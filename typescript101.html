<!DOCTYPE html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TypeScript 101</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<!-- Kode 101 – TypeScript. Bygd på felles mal for Kode 101-sidene. Ekte TypeScript-kompilator (frå CDN) i ein Web Worker. -->
<style>
:root {
    --gron: #2e7d32;
    --gron-mork: #1b5e20;
    --gron-lys: #e8f5e9;
    --bg: #eef3ef;
    --kort: #ffffff;
    --tekst: #24302a;
    --grå: #5f6b64;
    --linje: #dfe6e1;
    --lenke: #0066cc;
    --gul: #fff6d6;
    --gul-kant: #e8c547;
    --kode-bg: #f4f6f5;
    --font: system-ui, "Segoe UI", Arial, sans-serif;
    --mono: Consolas, "Cascadia Mono", "Cascadia Code", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--tekst); font-family: var(--font); font-size: 15px; display: flex; flex-direction: column; }

/* ---------- Grøn tittellinje ---------- */
header.topp { background: var(--gron); color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; border-bottom: 3px solid var(--gron-mork); }
header.topp .tilbake { color: #fff; text-decoration: none; font-size: 14px; padding: 4px 10px; border: 1px solid rgba(255,255,255,.5); border-radius: 14px; white-space: nowrap; }
header.topp .tilbake:hover { background: var(--gron-mork); }
header.topp .titlar { flex: 1 1 260px; min-width: 0; }
header.topp h1 { margin: 0; font-size: 21px; line-height: 1.2; }
header.topp .under { margin: 2px 0 0; font-size: 13px; opacity: .9; }
header.topp .hogre { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.framdrift { font-size: 13px; min-width: 130px; }
.framdrift .linje { height: 6px; background: rgba(255,255,255,.3); border-radius: 3px; margin-top: 4px; overflow: hidden; }
.framdrift .linje div { height: 100%; width: 0; background: #fff; transition: width .4s; }
header.topp button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6); border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
header.topp button:hover { background: var(--gron-mork); }

/* ---------- To kolonnar ---------- */
main.oppsett { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(320px, 40%) 1fr; gap: 14px; padding: 14px; }
.kort { background: var(--kort); border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
#leksjonspanel { overflow-y: auto; min-height: 0; padding: 0; display: flex; flex-direction: column; }
#sim { min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
@media (max-width: 900px) {
    body { height: auto; display: block; }
    main.oppsett { display: flex; flex-direction: column; padding: 10px; }
    #leksjonspanel { overflow: visible; }
    #sim { height: 78vh; min-height: 460px; }
}

/* ---------- Leksjonsliste ---------- */
#leksjonsliste { list-style: none; margin: 0; padding: 8px; border-bottom: 1px solid var(--linje); display: flex; flex-direction: column; gap: 2px; }
#leksjonsliste li button { width: 100%; text-align: left; background: none; border: none; font: inherit; font-size: 14px; padding: 5px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; color: var(--tekst); }
#leksjonsliste li button:hover { background: var(--gron-lys); }
#leksjonsliste li.aktiv button { background: var(--gron); color: #fff; }
#leksjonsliste .status { width: 1.2em; text-align: center; flex: none; }
#leksjonsliste .sirkel { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; vertical-align: -1px; opacity: .75; }
#leksjonsliste .sirkel.halv { background: linear-gradient(90deg, currentColor 50%, transparent 50%); opacity: 1; }
@media (max-width: 600px) { #leksjon .eksempel pre { padding-right: 12px; padding-top: 34px; } }
#leksjonsliste .nr { color: var(--grå); width: 1.6em; flex: none; }
#leksjonsliste li.aktiv .nr { color: #dfeee0; }
#leksjonsliste .tal { margin-left: auto; font-size: 12px; color: var(--grå); }
#leksjonsliste li.aktiv .tal { color: #dfeee0; }
#leksjonsliste .ferdig .status { color: var(--gron); }
#leksjonsliste li.aktiv.ferdig .status { color: #fff; }

/* ---------- Leksjonsinnhald ---------- */
#leksjon { padding: 14px 18px 18px; line-height: 1.5; }
#leksjon h2 { font-size: 20px; margin: 0 0 4px; padding-bottom: 6px; border-bottom: 2px solid var(--gron); }
#leksjon .laerer { color: var(--grå); font-size: 14px; margin: 6px 0 12px; }
#leksjon .laerer b { color: var(--gron-mork); }
#leksjon p { margin: 8px 0; }
#leksjon code { font-family: var(--mono); background: var(--kode-bg); padding: 1px 4px; border-radius: 3px; font-size: 13.5px; }
#leksjon h3 { font-size: 15px; margin: 18px 0 6px; color: var(--gron-mork); }
.eksempel { position: relative; margin: 8px 0 12px; }
.eksempel pre { margin: 0; background: #1e1e1e; color: #e6e6e6; font-family: var(--mono); font-size: 13.5px; padding: 10px 12px; padding-right: 70px; border-radius: 6px; overflow-x: auto; line-height: 1.4; }
.eksempel .prov { position: absolute; top: 6px; right: 6px; background: var(--gron); color: #fff; border: none; border-radius: 4px; padding: 3px 9px; font: inherit; font-size: 12.5px; cursor: pointer; }
.eksempel .prov:hover { background: var(--gron-mork); }
.tips { background: var(--gul); border-left: 4px solid var(--gul-kant); padding: 8px 12px; border-radius: 4px; margin: 10px 0; }
table.juks { border-collapse: collapse; width: 100%; font-size: 13.5px; margin: 8px 0; }
table.juks td, table.juks th { border-bottom: 1px solid var(--linje); padding: 4px 6px; text-align: left; vertical-align: top; }
table.juks td:first-child { font-family: var(--mono); white-space: nowrap; }

/* ---------- Oppgåver ---------- */
.oppgaver { list-style: none; padding: 0; margin: 6px 0; display: flex; flex-direction: column; gap: 8px; }
.oppgave { border: 1px solid var(--linje); border-radius: 8px; padding: 9px 12px; display: grid; grid-template-columns: 1.4em 1fr auto; gap: 4px 8px; align-items: start; transition: background .4s, border-color .4s; }
.oppgave .ikon { font-size: 16px; line-height: 1.4; color: #9aa59f; }
.oppgave.loyst { background: var(--gron-lys); border-color: #a5d6a7; }
.oppgave.loyst .ikon { color: var(--gron); }
.oppgave .hintknapp { background: #fff; border: 1px solid var(--linje); border-radius: 5px; padding: 2px 9px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--grå); }
.oppgave .hintknapp:hover { border-color: var(--gron); color: var(--gron-mork); }
.oppgave .hint { grid-column: 2 / 4; font-size: 13.5px; background: var(--gul); border-radius: 5px; padding: 5px 9px; }
.oppgave .bra { grid-column: 2 / 4; color: var(--gron-mork); font-weight: bold; font-size: 14px; animation: bra 2.6s forwards; }
@keyframes bra { 0% { opacity: 0; } 10% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
.fullfort { background: var(--gron); color: #fff; border-radius: 8px; padding: 10px 14px; margin: 14px 0 6px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.fullfort button { background: #fff; color: var(--gron-mork); border: none; border-radius: 5px; padding: 5px 12px; font: inherit; font-weight: bold; cursor: pointer; }
.navknappar { display: flex; justify-content: space-between; margin: 18px 0 8px; }
.navknappar button { background: #fff; border: 1px solid var(--gron); color: var(--gron-mork); border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer; }
.navknappar button:hover:not(:disabled) { background: var(--gron); color: #fff; }
.navknappar button:disabled { opacity: .35; cursor: default; }
details.laerar { margin: 16px 0 0; border: 1px solid var(--linje); border-radius: 8px; padding: 8px 12px; font-size: 14px; background: #fafcfb; }
details.laerar summary { cursor: pointer; font-weight: bold; color: var(--grå); }
details.laerar ul { padding-left: 20px; margin: 6px 0; }

/* ---------- Toast ---------- */
#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); background: var(--gron-mork); color: #fff; padding: 9px 16px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; z-index: 50; max-width: 90vw; font-size: 14px; }
#toast.vis { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- Kursbevis ---------- */
#bevisbakgrunn { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
#bevisbakgrunn.vis { display: flex; }
#bevisboks { background: #fff; border-radius: 10px; max-width: 640px; width: 100%; max-height: 92vh; overflow-y: auto; padding: 18px; }
.namnrad { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; font-size: 14px; }
.namnrad input { flex: 1; min-width: 160px; padding: 7px 10px; font: inherit; border: 1px solid #bbb; border-radius: 6px; }
#bevis { border: 3px solid var(--gron); border-radius: 6px; padding: 0 22px 18px; position: relative; text-align: center; }
#bevis .stripe { height: 14px; background: var(--gron); margin: 0 -22px 16px; }
#bevis h2 { margin: 6px 0 2px; font-size: 26px; color: var(--gron-mork); letter-spacing: .02em; }
#bevis .bnamn { font-size: 24px; margin: 14px 0 2px; font-family: Georgia, serif; border-bottom: 1px solid #999; display: inline-block; min-width: 60%; padding: 0 10px 2px; }
#bevis .skule { color: var(--grå); font-size: 14px; }
#bevis ul { list-style: none; padding: 0; text-align: left; margin: 14px auto 6px; max-width: 420px; font-size: 14px; }
#bevis ul li { padding: 2px 0; }
#bevis .sum { font-weight: bold; margin-top: 8px; }
#bevis .segl { position: absolute; right: 14px; top: 26px; width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe680, #d4a017 60%, #a87900); color: #5a3d00; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; box-shadow: 0 0 0 4px #f3d36b, 0 2px 6px rgba(0,0,0,.3); transform: rotate(-12deg); }
#bevis .delvis { position: absolute; right: 14px; top: 30px; border: 2px dashed var(--grå); color: var(--grå); border-radius: 6px; padding: 4px 8px; font-size: 13px; transform: rotate(-8deg); }
#bevis .manglar { font-size: 13px; color: var(--grå); }
.bevisknappar { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.bevisknappar button { padding: 7px 14px; font: inherit; border-radius: 6px; border: 1px solid var(--gron); background: #fff; color: var(--gron-mork); cursor: pointer; }
.bevisknappar button.hoved { background: var(--gron); color: #fff; }
@media print {
    @page { size: A4; margin: 15mm; }
    /* display:none (ikkje visibility:hidden) – elles tek resten av sida plass og gir fleire tomme sider */
    html, body { height: auto !important; min-height: 0 !important; overflow: visible !important; background: #fff !important; }
    body { display: block !important; }
    body > *:not(#bevisbakgrunn) { display: none !important; }
    #bevisbakgrunn { position: static !important; inset: auto; background: none !important; display: block !important; padding: 0 !important; }
    #bevisboks { box-shadow: none; max-width: none; max-height: none; overflow: visible; padding: 0; border-radius: 0; }
    #bevisboks .namnrad, #bevisboks .bevisknappar { display: none !important; }
    #bevis { break-inside: avoid; page-break-inside: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* ---------- Felles 💡-hjelpetekst (bruk i simulatoren) ---------- */
.hjelp { color: #ffe9a8; font-family: var(--font); font-size: 14px; background: rgba(255, 214, 90, .08); border-left: 3px solid #f2c94c; padding: 4px 10px; margin: 4px 0 6px; white-space: pre-wrap; border-radius: 0 4px 4px 0; }

/* ---------- TypeScript-simulator ---------- */
#sim { background: #1e1e1e; color: #ddd; }
.vtittel { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 7px 12px; background: #2b2b2b; border-bottom: 1px solid #111; font-size: 13.5px; color: #ddd; }
.vtittel .tslogo { background: #3178c6; color: #fff; font-weight: bold; font-size: 11px; padding: 2px 4px; border-radius: 3px; font-family: var(--mono); }
.vtittel .fnamn { font-family: var(--mono); }
.vtittel .status { margin-left: auto; font-size: 12.5px; color: #9a9a9a; }
.vtittel .status.koyrer { color: #7ee787; }
.vtittel .status.feil { color: #ff7b72; }
.verktoy { display: flex; gap: 8px; padding: 8px 10px; background: #252525; flex-wrap: wrap; align-items: center; }
.verktoy button { background: #3a3a3a; color: #eee; border: 1px solid #4a4a4a; border-radius: 5px; padding: 6px 12px; font: inherit; font-size: 13.5px; cursor: pointer; }
.verktoy button:hover:not(:disabled) { background: #474747; }
.verktoy button:disabled { opacity: .45; cursor: default; }
.verktoy #knappKoyr { background: var(--gron); border-color: var(--gron-mork); font-weight: bold; }
.verktoy #knappKoyr:hover:not(:disabled) { background: var(--gron-mork); }
.verktoy .snarveg { margin-left: auto; font-size: 12px; color: #8a8a8a; }
#editorboks { flex: 3 1 0; min-height: 140px; overflow: hidden; }
#editorboks .CodeMirror, #editorboks textarea { height: 100%; font-family: var(--mono); font-size: 14.5px; }
#editorboks textarea { width: 100%; background: #212121; color: #eee; border: none; padding: 8px; resize: none; tab-size: 4; }
.CodeMirror .feillinje { background: rgba(255, 70, 70, .28) !important; }
.konsolltittel { font-size: 12px; color: #9a9a9a; padding: 4px 12px; background: #252525; letter-spacing: .05em; }
#konsoll { flex: 2 1 0; min-height: 120px; overflow-y: auto; padding: 8px 12px; font-family: var(--mono); font-size: 14px; line-height: 1.45; background: #141414; white-space: pre-wrap; word-break: break-word; }
#konsoll .tom { color: #6a6a6a; }
#konsoll .info { color: #7a7a7a; font-style: italic; }
#konsoll .err { color: #ff7b72; }
#konsoll .warn { color: #f2cc60; }
#konsoll .alert { border: 1px solid #555; border-radius: 4px; padding: 2px 8px; display: inline-block; background: #262626; }
#konsoll .inrad { display: flex; align-items: baseline; }
#konsoll .inrad input { flex: 1; background: transparent; border: none; border-bottom: 1px solid #5aa0ef; color: #fff; font: inherit; outline: none; padding: 0 2px; min-width: 60px; }
#konsoll .inn { color: #8cc4ff; }
@media (max-width: 900px) { .verktoy .snarveg { display: none; } }

/* Typefeil, typelinje og hjelpeboble */
.CodeMirror .tsfeil { text-decoration: underline wavy #ff6b6b; text-decoration-skip-ink: none; text-underline-offset: 3px; }
.vtittel .tsstatus { font-size: 12.5px; color: #9a9a9a; padding: 1px 8px; border-radius: 10px; background: #333; white-space: nowrap; }
.vtittel .tsstatus.ok { color: #7ee787; }
.vtittel .tsstatus.feil { color: #ff7b72; }
.vtittel .tsstatus.lastar { color: #f2cc60; }
#typelinje { font-family: var(--mono); font-size: 13px; padding: 4px 12px; min-height: 26px; background: #252526; color: #d4d4d4; border-top: 1px solid #111; border-bottom: 3px solid #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#typelinje .svak { color: #7a7a7a; font-family: var(--font); font-style: italic; }
#typelinje .feil { color: #ff8a80; }
#typelinje .ti { color: #5aa0ef; }
.tk { color: #c792ea; }
.tt { color: #4ec9b0; }
#tstipp { position: fixed; z-index: 60; display: none; max-width: min(520px, calc(100vw - 16px)); background: #252526; color: #d4d4d4; border: 1px solid #454545; border-radius: 6px; padding: 7px 10px; font-size: 13px; line-height: 1.45; box-shadow: 0 4px 14px rgba(0,0,0,.45); pointer-events: none; }
#tstipp.vis { display: block; }
#tstipp .type { font-family: var(--mono); white-space: pre-wrap; }
#tstipp .doc { color: #aaa; margin-top: 4px; }
#tstipp .tfeil { color: #ff8a80; font-family: var(--mono); white-space: pre-wrap; margin-top: 4px; }
#tstipp .type + .tfeil { border-top: 1px solid #3a3a3a; padding-top: 5px; }
#tstipp .nr { color: #888; }
#tstipp .hjelp { margin: 4px 0 2px; }
#konsoll .ok { color: #7ee787; }
#konsoll .jskode { display: block; color: #d4d4d4; background: #1e1e1e; border-left: 3px solid #3178c6; padding: 6px 10px; margin: 2px 0 4px; }
#konsoll code, .hjelp code { font-family: var(--mono); background: rgba(255,255,255,.08); padding: 0 3px; border-radius: 3px; }
</style>
</head>
<body>

<header class="topp">
    <a class="tilbake" href="index.html">← Sandkassa</a>
    <div class="titlar">
        <h1>TypeScript 101</h1>
        <p class="under">JavaScript med typar – ekte TypeScript-kompilator som finn feila før koden køyrer</p>
    </div>
    <div class="hogre">
        <div class="framdrift" title="Løyste oppgåver">
            <span id="framdriftTekst">0 / 0 oppgåver</span>
            <div class="linje"><div id="framdriftLinje"></div></div>
        </div>
        <button id="knappBevis" type="button">Kursbevis</button>
        <button id="knappNullstill" type="button">Start på nytt</button>
    </div>
</header>

<main class="oppsett">
    <aside id="leksjonspanel" class="kort">
        <ol id="leksjonsliste"></ol>
        <div id="leksjon"></div>
    </aside>
    <section id="sim" class="kort">
        <div class="vtittel"><span class="tslogo">TS</span><span class="fnamn">main.ts</span><span id="status" class="status">Klar</span><span id="tsstatus" class="tsstatus">⏳ Lastar TypeScript …</span></div>
        <div class="verktoy">
            <button type="button" id="knappKoyr" title="Ctrl+Enter">▶ Køyr</button>
            <button type="button" id="knappStopp" disabled>■ Stopp</button>
            <button type="button" id="knappJs" title="Sjå JavaScript-koden kompilatoren lagar">Vis JavaScript</button>
            <button type="button" id="knappTom">Tøm utdata</button>
            <button type="button" id="knappTilbake">Tilbakestill kode</button>
            <span class="snarveg">Ctrl+Enter = køyr</span>
        </div>
        <div id="editorboks"><textarea id="kodefelt" spellcheck="false" aria-label="Kode"></textarea></div>
        <div id="typelinje" aria-live="polite"><span class="svak">Lastar kompilatoren …</span></div>
        <div class="konsolltittel">KONSOLL</div>
        <div id="konsoll" aria-live="polite"><span class="tom">Utdata frå programmet ditt kjem her.</span></div>
    </section>
</main>

<div id="tstipp" role="tooltip"></div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="bevisbakgrunn">
    <div id="bevisboks" role="dialog" aria-modal="true" aria-label="Kursbevis">
        <div class="namnrad">
            <label for="bevisNamn">Fornamnet ditt:</label>
            <input id="bevisNamn" type="text" maxlength="40" placeholder="Skriv fornamnet ditt">
        </div>
        <div id="bevis"></div>
        <div class="bevisknappar">
            <button type="button" id="bevisLukk">Lukk</button>
            <button type="button" id="bevisSkriv" class="hoved">Skriv ut</button>
        </div>
    </div>
</div>

<script>
"use strict";
/* ================== KURSOPPSETT ================== */
const KURS = {
    namn: "TypeScript 101",
    prefiks: "kode101-ts-",
};

/* Hjelparar for leksjonane (funksjonsdeklarasjonar, så dei finst før LEKSJONAR blir laga) */
function htmlEsc(s) { return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }
function ex(kode) { return `<div class="eksempel"><pre>${htmlEsc(kode)}</pre></div>`; }
function rein(k) { return String(k).replace(/\/\*[\s\S]*?\*\//g, "").replace(/(^|[^:"'`\\])\/\/.*$/gm, "$1"); }
function utLinjer(ctx) { return String(ctx.utdata || "").split("\n").map(s => s.trim()).filter(Boolean); }
function harLinje(ctx, verdi) { return utLinjer(ctx).some(l => l === String(verdi) || l.split(/[\s:=,]+/).includes(String(verdi))); }
/* ok = koden hadde ingen typefeil, vart køyrd og krasja ikkje */
function ok(ctx) { return !!ctx.koyrt && !ctx.feil && !ctx.stoppa; }
function tsFeil(ctx, ...kodar) { return (ctx.tsfeil || []).some(f => kodar.includes(f.kode)); }
function tsMelding(ctx, re) { return (ctx.tsfeil || []).some(f => re.test(f.melding)); }
function svarTekst(ctx) { return (ctx.input || []).filter(v => typeof v === "string"); }
/* Eit eige interface (ikkje Elev frå eksempelet) og eit objekt med den typen */
function eigeInterface(k) {
    const namn = [...k.matchAll(/\binterface\s+([A-Za-zÆØÅæøå_]\w*)\s*\{/g)].map(m => m[1]).filter(n => n !== "Elev");
    return namn.some(n => new RegExp(":\\s*" + n + "\\s*=\\s*\\{").test(k) && (k.match(new RegExp("\\binterface\\s+" + n + "\\s*\\{([^}]*)\\}")) || ["", ""])[1].split(/[;\n]/).filter(s => /\w\s*\??\s*:/.test(s)).length >= 3);
}
const UNION_SN = /:\s*(string\s*\|\s*number|number\s*\|\s*string)\b/;

{ id: "l1", tittel: "Kvifor TypeScript?", laerer: "kva TypeScript er, korleis kompilatoren finn feil <i>før</i> koden køyrer, og korleis TypeScript blir til JavaScript.",

${ex(`function leggSaman(a: number, b: number) {\n    return a + b;\n}\n\nconsole.log(leggSaman(5, 3));    // 8\nconsole.log(leggSaman("5", 3));  // ✖ typefeil!`)}
<p><code>: number</code> etter parameteren betyr «dette må vere eit tal». Kallar du funksjonen med tekst, får du ein <b>typefeil</b> med ein raud bølgjestrek under – akkurat som i VS Code. Hald musa over streken (eller klikk på han) for å lese meldinga.</p>

<p>Nettlesarar og Node.js køyrer eigentleg berre JavaScript. Når du trykkjer <b>▶ Køyr</b>, skjer to ting:</p>
<ol>

<p>Trykk <b>Vis JavaScript</b> for å sjå korleis koden ser ut etter at typane er fjerna.</p>
<div class="tips">💡 Feilmeldingane frå TypeScript er på engelsk, som i ekte verktøy. Under kvar melding får du ei forklaring på nynorsk. Kvar feil har eit nummer, t.d. <code>TS2345</code>, som du kan søkje på.</div>`,
  oppgaver: [

      sjekk: c => tsFeil(c, 2345) && /leggSaman\s*\(\s*["'`]/.test(rein(c.kode)) },
    { id: "l1o3", tekst: "Trykk <b>Vis JavaScript</b> og sjå kva som har skjedd med <code>: number</code>.", hint: ["Knappen står over editoren, ved sida av ▶ Køyr."],
      sjekk: c => !!c.visteJs },
    { id: "l1o4", tekst: "Lag funksjonen <code>gonge(a: number, b: number)</code> som returnerer produktet, og skriv ut <code>gonge(6, 7)</code>.", hint: ["Kopier <code>leggSaman</code> og byt namn og <code>+</code> med <code>*</code>.", "<code>function gonge(a: number, b: number) {<br>&nbsp;&nbsp;&nbsp;&nbsp;return a * b;<br>}<br>console.log(gonge(6, 7));</code>"],
      sjekk: c => ok(c) && /gonge\s*(=\s*)?\(\s*\w+\s*:\s*number\s*,\s*\w+\s*:\s*number\s*\)/.test(rein(c.kode)) && harLinje(c, 42) },

{ id: "l2", tittel: "Typar og typeinferens", laerer: "grunntypane <code>string</code>, <code>number</code> og <code>boolean</code>, typeannotasjonar og korleis TypeScript gjettar typen sjølv.",

console.log(namn, alder, erElev);
`,
  html: `
<p>Dei tre vanlegaste typane er:</p>
<table class="juks">
<tr><td>string</td><td>tekst, t.d. <code>"Kari"</code></td></tr>
<tr><td>number</td><td>alle tal, t.d. <code>17</code> og <code>3.14</code></td></tr>
<tr><td>boolean</td><td><code>true</code> eller <code>false</code></td></tr>
</table>
<p>Du skriv typen etter variabelnamnet med kolon. Det heiter ein <b>typeannotasjon</b>:</p>
${ex(`let alder: number = 17;\nalder = 18;         // ✔ lov\nalder = "atten";    // ✖ Type 'string' is not assignable to type 'number'.`)}

<h3>Typeinferens – TypeScript gjettar</h3>
<p>Du treng ikkje alltid skrive typen. Gir du variabelen ein verdi med ein gong, finn TypeScript typen sjølv. Det heiter <b>typeinferens</b>:</p>

    { id: "l2o3", tekst: "Lag ein variabel <b>utan</b> typeannotasjon, t.d. <code>let by = \"Stord\";</code>, og gi han eit tal etterpå. Sjå at TypeScript har gjetta typen!", hint: ["Klikk på <code>by</code> og sjå typen i linja under koden.", "<code>let by = \"Stord\";</code><br><code>by = 5410;</code>"],
      sjekk: c => tsMelding(c, /Type 'number' is not assignable to type 'string'/) && /\blet\s+\w+\s*=\s*["'`]/.test(rein(c.kode)) },
    { id: "l2o4", tekst: "Rekn ut kor mange sekund det er i eitt døgn med <code>number</code>-variablar (t.d. timar, minutt, sekund), og skriv ut svaret.", hint: ["Eit døgn har 24 timar, ein time har 60 minutt og eit minutt har 60 sekund.", "<code>const timar: number = 24;</code> … og så <code>console.log(timar * minutt * sekund);</code>"],
      sjekk: c => ok(c) && /:\s*number\b/.test(rein(c.kode)) && !/86400/.test(rein(c.kode)) && harLinje(c, 86400) },

{ id: "l3", tittel: "Funksjonar med typar", laerer: "å gi parametrar og returverdi typar, og bruke <code>void</code>, valfrie parametrar med <code>?</code> og standardverdiar.",
  start: `function areal(breidd: number, hogd: number): number {
    return breidd * hogd;
}

console.log(areal(4, 5));
`,
  html: `
<p>På funksjonar er typar ekstra nyttige. Du skriv typen på kvar parameter, og typen på svaret (<b>returtypen</b>) etter parentesen:</p>
${ex(`function areal(breidd: number, hogd: number): number {\n    return breidd * hogd;\n}\nconsole.log(areal(4, 5));`)}
<p>No veit både du, kompilatoren og VS Code kva funksjonen tek imot og gir tilbake. Kallar du han feil, får du beskjed:</p>
${ex(`areal(4);          // ✖ Expected 2 arguments, but got 1.\nareal(4, "5");     // ✖ Argument of type 'string' is not assignable ...`)}
<p>I <b>strict</b>-modus (som simulatoren brukar) må parametrar ha type. Utan type ville dei fått typen <code>any</code> («kva som helst»), og det godtek ikkje kompilatoren:</p>
${ex(`function dobbel(x) {   // ✖ Parameter 'x' implicitly has an 'any' type.\n    return x * 2;\n}`)}
<h3>void, valfrie parametrar og standardverdiar</h3>
<p>Ein funksjon som ikkje returnerer noko, har returtypen <code>void</code>. Ein parameter med <code>?</code> er <b>valfri</b>, og ein parameter med <code>=</code> får ein <b>standardverdi</b>:</p>
${ex(`function hels(namn: string, tittel?: string): void {\n    if (tittel) {\n        console.log("Hei, " + tittel + " " + namn);\n    } else {\n        console.log("Hei, " + namn);\n    }\n}\nhels("Kari");\nhels("Hansen", "lærar");\n\nfunction medMva(pris: number, sats: number = 0.25): number {\n    return pris * (1 + sats);\n}\nconsole.log(medMva(100));`)}
<p>Pilfunksjonar får typar på same måte: <code>const dobbel = (x: number): number =&gt; x * 2;</code></p>`,
  oppgaver: [
    { id: "l3o1", tekst: "Skriv ein funksjon der parameteren manglar type, t.d. <code>function dobbel(x) { return x * 2; }</code>, og les feilen.", hint: ["Trykk «Prøv» på eksempelet med <code>dobbel</code> og køyr."],
      sjekk: c => tsFeil(c, 7006) },
    { id: "l3o2", tekst: "Lag funksjonen <code>tilFahrenheit(c: number): number</code> (F = C · 1.8 + 32) og skriv ut kva 100 °C er i Fahrenheit.", hint: ["<code>return c * 1.8 + 32;</code>", "<code>console.log(tilFahrenheit(100));</code> skal gi 212."],
      sjekk: c => ok(c) && /\(\s*\w+\s*:\s*number\s*\)\s*:\s*number/.test(rein(c.kode)) && harLinje(c, 212) },
    { id: "l3o3", tekst: "Kall ein funksjon med for få argument og sjå kva kompilatoren seier.", hint: ["T.d. <code>console.log(areal(4));</code>"],
      sjekk: c => tsFeil(c, 2554, 2555) },
    { id: "l3o4", tekst: "Lag ein funksjon med ein valfri parameter (<code>?</code>) og kall han både med og utan det valfrie argumentet.", hint: ["Sjå <code>hels</code> i eksempelet – trykk «Prøv».", "Den valfrie parameteren må stå sist: <code>(namn: string, tittel?: string)</code>"],
      sjekk: c => ok(c) && /\(\s*[^)]*\w+\s*\?\s*:/.test(rein(c.kode)) && utLinjer(c).length >= 2 },

{ id: "l4", tittel: "Tabellar og tuplar", laerer: "å gi tabellar (arrays) typar som <code>number[]</code>, bruke <code>filter</code> og <code>map</code>, og lage tuplar.",
  start: `const karakterar: number[] = [4, 5, 3, 6];
karakterar.push(5);

console.log(karakterar);
`,
  html: `
<p>Ein tabell der alle elementa er tal, har typen <code>number[]</code> («tabell av tal»). Ein tabell av tekst er <code>string[]</code>:</p>
${ex(`const karakterar: number[] = [4, 5, 3, 6];\nconst fag: string[] = ["Norsk", "Matte", "IT"];`)}
<p>No passar TypeScript på innhaldet. Du får ikkje leggje tekst i ein talltabell ved eit uhell:</p>
${ex(`karakterar.push(5);       // ✔\nkarakterar.push("seks");  // ✖ Argument of type 'string' is not assignable to parameter of type 'number'.`)}
<p>Gjennomsnitt med ei løkke, som i JavaScript:</p>
${ex(`const karakterar: number[] = [4, 5, 3, 6];\nlet sum = 0;\nfor (const k of karakterar) {\n    sum += k;\n}\nconsole.log("Snitt:", sum / karakterar.length);`)}
<h3>filter og map</h3>
<p><code>filter</code> lagar ein ny tabell med elementa som oppfyller eit vilkår, og <code>map</code> gjer om kvart element. TypeScript skjønar typen på resultatet sjølv – klikk på <code>gode</code> og <code>tekstar</code>:</p>
${ex(`const karakterar: number[] = [4, 5, 3, 6];\nconst gode = karakterar.filter(k => k >= 5);\nconst tekstar = karakterar.map(k => "Karakter " + k);\nconsole.log(gode);\nconsole.log(tekstar);`)}
<h3>Tuplar</h3>
<p>Ein <b>tuppel</b> er ein tabell med fast lengd der kvar plass har sin eigen type. Fint for par av verdiar:</p>
${ex(`const elev: [string, number] = ["Kari", 17];\nconsole.log(elev[0] + " er " + elev[1] + " år");\n\nconst feil: [string, number] = [17, "Kari"];  // ✖`)}
<div class="tips">💡 Du kan òg skrive <code>Array&lt;number&gt;</code> i staden for <code>number[]</code>. Det betyr det same – meir om <code>&lt; &gt;</code> i leksjonen om generics.</div>`,
  oppgaver: [
    { id: "l4o1", tekst: "Lag ein tabell av typen <code>number[]</code> med karakterane dine og skriv ut gjennomsnittet.", hint: ["Bruk løkka frå eksempelet – trykk «Prøv».", "Gjennomsnitt = summen delt på <code>karakterar.length</code>."],
      sjekk: c => { const r = rein(c.kode); return ok(c) && /:\s*number\s*\[\s*\]/.test(r) && /\.length\b/.test(r) && /\d/.test(c.utdata); } },
    { id: "l4o2", tekst: "Prøv å <code>push</code>-e ein tekst inn i talltabellen og les feilen.", hint: ["<code>karakterar.push(\"seks\");</code>"],
      sjekk: c => tsFeil(c, 2345) && /\.push\s*\(\s*["'`]/.test(rein(c.kode)) },
    { id: "l4o3", tekst: "Bruk <code>filter</code> til å lage ein ny tabell med berre karakterane som er 5 eller betre, og skriv han ut.", hint: ["<code>const gode = karakterar.filter(k => k >= 5);</code>", "<code>console.log(gode);</code>"],
      sjekk: c => ok(c) && /\.filter\s*\(/.test(rein(c.kode)) && c.utdata.includes("[") },
    { id: "l4o4", tekst: "Lag ein tuppel av typen <code>[string, number]</code> og skriv ut begge delane.", hint: ["<code>const elev: [string, number] = [\"Kari\", 17];</code>", "Hent delane med <code>elev[0]</code> og <code>elev[1]</code>."],

{ id: "l5", tittel: "Objekt med interface", laerer: "å beskrive korleis eit objekt skal sjå ut med <code>interface</code>, og bruke valfrie og <code>readonly</code>-eigenskapar.",
  start: `interface Elev {
    namn: string;
    alder: number;
    klasse: string;
}

const kari: Elev = { namn: "Kari", alder: 17, klasse: "1IMA" };
console.log(kari.namn + " går i " + kari.klasse);
`,
  html: `
<p>Eit <b>interface</b> er ei «oppskrift» på eit objekt: kva eigenskapar det skal ha, og kva type kvar eigenskap har.</p>
${ex(`interface Elev {\n    namn: string;\n    alder: number;\n    klasse: string;\n}\n\nconst kari: Elev = { namn: "Kari", alder: 17, klasse: "1IMA" };\nconsole.log(kari.namn);`)}
<p>Kompilatoren sjekkar at objektet følgjer oppskrifta – at ingen eigenskapar manglar, og at ingen er feilstava:</p>
${ex(`const ola: Elev = { namn: "Ola", alder: 16 };\n// ✖ Property 'klasse' is missing in type ...\n\nconst per: Elev = { namn: "Per", alder: 16, klase: "1IMB" };\n// ✖ Object literal may only specify known properties ...`)}
<p>Bonus: skriv <code>kari.</code> i VS Code, så får du ei liste over alle eigenskapane. Det er ein av grunnane til at så mange brukar TypeScript.</p>
<h3>Valfrie og readonly-eigenskapar</h3>
${ex(`interface Brukar {\n    readonly id: number;   // kan ikkje endrast\n    brukarnamn: string;\n    epost?: string;        // valfri\n}\n\nconst b: Brukar = { id: 1, brukarnamn: "kari17" };\nb.brukarnamn = "kari_17";  // ✔\nb.id = 2;                  // ✖ Cannot assign to 'id' because it is a read-only property.`)}
<h3>Tabell av objekt</h3>
${ex(`interface Elev {\n    namn: string;\n    alder: number;\n    klasse: string;\n}\n\nconst klassa: Elev[] = [\n    { namn: "Kari", alder: 17, klasse: "1IMA" },\n    { namn: "Ola", alder: 16, klasse: "1IMA" },\n];\nfor (const e of klassa) {\n    console.log(e.namn + " (" + e.alder + ")");\n}`)}
<div class="tips">💡 Du kan òg skrive <code>type Elev = { namn: string; alder: number; };</code> For objekt fungerer <code>type</code> og <code>interface</code> nesten likt. Med <code>type</code> kan du i tillegg gi namn til andre typar – det ser du i neste leksjon.</div>`,
  oppgaver: [
    { id: "l5o1", tekst: "Lag ditt eige <code>interface</code> (t.d. <code>Spel</code>, <code>Bil</code> eller <code>Datamaskin</code>) med minst tre eigenskapar. Lag eit objekt av typen og skriv ut ein eigenskap.", hint: ["Gjer som med <code>Elev</code>, men med eit anna namn og andre eigenskapar.", "<code>interface Spel { tittel: string; aar: number; flerspelar: boolean; }</code><br><code>const s: Spel = { tittel: \"Minecraft\", aar: 2011, flerspelar: true };</code>"],
      sjekk: c => ok(c) && eigeInterface(rein(c.kode)) && c.utdata.trim() !== "" },
    { id: "l5o2", tekst: "Lag eit objekt der ein påkravd eigenskap manglar, og les feilen.", hint: ["T.d. <code>const ola: Elev = { namn: \"Ola\", alder: 16 };</code>"],
      sjekk: c => tsFeil(c, 2741, 2739) },
    { id: "l5o3", tekst: "Lag ein tabell med minst to objekt av ein interface-type og skriv ut alle med ei løkke.", hint: ["Sjå eksempelet «Tabell av objekt» – trykk «Prøv».", "Typen på tabellen er <code>Elev[]</code> (eller <code>Spel[]</code> …)."],
      sjekk: c => { const r = rein(c.kode); return ok(c) && /:\s*[A-ZÆØÅ]\w*\s*\[\s*\]\s*=/.test(r) && /\bfor\b|\.forEach\s*\(|\.map\s*\(/.test(r) && utLinjer(c).length >= 2; } },

{ id: "l6", tittel: "Union- og literal-typar", laerer: "å seie at ein verdi kan vere <i>ein av fleire</i> typar med <code>|</code>, og å avgrense til nokre få lovlege verdiar med literal-typar.",
  start: `type Val = "stein" | "saks" | "papir";

let mittVal: Val = "stein";
console.log("Eg vel " + mittVal);
`,
  html: `
<p>Med <code>|</code> (les: «eller») lagar du ein <b>union-type</b>. Ein verdi av typen <code>string | number</code> kan vere tekst <i>eller</i> tal:</p>
${ex(`let id: string | number;\nid = 42;        // ✔\nid = "A-42";    // ✔\nid = true;      // ✖`)}
<h3>Literal-typar</h3>
<p>Ein type kan òg vere ein <b>bestemt verdi</b>. Set du fleire saman, får du ei liste over lovlege verdiar – perfekt til stein, saks, papir:</p>
${ex(`type Val = "stein" | "saks" | "papir";\n\nlet mittVal: Val = "saks";   // ✔\nmittVal = "brett";           // ✖ Type '"brett"' is not assignable to type 'Val'.`)}
<p>Med <code>type</code> gir du typen eit namn, så du kan bruke han mange stader. Skriv du feil, t.d. <code>"stien"</code>, oppdagar kompilatoren det med ein gong.</p>
<p>Fleire døme: <code>type Retning = "opp" | "ned" | "venstre" | "hogre";</code> eller <code>type Terning = 1 | 2 | 3 | 4 | 5 | 6;</code></p>
<h3>Literal-typar i funksjonar</h3>
${ex(`type Val = "stein" | "saks" | "papir";\n\nfunction slaar(a: Val, b: Val): boolean {\n    return (a === "stein" && b === "saks") ||\n           (a === "saks" && b === "papir") ||\n           (a === "papir" && b === "stein");\n}\nconsole.log(slaar("stein", "saks"));\nconsole.log(slaar("papir", "saks"));`)}
<div class="tips">💡 Literal-typar er ofte betre enn vanleg <code>string</code>: kompilatoren fangar skrivefeil, og VS Code foreslår dei lovlege verdiane medan du skriv.</div>`,
  oppgaver: [

{ id: "l7", tittel: "Narrowing og null", laerer: "korleis TypeScript «snevrar inn» typen med <code>typeof</code> og <code>if</code>, og korleis du handterer <code>null</code> trygt med <code>?.</code> og <code>??</code>.",

<li><b>Føresetnad:</b> kurset byggjer på JavaScript 101 og forklarar ikkje variablar, vilkår og løkker på nytt.</li>
<li><b>Lagring:</b> framdrift og kode blir berre lagra i nettlesaren til eleven (localStorage). Byter eleven maskin eller nettlesar, startar han/ho på nytt.</li>
<li><b>I timen:</b> la elevane jobbe i sitt eige tempo, og bruk kursbeviset (Skriv ut / PDF) som dokumentasjon. Mange oppgåver går ut på å <i>lage</i> ein typefeil og lese meldinga – det er meininga.</li>
</ul>`;



/* ================== LAGRING ================== */
const lager = {
    hent(nokkel, standard) {
        try { const v = localStorage.getItem(KURS.prefiks + nokkel); return v === null ? standard : JSON.parse(v); }
        catch (e) { return standard; }
    },
    set(nokkel, verdi) { try { localStorage.setItem(KURS.prefiks + nokkel, JSON.stringify(verdi)); } catch (e) {} },
    slettAlle() {
        try {
            const ut = [];
            for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(KURS.prefiks)) ut.push(k); }
            ut.forEach(k => localStorage.removeItem(k));
        } catch (e) {}
    }
};

/* ================== TILSTAND ================== */
let loyste = new Set(lager.hent("loyste", []));
let besokt = new Set(lager.hent("besokt", []));
let hintNiva = lager.hent("hint", {});
let aktivIndeks = Math.min(Math.max(0, LEKSJONAR.findIndex(l => l.id === lager.hent("aktiv", LEKSJONAR[0].id))), LEKSJONAR.length - 1);
const ALLE_OPPGAVER = LEKSJONAR.flatMap(l => l.oppgaver.map(o => ({ ...o, leksjon: l })));

function lagreTilstand() {
    lager.set("loyste", [...loyste]);
    lager.set("besokt", [...besokt]);
    lager.set("hint", hintNiva);
    lager.set("aktiv", LEKSJONAR[aktivIndeks].id);
}

function leksjonStatus(l) {
    const n = l.oppgaver.length, ok = l.oppgaver.filter(o => loyste.has(o.id)).length;
    if (n === 0) return besokt.has(l.id) ? "ferdig" : "ny";
    if (ok === n) return "ferdig";
    if (ok > 0 || besokt.has(l.id)) return "igang";
    return "ny";
}
const STATUSIKON = { ny: '<span class="sirkel"></span>', igang: '<span class="sirkel halv"></span>', ferdig: "✔" };

/* ================== VISING ================== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function oppdaterFramdrift() {
    const n = ALLE_OPPGAVER.length, ok = ALLE_OPPGAVER.filter(o => loyste.has(o.id)).length;
    document.getElementById("framdriftTekst").textContent = `${ok} / ${n} oppgåver`;
    document.getElementById("framdriftLinje").style.width = (n ? 100 * ok / n : 0) + "%";
}

function teiknListe() {
    const ol = document.getElementById("leksjonsliste");
    ol.innerHTML = "";
    LEKSJONAR.forEach((l, i) => {
        const st = leksjonStatus(l);
        const ok = l.oppgaver.filter(o => loyste.has(o.id)).length;
        const li = document.createElement("li");
        li.className = (i === aktivIndeks ? "aktiv " : "") + st;
        li.innerHTML = `<button type="button"><span class="status" title="${st === "ferdig" ? "Ferdig" : st === "igang" ? "I gang" : "Ikkje starta"}">${STATUSIKON[st]}</span><span class="nr">${i + 1}.</span><span>${esc(l.tittel)}</span>${l.oppgaver.length ? `<span class="tal">${ok}/${l.oppgaver.length}</span>` : ""}</button>`;
        li.querySelector("button").onclick = () => visLeksjon(i);
        ol.appendChild(li);
    });
    oppdaterFramdrift();
}

function visLeksjon(i, rull = true) {
    aktivIndeks = i;
    const l = LEKSJONAR[i];
    besokt.add(l.id);
    lagreTilstand();
    const el = document.getElementById("leksjon");
    el.innerHTML = `
        <h2>${i + 1}. ${esc(l.tittel)}</h2>
        <p class="laerer"><b>Dette lærer du:</b> ${l.laerer}</p>
        <div class="forklaring">${l.html}</div>
        ${l.oppgaver.length ? `<h3>Oppgåver</h3><ul class="oppgaver"></ul>` : ""}
        <div class="fullfortplass"></div>
        <div class="navknappar">
            <button type="button" class="forre" ${i === 0 ? "disabled" : ""}>◀ Førre</button>
            <button type="button" class="neste" ${i === LEKSJONAR.length - 1 ? "disabled" : ""}>Neste ▶</button>
        </div>
        <details class="laerar"><summary>For læraren</summary>${LAERAR_HTML}</details>`;
    el.querySelectorAll(".eksempel").forEach(ex => {
        const pre = ex.querySelector("pre");
        const b = document.createElement("button");
        b.type = "button"; b.className = "prov"; b.textContent = "Prøv";
        b.title = "Lim inn koden (du køyrer sjølv)";
        b.onclick = () => { if (typeof simLim === "function") simLim(pre.dataset.kode ?? pre.textContent); };
        ex.appendChild(b);
    });
    const ul = el.querySelector(".oppgaver");
    if (ul) l.oppgaver.forEach(o => ul.appendChild(lagOppgaveEl(o)));
    el.querySelector(".forre").onclick = () => visLeksjon(i - 1);
    el.querySelector(".neste").onclick = () => visLeksjon(i + 1);
    teiknFullfort();
    teiknListe();
    if (rull) document.getElementById("leksjonspanel").scrollTop = 0;
    if (typeof simByttLeksjon === "function") simByttLeksjon(l);   // valfri krok (t.d. startkode i editoren)
}

function lagOppgaveEl(o) {
    const li = document.createElement("li");
    li.className = "oppgave" + (loyste.has(o.id) ? " loyst" : "");
    li.dataset.id = o.id;
    li.innerHTML = `<span class="ikon">${loyste.has(o.id) ? "✔" : "○"}</span><span class="tekst">${o.tekst}</span>` +
        (o.hint && o.hint.length ? `<button type="button" class="hintknapp">Hint</button>` : "<span></span>");
    const vis = () => {
        li.querySelectorAll(".hint").forEach(h => h.remove());
        const n = hintNiva[o.id] || 0;
        for (let k = 0; k < n; k++) {
            const d = document.createElement("div");
            d.className = "hint"; d.innerHTML = "💡 " + o.hint[k];
            li.appendChild(d);
        }
        const b = li.querySelector(".hintknapp");
        if (b) { b.textContent = n === 0 ? "Hint" : n < o.hint.length ? "Meir hjelp" : "Hint"; b.disabled = n >= o.hint.length; b.style.opacity = n >= o.hint.length ? .4 : 1; }
    };
    const b = li.querySelector(".hintknapp");
    if (b) b.onclick = () => { hintNiva[o.id] = Math.min((hintNiva[o.id] || 0) + 1, o.hint.length); lagreTilstand(); vis(); };
    vis();
    return li;
}

function teiknFullfort() {
    const l = LEKSJONAR[aktivIndeks];
    const plass = document.querySelector("#leksjon .fullfortplass");
    if (!plass) return;
    plass.innerHTML = "";
    if (l.oppgaver.length && leksjonStatus(l) === "ferdig") {
        const d = document.createElement("div");
        d.className = "fullfort";
        d.innerHTML = `<span>✔ Leksjon fullført!</span>` + (aktivIndeks < LEKSJONAR.length - 1 ? `<button type="button">Neste leksjon ▶</button>` : "");
        const b = d.querySelector("button");
        if (b) b.onclick = () => visLeksjon(aktivIndeks + 1);
        plass.appendChild(d);
    }
}

let toastTid = null;
function toast(tekst) {
    const t = document.getElementById("toast");
    t.textContent = tekst; t.classList.add("vis");

/* ================== OPPGÅVESJEKK ================== */
/* Kall etter KVAR kommando/køyring. Sjekkar alle oppgåver i alle leksjonar. */
function sjekkOppgaver(ctx) {
    const nye = [];
    for (const o of ALLE_OPPGAVER) {
        if (loyste.has(o.id)) continue;
        let ok = false;
        try { ok = !!o.sjekk(ctx); } catch (e) { ok = false; }
        if (ok) { loyste.add(o.id); nye.push(o); }
    }
    if (!nye.length) return nye;
    lagreTilstand();
    const aktiv = LEKSJONAR[aktivIndeks];
    for (const o of nye) {
        const li = document.querySelector(`#leksjon .oppgave[data-id="${o.id}"]`);
        if (li) {
            li.classList.add("loyst");
            li.querySelector(".ikon").textContent = "✔";
            const bra = document.createElement("div");
            bra.className = "bra"; bra.textContent = "✔ Bra!";
            li.appendChild(bra);
            setTimeout(() => bra.remove(), 2700);
        }
    }
    const andre = nye.filter(o => o.leksjon !== aktiv);
    if (andre.length) {
        const o = andre[0];
        toast(`✔ Bra! Du løyste ei oppgåve i leksjon ${LEKSJONAR.indexOf(o.leksjon) + 1}: ${o.leksjon.tittel}`);
    }
    teiknFullfort();
    teiknListe();
    return nye;
}

const konsoll = document.getElementById("konsoll");

if (window.CodeMirror) {
    cm = CodeMirror.fromTextArea(kodefelt, {
        mode: { name: "javascript", typescript: true }, theme: "material-darker", lineNumbers: true, indentUnit: 4, tabSize: 4,

}
function hentKode() { return cm ? cm.getValue() : kodefelt.value; }
function settKode(t) { if (cm) { cm.setValue(t); cm.setCursor(cm.lineCount(), 0); } else kodefelt.value = t; planleggSjekk(0); }
function markorIndeks() { return cm ? cm.indexFromPos(cm.getCursor()) : kodefelt.selectionStart; }
function planleggLagring() { clearTimeout(lagreTid); lagreTid = setTimeout(lagreKode, 300); }

function fjernFeilmerke() { if (cm && feilLinje !== null) { cm.removeLineClass(feilLinje, "background", "feillinje"); } feilLinje = null; }

    cm.scrollIntoView({ line: feilLinje, ch: 0 }, 60);
}
function simLim(t) { settKode(t); lagreKode(); if (cm) cm.focus(); else kodefelt.focus(); }

/* ================== KOMPILATOREN (TypeScript i ein eigen Web Worker) ================== */
const TS_VERSJON = "5.9.3";
const TS_KJELDER = [
    `https://cdn.jsdelivr.net/npm/typescript@${TS_VERSJON}/lib/`,
    `https://unpkg.com/typescript@${TS_VERSJON}/lib/`,
];
/* Berre dei standardbiblioteka simulatoren treng (ES2022-metodar på tabellar, strengar, Map, Set …) – ikkje DOM */
const TS_LIBS = ["lib.es5.d.ts", "lib.es2015.core.d.ts", "lib.es2015.collection.d.ts", "lib.es2015.iterable.d.ts",
    "lib.es2015.symbol.d.ts", "lib.es2015.symbol.wellknown.d.ts", "lib.es2015.promise.d.ts", "lib.es2016.array.include.d.ts",
    "lib.es2017.object.d.ts", "lib.es2017.string.d.ts", "lib.es2019.array.d.ts", "lib.es2019.object.d.ts", "lib.es2019.string.d.ts",
    "lib.es2021.string.d.ts", "lib.es2022.array.d.ts", "lib.es2022.string.d.ts"];
/* Det som finst i simulatoren i staden for nettsida (lib.dom) */
const SIM_DTS = `interface Console {
    log(...data: any[]): void;
    info(...data: any[]): void;
    debug(...data: any[]): void;
    warn(...data: any[]): void;
    error(...data: any[]): void;
    clear(): void;
}
declare var console: Console;
/** Spør brukaren. Gir teksten brukaren skreiv, eller null om brukaren avbraut (Esc). */
declare function prompt(message?: string): string | null;
/** Viser ei melding. */
declare function alert(message?: any): void;
`;

/* Denne funksjonen køyrer inne i workeren (blir gjort om til tekst) */
function kompilatorWorker(KJELDER, LIBS, SIM_DTS) {
    let ts = null, ls = null, kode = "", versjon = 0, base = null;
    const filer = {};
    async function hentTekst(sti) {
        for (const b of [base, ...KJELDER.filter(k => k !== base)]) {
            try { const r = await fetch(b + sti); if (r.ok) return await r.text(); } catch (e) {}
        }
        throw new Error("Klarte ikkje å hente " + sti);
    }
    async function start() {
        for (const b of KJELDER) {
            try { importScripts(b + "typescript.js"); if (self.ts && self.ts.createLanguageService) { ts = self.ts; base = b; break; } } catch (e) {}
        }
        if (!ts) throw new Error("Klarte ikkje å laste typescript.js");
        const tekstar = await Promise.all(LIBS.map(hentTekst));
        LIBS.forEach((l, i) => { filer["/" + l] = tekstar[i]; });
        filer["/simulator.d.ts"] = SIM_DTS;
        const opts = {
            strict: true, target: ts.ScriptTarget.ES2022, module: ts.ModuleKind.None, noLib: true,
            sourceMap: true, noFallthroughCasesInSwitch: true, newLine: ts.NewLineKind.LineFeed,
        };
        const host = {
            getScriptFileNames: () => [...Object.keys(filer), "/main.ts"],
            getScriptVersion: f => f === "/main.ts" ? String(versjon) : "1",
            getScriptSnapshot: f => { const t = f === "/main.ts" ? kode : filer[f]; return t === undefined ? undefined : ts.ScriptSnapshot.fromString(t); },
            getCurrentDirectory: () => "/",
            getCompilationSettings: () => opts,
            getDefaultLibFileName: () => "/lib.es5.d.ts",
            fileExists: f => f === "/main.ts" || f in filer,
            readFile: f => f === "/main.ts" ? kode : filer[f],
        };
        ls = ts.createLanguageService(host, ts.createDocumentRegistry());
        ls.getSemanticDiagnostics("/main.ts");   // varm opp (les inn standardbiblioteka)
        postMessage({ t: "klar", versjon: ts.version });
    }
    function settKode(k) { if (typeof k === "string" && k !== kode) { kode = k; versjon++; } }
    function diagnosar() {
        const alle = [...ls.getSyntacticDiagnostics("/main.ts"), ...ls.getSemanticDiagnostics("/main.ts")];
        return alle.filter(d => d.category === ts.DiagnosticCategory.Error && d.file && d.start !== undefined).map(d => {
            const p = d.file.getLineAndCharacterOfPosition(d.start);
            return { kode: d.code, melding: ts.flattenDiagnosticMessageText(d.messageText, "\n"), start: d.start, lengd: d.length || 0, linje: p.line + 1, kol: p.character + 1 };
        }).sort((a, b) => a.start - b.start);
    }
    function info(pos) {
        for (const p of [pos, pos - 1]) {
            if (p < 0) continue;
            const qi = ls.getQuickInfoAtPosition("/main.ts", p);
            if (qi && qi.displayParts && qi.displayParts.length) {
                return { tekst: ts.displayPartsToString(qi.displayParts), doc: ts.displayPartsToString(qi.documentation || []), start: qi.textSpan.start, lengd: qi.textSpan.length };
            }
        }
        return null;
    }
    const klar = start().catch(e => { postMessage({ t: "lastfeil", melding: String(e && e.message || e) }); });
    onmessage = async e => {
        const m = e.data;
        try {
            await klar;
            if (!ls) throw new Error("Kompilatoren er ikkje lasta");
            settKode(m.kode);
            if (m.t === "sjekk") {
                const svar = { t: "svar", id: m.id, diag: diagnosar() };
                if (m.emit) {
                    const ut = ls.getEmitOutput("/main.ts").outputFiles;
                    const js = ut.find(f => f.name.endsWith(".js")), kart = ut.find(f => f.name.endsWith(".map"));
                    svar.js = js ? js.text : "";
                    svar.kart = kart ? JSON.parse(kart.text).mappings : "";
                }
                postMessage(svar);
            } else if (m.t === "info") {
                postMessage({ t: "svar", id: m.id, info: info(m.pos) });
            }
        } catch (err) {
            postMessage({ t: "svar", id: m.id, feil: String(err && err.message || err) });
        }
    };
}

let tsWorker = null, tsKlar = false, tsLastfeil = null, tsId = 0, ventarPaaKoyr = false;
const tsVentar = new Map();
function startKompilator() {
    settTsStatus("⏳ Lastar TypeScript …", "lastar", "Kompilatoren blir lasta ned – første gong kan det ta litt tid");
    const src = `(${kompilatorWorker.toString()})(${JSON.stringify(TS_KJELDER)}, ${JSON.stringify(TS_LIBS)}, ${JSON.stringify(SIM_DTS)});`;
    const url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
    tsWorker = new Worker(url);
    URL.revokeObjectURL(url);
    tsWorker.onmessage = e => {
        const d = e.data;
        if (d.t === "klar") {
            tsKlar = true;
            settTsStatus("TypeScript " + d.versjon, "", "Kompilatoren er klar (strict-modus)");
            typelinje.innerHTML = '<span class="svak">Klikk på eit namn i koden for å sjå typen.</span>';
            livesjekk();
            planleggTypelinje();
            if (ventarPaaKoyr) { ventarPaaKoyr = false; koyr(); }
        } else if (d.t === "lastfeil") {
            tsLastfeil = d.melding;
            settTsStatus("✖ Kompilatoren manglar", "feil", d.melding);
            if (ventarPaaKoyr) { ventarPaaKoyr = false; settStatus("Klar"); visLastfeil(); }
        } else if (d.t === "svar" && tsVentar.has(d.id)) {
            const { ok, feil } = tsVentar.get(d.id);
            tsVentar.delete(d.id);
            if (d.feil) feil(new Error(d.feil)); else ok(d);
        }
    };
    tsWorker.onerror = e => { e.preventDefault(); };
}
function tsSpor(melding) {
    return new Promise((ok, feil) => {
        if (!tsKlar) { feil(new Error("Kompilatoren er ikkje klar")); return; }
        const id = ++tsId;
        tsVentar.set(id, { ok, feil });
        tsWorker.postMessage({ ...melding, id });
    });
}
function visLastfeil() {
    konsoll.innerHTML = "";
    skriv("✖ Klarte ikkje å laste TypeScript-kompilatoren.\n", "err");
    hjelp("Kompilatoren blir henta frå <code>cdn.jsdelivr.net</code> eller <code>unpkg.com</code>. Sjekk nettilkoplinga og last sida på nytt. På nokre skulenett er desse sidene blokkerte – spør læraren.");
}

/* ---- Direktesjekk medan du skriv: raude bølgjestrekar ---- */

async function livesjekk() {
    if (!tsKlar) return;
    const kode = hentKode();
    let svar;
    try { svar = await tsSpor({ t: "sjekk", kode }); } catch (e) { return; }
    if (kode !== hentKode()) return;   // koden er endra sidan – ny sjekk kjem
    visDiagnosar(svar.diag);
}
function visDiagnosar(diag) {
    diagnosar = diag;
    merke.forEach(m => m.clear()); merke = [];
    if (cm) {
        const n = cm.getValue().length;
        for (const d of diag) {
            let fra = d.start, til = d.start + Math.max(d.lengd, 1);
            if (til > n) { til = n; fra = Math.max(0, Math.min(fra, n - 1)); }
            if (fra >= til) continue;
            merke.push(cm.markText(cm.posFromIndex(fra), cm.posFromIndex(til), { className: "tsfeil" }));
        }
    }
    if (diag.length) settTsStatus("✖ " + diag.length + " typefeil", "feil", "Hald musa over den raude streken for å lese feilen");
    else settTsStatus("✔ Ingen typefeil", "ok", "Kompilatoren fann ingen feil");

/* ---- Typelinja under koden: typen der markøren står ---- */
let typeTid = null;

async function oppdaterTypelinje() {

    const kode = hentKode(), pos = markorIndeks();
    const feil = diagnosar.find(d => pos >= d.start && pos <= d.start + Math.max(d.lengd, 1));
    if (feil) { typelinje.innerHTML = `<span class="feil">✖ TS${feil.kode}: ${esc(feil.melding.split("\n")[0])}</span>`; return; }
    let svar = null;

    if (kode !== hentKode() || pos !== markorIndeks()) return;
    if (svar && svar.info) typelinje.innerHTML = `<span class="ti">ℹ</span> ${fargeType(svar.info.tekst)}`;

/* Enkel farging av typeinfo, t.d. «let alder: number» */

    return esc(t).replace(/\b(let|const|var|function|interface|type|parameter|property|method|class|enum)\b/g, '<span class="tk">$1</span>')
        .replace(/\b(string|number|boolean|null|undefined|void|any|unknown|never|true|false)\b/g, '<span class="tt">$1</span>');

/* ---- Hald musa over koden: typeinfo og feilmelding (som i VS Code) ---- */
let hoverTid = null, tippPos = null;
function skjulTipp() { tipp.classList.remove("vis"); tippPos = null; }
if (cm) {
    const w = cm.getWrapperElement();
    w.addEventListener("mousemove", e => {
        clearTimeout(hoverTid);
        if (tippPos && Math.hypot(e.clientX - tippPos.x, e.clientY - tippPos.y) > 14) skjulTipp();
        hoverTid = setTimeout(() => visTipp(e.clientX, e.clientY), 380);
    });
    w.addEventListener("mouseleave", () => { clearTimeout(hoverTid); skjulTipp(); });
    w.addEventListener("mousedown", skjulTipp);
    cm.on("scroll", skjulTipp);
}
async function visTipp(x, y) {
    if (!cm || !tsKlar) return;
    const pos = cm.coordsChar({ left: x, top: y }, "window");
    const c = cm.charCoords(pos, "window");
    if (x < c.left - 10 || x > c.right + 10 || y < c.top - 2 || y > c.bottom + 2) return;   // ikkje over tekst
    const idx = cm.indexFromPos(pos), kode = hentKode();
    const feil = diagnosar.filter(d => idx >= d.start && idx < d.start + Math.max(d.lengd, 1));
    let svar = null;
    try { svar = await tsSpor({ t: "info", kode, pos: idx }); } catch (e) {}
    if (kode !== hentKode()) return;
    const info = svar && svar.info && idx >= svar.info.start && idx <= svar.info.start + svar.info.lengd ? svar.info : null;
    if (!info && !feil.length) return;
    let html = "";
    if (info) html += `<div class="type">${fargeType(info.tekst)}</div>` + (info.doc ? `<div class="doc">${esc(info.doc)}</div>` : "");
    for (const f of feil) html += `<div class="tfeil">✖ ${esc(f.melding)} <span class="nr">TS${f.kode}</span></div><div class="hjelp">💡 ${hjelpTs(f.kode, f.melding)}</div>`;
    tipp.innerHTML = html;
    tipp.classList.add("vis");
    const b = tipp.offsetWidth, h = tipp.offsetHeight;
    let left = Math.min(x + 10, window.innerWidth - b - 8), top = c.bottom + 6;
    if (top + h > window.innerHeight - 8) top = c.top - h - 6;
    tipp.style.left = Math.max(8, left) + "px"; tipp.style.top = Math.max(8, top) + "px";
    tippPos = { x, y };
}

}

function dekodKart(mappings) {
    const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
    const linjer = []; let srcLinje = 0;
    for (const linje of String(mappings).split(";")) {
        const seg = []; let kol = 0;
        if (linje) for (const s of linje.split(",")) {
            const v = []; let shift = 0, val = 0;
            for (const ch of s) {
                let d = B64.indexOf(ch); const vidare = d & 32; d &= 31;
                val += d << shift;
                if (vidare) shift += 5; else { v.push(val & 1 ? -(val >>> 1) : val >>> 1); val = 0; shift = 0; }
            }
            kol += v[0];
            if (v.length >= 4) { srcLinje += v[2]; seg.push([kol, srcLinje]); }
        }
        linjer.push(seg);
    }
    return linjer;
}
function tsLinje(kart, jsLinje, kol) {
    if (!kart || !(jsLinje >= 1)) return null;
    for (let l = jsLinje; l >= 1 && l > jsLinje - 3; l--) {
        const seg = kart[l - 1];
        if (!seg || !seg.length) continue;
        let best = seg[0];
        if (l === jsLinje && kol) for (const s of seg) if (s[0] <= kol - 1) best = s;
        return best[1] + 1;
    }
    return null;
}

    if (!tsKlar) {
        if (tsLastfeil) { visLastfeil(); return; }
        ventarPaaKoyr = true;
        settStatus("Ventar på kompilatoren …", "koyrer");
        return;
    }
    const kode = hentKode();
    lagreKode();
    fjernFeilmerke();
    kompilerer = true; knappKoyr.disabled = true;
    settStatus("Kompilerer …", "koyrer");
    let svar;
    try { svar = await tsSpor({ t: "sjekk", kode, emit: true }); }
    catch (e) { kompilerer = false; knappKoyr.disabled = false; settStatus("Feil", "feil"); skriv("Intern feil i kompilatoren: " + e.message + "\n", "err"); return; }
    kompilerer = false;
    if (kode === hentKode()) visDiagnosar(svar.diag);
    konsoll.innerHTML = "";
    skriv("▶ tsc main.ts\n", "info");
    if (svar.diag.length) {
        const vis = svar.diag.slice(0, 8);
        for (const d of vis) {
            skriv(`main.ts:${d.linje}:${d.kol} - error TS${d.kode}: ${d.melding}\n`, "err");
            hjelp(hjelpTs(d.kode, d.melding));
        }
        if (svar.diag.length > vis.length) skriv(`… og ${svar.diag.length - vis.length} feil til.\n`, "err");
        skriv(`\nFann ${svar.diag.length} feil. Koden vart ikkje køyrd – rett opp feila først.\n`, "warn");
        if (kode === hentKode()) markerLinje(svar.diag[0].linje);
        knappKoyr.disabled = false;
        settStatus("Typefeil – sjå konsollen", "feil");
        sjekkOppgaver({ kode, utdata: "", input: [], feil: null, feiltype: null, stoppa: false, koyrt: false, tsfeil: svar.diag });
        return;
    }
    skriv("✔ Ingen typefeil\n", "ok");
    skriv("▶ node main.js\n", "info");
    const js = svar.js.replace(/\n?\/\/# sourceMappingURL=.*\s*$/, "");
    kjoring = { kode, kart: dekodKart(svar.kart), utdata: [], input: [], feil: null, feiltype: null, stoppa: false, jsLinjer: js.split("\n").length };
    const kropp = js.replace(/(\bawait\s+)?\bprompt\s*\(/g, "await prompt(");
    const src = PREAMBLE + "(async () => {\n" + kropp + "\n})().then(__ferdig, __feil);";
    const url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
    worker = new Worker(url);
    URL.revokeObjectURL(url);
    korer = true;
    knappStopp.disabled = false;
    settStatus("Køyrer …", "koyrer");
    worker.onmessage = e => handterMelding(e.data);
    worker.onerror = e => {
        e.preventDefault();
        const melding = String(e.message || "Error").replace(/^Uncaught\s+/, "");
        const m = melding.match(/^(\w*Error):\s*([\s\S]*)$/);
        const namn = m ? m[1] : "Error", tekst = m ? m[2] : melding;
        visFeil(namn, tekst, e.lineno ? e.lineno - 1 : null, e.colno);
    };
}

function handterMelding(d) {
    if (!kjoring) return;
    if (d.t === "ut") {
        const l = d.l;
        if (d.h) skriv("… (" + d.h + " linjer hoppa over) …\n", "info");
        for (const x of l) if (x.k === "log" && kjoring.utdata.length < 20000) kjoring.utdata.push(x.s);
        let tekst = "", kl = null;
        for (const x of l) {
            const k = x.k === "log" ? "" : x.k;
            if (kl !== null && k !== kl) { skriv(tekst, kl); tekst = ""; }
            kl = k; tekst += x.s + "\n";
        }
        if (tekst) skriv(tekst, kl);
    } else if (d.t === "clear") {
        konsoll.innerHTML = "";
    } else if (d.t === "alert") {
        skriv(d.s, "alert"); skriv("\n"); kjoring.utdata.push(d.s);
    } else if (d.t === "input") {
        visInput(d.q);
    } else if (d.t === "ferdig") {
        avslutt("ferdig");
    } else if (d.t === "formykje") {
        skriv("\n■ Stoppa: programmet skreiv over 50 millionar linjer.\n", "warn");
        hjelp("Har du ei evig løkke? Sjekk at vilkåret i <code>while</code>/<code>for</code> blir usant til slutt.");
        kjoring.stoppa = true; avslutt("stoppa");
    } else if (d.t === "feil") {
        let linje = null, kol = null;
        const m = String(d.stack).match(/blob:[^\s)]*:(\d+):(\d+)/);
        if (m) { linje = Number(m[1]) - 1; kol = Number(m[2]); }
        visFeil(d.namn, d.melding, linje, kol);
    }
}

function visInput(q) {
    settStatus("Ventar på svar …", "koyrer");
    const rad = document.createElement("div");
    rad.className = "inrad";
    const s = document.createElement("span"); s.textContent = q ? q + " " : ""; rad.appendChild(s);
    const inp = document.createElement("input");
    inp.type = "text"; inp.autocomplete = "off"; inp.spellcheck = false; inp.setAttribute("aria-label", "Svar (Enter = OK, Esc = Avbryt)");
    inp.placeholder = "Enter = OK · Esc = Avbryt";
    rad.appendChild(inp);
    konsoll.appendChild(rad); konsoll.scrollTop = konsoll.scrollHeight;
    inp.focus({ preventScroll: true });
    inp.addEventListener("keydown", e => {
        if (e.key !== "Enter" && e.key !== "Escape") return;
        e.preventDefault(); e.stopPropagation();
        const v = e.key === "Escape" ? null : inp.value;
        const svar = document.createElement("span");
        svar.className = v === null ? "info" : "inn";
        svar.textContent = v === null ? "(Avbryt → null)" : v;
        inp.replaceWith(svar);
        konsoll.appendChild(document.createTextNode("\n"));
        if (kjoring) kjoring.input.push(v);
        settStatus("Køyrer …", "koyrer");
        if (worker) worker.postMessage({ t: "svar", v });
    });
}

function visFeil(namn, melding, jsLinje, kol) {
    if (!kjoring) return;
    const linje = jsLinje && jsLinje <= kjoring.jsLinjer ? tsLinje(kjoring.kart, jsLinje, kol) : null;
    skriv("Uncaught " + namn + ": " + melding + "\n", "err");
    if (linje) { skriv("    at main.ts:" + linje + "\n", "err"); markerLinje(linje); }
    hjelp(hjelpFor(namn, melding));
    kjoring.feil = namn + ": " + melding; kjoring.feiltype = namn;
    avslutt("feil");
}

function hjelpFor(namn, m) {
    if (namn === "SyntaxError") {
        if (/await is only valid|reserved word/.test(m)) return "I simulatoren kan <code>prompt</code> berre brukast utanfor eigne funksjonar. Hent svaret først, og send verdien inn i funksjonen som parameter.";
        return "Ein syntaksfeil som kompilatoren ikkje fanga. Sjå på den raude linja.";
    }
    if (namn === "TypeError") {
        if (/is not a function/.test(m)) return "Du prøver å kalle noko som ikkje er ein funksjon. Kompilatoren kunne ikkje åtvare deg, fordi verdien hadde typen <code>any</code> – då blir ingenting sjekka. Med ein ekte type (eller <code>unknown</code>) hadde feilen vorte oppdaga før køyring.";
        if (/Cannot read properties of (undefined|null)/.test(m)) return "Du prøver å hente noko frå ein verdi som er <code>undefined</code> eller <code>null</code>. Sjekk verdien med <code>if</code> eller <code>?.</code> først. Er typen <code>any</code>, kan ikkje kompilatoren hjelpe deg.";
    }
    if (namn === "ReferenceError") return "Noko finst ikkje når programmet køyrer. Har du brukt <code>any</code> eller noko simulatoren ikkje har?";
    if (namn === "RangeError" && /call stack/.test(m)) return "Funksjonen kallar seg sjølv om og om att utan å stoppe. Han treng eit vilkår som gjer at han sluttar.";
    if (namn === "RangeError") return "Ein verdi er utanfor det lovlege området, t.d. eit negativt tal eller for mange desimalar.";
    if (namn === "Error") return "Programmet kasta ein feil med <code>throw</code>.";
    return "Programmet krasja medan det køyrde. Les feilmeldinga og sjå på den raude linja.";
}

function stopp() {
    if (!korer || !kjoring) return;
    skriv("\n■ Programmet vart stoppa.\n", "warn");
    kjoring.stoppa = true;
    avslutt("stoppa");
}

function avslutt(korleis) {
    if (worker) { worker.terminate(); worker = null; }
    konsoll.querySelectorAll(".inrad input").forEach(i => { i.disabled = true; });
    korer = false;
    knappKoyr.disabled = false; knappStopp.disabled = true;
    const k = kjoring; kjoring = null;
    if (!k) return;
    const ut = k.utdata.join("\n");
    if (korleis === "ferdig") {
        skriv("\n— Programmet er ferdig —\n", "info");
        settStatus("Ferdig");
        if (/\bNaN\b/.test(ut)) hjelp("<code>NaN</code> betyr «Not a Number» – du har rekna med noko som ikkje er eit tal. Typen var <code>number</code>, men verdien var ugyldig (t.d. <code>Number(\"hei\")</code> eller deling 0/0).");
    } else if (korleis === "stoppa") settStatus("Stoppa");
    else settStatus("Feil – sjå konsollen", "feil");
    sjekkOppgaver({ kode: k.kode, utdata: ut, input: k.input, feil: k.feil, feiltype: k.feiltype, stoppa: k.stoppa, koyrt: true, tsfeil: [] });
}

startKompilator();

/* ================== OPPSTART ================== */
visLeksjon(aktivIndeks, false);
</script>
</body>
</html>
