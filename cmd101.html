/* set */
function reknA(uttrykk) {
  const tok = uttrykk.match(/0x[0-9a-f]+|\d+|[a-z_][\w.]*|<<=?|>>=?|[+\-*\/%&|^]=|[-+*\/%()=,!~&|^]|\S/gi) || [];
  let i = 0;
  const kikk = () => tok[i], neste = () => tok[i++];
  const talVerdi = n => { const v = hentVar(n); const t = parseInt(v, 10); return isFinite(t) ? t : 0; };
  function prim() {
    const t = neste();
    if (t === undefined) throw "Missing operand.";
    if (t === "(") { const v = komma(); if (neste() !== ")") throw "Unbalanced parenthesis."; return v; }
    if (t === "-") return -prim() | 0;
    if (t === "+") return prim();
    if (t === "!") return prim() ? 0 : 1;
    if (t === "~") return ~prim();
    if (/^0x/i.test(t)) return parseInt(t, 16) | 0;
    if (/^\d/.test(t)) { if (+t > 2147483647) throw "Invalid number.  Numbers are limited to 32-bits of precision."; return parseInt(t, 10); }
    if (/^[a-z_]/i.test(t)) return talVerdi(t);
    throw "Missing operand.";
  }
  function mul() { let v = prim(); while (["*", "/", "%"].includes(kikk())) { const o = neste(); const r = prim(); if (o !== "*" && r === 0) throw "Divide by zero error."; v = o === "*" ? Math.imul(v, r) : o === "/" ? Math.trunc(v / r) : v % r; } return v; }
  function add() { let v = mul(); while (kikk() === "+" || kikk() === "-") { const o = neste(); const r = mul(); v = (o === "+" ? v + r : v - r) | 0; } return v; }
  function tildel() {
    if (/^[a-z_]/i.test(kikk() || "") && /^([+\-*\/%&|^]|<<|>>)?=$/.test(tok[i + 1] || "")) {
      const n = neste(), o = neste(); const r = tildel();
      let v = r;
      const g = talVerdi(n);
      if (o === "+=") v = g + r; else if (o === "-=") v = g - r; else if (o === "*=") v = g * r;
      else if (o === "/=") { if (!r) throw "Divide by zero error."; v = Math.trunc(g / r); } else if (o === "%=") { if (!r) throw "Divide by zero error."; v = g % r; }
      settVar(n, String(v | 0)); S.brukarVar.add(lc(n));
      return v | 0;
    }
    return add();
  }
  function komma() { let v = tildel(); while (kikk() === ",") { neste(); v = tildel(); } return v; }
  if (!tok.length) throw "The syntax of the command is incorrect.";
  const v = komma();
  if (i < tok.length) throw tok[i] === ")" ? "Unbalanced parenthesis." : "Missing operator.";
  return v;
}
K.set = async (a, io, ktx) => {
  let t = a.replace(/^\s/, "");
  const tt = t.trim();
  if (!tt) {
    const alle = Object.values(S.env).sort((x, y) => lc(x.namn) < lc(y.namn) ? -1 : 1);
    alle.forEach(v => io.ut(v.namn + "=" + v.verdi + "\n"));
    return;
  }
  let m;
  if ((m = tt.match(/^\/a\s*(.*)$/is))) {
    let u = m[1].trim().replace(/^"(.*)"$/s, "$1");
    if (!u) { io.feil("The syntax of the command is incorrect.", "Skriv eit reknestykke, t.d. `set /a 2+3` eller `set /a sum=5*8`."); return false; }
    try {
      const v = reknA(u);
      io.post.ekstra.resultat = v;
      if (!ktx.batch) io.ut(v + "\n");
    } catch (e) {
      const hj = { "Missing operand.": "Reknestykket er ikkje fullstendig. Eksempel: `set /a 2+3`.", "Divide by zero error.": "Du kan ikkje dele på 0 – heller ikkje i CMD.",

      io.feil(String(e), hj || "Sjekk reknestykket.");
      return false;
    }
    return;
  }
  if ((m = tt.match(/^\/p\s*(.*)$/is))) {
    let r = m[1];
    if (r.startsWith('"')) r = r.slice(1, r.lastIndexOf('"') > 0 ? r.lastIndexOf('"') : undefined);
    else r = a.replace(/^\s*\/p\s*/i, "");
    const i = r.indexOf("=");
    if (i < 1) { io.feil("The syntax of the command is incorrect.", "Skriv t.d. `set /p namn=Kva heiter du? ` – variabelnamnet først, så `=` og spørsmålet."); return false; }
    const namn = r.slice(0, i), sporsmal = r.slice(i + 1);
    if (ktx.batch) ktx.batch.brukteSetP = true;

    const svar = await lesLinje();
    io.post.ekstra.svar = svar;

    if (svar === "") { io.mislukka(); return false; }
    settVar(namn, svar); S.brukarVar.add(lc(namn));
    return;
  }
  let s = t;
  if (s.trim().startsWith('"')) { s = s.trim(); s = s.slice(1, s.lastIndexOf('"') > 0 ? s.lastIndexOf('"') : undefined); }
  const i = s.indexOf("=");
  if (i < 0) {
    const p = lc(s.trim());
    const treff = Object.values(S.env).filter(v => lc(v.namn).startsWith(p)).sort((x, y) => lc(x.namn) < lc(y.namn) ? -1 : 1);
    if (["cd", "date", "time", "random", "errorlevel"].includes(p) && !treff.length) { io.feil("Environment variable " + s.trim() + " not defined", `\`%${p.toUpperCase()}%\` er ein spesiell variabel som ikkje står i lista. Skriv \`echo %${p.toUpperCase()}%\` for å sjå verdien.`); return false; }
    if (!treff.length) { io.feil("Environment variable " + s.trim() + " not defined", `Variabelen \`${s.trim()}\` finst ikkje. Lag han med \`set ${s.trim()}=verdi\`.`); return false; }
    treff.forEach(v => io.ut(v.namn + "=" + v.verdi + "\n"));
    return;
  }
  if (i === 0) { io.feil("The syntax of the command is incorrect.", "Variabelen må ha eit namn før `=`, t.d. `set namn=Kari`."); return false; }
  const namn = s.slice(0, i), verdi = s.slice(i + 1);
  if (/\s$/.test(namn) || /^\s/.test(verdi)) io.hjelp(`Obs: Du har mellomrom rundt \`=\`. I CMD blir mellomromet ein del av namnet og verdien, så variabelen heiter no «${namn}» (med mellomrom). Skriv heller \`set ${namn.trim()}=${verdi.trim()}\` utan mellomrom.`);
  settVar(namn, verdi);
  if (verdi !== "") S.brukarVar.add(lc(namn));
};

    else if (x === "-l" || x === "/l") { storleik = parseInt(o[++i]); if (!(storleik >= 0 && storleik <= 65500)) { io.feil("Bad value for option -l, valid range is from 0 to 65500."); return false; } }
    else if (x === "-w" || x === "-i") i++;
    else if (x === "-4" || x === "-6" || x === "-a") { /* ignorer */ }
    else if (x.startsWith("-") || x.startsWith("/")) { io.feil(`Bad option ${o[i]}.`, "Ukjend brytar. Vanlege brytarar er `-n tal` og `-t`. Skriv `ping /?` for meir."); return false; }

    io.hjelp("Skriv kva du vil pinge, t.d. `ping google.com` eller `ping 8.8.8.8`.");
    return false;
  }
  const r = slaaOpp(maal);
  io.post.ekstra = { maal: lc(maal), ip: r.ip, n, t: evig, sendt: 0, motteke: 0, type: r.type };
  if (r.type === "ukjend") {
    io.feil(`Ping request could not find host ${maal}. Please check the name and try again.`, `Namnet «${maal}» fanst ikkje i DNS. Sjekk skrivemåten (t.d. \`google.com\`). Verkar \`ping 8.8.8.8\` men ikkje namn, er det truleg DNS-feil.`);
    return false;
  }
  const lokal = r.type === "lokal" || r.type === "lokal6";

  const v6 = r.type === "lokal6";

  const tider = [];
  let sendt = 0, motteke = 0;
  const stat = () => {
    const tapt = sendt - motteke;
    let s = `\nPing statistics for ${r.ip}:\n    Packets: Sent = ${sendt}, Received = ${motteke}, Lost = ${tapt} (${sendt ? Math.round(100 * tapt / sendt) : 0}% loss),\n`;

    return s;
  };
  try {
    for (let i = 0; evig || i < n; i++) {
      if (utanNett) { await vent(tilfeldig(350, 600)); sendt++; io.ut("PING: transmit failed. General failure. \n"); }
      else if (r.type === "timeout") { await vent(tilfeldig(900, 1100)); sendt++; io.ut("Request timed out.\n"); }

        await vent(tilfeldig(400, 800));

        if (lokal) ms = 0;
        else if (r.type === "gw") { ms = 1; ttl = 255; if (Math.random() < .5) ms = 0; }
        else { ms = tilfeldig(r.vert.ms[0], r.vert.ms[1]); ttl = r.vert.ttl; }
        motteke++; tider.push(ms);
        const tid = ms < 1 ? "time<1ms" : "time=" + ms + "ms";
        if (v6) io.ut(`Reply from ${r.ip}: ${tid} \n`);
        else io.ut(`Reply from ${r.ip}: bytes=${storleik} ${tid} TTL=${ttl}\n`);

    }
    throw e;
  }
  io.ut(stat());

  else if (r.type === "timeout") io.hjelp("Ingen svar. Maskinen finst kanskje ikkje, er slått av, eller ein brannmur stoppar ping. Sjekk adressa med `ipconfig`.");

};

K.shutdown = async (a, io) => {
  const { sw } = bryt(a.replace(/-([a-z])/gi, "/$1"));
  if (sw.has("a")) {
    if (S.nedstenging) { S.nedstenging = false; io.hjelp("Nedstenginga er avbroten."); return; }
    io.feil("Unable to abort the system shutdown because no shutdown was in progress.(1116)"); return false;
  }
  if (sw.has("s") || sw.has("r") || sw.has("l") || sw.has("h")) {
    S.nedstenging = true;
    const t = (a.match(/[/-]t\s+(\d+)/i) || [])[1];
    const kva = sw.has("r") ? "starte på nytt" : sw.has("l") ? "logge deg av" : sw.has("h") ? "gå i dvale" : "slå seg av";
    io.hjelp(`Åtvaring: På ein ekte PC ville maskinen no ${kva}${t ? ` om ${t} sekund` : " om eitt minutt"} – og arbeid som ikkje er lagra, kan gå tapt! I simulatoren skjer ingenting. Ei planlagd nedstenging avbryt du med \`shutdown /a\`.`);
    return;
  }
  io.ut("Usage: shutdown [/i | /l | /s | /sg | /r | /g | /a | /p | /h | /e | /o] [/hybrid] [/soft] [/fw] [/f]\n    [/m \\\\computer][/t xxx][/d [p|u:]xx:yy [/c \"comment\"]]\n\n    No args    Display help. This is the same as typing /?.\n    /s         Shutdown the computer.\n    /r         Full shutdown and restart the computer.\n    /a         Abort a system shutdown.\n    /t xxx     Set the time-out period before shutdown to xxx seconds.\n");
  io.hjelp("`shutdown /s` slår av maskinen og `shutdown /r` startar han på nytt. `/t 60` ventar 60 sekund først. Ver forsiktig på ein ekte PC!");
};

const HJELP_ALIAS = { chdir: "cd", md: "mkdir", rd: "rmdir", erase: "del", rename: "ren" };
function visHjelpFor(namn, io) {
  const k = HJELP_ALIAS[namn] || namn;
  const h = HJELP[k];
  if (!h) { io.ut("This command is not supported by the help utility.  Try \"" + namn + " /?\".\n"); io.hjelp(`Det finst inga hjelp for «${namn}» i simulatoren.`); return; }
  io.ut((h[0] ? h[0] + "\n\n" : "") + h[1] + "\n");
  io.hjelp(h[2]);
}
K.help = async (a, io) => {
  const t = lc(a.trim());
  if (t) {
    if (!KOMMANDOAR[t] && !HJELP[t]) { io.ut("This command is not supported by the help utility.  Try \"" + t + " /?\".\n"); return false; }
    visHjelpFor(t, io); return;
  }
  io.ut("For more information on a specific command, type HELP command-name\n");
  const namn = ["attrib", "call", "cd", "chdir", "cls", "color", "copy", "date", "del", "dir", "echo", "erase", "exit", "find", "findstr", "goto", "help", "if",
    "md", "mkdir", "more", "move", "pause", "rd", "rem", "ren", "rename", "rmdir", "set", "shutdown", "sort", "start", "systeminfo", "tasklist", "taskkill", "time", "timeout", "title", "tree", "type", "ver", "xcopy"];
  for (const n of namn) io.ut(n.toUpperCase().padEnd(15) + HJELP[HJELP_ALIAS[n] || n][0] + "\n");
  io.ut("\nFor more information on tools see the command-line reference in the online help.\n");
  io.hjelp("Dette er dei innebygde kommandoane. Nettverkskommandoar som `ipconfig`, `ping`, `tracert` og `nslookup` står ikkje i lista, men verkar òg. Skriv t.d. `ping /?` for hjelp til ein kommando.");
};

   ===================================================================== */
const NP = { sti: null, original: "", open: false, dialogSvar: null };
const npEl = document.getElementById("notisblokk"), npTekst = document.getElementById("npTekst");
function npTittel() {
  const namn = NP.sti ? basenamn(NP.sti) : "Untitled";
  document.getElementById("npNamn").textContent = (npTekst.value !== NP.original ? "*" : "") + namn + " - Notepad";
}
function npFeil(t) { const e = document.getElementById("npFeil"); e.innerHTML = t ? hjelpHtml(t) : ""; e.classList.toggle("vis", !!t); }
function npDialog(tekst) {
  document.getElementById("npDialogTekst").textContent = tekst;
  document.getElementById("npDialogBak").classList.add("vis");
  setTimeout(() => document.getElementById("npJa").focus(), 0);
  return new Promise(res => { NP.dialogSvar = res; });
}
function npSvar(v) { document.getElementById("npDialogBak").classList.remove("vis"); const r = NP.dialogSvar; NP.dialogSvar = null; if (r) r(v); }
document.getElementById("npJa").onclick = () => npSvar(true);
document.getElementById("npNei").onclick = () => npSvar(false);

async function opneNotisblokk(abs) {
  if (NP.open) lukkNotisblokk(true);
  NP.sti = abs; NP.open = true;
  npFeil("");
  document.getElementById("npFilnamnRad").classList.toggle("vis", !abs);
  document.getElementById("npFilnamn").value = "";
  NP.mappe = S.cwd;
  let tekst = "";
  npTekst.value = ""; NP.original = "";
  npEl.classList.add("vis");
  if (!S.prosessar.some(p => lc(p.namn) === "notepad.exe")) S.prosessar.push({ namn: "Notepad.exe", pid: 10412, okt: "Console", nr: 1, mem: 48212 });
  npTittel();
  if (abs) {
    const n = hent(abs);
    if (!n) {
      const ja = await npDialog(`Cannot find the ${abs} file.\n\nDo you want to create a new file?`);
      if (!ja) { lukkNotisblokk(true); return; }
      const fe = skrivFil(abs, "");
      if (fe) {
        npFeil(fe === "Access is denied." ? "Access is denied. – " + HJ.verna : fe + " – Mappa finst ikkje.");
        NP.sti = null; document.getElementById("npFilnamnRad").classList.add("vis");
      } else ettersjekk("notepad");
    } else tekst = fraCRLF(n.d);
  }
  npTekst.value = tekst; NP.original = tekst;
  npTittel();
  npTekst.focus();
  npTekst.setSelectionRange(0, 0);
  npOppdaterPos();
}
function lukkNotisblokk(stille) {
  npEl.classList.remove("vis");
  document.getElementById("npDialogBak").classList.remove("vis");
  if (NP.dialogSvar) npSvar(false);
  NP.open = false;
  S.prosessar = S.prosessar.filter(p => lc(p.namn) !== "notepad.exe");
  if (!stille) fokuserTerm();
}
function npLagre() {
  let abs = NP.sti;
  if (!abs) {
    const namn = document.getElementById("npFilnamn").value.trim();
    if (!namn) { npFeil("Skriv eit filnamn først, t.d. `notat.txt`."); document.getElementById("npFilnamn").focus(); return false; }
    abs = absSti(/\.[^.\\]+$/.test(namn) ? namn : namn + ".txt", NP.mappe || S.cwd);
  }
  const n = hent(abs);
  if (n && n.t === "d") { npFeil("Det finst alt ei mappe med det namnet."); return false; }
  const fe = skrivFil(abs, npTekst.value);
  if (fe) { npFeil(fe === "Access is denied." ? "Access is denied. – " + HJ.verna : fe); return false; }
  NP.sti = abs; NP.original = npTekst.value;
  document.getElementById("npFilnamnRad").classList.remove("vis");
  npFeil(""); npTittel();
  ettersjekk("notepad " + basenamn(abs));
  return true;
}
document.getElementById("npLagre").onclick = () => { if (npLagre()) lukkNotisblokk(false); };
document.getElementById("npAvbryt").onclick = () => lukkNotisblokk(false);
document.getElementById("npLukk").onclick = () => lukkNotisblokk(false);
npTekst.addEventListener("input", () => { npTittel(); npOppdaterPos(); });
function npOppdaterPos() {
  const p = npTekst.selectionStart, f = npTekst.value.slice(0, p).split("\n");
  document.getElementById("npPos").textContent = `Ln ${f.length}, Col ${f[f.length - 1].length + 1}`;
}
["keyup", "click", "select"].forEach(ev => npTekst.addEventListener(ev, npOppdaterPos));
npEl.addEventListener("keydown", e => {
  if (e.ctrlKey && lc(e.key) === "s") { e.preventDefault(); npLagre(); }
  if (e.key === "Tab" && e.target === npTekst) { e.preventDefault(); const a = npTekst.selectionStart; npTekst.setRangeText("\t", a, npTekst.selectionEnd, "end"); npTittel(); }
  if (e.key === "Escape" && document.getElementById("npDialogBak").classList.contains("vis")) { e.stopPropagation(); npSvar(false); }
});
document.getElementById("npFilnamn").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); if (npLagre()) lukkNotisblokk(false); } });

function banner() {
  skriv(VERSJON + "\n(c) Microsoft Corporation. All rights reserved.\n\n");
}
function nyOkt(frEksit) {
  const prosessar = S.prosessar;
  S = nyTilstand();
  if (!frEksit) S.prosessar = prosessar.some(p => lc(p.namn) === "cmd.exe") ? prosessar : [...prosessar, { namn: "cmd.exe", pid: 9120 + tilfeldig(10, 900), okt: "Console", nr: 1, mem: 5264 }];
  document.getElementById("vTittel").textContent = "Command Prompt";
  settFarge(0, 7);
  tomSkjerm();
  banner();
  if (frEksit) skrivHjelp("I ekte CMD ville `exit` lukka vindauget no. Her startar vi ei ny økt i staden – variablar og fargar er sette tilbake.");
  T.modus = "prompt";
  teikn();
}
function synkFs() {
  const nytt = lesFs();
  if (JSON.stringify(nytt) === JSON.stringify(FS)) return;
  FS = nytt;
  let c = S.cwd;
  while (!hent(c) && forelderAv(c)) c = forelderAv(c).sti;
  S.cwd = hent(c) ? c : HEIM;
  teikn();
}
window.addEventListener("storage", e => { if (e.key === FS_NOKKEL || e.key === null) synkFs(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") synkFs(); });

function startSimulator() {
  historikk = lager.hent("historikk", []);
  if (!Array.isArray(historikk)) historikk = [];
