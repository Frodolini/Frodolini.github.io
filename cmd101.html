<!DOCTYPE html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMD 101</title>
<!-- Kode 101: CMD 101 – simulert kommandolinje (cmd.exe) for Vg1/Vg2 IM. Éi sjølvstendig fil. -->
<style>
:root {
    --gron: #2e7d32;
    --gron-mork: #1b5e20;
    --gron-lys: #e8f5e9;
    --bg: #eef3ef;
    --kort: #ffffff;
    --tekst: #24302a;
    --grå: #5f6b64;
    --linje: #dfe6e1;
    --lenke: #0066cc;
    --gul: #fff6d6;
    --gul-kant: #e8c547;
    --kode-bg: #f4f6f5;
    --font: system-ui, "Segoe UI", Arial, sans-serif;
    --mono: Consolas, "Cascadia Mono", "Cascadia Code", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--tekst); font-family: var(--font); font-size: 15px; display: flex; flex-direction: column; }

/* ---------- Grøn tittellinje ---------- */
header.topp { background: var(--gron); color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; border-bottom: 3px solid var(--gron-mork); }
header.topp .tilbake { color: #fff; text-decoration: none; font-size: 14px; padding: 4px 10px; border: 1px solid rgba(255,255,255,.5); border-radius: 14px; white-space: nowrap; }
header.topp .tilbake:hover { background: var(--gron-mork); }
header.topp .titlar { flex: 1 1 260px; min-width: 0; }
header.topp h1 { margin: 0; font-size: 21px; line-height: 1.2; }
header.topp .under { margin: 2px 0 0; font-size: 13px; opacity: .9; }
header.topp .hogre { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.framdrift { font-size: 13px; min-width: 130px; }
.framdrift .linje { height: 6px; background: rgba(255,255,255,.3); border-radius: 3px; margin-top: 4px; overflow: hidden; }
.framdrift .linje div { height: 100%; width: 0; background: #fff; transition: width .4s; }
header.topp button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6); border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
header.topp button:hover { background: var(--gron-mork); }

/* ---------- To kolonnar ---------- */
main.oppsett { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(320px, 40%) 1fr; gap: 14px; padding: 14px; }
.kort { background: var(--kort); border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
#leksjonspanel { overflow-y: auto; min-height: 0; padding: 0; display: flex; flex-direction: column; }
#sim { min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
@media (max-width: 900px) {
    body { height: auto; display: block; }
    main.oppsett { display: flex; flex-direction: column; padding: 10px; }
    #leksjonspanel { overflow: visible; }
    #sim { height: 78vh; min-height: 460px; }
}

/* ---------- Leksjonsliste ---------- */
#leksjonsliste { list-style: none; margin: 0; padding: 8px; border-bottom: 1px solid var(--linje); display: flex; flex-direction: column; gap: 2px; }
#leksjonsliste li button { width: 100%; text-align: left; background: none; border: none; font: inherit; font-size: 14px; padding: 5px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; color: var(--tekst); }
#leksjonsliste li button:hover { background: var(--gron-lys); }
#leksjonsliste li.aktiv button { background: var(--gron); color: #fff; }
#leksjonsliste .status { width: 1.2em; text-align: center; flex: none; }
#leksjonsliste .sirkel { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; vertical-align: -1px; opacity: .75; }
#leksjonsliste .sirkel.halv { background: linear-gradient(90deg, currentColor 50%, transparent 50%); opacity: 1; }
@media (max-width: 600px) { #leksjon .eksempel pre { padding-right: 12px; padding-top: 34px; } }
#leksjonsliste .nr { color: var(--grå); width: 1.6em; flex: none; }
#leksjonsliste li.aktiv .nr { color: #dfeee0; }
#leksjonsliste .tal { margin-left: auto; font-size: 12px; color: var(--grå); }
#leksjonsliste li.aktiv .tal { color: #dfeee0; }
#leksjonsliste .ferdig .status { color: var(--gron); }
#leksjonsliste li.aktiv.ferdig .status { color: #fff; }

/* ---------- Leksjonsinnhald ---------- */
#leksjon { padding: 14px 18px 18px; line-height: 1.5; }
#leksjon h2 { font-size: 20px; margin: 0 0 4px; padding-bottom: 6px; border-bottom: 2px solid var(--gron); }
#leksjon .laerer { color: var(--grå); font-size: 14px; margin: 6px 0 12px; }
#leksjon .laerer b { color: var(--gron-mork); }
#leksjon p { margin: 8px 0; }
#leksjon code { font-family: var(--mono); background: var(--kode-bg); padding: 1px 4px; border-radius: 3px; font-size: 13.5px; }
#leksjon h3 { font-size: 15px; margin: 18px 0 6px; color: var(--gron-mork); }
.eksempel { position: relative; margin: 8px 0 12px; }
.eksempel pre { margin: 0; background: #1e1e1e; color: #e6e6e6; font-family: var(--mono); font-size: 13.5px; padding: 10px 12px; padding-right: 70px; border-radius: 6px; overflow-x: auto; line-height: 1.4; }
.eksempel .prov { position: absolute; top: 6px; right: 6px; background: var(--gron); color: #fff; border: none; border-radius: 4px; padding: 3px 9px; font: inherit; font-size: 12.5px; cursor: pointer; }
.eksempel .prov:hover { background: var(--gron-mork); }
.tips { background: var(--gul); border-left: 4px solid var(--gul-kant); padding: 8px 12px; border-radius: 4px; margin: 10px 0; }
table.juks { border-collapse: collapse; width: 100%; font-size: 13.5px; margin: 8px 0; }
table.juks td, table.juks th { border-bottom: 1px solid var(--linje); padding: 4px 6px; text-align: left; vertical-align: top; }
table.juks td:first-child { font-family: var(--mono); white-space: nowrap; }

/* ---------- Oppgåver ---------- */
.oppgaver { list-style: none; padding: 0; margin: 6px 0; display: flex; flex-direction: column; gap: 8px; }
.oppgave { border: 1px solid var(--linje); border-radius: 8px; padding: 9px 12px; display: grid; grid-template-columns: 1.4em 1fr auto; gap: 4px 8px; align-items: start; transition: background .4s, border-color .4s; }
.oppgave .ikon { font-size: 16px; line-height: 1.4; color: #9aa59f; }
.oppgave.loyst { background: var(--gron-lys); border-color: #a5d6a7; }
.oppgave.loyst .ikon { color: var(--gron); }
.oppgave .hintknapp { background: #fff; border: 1px solid var(--linje); border-radius: 5px; padding: 2px 9px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--grå); }
.oppgave .hintknapp:hover { border-color: var(--gron); color: var(--gron-mork); }
.oppgave .hint { grid-column: 2 / 4; font-size: 13.5px; background: var(--gul); border-radius: 5px; padding: 5px 9px; }
.oppgave .bra { grid-column: 2 / 4; color: var(--gron-mork); font-weight: bold; font-size: 14px; animation: bra 2.6s forwards; }
@keyframes bra { 0% { opacity: 0; } 10% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
.fullfort { background: var(--gron); color: #fff; border-radius: 8px; padding: 10px 14px; margin: 14px 0 6px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.fullfort button { background: #fff; color: var(--gron-mork); border: none; border-radius: 5px; padding: 5px 12px; font: inherit; font-weight: bold; cursor: pointer; }
.navknappar { display: flex; justify-content: space-between; margin: 18px 0 8px; }
.navknappar button { background: #fff; border: 1px solid var(--gron); color: var(--gron-mork); border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer; }
.navknappar button:hover:not(:disabled) { background: var(--gron); color: #fff; }
.navknappar button:disabled { opacity: .35; cursor: default; }
details.laerar { margin: 16px 0 0; border: 1px solid var(--linje); border-radius: 8px; padding: 8px 12px; font-size: 14px; background: #fafcfb; }
details.laerar summary { cursor: pointer; font-weight: bold; color: var(--grå); }
details.laerar ul { padding-left: 20px; margin: 6px 0; }

/* ---------- Toast ---------- */
#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); background: var(--gron-mork); color: #fff; padding: 9px 16px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; z-index: 50; max-width: 90vw; font-size: 14px; }
#toast.vis { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- Kursbevis ---------- */
#bevisbakgrunn { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
#bevisbakgrunn.vis { display: flex; }
#bevisboks { background: #fff; border-radius: 10px; max-width: 640px; width: 100%; max-height: 92vh; overflow-y: auto; padding: 18px; }
.namnrad { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; font-size: 14px; }
.namnrad input { flex: 1; min-width: 160px; padding: 7px 10px; font: inherit; border: 1px solid #bbb; border-radius: 6px; }
#bevis { border: 3px solid var(--gron); border-radius: 6px; padding: 0 22px 18px; position: relative; text-align: center; }
#bevis .stripe { height: 14px; background: var(--gron); margin: 0 -22px 16px; }
#bevis h2 { margin: 6px 0 2px; font-size: 26px; color: var(--gron-mork); letter-spacing: .02em; }
#bevis .bnamn { font-size: 24px; margin: 14px 0 2px; font-family: Georgia, serif; border-bottom: 1px solid #999; display: inline-block; min-width: 60%; padding: 0 10px 2px; }
#bevis .skule { color: var(--grå); font-size: 14px; }
#bevis ul { list-style: none; padding: 0; text-align: left; margin: 14px auto 6px; max-width: 420px; font-size: 14px; }
#bevis ul li { padding: 2px 0; }
#bevis .sum { font-weight: bold; margin-top: 8px; }
#bevis .segl { position: absolute; right: 14px; top: 26px; width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe680, #d4a017 60%, #a87900); color: #5a3d00; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; box-shadow: 0 0 0 4px #f3d36b, 0 2px 6px rgba(0,0,0,.3); transform: rotate(-12deg); }
#bevis .delvis { position: absolute; right: 14px; top: 30px; border: 2px dashed var(--grå); color: var(--grå); border-radius: 6px; padding: 4px 8px; font-size: 13px; transform: rotate(-8deg); }
#bevis .manglar { font-size: 13px; color: var(--grå); }
.bevisknappar { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.bevisknappar button { padding: 7px 14px; font: inherit; border-radius: 6px; border: 1px solid var(--gron); background: #fff; color: var(--gron-mork); cursor: pointer; }
.bevisknappar button.hoved { background: var(--gron); color: #fff; }
@media print {
    body * { visibility: hidden !important; }
    #bevis, #bevis * { visibility: visible !important; }
    #bevisbakgrunn { position: static; background: none; display: block; padding: 0; }
    #bevisboks { box-shadow: none; max-height: none; overflow: visible; padding: 0; }
    #bevis { position: absolute; left: 0; top: 0; width: 100%; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* ---------- Felles 💡-hjelpetekst (bruk i simulatoren) ---------- */
.hjelp { color: #ffe9a8; font-family: var(--font); font-size: 14px; background: rgba(255, 214, 90, .08); border-left: 3px solid #f2c94c; padding: 4px 10px; margin: 4px 0 6px; white-space: pre-wrap; border-radius: 0 4px 4px 0; }

/* ---------- CMD-simulator ---------- */
#sim { background: #0c0c0c; position: relative; }
.vtittel { display: flex; align-items: center; gap: 8px; background: #202020; color: #e6e6e6; font-size: 12.5px; height: 32px; padding-left: 10px; flex: none; user-select: none; border-radius: 8px 8px 0 0; }
.vtittel .vikon { width: 18px; height: 14px; background: #0c0c0c; border: 1px solid #9a9a9a; border-radius: 2px; color: #ddd; font: bold 8px/12px var(--mono); text-align: center; flex: none; }
.vtittel .vnamn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vtittel .vknapp { width: 42px; line-height: 32px; text-align: center; color: #bbb; font-size: 13px; flex: none; }
#term { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 6px 10px 12px; font-family: var(--mono); font-size: 15px; line-height: 1.32; color: #cccccc; background: #0c0c0c; white-space: pre-wrap; word-break: normal; overflow-wrap: anywhere; cursor: text; position: relative; -webkit-tap-highlight-color: transparent; }
#term::-webkit-scrollbar { width: 10px; }
#term::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 5px; }
#termUt > div { min-height: 1.32em; }
#termAktiv { position: relative; min-height: 1.32em; }
#termInn { position: absolute; left: 0; top: 0; width: 2px; height: 1.3em; opacity: 0; border: 0; padding: 0; margin: 0; resize: none; overflow: hidden; font-size: 16px; color: transparent; background: transparent; caret-color: transparent; outline: none; }
.markor { position: relative; }
.markor::after { content: ""; position: absolute; left: 0; right: 0; bottom: 1px; height: 3px; background: currentColor; animation: blink 1.06s steps(1) infinite; }
.markor.tom::after { width: .6em; right: auto; }
#term.ufokus .markor::after { animation: none; opacity: .45; }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
#term .hjelp { word-break: normal; overflow-wrap: break-word; line-height: 1.45; }
#term .hjelp code { font-family: var(--mono); background: rgba(255,255,255,.1); padding: 0 4px; border-radius: 3px; color: #fff3c4; }
#term ::selection { background: #f2f2f2; color: #0c0c0c; }
.mobilrad { display: none; gap: 6px; padding: 6px 8px; background: #1a1a1a; flex: none; overflow-x: auto; }
.mobilrad button { background: #2d2d2d; color: #e6e6e6; border: 1px solid #444; border-radius: 6px; padding: 6px 12px; font: 13px var(--mono); flex: none; }
@media (max-width: 900px), (pointer: coarse) { .mobilrad { display: flex; } }
@media (max-width: 600px) { #term { font-size: 13px; padding: 4px 6px 10px; } }
#leksjon pre.fil { background: #1e1e1e; color: #e6e6e6; font-family: var(--mono); font-size: 13.5px; padding: 10px 12px; border-radius: 6px; overflow-x: auto; line-height: 1.4; margin: 8px 0 12px; border-left: 4px solid #6a6a6a; }
#leksjon pre.fil::before { content: attr(data-fil); display: block; color: #9a9a9a; font-size: 12px; margin-bottom: 4px; }

/* ---------- Notisblokk ---------- */
#notisblokk { position: absolute; left: 6%; right: 6%; top: 46px; bottom: 7%; background: #fff; color: #1a1a1a; border: 1px solid #8a8a8a; border-radius: 8px; box-shadow: 0 10px 34px rgba(0,0,0,.55); display: none; flex-direction: column; z-index: 6; overflow: hidden; font-family: var(--font); }
#notisblokk.vis { display: flex; }
.np-tittel { display: flex; align-items: center; gap: 8px; height: 32px; padding-left: 10px; background: #f3f3f3; font-size: 12.5px; border-bottom: 1px solid #e2e2e2; flex: none; user-select: none; }
.np-tittel .npikon { width: 14px; height: 16px; background: #fff; border: 1px solid #5b9bd5; border-radius: 2px; box-shadow: inset 0 3px 0 #5b9bd5; flex: none; }
.np-tittel .npnamn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.np-tittel button { width: 42px; height: 32px; border: 0; background: none; font-size: 15px; cursor: pointer; color: #333; }
.np-tittel button:hover { background: #e81123; color: #fff; }
.np-meny { display: flex; gap: 6px; align-items: center; padding: 5px 8px; border-bottom: 1px solid #e6e6e6; flex: none; flex-wrap: wrap; font-size: 13px; }
.np-meny button { border: 1px solid #c8c8c8; background: #fff; border-radius: 5px; padding: 4px 12px; font: inherit; cursor: pointer; }
.np-meny button.hoved { background: var(--gron); border-color: var(--gron); color: #fff; }
.np-meny button:hover { filter: brightness(.95); }
.np-meny .npfilnamn { display: none; align-items: center; gap: 5px; }
.np-meny .npfilnamn.vis { display: flex; }
.np-meny .npfilnamn input { font: inherit; padding: 3px 6px; border: 1px solid #bbb; border-radius: 4px; width: 150px; }
.np-meny .npinfo { color: #777; font-size: 12px; margin-left: auto; }
#npTekst { flex: 1; min-height: 0; border: 0; outline: none; resize: none; padding: 8px 10px; font: 15px/1.4 var(--mono); color: #111; background: #fff; white-space: pre; overflow: auto; }
.np-status { display: flex; gap: 18px; justify-content: flex-end; padding: 3px 12px; font-size: 12px; color: #555; background: #f3f3f3; border-top: 1px solid #e2e2e2; flex: none; }
.np-feil { display: none; background: #fdecea; color: #8a1c13; font-size: 13px; padding: 6px 10px; border-bottom: 1px solid #f5c6c0; }
.np-feil.vis { display: block; }
.np-dialogbak { position: absolute; inset: 0; background: rgba(0,0,0,.25); display: none; align-items: center; justify-content: center; z-index: 2; }
.np-dialogbak.vis { display: flex; }
.np-dialog { background: #fff; border: 1px solid #999; border-radius: 8px; box-shadow: 0 6px 22px rgba(0,0,0,.35); width: min(380px, 92%); padding: 0; overflow: hidden; }
.np-dialog .dt { padding: 8px 12px; font-size: 12.5px; background: #f3f3f3; border-bottom: 1px solid #e2e2e2; }
.np-dialog .dm { padding: 16px 16px 10px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
.np-dialog .dk { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px; background: #f7f7f7; }
.np-dialog .dk button { min-width: 76px; padding: 5px 12px; border: 1px solid #bbb; background: #fff; border-radius: 5px; font: inherit; font-size: 13px; cursor: pointer; }
.np-dialog .dk button.hoved { background: var(--gron); border-color: var(--gron); color: #fff; }
@media (max-width: 600px) { #notisblokk { left: 2%; right: 2%; top: 38px; bottom: 2%; } }
</style>
</head>
<body>

<header class="topp">
    <a class="tilbake" href="index.html">← Sandkassa</a>
    <div class="titlar">
        <h1>CMD 101 – kommandolinja i Windows</h1>
        <p class="under">Lær å styre Windows med tastaturet – i ein trygg simulator</p>
    </div>
    <div class="hogre">
        <div class="framdrift" title="Løyste oppgåver">
            <span id="framdriftTekst">0 / 0 oppgåver</span>
            <div class="linje"><div id="framdriftLinje"></div></div>
        </div>
        <button id="knappBevis" type="button">Kursbevis</button>
        <button id="knappNullstill" type="button">Start på nytt</button>
    </div>
</header>

<main class="oppsett">
    <aside id="leksjonspanel" class="kort">
        <ol id="leksjonsliste"></ol>
        <div id="leksjon"></div>
    </aside>
    <section id="sim" class="kort">
        <div class="vtittel"><span class="vikon">C:\</span><span class="vnamn" id="vTittel">Command Prompt</span><span class="vknapp">&#8211;</span><span class="vknapp">&#9744;</span><span class="vknapp">&#10005;</span></div>
        <div id="term" class="ufokus" aria-label="Kommandolinje – klikk og skriv"><div id="termUt"></div><div id="termAktiv"><span id="aktivTekst"></span><textarea id="termInn" rows="1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Skriv ein kommando"></textarea></div></div>
        <div class="mobilrad" aria-label="Ekstra tastar">
            <button type="button" data-tast="Tab">Tab</button>
            <button type="button" data-tast="ArrowUp">&#8593;</button>
            <button type="button" data-tast="ArrowDown">&#8595;</button>
            <button type="button" data-tast="CtrlC">Ctrl+C</button>
            <button type="button" data-tast="CtrlL">Ctrl+L</button>
            <button type="button" data-tekst="\">\</button>
            <button type="button" data-tekst="|">|</button>
            <button type="button" data-tekst=">">&gt;</button>
            <button type="button" data-tekst="%">%</button>
        </div>
        <div id="notisblokk" role="dialog" aria-label="Notisblokk">
            <div class="np-tittel"><span class="npikon"></span><span class="npnamn" id="npNamn">Untitled - Notepad</span><button type="button" id="npLukk" title="Lukk (utan å lagre)">&#10005;</button></div>
            <div class="np-meny">
                <button type="button" id="npLagre" class="hoved">Lagre</button>
                <button type="button" id="npAvbryt">Avbryt</button>
                <span class="npfilnamn" id="npFilnamnRad"><label for="npFilnamn">Filnamn:</label><input id="npFilnamn" type="text" placeholder="t.d. notat.txt" autocomplete="off" spellcheck="false"></span>
                <span class="npinfo">Ctrl+S lagrar</span>
            </div>
            <div class="np-feil" id="npFeil"></div>
            <textarea id="npTekst" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Tekst i Notisblokk"></textarea>
            <div class="np-status"><span id="npPos">Ln 1, Col 1</span><span>100%</span><span>Windows (CRLF)</span><span>UTF-8</span></div>
            <div class="np-dialogbak" id="npDialogBak">
                <div class="np-dialog" role="alertdialog">
                    <div class="dt">Notepad</div>
                    <div class="dm" id="npDialogTekst"></div>
                    <div class="dk"><button type="button" id="npJa" class="hoved">Ja</button><button type="button" id="npNei">Nei</button></div>
                </div>
            </div>
        </div>
    </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<div id="bevisbakgrunn">

            <label for="bevisNamn">Fornamnet ditt:</label>
            <input id="bevisNamn" type="text" maxlength="40" placeholder="Skriv fornamnet ditt">

</div>

<script>
"use strict";
/* ================== KURSOPPSETT ================== */
const KURS = {
    namn: "CMD 101",
    prefiks: "kode101-cmd-",
};

/* Hjelparar for oppgåvesjekk (ctx = { kommando, utdata, fs, historikk, tilstand }) */
const kL = ctx => (ctx.tilstand && ctx.tilstand.logg) || [];
const koyrt = (ctx, namn, pred = () => true) => kL(ctx).some(e => (Array.isArray(namn) ? namn.includes(e.namn) : e.namn === namn) && pred(e));
const brytarar = e => bryt(e.args).sw;
const iMappe = (ctx, sti) => lc(ctx.tilstand.cwd) === lc(sti);
const finst = (ctx, sti, type) => { const n = hent(sti, ctx.fs); return !!n && (!type || n.t === type); };
const filUnder = (ctx, namn) => finnFilIRot(ctx.fs, "C:\\Users\\elev", namn) || [];
const linjerI = node => fraCRLF(node.d).split("\n").filter(l => l.trim()).length;
const DOK = "C:\\Users\\elev\\Documents";
const escH = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ex = (k) => `<div class="eksempel"><pre>${escH(k)}</pre></div>`;
const fil = (namn, innhald) => `<pre class="fil" data-fil="${escH(namn)}">${escH(innhald)}</pre>`;

const LEKSJONAR = [
  { id: "l1", tittel: "Velkomen til kommandolinja", laerer: "kva kommandolinja er, og dei første kommandoane <code>ver</code>, <code>echo</code>, <code>help</code> og <code>cls</code>.",
    html: `
<p>Kommandolinja (CMD) er ein måte å styre datamaskinen på ved å <b>skrive</b> kommandoar i staden for å klikke med musa. Det kan verke gammaldags, men IT-folk brukar ho kvar dag: Det går raskt, og du kan gjere ting som ikkje finst i menyane.</p>
<p>I det svarte feltet ser du ein simulert CMD. Linja <code>C:\\Users\\elev&gt;</code> heiter <b>ledeteksten</b> (prompt). Han viser kvar du er, og at maskinen ventar på deg. Skriv ein kommando og trykk <b>Enter</b>. Prøv denne – han viser kva Windows-versjon maskinen har:</p>
${ex("ver")}
<p><code>echo</code> skriv ut tekst – litt som å la datamaskinen seie noko:</p>
${ex("echo Hei, verda!")}
<p>Treng du hjelp? <code>help</code> viser ei liste over kommandoane. Skriv <code>/?</code> etter ein kommando for å få hjelp til akkurat han, t.d. <code>dir /?</code>. Er skjermen full, tømmer du han med <code>cls</code> (clear screen).</p>
${ex("help")}
${ex("cls")}
<div class="tips">Du kan ikkje øydeleggje noko her – alt er simulert. Prøv deg fram! Knappen <b>Prøv</b> limer inn kommandoen, så trykkjer du sjølv Enter.</div>`,
    oppgaver: [
      { id: "l1o1", tekst: "Skriv <code>ver</code> for å sjå kva Windows-versjon maskinen har.", hint: ["Klikk i det svarte feltet, skriv <code>ver</code> og trykk Enter."],
        sjekk: ctx => koyrt(ctx, "ver") },
      { id: "l1o2", tekst: "Bruk <code>echo</code> til å skrive ut ein tekst om deg sjølv, t.d. <code>echo Hei, eg heiter Kari</code>.", hint: ["Start med <code>echo</code> og eit mellomrom, og skriv så teksten.", "Skriv: <code>echo Hei, eg heiter Kari</code> og trykk Enter."],
        sjekk: ctx => koyrt(ctx, "echo", e => e.utdata.trim().length > 1 && !/^ECHO is (on|off)\.$/.test(e.utdata.trim())) },
      { id: "l1o3", tekst: "Få opp hjelp: anten med <code>help</code> eller med ein kommando og <code>/?</code>.", hint: ["Skriv <code>help</code> og trykk Enter.", "Du kan også skrive t.d. <code>dir /?</code> for hjelp til éin kommando."],
        sjekk: ctx => koyrt(ctx, "help") || kL(ctx).some(e => /^\s*\/\?/.test(e.args)) },
      { id: "l1o4", tekst: "Tøm skjermen med <code>cls</code>.", hint: ["<code>cls</code> står for «clear screen»."],
        sjekk: ctx => koyrt(ctx, "cls") },
    ]},

  { id: "l2", tittel: "Kvar er eg?", laerer: "å sjå kva som finst i ei mappe med <code>dir</code>, og å flytte deg mellom mapper med <code>cd</code>.",
    html: `
<p>Filene på datamaskinen ligg i <b>mapper</b>, og mapper kan liggje inni andre mapper – som skuffer i eit skap. Ledeteksten viser kvar du står: <code>C:\\Users\\elev</code> betyr mappa <code>elev</code>, inni <code>Users</code>, på disken <code>C:</code>. Ei slik adresse heiter ein <b>sti</b>.</p>
<p><code>dir</code> viser innhaldet i mappa du står i. <code>&lt;DIR&gt;</code> betyr at det er ei mappe; elles ser du storleiken på fila i byte.</p>
${ex("dir")}
<p><code>cd</code> (change directory) flyttar deg inn i ei mappe. <code>cd ..</code> går eitt steg opp, og <code>cd \\</code> går heilt til toppen (rota) av disken.</p>
${ex("cd Documents")}
${ex("cd ..")}
<p>Ein <b>relativ</b> sti startar der du står (<code>cd Documents</code>). Ein <b>absolutt</b> sti startar på disken (<code>cd C:\\Users\\elev\\Desktop</code>) og verkar same kvar du er. Har mappenamnet mellomrom, set du hermeteikn rundt: <code>cd "C:\\Program Files"</code>.</p>
${ex('cd "C:\\Program Files"')}
<div class="tips"><b>Tab-tasten</b> er venen din! Skriv byrjinga av eit namn, t.d. <code>cd Doc</code>, og trykk Tab – så fullfører CMD namnet for deg. Trykk Tab fleire gonger for å bla mellom forslag. Med pil opp (↑) hentar du førre kommando. Skråstreken <code>\\</code> finn du til venstre for Backspace på norsk tastatur.</div>`,
    oppgaver: [
      { id: "l2o1", tekst: "Skriv <code>dir</code> for å sjå kva som ligg i mappa <code>C:\\Users\\elev</code>.", hint: ["Skriv <code>dir</code> og trykk Enter. Står du ein annan stad, gå først heim med <code>cd C:\\Users\\elev</code>."],
        sjekk: ctx => koyrt(ctx, "dir", e => e.ok && lc(e.cwdFor) === "c:\\users\\elev" || e.ok && lc(e.args).includes("users\\elev")) },
      { id: "l2o2", tekst: "Gå inn i mappa <code>Documents</code>.", hint: ["Bruk <code>cd</code> og namnet på mappa.", "Skriv <code>cd Documents</code> (eller <code>cd Doc</code> og trykk Tab)."],
        sjekk: ctx => iMappe(ctx, DOK) },
      { id: "l2o3", tekst: "Gå eitt steg opp att med <code>cd ..</code>.", hint: ["To punktum betyr «mappa over».", "Skriv <code>cd ..</code> – du kan også skrive <code>cd..</code> utan mellomrom."],
        sjekk: ctx => koyrt(ctx, ["cd", "chdir"], e => e.ok && /^\s*\.\.([\\/]|\s|$)/.test(e.args.replace(/"/g, "")) && lc(e.cwdEtter) !== lc(e.cwdFor)) },
      { id: "l2o4", tekst: "Gå til mappa <code>C:\\Program Files</code> med ein absolutt sti.", hint: ["Ein absolutt sti startar med <code>C:\\</code>. Mappenamnet har mellomrom, så bruk hermeteikn.", "Skriv: <code>cd \"C:\\Program Files\"</code> – eller skriv <code>cd C:\\Prog</code> og trykk Tab."],
        sjekk: ctx => iMappe(ctx, "C:\\Program Files") },
    ]},

  { id: "l3", tittel: "Mapper", laerer: "å lage og slette mapper med <code>mkdir</code> og <code>rd</code>, og å sjå mappetreet med <code>tree</code>.",
    html: `
<p>Med <code>mkdir</code> (make directory) lagar du ei ny mappe der du står. Kortforma <code>md</code> gjer det same.</p>
${ex("mkdir Prosjekt")}
<p>Du kan lage fleire nivå på éin gong. Finst ikkje mappa <code>Skulearbeid</code> frå før, lagar CMD ho også:</p>
${ex("mkdir Skulearbeid\\Norsk")}
<p><code>rd</code> (remove directory, eller <code>rmdir</code>) slettar ei <b>tom</b> mappe. Er det noko i ho, får du ei feilmelding. Med <code>rd /s /q mappe</code> blir mappa sletta med alt innhald – utan å spørje, og ho hamnar <b>ikkje</b> i papirkorga. Ver forsiktig!</p>
${ex("rd Prosjekt")}
<p><code>tree</code> teiknar mappene som eit tre. Med <code>tree /f</code> ser du filene òg.</p>
${ex("tree")}
<div class="tips">Mappene <code>C:\\Windows</code> og <code>C:\\Program Files</code> er verna. Prøv gjerne å lage noko der – då ser du feilmeldinga «Access is denied.».</div>`,
    oppgaver: [
      { id: "l3o1", tekst: "Lag mappa <code>IM</code> inni <code>Documents</code>, slik at stien blir <code>C:\\Users\\elev\\Documents\\IM</code>.", hint: ["Gå først til Documents: <code>cd C:\\Users\\elev\\Documents</code>.", "Skriv så: <code>mkdir IM</code>"],
        sjekk: ctx => finst(ctx, DOK + "\\IM", "d") },
      { id: "l3o2", tekst: "Lag dei to mappene <code>Vg1</code> og <code>Vg2</code> inni <code>IM</code>.", hint: ["Gå inn i IM med <code>cd IM</code> og bruk <code>mkdir</code> to gonger.", "Du kan også skrive <code>mkdir Vg1 Vg2</code> – då blir begge laga på éin gong."],
        sjekk: ctx => finst(ctx, DOK + "\\IM\\Vg1", "d") && finst(ctx, DOK + "\\IM\\Vg2", "d") },
      { id: "l3o3", tekst: "Lag ei mappe som heiter <code>tull</code>, og slett ho igjen med <code>rd</code>.", hint: ["Først <code>mkdir tull</code>, så <code>rd tull</code>."],
        sjekk: ctx => ctx.tilstand.slettaMapper.some(s => lc(basenamn(s)) === "tull") },
      { id: "l3o4", tekst: "Gå til <code>IM</code>-mappa og vis mappetreet med <code>tree</code>. Du skal sjå både <code>Vg1</code> og <code>Vg2</code>.", hint: ["Skriv <code>cd C:\\Users\\elev\\Documents\\IM</code> og så <code>tree</code>."],
        sjekk: ctx => koyrt(ctx, "tree", e => /Vg1/i.test(e.utdata) && /Vg2/i.test(e.utdata)) },
    ]},

  { id: "l4", tittel: "Filer", laerer: "å lage, lese, kopiere og slette filer – og å bruke Notisblokk frå CMD.",
    html: `
<p>Teiknet <code>&gt;</code> sender utskrifta frå ein kommando <b>inn i ei fil</b> i staden for til skjermen. Finst ikkje fila, blir ho laga. Finst ho, blir ho <b>skriven over</b>!</p>
${ex("echo Hei på deg > hei.txt")}
<p>To teikn, <code>&gt;&gt;</code>, legg teksten til <b>nedst</b> i fila i staden for å skrive over.</p>
${ex("echo Ei linje til >> hei.txt")}
<p><code>type</code> viser kva som står i ei fil. <code>copy</code> kopierer, <code>ren</code> gir nytt namn, <code>move</code> flyttar, og <code>del</code> slettar (utan papirkorg!).</p>
${ex("type hei.txt")}
${ex("copy hei.txt kopi.txt")}
${ex("ren kopi.txt gamal.txt")}
${ex("del gamal.txt")}
<p>Vil du skrive lengre tekstar, kan du opne <b>Notisblokk</b> rett frå CMD. Skriv teksten, og trykk <b>Lagre</b>.</p>
${ex("notepad handleliste.txt")}
<div class="tips">Teikna <code>&lt;</code> og <code>&gt;</code> finn du på tasten til venstre for Z (med Shift for <code>&gt;</code>).</div>`,
    oppgaver: [
      { id: "l4o1", tekst: "Gå til <code>Documents</code> og lag fila <code>hei.txt</code> med <code>echo</code> og <code>&gt;</code>.", hint: ["Teksten etter <code>echo</code> hamnar i fila du skriv etter <code>&gt;</code>.", "Skriv: <code>echo Hei på deg > hei.txt</code>"],
        sjekk: ctx => filUnder(ctx, "hei.txt").some(f => fraCRLF(f.node.d).trim().length > 0) },
      { id: "l4o2", tekst: "Legg til ei ny linje nedst i <code>hei.txt</code> med <code>&gt;&gt;</code>. Fila skal ha minst to linjer.", hint: ["Éin <code>&gt;</code> skriv over, to <code>&gt;&gt;</code> legg til.", "Skriv: <code>echo Ei linje til >> hei.txt</code>"],
        sjekk: ctx => filUnder(ctx, "hei.txt").some(f => linjerI(f.node) >= 2) },
      { id: "l4o3", tekst: "Vis innhaldet i <code>hei.txt</code> med <code>type</code>.", hint: ["Skriv <code>type hei.txt</code> i same mappe som fila."],
        sjekk: ctx => koyrt(ctx, "type", e => e.ok && /hei\.txt/i.test(e.args) && e.utdata.trim().length > 0) },
      { id: "l4o4", tekst: "Lag ein kopi av <code>hei.txt</code> som heiter <code>kopi.txt</code>.", hint: ["Bruk <code>copy kjelde mål</code>.", "Skriv: <code>copy hei.txt kopi.txt</code>"],
        sjekk: ctx => filUnder(ctx, "kopi.txt").length > 0 },
      { id: "l4o5", tekst: "Slett <code>kopi.txt</code> med <code>del</code>.", hint: ["Skriv <code>del kopi.txt</code>. Sjekk etterpå med <code>dir</code> at fila er borte."],
        sjekk: ctx => ctx.tilstand.slettaFiler.some(s => lc(basenamn(s)) === "kopi.txt") },
      { id: "l4o6", tekst: "Skriv ei handleliste med minst tre linjer i Notisblokk: <code>notepad handleliste.txt</code>. Hugs å lagre!", hint: ["Finst ikkje fila, spør Notisblokk om han skal lage ho – svar <b>Ja</b>.", "Skriv éin vare per linje (Enter mellom), og trykk <b>Lagre</b>. Sjekk med <code>type handleliste.txt</code>."],
        sjekk: ctx => filUnder(ctx, "handleliste.txt").some(f => linjerI(f.node) >= 3) },
    ]},

  { id: "l5", tittel: "Jokerteikn og søk", laerer: "å bruke jokerteikna <code>*</code> og <code>?</code>, å søkje i filer med <code>findstr</code> og å kople kommandoar saman med <code>|</code>.",
    html: `
<p><b>Jokerteikn</b> står for «kva som helst». <code>*</code> betyr null eller fleire teikn, og <code>?</code> betyr nøyaktig eitt teikn. <code>*.txt</code> betyr altså «alle filer som sluttar på .txt».</p>
${ex("dir *.txt")}
<p>Med <code>/s</code> leitar <code>dir</code> i alle undermapper òg, og <code>/b</code> gir ei kort liste med berre stiane:</p>
${ex("dir /s /b *.txt")}
<p><code>findstr</code> leitar etter tekst <b>inni</b> filer og viser linjene som passar. Legg til <code>/i</code> om du ikkje bryr deg om store og små bokstavar.</p>
${ex('findstr /i "ip" notat.txt')}
<p>Røyrteiknet <code>|</code> (pipe) sender utskrifta frå éin kommando vidare til den neste – som eit røyr mellom dei. <code>sort</code> sorterer linjer, og <code>more</code> viser éi side om gongen.</p>
${ex("type huskeliste.txt | sort")}
${ex("tasklist | findstr chrome")}
<div class="tips">Teiknet <code>|</code> finn du på tasten til venstre for 1 (under Esc) på norsk tastatur.</div>`,
    oppgaver: [
      { id: "l5o1", tekst: "Gå til <code>Documents</code> og list berre <code>.txt</code>-filene der med <code>dir *.txt</code>.", hint: ["<code>*</code> står for «kva som helst».", "Skriv <code>cd C:\\Users\\elev\\Documents</code> og så <code>dir *.txt</code>."],
        sjekk: ctx => koyrt(ctx, "dir", e => e.ok && /\*/.test(e.args) && /\.txt/i.test(e.utdata)) },
      { id: "l5o2", tekst: "Finn alle <code>.txt</code>-filer i heile brukarmappa di med <code>dir /s</code>.", hint: ["Gå til <code>C:\\Users\\elev</code> først.", "Skriv <code>dir /s /b *.txt</code>"],
        sjekk: ctx => koyrt(ctx, "dir", e => e.ok && brytarar(e).has("s") && /\.txt/i.test(e.utdata)) },
      { id: "l5o3", tekst: "Bruk <code>findstr</code> til å finne linja med «IP» i <code>notat.txt</code> (i <code>Documents</code>).", hint: ["Forma er <code>findstr tekst fil</code>.", "Skriv <code>findstr IP notat.txt</code> når du står i Documents."],
        sjekk: ctx => koyrt(ctx, "findstr", e => /IP står for/.test(e.utdata)) },
      { id: "l5o4", tekst: "Vis <code>huskeliste.txt</code> (på Desktop) sortert: send <code>type</code> gjennom røyret <code>|</code> til <code>sort</code>.", hint: ["Gå til Desktop med <code>cd C:\\Users\\elev\\Desktop</code>.", "Skriv <code>type huskeliste.txt | sort</code>"],
        sjekk: ctx => koyrt(ctx, "sort", e => e.iRoyr && /Kjøpe mjølk/.test(e.utdata) && /Trening/.test(e.utdata)) },
    ]},

  { id: "l6", tittel: "Nettverk 1: ipconfig", laerer: "å finne IP-adresse, nettmaske, gateway og MAC-adresse med <code>ipconfig</code>.",
    html: `
<p>Alle maskiner på eit nettverk har ei <b>IP-adresse</b> – litt som ei postadresse. <code>ipconfig</code> viser dei viktigaste nettverksinnstillingane:</p>
${ex("ipconfig")}
<ul><li><b>IPv4 Address</b> – adressa til denne maskinen.</li><li><b>Subnet Mask</b> – seier kor stort det lokale nettet er.</li><li><b>Default Gateway</b> – ruteren, «døra» ut av det lokale nettet.</li></ul>
<p><code>ipconfig /all</code> viser endå meir: mellom anna maskinnamnet, DNS-tenaren og <b>MAC-adressa</b> (Physical Address), som er eit fast «serienummer» for nettverkskortet.</p>
${ex("ipconfig /all")}
<p>Andre nyttige kommandoar er <code>hostname</code> (namnet på maskinen), <code>getmac</code> (MAC-adressa) og <code>ipconfig /flushdns</code> (tømmer DNS-minnet).</p>
${ex("hostname")}
<div class="tips"><code>ipconfig /release</code> slepp IP-adressa, og <code>ipconfig /renew</code> hentar ei ny frå DHCP-tenaren. Prøv – og sjå kva som skjer med <code>ping</code> i mellomtida!</div>`,
    oppgaver: [
      { id: "l6o1", tekst: "Køyr <code>ipconfig</code> og finn IPv4-adressa til maskinen.", hint: ["Skriv <code>ipconfig</code> og trykk Enter."],
        sjekk: ctx => koyrt(ctx, "ipconfig", e => e.ok && !e.args.trim()) },
      { id: "l6o2", tekst: "Køyr <code>ipconfig /all</code> for å sjå alle detaljane.", hint: ["Skriv <code>ipconfig /all</code>."],
        sjekk: ctx => koyrt(ctx, "ipconfig", e => brytarar(e).has("all")) },
      { id: "l6o3", tekst: "Finn ut kva maskinen heiter med <code>hostname</code>.", hint: ["Skriv <code>hostname</code>."],
        sjekk: ctx => koyrt(ctx, "hostname") },
      { id: "l6o4", tekst: "Finn MAC-adressa til Ethernet-kortet, og skriv ho ut med <code>echo</code> (t.d. <code>echo AA-BB-CC-DD-EE-FF</code>).", hint: ["MAC-adressa står ved <b>Physical Address</b> i <code>ipconfig /all</code>, eller i <code>getmac</code>.", "Ho startar med <code>3C-52-82</code>. Skriv <code>echo</code> og heile adressa."],
        sjekk: ctx => koyrt(ctx, "echo", e => lc(e.utdata).replace(/[:\s]/g, "-").includes(lc(MASKIN.mac))) },
    ]},

  { id: "l7", tittel: "Nettverk 2: ping og feilsøking", laerer: "å teste nettverket med <code>ping</code>, <code>tracert</code> og <code>nslookup</code>, og å feilsøkje steg for steg.",
    html: `
<p><code>ping</code> sender små pakkar til ei anna maskin og ventar på svar – som å rope «hallo?» og høyre etter ekko. Du ser kor lang tid svaret tok, i millisekund (ms).</p>
${ex("ping google.com")}
<p>Vanleg ping sender 4 pakkar. <code>-n 2</code> sender 2, og <code>-t</code> held fram heilt til du stoppar med <b>Ctrl+C</b>.</p>
${ex("ping -t 8.8.8.8")}
<p><code>nslookup</code> spør DNS-tenaren kva IP-adresse eit namn har – som å slå opp i ein telefonkatalog. <code>tracert</code> viser alle «hoppa» (ruterane) pakkane går innom på vegen.</p>
${ex("nslookup vg.no")}
${ex("tracert google.com")}
<h3>Feilsøking: gå frå nært til fjernt</h3>
<ol><li><code>ping 127.0.0.1</code> – verkar nettverksdelen på maskinen mi?</li><li><code>ping 10.120.12.1</code> – når eg gatewayen (ruteren)?</li><li><code>ping 8.8.8.8</code> – når eg Internett?</li><li><code>ping google.com</code> – verkar DNS (namn til IP)?</li></ol>
<p>Stoppar det på eit steg, veit du kvar feilen er. Går <code>8.8.8.8</code> men ikkje <code>google.com</code>, er det truleg DNS som sviktar.</p>`,
    oppgaver: [
      { id: "l7o1", tekst: "Ping din eigen maskin med <code>ping 127.0.0.1</code> (eller <code>ping localhost</code>).", hint: ["127.0.0.1 er alltid «meg sjølv».", "Skriv <code>ping 127.0.0.1</code> og vent til han er ferdig."],
        sjekk: ctx => koyrt(ctx, "ping", e => /^lokal/.test(e.ekstra.type || "") && e.ekstra.motteke > 0) },
      { id: "l7o2", tekst: "Ping <b>standard gateway</b> (ruteren) til maskinen. Adressa finn du med <code>ipconfig</code>.", hint: ["Sjå etter <b>Default Gateway</b> i <code>ipconfig</code>.", "Skriv <code>ping 10.120.12.1</code>"],
        sjekk: ctx => koyrt(ctx, "ping", e => e.ekstra.ip === MASKIN.gw && e.ekstra.motteke > 0) },

/* Simulatoren (lenger nede) definerer simLim(tekst) og kallar sjekkOppgaver(ctx) etter kvar kommando. */

/* ================== LAGRING ================== */
const lager = {
    hent(nokkel, standard) {
        try { const v = localStorage.getItem(KURS.prefiks + nokkel); return v === null ? standard : JSON.parse(v); }
        catch (e) { return standard; }
    },
    set(nokkel, verdi) { try { localStorage.setItem(KURS.prefiks + nokkel, JSON.stringify(verdi)); } catch (e) {} },
    slettAlle() {
        try {
            const ut = [];
            for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(KURS.prefiks)) ut.push(k); }
            ut.forEach(k => localStorage.removeItem(k));
        } catch (e) {}
    }
};

/* ================== TILSTAND ================== */
let loyste = new Set(lager.hent("loyste", []));
let besokt = new Set(lager.hent("besokt", []));
let hintNiva = lager.hent("hint", {});
let aktivIndeks = Math.min(Math.max(0, LEKSJONAR.findIndex(l => l.id === lager.hent("aktiv", LEKSJONAR[0].id))), LEKSJONAR.length - 1);
const ALLE_OPPGAVER = LEKSJONAR.flatMap(l => l.oppgaver.map(o => ({ ...o, leksjon: l })));

function lagreTilstand() {
    lager.set("loyste", [...loyste]);
    lager.set("besokt", [...besokt]);
    lager.set("hint", hintNiva);
    lager.set("aktiv", LEKSJONAR[aktivIndeks].id);
}

function leksjonStatus(l) {
    const n = l.oppgaver.length, ok = l.oppgaver.filter(o => loyste.has(o.id)).length;
    if (n === 0) return besokt.has(l.id) ? "ferdig" : "ny";
    if (ok === n) return "ferdig";
    if (ok > 0 || besokt.has(l.id)) return "igang";
    return "ny";
}
const STATUSIKON = { ny: '<span class="sirkel"></span>', igang: '<span class="sirkel halv"></span>', ferdig: "✔" };

/* ================== VISING ================== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function oppdaterFramdrift() {
    const n = ALLE_OPPGAVER.length, ok = ALLE_OPPGAVER.filter(o => loyste.has(o.id)).length;
    document.getElementById("framdriftTekst").textContent = `${ok} / ${n} oppgåver`;
    document.getElementById("framdriftLinje").style.width = (n ? 100 * ok / n : 0) + "%";
}

function teiknListe() {
    const ol = document.getElementById("leksjonsliste");
    ol.innerHTML = "";
    LEKSJONAR.forEach((l, i) => {
        const st = leksjonStatus(l);
        const ok = l.oppgaver.filter(o => loyste.has(o.id)).length;
        const li = document.createElement("li");
        li.className = (i === aktivIndeks ? "aktiv " : "") + st;
        li.innerHTML = `<button type="button"><span class="status" title="${st === "ferdig" ? "Ferdig" : st === "igang" ? "I gang" : "Ikkje starta"}">${STATUSIKON[st]}</span><span class="nr">${i + 1}.</span><span>${esc(l.tittel)}</span>${l.oppgaver.length ? `<span class="tal">${ok}/${l.oppgaver.length}</span>` : ""}</button>`;
        li.querySelector("button").onclick = () => visLeksjon(i);
        ol.appendChild(li);
    });
    oppdaterFramdrift();
}

function visLeksjon(i, rull = true) {
    aktivIndeks = i;
    const l = LEKSJONAR[i];
    besokt.add(l.id);
    lagreTilstand();
    const el = document.getElementById("leksjon");
    el.innerHTML = `
        <h2>${i + 1}. ${esc(l.tittel)}</h2>
        <p class="laerer"><b>Dette lærer du:</b> ${l.laerer}</p>
        <div class="forklaring">${l.html}</div>
        ${l.oppgaver.length ? `<h3>Oppgåver</h3><ul class="oppgaver"></ul>` : ""}
        <div class="fullfortplass"></div>
        <div class="navknappar">
            <button type="button" class="forre" ${i === 0 ? "disabled" : ""}>◀ Førre</button>
            <button type="button" class="neste" ${i === LEKSJONAR.length - 1 ? "disabled" : ""}>Neste ▶</button>
        </div>
        <details class="laerar"><summary>For læraren</summary>${LAERAR_HTML}</details>`;
    el.querySelectorAll(".eksempel").forEach(ex => {
        const pre = ex.querySelector("pre");
        const b = document.createElement("button");
        b.type = "button"; b.className = "prov"; b.textContent = "Prøv";
        b.title = "Lim inn koden (du køyrer sjølv)";
        b.onclick = () => { if (typeof simLim === "function") simLim(pre.dataset.kode ?? pre.textContent); };
        ex.appendChild(b);
    });
    const ul = el.querySelector(".oppgaver");
    if (ul) l.oppgaver.forEach(o => ul.appendChild(lagOppgaveEl(o)));
    el.querySelector(".forre").onclick = () => visLeksjon(i - 1);
    el.querySelector(".neste").onclick = () => visLeksjon(i + 1);
    teiknFullfort();
    teiknListe();
    if (rull) document.getElementById("leksjonspanel").scrollTop = 0;
    if (typeof simByttLeksjon === "function") simByttLeksjon(l);   // valfri krok (t.d. startkode i editoren)
}

function lagOppgaveEl(o) {
    const li = document.createElement("li");
    li.className = "oppgave" + (loyste.has(o.id) ? " loyst" : "");
    li.dataset.id = o.id;
    li.innerHTML = `<span class="ikon">${loyste.has(o.id) ? "✔" : "○"}</span><span class="tekst">${o.tekst}</span>` +
        (o.hint && o.hint.length ? `<button type="button" class="hintknapp">Hint</button>` : "<span></span>");
    const vis = () => {
        li.querySelectorAll(".hint").forEach(h => h.remove());
        const n = hintNiva[o.id] || 0;
        for (let k = 0; k < n; k++) {
            const d = document.createElement("div");
            d.className = "hint"; d.innerHTML = "💡 " + o.hint[k];
            li.appendChild(d);
        }
        const b = li.querySelector(".hintknapp");
        if (b) { b.textContent = n === 0 ? "Hint" : n < o.hint.length ? "Meir hjelp" : "Hint"; b.disabled = n >= o.hint.length; b.style.opacity = n >= o.hint.length ? .4 : 1; }
    };
    const b = li.querySelector(".hintknapp");
    if (b) b.onclick = () => { hintNiva[o.id] = Math.min((hintNiva[o.id] || 0) + 1, o.hint.length); lagreTilstand(); vis(); };
    vis();
    return li;
}

function teiknFullfort() {
    const l = LEKSJONAR[aktivIndeks];
    const plass = document.querySelector("#leksjon .fullfortplass");
    if (!plass) return;
    plass.innerHTML = "";
    if (l.oppgaver.length && leksjonStatus(l) === "ferdig") {
        const d = document.createElement("div");
        d.className = "fullfort";
        d.innerHTML = `<span>✔ Leksjon fullført!</span>` + (aktivIndeks < LEKSJONAR.length - 1 ? `<button type="button">Neste leksjon ▶</button>` : "");
        const b = d.querySelector("button");
        if (b) b.onclick = () => visLeksjon(aktivIndeks + 1);
        plass.appendChild(d);
    }
}

let toastTid = null;
function toast(tekst) {
    const t = document.getElementById("toast");
    t.textContent = tekst; t.classList.add("vis");
    clearTimeout(toastTid); toastTid = setTimeout(() => t.classList.remove("vis"), 3200);
}

/* ================== OPPGÅVESJEKK ================== */
/* Kall etter KVAR kommando/køyring. Sjekkar alle oppgåver i alle leksjonar. */
function sjekkOppgaver(ctx) {
    const nye = [];
    for (const o of ALLE_OPPGAVER) {
        if (loyste.has(o.id)) continue;
        let ok = false;
        try { ok = !!o.sjekk(ctx); } catch (e) { ok = false; }
        if (ok) { loyste.add(o.id); nye.push(o); }
    }
    if (!nye.length) return nye;
    lagreTilstand();
    const aktiv = LEKSJONAR[aktivIndeks];
    for (const o of nye) {
        const li = document.querySelector(`#leksjon .oppgave[data-id="${o.id}"]`);
        if (li) {
            li.classList.add("loyst");
            li.querySelector(".ikon").textContent = "✔";
            const bra = document.createElement("div");
            bra.className = "bra"; bra.textContent = "✔ Bra!";
            li.appendChild(bra);
            setTimeout(() => bra.remove(), 2700);
        }
    }
    const andre = nye.filter(o => o.leksjon !== aktiv);
    if (andre.length) {
        const o = andre[0];
        toast(`✔ Bra! Du løyste ei oppgåve i leksjon ${LEKSJONAR.indexOf(o.leksjon) + 1}: ${o.leksjon.tittel}`);
    }
    teiknFullfort();
    teiknListe();
    return nye;
}

/* ================== KURSBEVIS ================== */
function datoTekst(d = new Date()) {
    return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + d.getFullYear();
}
function hentNamn() { try { return localStorage.getItem("kode101-namn") || ""; } catch (e) { return ""; } }
function teiknBevis() {
    const namn = document.getElementById("bevisNamn").value.trim();
    const n = ALLE_OPPGAVER.length, ok = ALLE_OPPGAVER.filter(o => loyste.has(o.id)).length;
    const alt = ok === n;
    const leks = LEKSJONAR.filter(l => l.oppgaver.length);
    const manglar = leks.filter(l => leksjonStatus(l) !== "ferdig");
    document.getElementById("bevis").innerHTML = `
        <div class="stripe"></div>
        ${alt ? `<div class="segl">Fullført</div>` : `<div class="delvis">Delvis fullført</div>`}
        <h2>Kursbevis – ${esc(KURS.namn)}</h2>
        <div class="skule">Stord vidaregåande skule – IM</div>
        <div class="bnamn">${namn ? esc(namn) : "&nbsp;"}</div>

function levenshtein(a, b) {
  a = lc(a); b = lc(b);
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;

  if (ktx.batch) ktx.batch.brukteIf = true;
  S.brukteIf = true;
  let dersom = s, elles = null;
  if (s.startsWith("(")) {
    const e = finnSluttParen(s, 0);
    if (e < 0) return feil("The syntax of the command is incorrect.", "Ein `(` manglar ein `)`.");
    dersom = s.slice(1, e);
    let r = s.slice(e + 1).trim();
    if (/^else\b/i.test(r)) {
      r = r.slice(4).trim();
      if (r.startsWith("(")) { const e2 = finnSluttParen(r, 0); elles = e2 > 0 ? r.slice(1, e2) : r.slice(1); }
      else elles = r;
    }
  }
  if (!dersom.trim() && !s.startsWith("(")) return feil("The syntax of the command is incorrect.", "Etter vilkåret må det kome ein kommando, t.d. `if exist hei.txt type hei.txt`.");
  S.sistOk = true;
  const blokk = vilkar ? dersom : elles;
  if (blokk !== null && blokk.trim()) await koyrBlokk(blokk, ktx);

/* Køyr éin enkel kommando (eventuelt del av eit røyr) */
async function koyrEin(cmdTekst, ktx, stdin, tilTerminal, iRoyr) {
  const r = delOmdirigering(cmdTekst);
  if (r.feil) { skriv(r.feil + "\n"); S.sistOk = false; return { ut: "" }; }
  let tekst = r.tekst.trim().replace(/^@+\s*/, "");
  if (!tekst) { S.sistOk = true; return { ut: "" }; }
  if (r.inn) {
    const abs = absSti(r.inn); const n = hent(abs);
    if (!n || n.t !== "f") { skriv("The system cannot find the file specified.\n"); S.sistOk = false; return { ut: "" }; }
    stdin = fraCRLF(n.d);
  }
  const { namn, rest } = delNamn(tekst);
  let buf = "", feila = false;
  const tilFil = !!r.ut;
  const utTilTerm = tilTerminal && !tilFil;
  const feilNul = r.feilUt && r.feilUt !== "&1" && lc(r.feilUt.sti) === "nul";
  const io = {
    inn: stdin, iRoyr, tilTerminal: utTilTerm, batch: ktx.batch,
    ut(t) { buf += t; if (utTilTerm) skriv(t); },
    feil(t, hj) {
      feila = true;
      const tt = t.endsWith("\n") ? t : t + "\n";
      if (r.feilUt === "&1") io.ut(tt);
      else if (!feilNul) skriv(tt);
      if (hj && !feilNul) skrivHjelp(hj);
    },
    hjelp(hj) { if (!feilNul) skrivHjelp(hj); },
    mislukka() { feila = true; }
  };
  const post = { namn: lc(namn), args: rest, raa: ktx.raa || "", cwdFor: S.cwd, iRoyr, batch: !!ktx.batch, ekstra: {}, ok: true, utdata: "" };
  io.post = post;
  // lag fila før kommandoen køyrer (som ekte CMD)
  let utAbs = null;
  if (tilFil && lc(r.ut.sti) !== "nul") {
    utAbs = absSti(r.ut.sti);
    const n = hent(utAbs);
    let fe = null;
    if (n && n.t === "d") fe = "Access is denied.";
    else if (!n || !r.ut.legg) fe = skrivFil(utAbs, n && r.ut.legg ? "" : "", !!r.ut.legg);
    if (fe) {
      skriv(fe + "\n");
      if (fe === "Access is denied.") skrivHjelp(erVerna(utAbs) ? HJ.verna : "Du kan ikkje skrive til ei mappe. Skriv namnet på ei fil, t.d. `> liste.txt`.");
      else skrivHjelp("Mappa du prøver å lagre i, finst ikkje. Sjekk stien.");
      S.sistOk = false; return { ut: "" };
    }
  }
  let unntak = null, batchKode = null;
  try {
    const res = await koyrKommando(namn, rest, io, ktx);
    if (res === false) feila = true;
    if (res && typeof res === "object" && "batchKode" in res) batchKode = res.batchKode;
  } catch (e) { unntak = e; if (e instanceof Avbrot) post.ekstra.avbrote = true; }
  post.ok = !feila && !(unntak instanceof Avbrot);
  post.utdata = buf; post.cwdEtter = S.cwd;
  S.logg.push(post);
  if (utAbs) { const fe = skrivFil(utAbs, buf, true); if (fe) skriv(fe + "\n"); }
  S.sistOk = !feila;
  if (batchKode !== null) { S.errorlevel = batchKode; S.sistOk = batchKode === 0; }
  else if (!["echo", "rem", "set", "if", "cls", "title", "pause"].includes(post.namn) || feila) S.errorlevel = feila ? (post.errorlevel ?? 1) : 0;
  if (unntak) throw unntak;
  return { ut: buf };
}

/* Finn og køyr kommandoen */
async function koyrKommando(namn, rest, io, ktx) {
  const l = lc(namn);
  if (/^[a-z]:\\?$/i.test(namn) && !rest.trim()) {
    if (l.startsWith("c:")) return;
    io.feil("The system cannot find the drive specified.", "Denne maskinen har berre disken `C:`. Skriv `C:` for å vere på C-disken.");
    return false;
  }
  const k = KOMMANDOAR[l];
  if (k) {
    if (/^\s*\/\?/.test(rest) && l !== "echo") { visHjelpFor(l, io); return; }
    return k(rest, io, ktx);
  }
  // fil/program med sti eller filtype
  const fil = finnKoyrbar(namn);
  if (fil) return koyrFil(fil, rest, io, ktx);
  return ukjend(namn, rest, io);
}

function finnKoyrbar(namn) {
  const kand = [];
  const harExt = /\.[a-z0-9]+$/i.test(namn);
  const exts = harExt ? [""] : [".bat", ".cmd", ".exe", ".com"];
  const stiar = /[\\:]/.test(namn) ? [S.cwd] : [S.cwd, "C:\\Windows\\System32", "C:\\Windows"];
  for (const s of stiar) for (const e of exts) kand.push(absSti(namn + e, s));
  for (const k of kand) { const n = hent(k); if (n && n.t === "f") return k; }
  return null;
}

async function koyrFil(abs, rest, io, ktx) {
  const ext = lc((basenamn(abs).match(/\.[^.]+$/) || [""])[0]);
  const bn = lc(basenamn(abs));
  if (ext === ".bat" || ext === ".cmd") {
    const args = [basenamn(abs).replace(/\.(bat|cmd)$/i, ""), ...ord(rest).map(o => o.q ? '"' + o.v + '"' : o.v)];
    return koyrBatch(abs, args, ktx);
  }
  if (bn === "notepad.exe") return KOMMANDOAR.notepad(rest, io, ktx);
  if (bn === "cmd.exe") return KOMMANDOAR.cmd(rest, io, ktx);
  const intern = bn.replace(/\.exe$/, "");
  if (KOMMANDOAR[intern] && ext === ".exe") return KOMMANDOAR[intern](rest, io, ktx);
  if (ext === ".txt" || ext === ".log" || ext === ".ini" || ext === "") { opneNotisblokk(abs); return; }
  if (ext === ".exe") { io.hjelp(`«${basenamn(abs)}» er berre ei simulert programfil. På ein ekte PC ville programmet starta no – og ukjende .exe-filer frå nettet kan vere skadevare!`); return; }
  if (ext === ".dll") { io.feil(`'${basenamn(abs)}' is not recognized as an internal or external command,\noperable program or batch file.`, "Ei .dll-fil er eit programbibliotek som andre program brukar. Ho kan ikkje køyrast åleine."); return false; }
  io.hjelp(`På ein ekte PC ville Windows opna «${basenamn(abs)}» i programmet som høyrer til filtypen (t.d. Bilete-appen). Det går ikkje i simulatoren.`);
}

/* ---------- batch-filer ---------- */
async function koyrBatch(abs, args, ktxForelder, startEtikett = null) {
  const node = hent(abs);
  const setn = setningar(node ? node.d : "");
  const etikettar = {};
  setn.forEach((s, i) => { const m = s.trim().match(/^:([^\s:+]+)/); if (m && etikettar[lc(m[1])] === undefined) etikettar[lc(m[1])] = i; });
  const forelder = ktxForelder && ktxForelder.batch;
  const b = { sti: abs, namn: basenamn(abs), args, ekko: forelder ? forelder.ekko : S.ekko, brukteSetP: false, brukteIf: false,
    brukteGoto: false, brukteEcho: false, svar: [], ferdig: false, linjer: 0 };
  if (forelder) b.foreldre = forelder;
  S.batchar.push(b);
  if (S.batchar.length > 60) S.batchar.shift();
  let pc = 0, steg = 0;
  if (startEtikett) {
    const i = etikettar[lc(startEtikett)];
    if (i === undefined) { skriv("The system cannot find the batch label specified - " + startEtikett + "\n"); return false; }
    pc = i + 1;
  }
  const ktx = { batch: b, raa: "" };
  while (pc < setn.length) {
    const raa = setn[pc++];
    const t = raa.trim();
    if (++steg % 40 === 0) { await new Promise(r => setTimeout(r, 0)); }
    if (S.avbrote) {
      S.avbrote = false;
      skriv("^C\n");
      if (await sporAvslutt()) throw new Avbrot(true);
    }
    if (!t || t.startsWith(":")) continue;
    b.linjer++;
    if (b.ekko && !t.startsWith("@")) { flushLinje(); leggTilLinje(""); skriv(S.cwd + ">" + t + "\n"); }
    try {
      ktx.raa = t;
      await koyrSetning(t, ktx);
    } catch (e) {
      if (e instanceof GotoSignal) {
        b.brukteGoto = true;
        const et = lc(e.etikett.replace(/^:/, ""));
        if (et === "eof") break;
        const i = etikettar[et];
        if (i === undefined) { skriv("The system cannot find the batch label specified - " + e.etikett.replace(/^:/, "") + "\n"); skrivHjelp("Fann ikkje etiketten. Ein etikett er ei linje som startar med kolon, t.d. `:meny`."); break; }
        pc = i + 1; continue;
      }
      if (e instanceof BatchSlutt) { S.errorlevel = e.kode; b.kode = e.kode; if (e.alt) { b.ferdig = true; throw e; } break; }
      if (e instanceof Avbrot) {
        S.avbrote = false;
        if (!e.vist) skriv("^C\n");
        if (await sporAvslutt()) throw new Avbrot(true);
        continue;
      }
      throw e;
    }
  }
  b.ferdig = true;
  return { batchKode: b.kode ?? S.errorlevel };
}
async function sporAvslutt() {
  for (;;) {
    skriv("Terminate batch job (Y/N)? ");
    let svar;
    try { svar = await lesLinje(); } catch (e) { S.avbrote = false; return true; }
    if (/^y/i.test(svar.trim())) return true;
    if (/^n/i.test(svar.trim())) return false;
  }
}

/* Spør Y/N (del, rd /s, copy-overskriving). Returnerer t.d. "y", "n", "a". */
async function sporJN(tekst, lov = "yn") {
  for (;;) {
    skriv(tekst);

    if (lov.includes("a") && (s === "a" || s === "all")) return "a";
    if (s === "y" || s === "yes") return "y";

  }

const DIR_FRI = 112345678848;
function dirLinje(namn, n) {
  return datoTidFil(n.m) + "    " + (n.t === "d" ? "<DIR>".padEnd(14) : talFmt(bytar(n.d)).padStart(14)) + " " + namn;
}
K.dir = async (a, io) => {
  const { sw, pos } = bryt(a);
  const bare = sw.has("b"), rek = sw.has("s"), brei = sw.has("w");
  const af = attrFilter(sw);
  for (const s of sw) if (!/^(b|s|w|p|o.*|a.*|q|l|n|x|c|-c)$/.test(s)) { io.feil(`Invalid switch - "${s}".`, "Sjekk brytaren. Vanlege brytarar er `/b`, `/s`, `/w` og `/a`."); return false; }
  const maal = pos[0] ?? ".";
  if (/^[a-z]:/i.test(maal) && lc(maal.slice(0, 2)) !== "c:") { io.feil("The system cannot find the path specified.", "Denne maskinen har berre disken `C:`."); return false; }
  let abs = absSti(maal);
  let dirAbs = abs, monster = "*";
  let n = hent(abs);
  if (!n || n.t === "f") {
    const f = forelderAv(abs);
    if (!f) return false;
    dirAbs = f.sti; monster = f.namn;
    if (!hent(dirAbs) || hent(dirAbs).t !== "d") {
      if (!bare) io.ut(" Volume in drive C has no label.\n Volume Serial Number is 6A2F-1C3B\n\n");
      io.feil("The system cannot find the path specified.", `Fann ikkje mappa \`${dirAbs}\`. Sjekk stien.`);
      return false;
    }
  }
  const re = jokerRegex(monster);
  const treff = dn => sorterNamn(Object.keys(dn.c)).filter(k => re.test(k) && passarAttr(dn.c[k], af));
  if (bare) {
    let tal = 0;
    const gaa = (sti) => {
      const dn = hent(sti);
      for (const k of treff(dn)) { io.ut((rek ? join(sti, k) : k) + "\n"); tal++; }
      if (rek) for (const k of sorterNamn(Object.keys(dn.c))) if (dn.c[k].t === "d" && passarAttr(dn.c[k], null)) gaa(join(sti, k));
    };
    gaa(dirAbs);
    if (!tal) { io.feil("File Not Found"); return false; }
    return;
  }
  io.ut(" Volume in drive C has no label.\n Volume Serial Number is 6A2F-1C3B\n");
  let totFiler = 0, totByte = 0, totDirs = 0, nokoFunne = false;
  const seksjon = (sti, vis) => {
    const dn = hent(sti);
    let namn = treff(dn);
    const linjer = [];
    let filer = 0, byte = 0, dirs = 0;
    const erRot = sti.length <= 3;
    if (!erRot && (monster === "*" || monster === "*.*")) { linjer.push([".", dn]); linjer.push(["..", dn]); dirs += 2; }
    for (const k of namn) { const c = dn.c[k]; linjer.push([k, c]); if (c.t === "d") dirs++; else { filer++; byte += bytar(c.d); } }
    if (!namn.length && !(rek && vis)) return false;
    if (!namn.length) return false;
    nokoFunne = true;
    io.ut("\n Directory of " + sti + "\n\n");
    if (brei) {
      const celler = linjer.map(([k, c]) => c.t === "d" ? "[" + k + "]" : k);
      const b = Math.max(...celler.map(c => c.length)) + 2;
      const perRad = Math.max(1, Math.floor(78 / b));
      for (let i = 0; i < celler.length; i += perRad) io.ut(celler.slice(i, i + perRad).map(c => c.padEnd(b)).join("").trimEnd() + "\n");
    } else for (const [k, c] of linjer) io.ut(dirLinje(k, c) + "\n");
    totFiler += filer; totByte += byte; totDirs += dirs;
    if (rek) io.ut(String(filer).padStart(16) + " File(s) " + talFmt(byte).padStart(14) + " bytes\n");
    else {
      io.ut(String(filer).padStart(16) + " File(s) " + talFmt(byte).padStart(14) + " bytes\n");
      io.ut(String(dirs).padStart(16) + " Dir(s)  " + talFmt(DIR_FRI).padStart(15) + " bytes free\n");
    }
    return true;
  };
  if (!rek) {
    if (!seksjon(dirAbs)) {
      if (!hent(dirAbs) || !Object.keys(hent(dirAbs).c).length && dirAbs.length > 3 && (monster === "*")) { /* tom mappe: vis . og .. */ }
      const dn = hent(dirAbs);
      if (dn && dirAbs.length > 3 && (monster === "*" || monster === "*.*")) {
        io.ut("\n Directory of " + dirAbs + "\n\n" + dirLinje(".", dn) + "\n" + dirLinje("..", dn) + "\n");
        io.ut(String(0).padStart(16) + " File(s) " + "0".padStart(14) + " bytes\n" + String(2).padStart(16) + " Dir(s)  " + talFmt(DIR_FRI).padStart(15) + " bytes free\n");
        return;
      }
      io.ut("\n Directory of " + dirAbs + "\n\n");
      io.feil("File Not Found", monster !== "*" ? `Ingen filer eller mapper i \`${dirAbs}\` passar med «${monster}».` : undefined);
      return false;
    }
    return;
  }
  const gaa = sti => {
    seksjon(sti, true);
    const dn = hent(sti);
    for (const k of sorterNamn(Object.keys(dn.c))) if (dn.c[k].t === "d" && passarAttr(dn.c[k], null)) gaa(join(sti, k));
  };
  gaa(dirAbs);
  if (!nokoFunne) { io.feil("File Not Found"); return false; }
  io.ut("\n     Total Files Listed:\n" + String(totFiler).padStart(16) + " File(s) " + talFmt(totByte).padStart(14) + " bytes\n" +
    String(totDirs).padStart(16) + " Dir(s)  " + talFmt(DIR_FRI).padStart(15) + " bytes free\n");
};

/* tree */
K.tree = async (a, io) => {
  const { sw, pos } = bryt(a);
  const filer = sw.has("f"), ascii = sw.has("a");
  const abs = pos[0] ? absSti(pos[0]) : S.cwd;
  const n = hent(abs);
  io.ut("Folder PATH listing\nVolume serial number is 6A2F-1C3B\n");
  if (!n || n.t !== "d") { io.feil("Invalid path - " + (pos[0] ? abs.slice(2).toUpperCase() : abs), "Fann ikkje mappa. Sjekk stien."); return false; }
  io.ut((pos[0] ? abs.toUpperCase() : "C:.") + "\n");
  const G = ascii ? { t: "+---", s: "\\---", l: "|   " } : { t: "├───", s: "└───", l: "│   " };
  let harUnder = false;
  const gaa = (dn, prefiks) => {
    const keys = sorterNamn(Object.keys(dn.c)).filter(k => passarAttr(dn.c[k], null));
    const dirs = keys.filter(k => dn.c[k].t === "d");
    const fs = keys.filter(k => dn.c[k].t === "f");
    if (filer && fs.length) {
      for (const f of fs) io.ut(prefiks + (dirs.length ? G.l : "    ") + f + "\n");
      io.ut((prefiks + (dirs.length ? G.l : "    ")).trimEnd() + "\n");
    }
    dirs.forEach((d, i) => {
      harUnder = true;
      const sist = i === dirs.length - 1;
      io.ut(prefiks + (sist ? G.s : G.t) + d + "\n");
      gaa(dn.c[d], prefiks + (sist ? "    " : G.l));
    });
  };
  gaa(n, "");
  if (!harUnder) io.ut("No subfolders exist \n");
};

/* mkdir / md */
K.mkdir = K.md = async (a, io) => {
  const o = ord(a).map(x => x.v);
  if (!o.length) { io.feil("The syntax of the command is incorrect.", "Skriv namnet på mappa du vil lage, t.d. `mkdir Prosjekt`."); return false; }
  let ok = true;
  for (const namn of o) {
    const abs = absSti(namn);
    if (erVerna(abs)) { io.feil("Access is denied.", HJ.verna); ok = false; continue; }
    if (delSti(abs).slice(1).some(ugyldigNamn)) { io.feil("The filename, directory name, or volume label syntax is incorrect.", "Mappenamn kan ikkje innehalde teikna < > : \" | ? *"); ok = false; continue; }
    if (hent(abs)) { io.feil(`A subdirectory or file ${namn} already exists.`, `Det finst alt ei mappe eller fil som heiter «${basenamn(abs)}» her.`); ok = false; continue; }
    const fe = lagMappeSti(abs);
    if (fe) { io.feil(fe); ok = false; }
  }
  if (o.length === 1 && /\s/.test(a.trim()) && !/"/.test(a)) { /* ingen hjelp */ }
  return ok;
};

/* rmdir / rd */
K.rmdir = K.rd = async (a, io) => {
  const { sw, pos } = bryt(a);
  if (!pos.length) { io.feil("The syntax of the command is incorrect.", "Skriv namnet på mappa du vil slette, t.d. `rd tull`."); return false; }
  let ok = true;
  for (const namn of pos) {
    const abs = absSti(namn);
    const n = hent(abs);
    if (!n) { io.feil("The system cannot find the file specified.", `Fann ikkje mappa «${namn}». Skriv \`dir\` for å sjå kva som finst her.`); ok = false; continue; }
    if (n.t !== "d") { io.feil("The directory name is invalid.", `«${basenamn(abs)}» er ei fil. Filer slettar du med \`del ${basenamn(abs)}\`.`); ok = false; continue; }
    if (erVerna(abs) || abs.length <= 3) { io.feil("Access is denied.", HJ.verna); ok = false; continue; }
    if (lc(S.cwd) === lc(abs) || lc(S.cwd).startsWith(lc(abs) + "\\")) { io.feil("The process cannot access the file because it is being used by another process.", "Du står inni mappa du prøver å slette. Gå ut av ho først, t.d. med `cd ..`."); ok = false; continue; }
    if (Object.keys(n.c).length && !sw.has("s")) { io.feil("The directory is not empty.", `Mappa er ikkje tom. Slett innhaldet først, eller bruk \`rd /s ${namn}\` for å slette mappa med alt innhald (ver forsiktig – det går ikkje an å angre!).`); ok = false; continue; }
    if (sw.has("s") && !sw.has("q")) {
      const s = await sporJN(namn + ", Are you sure (Y/N)? ");
      if (s !== "y") continue;
    }
    fjern(abs);
    S.slettaMapper.push(abs);
  }
  return ok;
};

/* type */
K.type = async (a, io) => {
  const o = ord(a).map(x => x.v);
  if (!o.length) { io.feil("The syntax of the command is incorrect.", "Skriv namnet på fila, t.d. `type notat.txt`."); return false; }
  let ok = true;
  const fleire = o.length > 1 || o.some(harJoker);
  for (const namn of o) {
    if (lc(namn) === "nul") continue;
    const abs = absSti(namn);
    let liste = [];
    if (harJoker(basenamn(abs))) {
      const f = forelderAv(abs); const p = hent(f.sti);
      if (p && p.t === "d") liste = sorterNamn(Object.keys(p.c)).filter(k => p.c[k].t === "f" && jokerRegex(f.namn).test(k)).map(k => join(f.sti, k));
      if (!liste.length) { fileFinstIkkje(io, namn); ok = false; continue; }
    } else liste = [abs];
    for (const s of liste) {
      const n = hent(s);
      if (!n) { fileFinstIkkje(io, namn, forelderAv(s) && hent(forelderAv(s).sti) ? forelderAv(s).sti : S.cwd); ok = false; continue; }
      if (n.t === "d") { io.feil("Access is denied.", `«${basenamn(s)}» er ei mappe, ikkje ei fil. Bruk \`dir ${basenamn(s)}\` for å sjå innhaldet.`); ok = false; continue; }
      if (fleire) skriv("\n" + basenamn(s) + "\n\n\n");
      let d = fraCRLF(n.d);
      io.ut(d.endsWith("\n") || d === "" ? d : d + "\n");
    }
  }
  return ok;
};

/* Finn kjeldefiler for copy/move/del (jokerteikn) */
function kjeldefiler(namn) {
  const abs = absSti(namn);
  const n = hent(abs);
  if (n && n.t === "f") return [abs];
  if (n && n.t === "d") return sorterNamn(Object.keys(n.c)).filter(k => n.c[k].t === "f").map(k => join(abs, k));
  const f = forelderAv(abs);
  if (f && harJoker(f.namn)) {
    const p = hent(f.sti);
    if (p && p.t === "d") return sorterNamn(Object.keys(p.c)).filter(k => p.c[k].t === "f" && jokerRegex(f.namn).test(k)).map(k => join(f.sti, k));
  }
  return [];
}
function maalFor(kjelde, dst, fleire) {
  const dAbs = absSti(dst);
  const dn = hent(dAbs);
  if (dn && dn.t === "d") return join(dAbs, basenamn(kjelde));
  const f = forelderAv(dAbs);
  if (f && harJoker(f.namn)) {   // copy *.txt *.bak
    const kb = basenamn(kjelde), [kn, ke = ""] = [kb.replace(/\.[^.]*$/, ""), (kb.match(/\.[^.]*$/) || [""])[0]];
    const [mn, me = ""] = [f.namn.replace(/\.[^.]*$/, ""), (f.namn.match(/\.[^.]*$/) || [""])[0]];
    return join(f.sti, (mn === "*" ? kn : mn) + (me === ".*" ? ke : me));
  }
  return dAbs;
}

/* copy */
K.copy = async (a, io) => {
  const { sw, pos } = bryt(a);
  if (!pos.length) { io.feil("The syntax of the command is incorrect.", "Skriv `copy kjelde mål`, t.d. `copy hei.txt kopi.txt`."); return false; }
  const kjelder = kjeldefiler(pos[0]);
  if (!kjelder.length) {
    fileFinstIkkje(io, pos[0]);
    io.ut("        0 file(s) copied.\n");
    return false;
  }
  const dst = pos[1] ?? ".";
  let tal = 0, alle = sw.has("y"), ok = true;
  const fleire = kjelder.length > 1 || harJoker(pos[0]) || hent(absSti(pos[0]))?.t === "d";
  for (const k of kjelder) {
    const m = maalFor(k, dst, fleire);
    if (fleire) io.ut(basenamn(k) + "\n");
    if (lc(m) === lc(k)) { io.feil("The file cannot be copied onto itself.", "Kjelde og mål er same fil. Gi kopien eit anna namn, t.d. `copy hei.txt kopi.txt`."); ok = false; continue; }
    const mn = hent(m);
    if (mn && mn.t === "f" && !alle) {
      const s = await sporJN(`Overwrite ${m}? (Yes/No/All): `, "yna");
      if (s === "n") continue;
      if (s === "a") alle = true;
    }
    if (erVerna(m)) { io.feil("Access is denied.", HJ.verna); ok = false; continue; }
    const fe = skrivFil(m, fraCRLF(hent(k).d));
    if (fe) { io.feil(fe, fe.includes("path") ? "Mappa du vil kopiere til, finst ikkje." : undefined); ok = false; continue; }
    tal++;
  }
  io.ut(`        ${tal} file(s) copied.\n`);
  return ok && tal > 0;
};

/* xcopy (enkel) */
K.xcopy = async (a, io) => {
  const { sw, pos } = bryt(a);
  if (!pos.length) { io.feil("Invalid number of parameters", "Skriv `xcopy kjelde mål`, t.d. `xcopy Documents Backup /s /i`."); return false; }
  const kAbs = absSti(pos[0]);
  const kn = hent(kAbs);
  const dst = absSti(pos[1] ?? ".");
  let filer = [];
  if (kn && kn.t === "d") {
    const gaa = (sti, rel) => {
      const n = hent(sti);
      for (const k of sorterNamn(Object.keys(n.c))) {
        if (n.c[k].t === "f") filer.push({ fra: join(sti, k), rel: rel + k });
        else if (sw.has("s") || sw.has("e")) gaa(join(sti, k), rel + k + "\\");
      }
    };
    gaa(kAbs, "");
    if (!hent(dst) && !sw.has("i")) {
      for (;;) {
        skriv(`Does ${dst} specify a file name\nor directory name on the target\n(F = file, D = directory)? `);
        const s = lc((await lesLinje()).trim());
        if (s === "d" || s === "f") break;
      }
    }
  } else {
    filer = kjeldefiler(pos[0]).map(f => ({ fra: f, rel: basenamn(f) }));
    if (!filer.length) { io.feil("File not found - " + basenamn(kAbs), "Fann ikkje kjelda. Sjekk namnet med `dir`."); io.ut("0 File(s) copied\n"); return false; }
  }
  if (erVerna(dst)) { io.feil("Access denied", HJ.verna); return false; }
  let tal = 0;
  for (const f of filer) {
    const m = join(dst, f.rel);
    const fe = lagMappeSti(forelderAv(m).sti) || skrivFil(m, fraCRLF(hent(f.fra).d));
    if (fe) { io.feil(fe); continue; }
    io.ut(join(kn && kn.t === "d" ? basenamn(kAbs) : "", f.rel).replace(/^\\/, "") + "\n");
    tal++;
  }
  if (kn && kn.t === "d" && (sw.has("e")) ) lagMappeSti(dst);
  io.ut(`${tal} File(s) copied\n`);
};

/* move */
K.move = async (a, io) => {
  const { sw, pos } = bryt(a);
  if (pos.length < 1) { io.feil("The syntax of the command is incorrect.", "Skriv `move kjelde mål`, t.d. `move hei.txt Desktop`."); return false; }
  const kAbs = absSti(pos[0]);
  const kn = hent(kAbs);
  const dst = pos[1] ?? ".";
  if (kn && kn.t === "d") {
    const dAbs = absSti(dst); const dn = hent(dAbs);
    const m = dn && dn.t === "d" ? join(dAbs, basenamn(kAbs)) : dAbs;
    if (erVerna(kAbs) || erVerna(m)) { io.feil("Access is denied.", HJ.verna); return false; }
    if (lc(m).startsWith(lc(kAbs) + "\\") || lc(S.cwd).startsWith(lc(kAbs))) { io.feil("The process cannot access the file because it is being used by another process."); return false; }
    if (hent(m)) { io.feil("Access is denied.", "Det finst alt noko med det namnet der."); return false; }
    const f = forelderAv(m); const p = hent(f.sti);
    if (!p || p.t !== "d") { io.feil("The system cannot find the path specified."); return false; }
    p.c[f.namn] = kn; fjernUtanLagring(kAbs); p.m = naa(); lagreFs();
    io.ut("        1 dir(s) moved.\n");
    return;
  }
  const kjelder = kjeldefiler(pos[0]);
  if (!kjelder.length) { fileFinstIkkje(io, pos[0]); return false; }
  let tal = 0, alle = sw.has("y"), ok = true;
  for (const k of kjelder) {
    const m = maalFor(k, dst, kjelder.length > 1);
    if (kjelder.length > 1) io.ut(k + "\n");
    if (lc(m) === lc(k)) { tal++; continue; }
    if (erVerna(k) || erVerna(m)) { io.feil("Access is denied.", HJ.verna); ok = false; continue; }
    const mn = hent(m);
    if (mn && mn.t === "f" && !alle) {
      const s = await sporJN(`Overwrite ${m}? (Yes/No/All): `, "yna");
      if (s === "n") continue; if (s === "a") alle = true;
    }
    const kopi = hent(k);
    const f = forelderAv(m); const p = hent(f.sti);
    if (!p || p.t !== "d") { io.feil("The system cannot find the path specified.", "Mappa du vil flytte til, finst ikkje."); ok = false; continue; }
    const eks = finnNamn(p, f.namn);
    if (eks) delete p.c[eks];
    fjernUtanLagring(k);
    p.c[f.namn] = { ...kopi, m: kopi.m };
    p.m = naa();
    tal++;
  }
  lagreFs();
  io.ut(`        ${tal} file(s) moved.\n`);
  return ok;
};
function fjernUtanLagring(abs) { const f = forelderAv(abs); const p = hent(f.sti); const k = finnNamn(p, f.namn); if (k) delete p.c[k]; p.m = naa(); }

/* ren / rename */
K.ren = K.rename = async (a, io) => {
  const { pos } = bryt(a);
  if (pos.length !== 2 || /[\\/]/.test(pos[1])) { io.feil("The syntax of the command is incorrect.", "Skriv `ren gamaltnamn nyttnamn`, t.d. `ren kopi.txt backup.txt`. Det nye namnet skal vere utan sti."); return false; }
  const kAbs = absSti(pos[0]);
  if (erVerna(kAbs)) { io.feil("Access is denied.", HJ.verna); return false; }
  let kjelder = [];
  if (harJoker(basenamn(kAbs))) kjelder = kjeldefiler(pos[0]); else if (hent(kAbs)) kjelder = [kAbs];
  if (!kjelder.length) { fileFinstIkkje(io, pos[0]); return false; }
  let ok = true;
  for (const k of kjelder) {
    const f = forelderAv(k); const p = hent(f.sti);
    const nytt = harJoker(pos[1]) ? basenamn(maalFor(k, join(f.sti, pos[1]), true)) : pos[1];
    if (ugyldigNamn(nytt)) { io.feil("The syntax of the command is incorrect."); ok = false; continue; }
    const eks = finnNamn(p, nytt);
    if (eks && lc(eks) !== lc(basenamn(k))) { io.feil("A duplicate file name exists, or the file\ncannot be found.", `Det finst alt noko som heiter «${eks}» her. Vel eit anna namn.`); ok = false; continue; }
    const gk = finnNamn(p, basenamn(k));
    const node = p.c[gk];
    // behald rekkjefølgja
    const ny = {};
    for (const [kk, v] of Object.entries(p.c)) { if (kk === gk) ny[nytt] = node; else ny[kk] = v; }
    p.c = ny; p.m = naa();
  }
  lagreFs();
  return ok;
};

/* del / erase */
K.del = K.erase = async (a, io) => {
  const { sw, pos } = bryt(a);
  if (!pos.length) { io.feil("The syntax of the command is incorrect.", "Skriv namnet på fila du vil slette, t.d. `del gamal.txt`."); return false; }
  let ok = true;
  const stille = sw.has("q");
  for (const namn of pos) {
    let abs = absSti(namn);
    let n = hent(abs);
    let dirAbs, monster;
    if (n && n.t === "d") { dirAbs = abs; monster = "*"; }
    else { const f = forelderAv(abs); dirAbs = f.sti; monster = f.namn; }
    const dn = hent(dirAbs);
    const finn = (sti) => { const d = hent(sti); return d && d.t === "d" ? sorterNamn(Object.keys(d.c)).filter(k => d.c[k].t === "f" && jokerRegex(monster).test(k)).map(k => join(sti, k)) : []; };
    let liste = [];
    if (sw.has("s")) { const gaa = s => { liste.push(...finn(s)); const d = hent(s); for (const k of Object.keys(d.c)) if (d.c[k].t === "d") gaa(join(s, k)); }; if (dn && dn.t === "d") gaa(dirAbs); }
    else liste = finn(dirAbs);
    if (!liste.length) {
      if (!dn || dn.t !== "d") { io.feil("The system cannot find the path specified.", "Mappa finst ikkje. Sjekk stien."); ok = false; continue; }
      io.feil("Could Not Find " + join(dirAbs, monster), `Fann ingen fil som heiter «${monster}» i \`${dirAbs}\`. Skriv \`dir\` for å sjå kva filer som finst.`);

function lesInndata(io, filer, kommando) {
  // returnerer [{namn, linjer}] eller null ved feil
  if (!filer.length) {
    if (io.inn === null || io.inn === undefined) return null;
    return [{ namn: null, linjer: fraCRLF(io.inn).replace(/\n$/, "").split("\n") }];
  }
  const ut = [];
  for (const f of filer) {
    const liste = harJoker(f) ? kjeldefiler(f) : [absSti(f)];
    if (!liste.length || !hent(liste[0]) || hent(liste[0]).t !== "f") {
      io.feil(kommando === "find" ? "File not found - " + f.toUpperCase() : kommando === "sort" ? "The system cannot find the file specified." : "FINDSTR: Cannot open " + f,
        `Fann ikkje fila «${f}» i \`${S.cwd}\`. Skriv \`dir\` for å sjå kva filer som finst her.`);
      continue;
    }
    for (const s of liste) ut.push({ namn: basenamn(s), linjer: fraCRLF(hent(s).d).replace(/\n$/, "").split("\n") });
  }
  return ut;
}

K.findstr = async (a, io) => {

    if (!x.q && x.v.startsWith("/") && x.v.length > 1) { x.v.split("/").filter(Boolean).forEach(s => sw.add(lc(s))); continue; }
    pos.push(x.v);

  if (cStreng === null && !pos.length) { io.feil("FINDSTR: Bad command line", "Skriv kva du vil leite etter, t.d. `findstr \"IP\" notat.txt`."); return false; }
  const strengar = cStreng !== null ? [cStreng] : pos.shift().split(" ").filter(Boolean);
  const ci = sw.has("i"), inv = sw.has("v"), nr = sw.has("n"), regex = sw.has("r");
  const testarar = strengar.map(s => {
    if (regex) { try { return new RegExp(s.replace(/\\</g, "\\b").replace(/\\>/g, "\\b"), ci ? "i" : ""); } catch (e) { return { test: () => false }; } }

    const t = testarar.some(r => r.test(l));
    if (t !== inv) { treff++; io.ut((fleire && f.namn ? f.namn + ":" : "") + (nr ? (i + 1) + ":" : "") + l + "\n"); }

  if (!treff) { io.mislukka(); if (!io.iRoyr && io.tilTerminal) io.hjelp(`Ingen linjer inneheld «${strengar.join(" ")}».` + (ci ? "" : " Hugs at `findstr` skil mellom store og små bokstavar – prøv `/i`.")); return false; }

K.find = async (a, io) => {
  const o = ord(a);

  for (const x of o) {

  if (streng === null) { io.feil("FIND: Parameter format not correct", "`find` krev hermeteikn rundt teksten: `find \"hei\" fil.txt`."); return false; }
  const ci = sw.has("i"), inv = sw.has("v"), tel = sw.has("c"), nr = sw.has("n");
