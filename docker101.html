<!DOCTYPE html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docker 101</title>
<!-- Kode 101 – Docker. Bygd på felles mal for Kode 101-sidene. Linux-serveren, Docker og Docker Hub er simulerte i nettlesaren (ingen eksterne bibliotek). -->
<style>
:root {
    --gron: #2e7d32;
    --gron-mork: #1b5e20;
    --gron-lys: #e8f5e9;
    --bg: #eef3ef;
    --kort: #ffffff;
    --tekst: #24302a;
    --grå: #5f6b64;
    --linje: #dfe6e1;
    --lenke: #0066cc;
    --gul: #fff6d6;
    --gul-kant: #e8c547;
    --kode-bg: #f4f6f5;
    --font: system-ui, "Segoe UI", Arial, sans-serif;
    --mono: Consolas, "Cascadia Mono", "Cascadia Code", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--tekst); font-family: var(--font); font-size: 15px; display: flex; flex-direction: column; }

/* ---------- Grøn tittellinje ---------- */
header.topp { background: var(--gron); color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; border-bottom: 3px solid var(--gron-mork); }
header.topp .tilbake { color: #fff; text-decoration: none; font-size: 14px; padding: 4px 10px; border: 1px solid rgba(255,255,255,.5); border-radius: 14px; white-space: nowrap; }
header.topp .tilbake:hover { background: var(--gron-mork); }
header.topp .titlar { flex: 1 1 260px; min-width: 0; }
header.topp h1 { margin: 0; font-size: 21px; line-height: 1.2; }
header.topp .under { margin: 2px 0 0; font-size: 13px; opacity: .9; }
header.topp .hogre { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.framdrift { font-size: 13px; min-width: 130px; }
.framdrift .linje { height: 6px; background: rgba(255,255,255,.3); border-radius: 3px; margin-top: 4px; overflow: hidden; }
.framdrift .linje div { height: 100%; width: 0; background: #fff; transition: width .4s; }
header.topp button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6); border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
header.topp button:hover { background: var(--gron-mork); }

/* ---------- To kolonnar ---------- */
main.oppsett { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(320px, 40%) 1fr; gap: 14px; padding: 14px; }
.kort { background: var(--kort); border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
#leksjonspanel { overflow-y: auto; min-height: 0; padding: 0; display: flex; flex-direction: column; }
#sim { min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
@media (max-width: 900px) {
    body { height: auto; display: block; }
    main.oppsett { display: flex; flex-direction: column; padding: 10px; }
    #leksjonspanel { overflow: visible; }
    #sim { height: 78vh; min-height: 460px; }
}

/* ---------- Leksjonsliste ---------- */
#leksjonsliste { list-style: none; margin: 0; padding: 8px; border-bottom: 1px solid var(--linje); display: flex; flex-direction: column; gap: 2px; }
#leksjonsliste li button { width: 100%; text-align: left; background: none; border: none; font: inherit; font-size: 14px; padding: 5px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; color: var(--tekst); }
#leksjonsliste li button:hover { background: var(--gron-lys); }
#leksjonsliste li.aktiv button { background: var(--gron); color: #fff; }
#leksjonsliste .status { width: 1.2em; text-align: center; flex: none; }
#leksjonsliste .sirkel { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; vertical-align: -1px; opacity: .75; }
#leksjonsliste .sirkel.halv { background: linear-gradient(90deg, currentColor 50%, transparent 50%); opacity: 1; }
@media (max-width: 600px) { #leksjon .eksempel pre { padding-right: 12px; padding-top: 34px; } }
#leksjonsliste .nr { color: var(--grå); width: 1.6em; flex: none; }
#leksjonsliste li.aktiv .nr { color: #dfeee0; }
#leksjonsliste .tal { margin-left: auto; font-size: 12px; color: var(--grå); }
#leksjonsliste li.aktiv .tal { color: #dfeee0; }
#leksjonsliste .ferdig .status { color: var(--gron); }
#leksjonsliste li.aktiv.ferdig .status { color: #fff; }

/* ---------- Leksjonsinnhald ---------- */
#leksjon { padding: 14px 18px 18px; line-height: 1.5; }
#leksjon h2 { font-size: 20px; margin: 0 0 4px; padding-bottom: 6px; border-bottom: 2px solid var(--gron); }
#leksjon .laerer { color: var(--grå); font-size: 14px; margin: 6px 0 12px; }
#leksjon .laerer b { color: var(--gron-mork); }
#leksjon p { margin: 8px 0; }
#leksjon code { font-family: var(--mono); background: var(--kode-bg); padding: 1px 4px; border-radius: 3px; font-size: 13.5px; }
#leksjon h3 { font-size: 15px; margin: 18px 0 6px; color: var(--gron-mork); }
.eksempel { position: relative; margin: 8px 0 12px; }
.eksempel pre { margin: 0; background: #1e1e1e; color: #e6e6e6; font-family: var(--mono); font-size: 13.5px; padding: 10px 12px; padding-right: 70px; border-radius: 6px; overflow-x: auto; line-height: 1.4; }
.eksempel .prov { position: absolute; top: 6px; right: 6px; background: var(--gron); color: #fff; border: none; border-radius: 4px; padding: 3px 9px; font: inherit; font-size: 12.5px; cursor: pointer; }
.eksempel .prov:hover { background: var(--gron-mork); }
.tips { background: var(--gul); border-left: 4px solid var(--gul-kant); padding: 8px 12px; border-radius: 4px; margin: 10px 0; }
table.juks { border-collapse: collapse; width: 100%; font-size: 13.5px; margin: 8px 0; }
table.juks td, table.juks th { border-bottom: 1px solid var(--linje); padding: 4px 6px; text-align: left; vertical-align: top; }
table.juks td:first-child { font-family: var(--mono); white-space: nowrap; }

/* ---------- Oppgåver ---------- */
.oppgaver { list-style: none; padding: 0; margin: 6px 0; display: flex; flex-direction: column; gap: 8px; }
.oppgave { border: 1px solid var(--linje); border-radius: 8px; padding: 9px 12px; display: grid; grid-template-columns: 1.4em 1fr auto; gap: 4px 8px; align-items: start; transition: background .4s, border-color .4s; }
.oppgave .ikon { font-size: 16px; line-height: 1.4; color: #9aa59f; }
.oppgave.loyst { background: var(--gron-lys); border-color: #a5d6a7; }
.oppgave.loyst .ikon { color: var(--gron); }
.oppgave .hintknapp { background: #fff; border: 1px solid var(--linje); border-radius: 5px; padding: 2px 9px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--grå); }
.oppgave .hintknapp:hover { border-color: var(--gron); color: var(--gron-mork); }
.oppgave .hint { grid-column: 2 / 4; font-size: 13.5px; background: var(--gul); border-radius: 5px; padding: 5px 9px; }
.oppgave .bra { grid-column: 2 / 4; color: var(--gron-mork); font-weight: bold; font-size: 14px; animation: bra 2.6s forwards; }
@keyframes bra { 0% { opacity: 0; } 10% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
.fullfort { background: var(--gron); color: #fff; border-radius: 8px; padding: 10px 14px; margin: 14px 0 6px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.fullfort button { background: #fff; color: var(--gron-mork); border: none; border-radius: 5px; padding: 5px 12px; font: inherit; font-weight: bold; cursor: pointer; }
.navknappar { display: flex; justify-content: space-between; margin: 18px 0 8px; }
.navknappar button { background: #fff; border: 1px solid var(--gron); color: var(--gron-mork); border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer; }
.navknappar button:hover:not(:disabled) { background: var(--gron); color: #fff; }
.navknappar button:disabled { opacity: .35; cursor: default; }
details.laerar { margin: 16px 0 0; border: 1px solid var(--linje); border-radius: 8px; padding: 8px 12px; font-size: 14px; background: #fafcfb; }
details.laerar summary { cursor: pointer; font-weight: bold; color: var(--grå); }
details.laerar ul { padding-left: 20px; margin: 6px 0; }

/* ---------- Toast ---------- */
#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); background: var(--gron-mork); color: #fff; padding: 9px 16px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; z-index: 50; max-width: 90vw; font-size: 14px; }
#toast.vis { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- Kursbevis ---------- */
#bevisbakgrunn { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
#bevisbakgrunn.vis { display: flex; }
#bevisboks { background: #fff; border-radius: 10px; max-width: 640px; width: 100%; max-height: 92vh; overflow-y: auto; padding: 18px; }
.namnrad { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; font-size: 14px; }
.namnrad input { flex: 1; min-width: 160px; padding: 7px 10px; font: inherit; border: 1px solid #bbb; border-radius: 6px; }
#bevis { border: 3px solid var(--gron); border-radius: 6px; padding: 0 22px 18px; position: relative; text-align: center; }
#bevis .stripe { height: 14px; background: var(--gron); margin: 0 -22px 16px; }
#bevis h2 { margin: 6px 0 2px; font-size: 26px; color: var(--gron-mork); letter-spacing: .02em; }
#bevis .bnamn { font-size: 24px; margin: 14px 0 2px; font-family: Georgia, serif; border-bottom: 1px solid #999; display: inline-block; min-width: 60%; padding: 0 10px 2px; }
#bevis .skule { color: var(--grå); font-size: 14px; }
#bevis ul { list-style: none; padding: 0; text-align: left; margin: 14px auto 6px; max-width: 420px; font-size: 14px; }
#bevis ul li { padding: 2px 0; }
#bevis .sum { font-weight: bold; margin-top: 8px; }
#bevis .segl { position: absolute; right: 14px; top: 26px; width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe680, #d4a017 60%, #a87900); color: #5a3d00; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; box-shadow: 0 0 0 4px #f3d36b, 0 2px 6px rgba(0,0,0,.3); transform: rotate(-12deg); }
#bevis .delvis { position: absolute; right: 14px; top: 30px; border: 2px dashed var(--grå); color: var(--grå); border-radius: 6px; padding: 4px 8px; font-size: 13px; transform: rotate(-8deg); }
#bevis .manglar { font-size: 13px; color: var(--grå); }
.bevisknappar { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.bevisknappar button { padding: 7px 14px; font: inherit; border-radius: 6px; border: 1px solid var(--gron); background: #fff; color: var(--gron-mork); cursor: pointer; }
.bevisknappar button.hoved { background: var(--gron); color: #fff; }
@media print {
    @page { size: A4; margin: 15mm; }
    /* display:none (ikkje visibility:hidden) – elles tek resten av sida plass og gir fleire tomme sider */
    html, body { height: auto !important; min-height: 0 !important; overflow: visible !important; background: #fff !important; }
    body { display: block !important; }
    body > *:not(#bevisbakgrunn) { display: none !important; }
    #bevisbakgrunn { position: static !important; inset: auto; background: none !important; display: block !important; padding: 0 !important; }
    #bevisboks { box-shadow: none; max-width: none; max-height: none; overflow: visible; padding: 0; border-radius: 0; }
    #bevisboks .namnrad, #bevisboks .bevisknappar { display: none !important; }
    #bevis { break-inside: avoid; page-break-inside: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* ---------- Felles 💡-hjelpetekst (bruk i simulatoren) ---------- */
.hjelp { color: #ffe9a8; font-family: var(--font); font-size: 14px; background: rgba(255, 214, 90, .08); border-left: 3px solid #f2c94c; padding: 4px 10px; margin: 4px 0 6px; white-space: pre-wrap; border-radius: 0 4px 4px 0; }
#leksjon button.handling { background: var(--gron); color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; margin: 2px 6px 2px 0; }
#leksjon button.handling:hover { background: var(--gron-mork); }
#leksjon button.handling.lys { background: #fff; color: var(--gron-mork); border: 1px solid var(--gron); }
#leksjon button.handling.lys:hover { background: var(--gron-lys); }
#leksjon .klargjer { font-size: 13.5px; color: var(--grå); border-top: 1px dashed var(--linje); margin-top: 14px; padding-top: 8px; }

/* ---------- Terminal ---------- */
#sim { background: #0c0c0c; position: relative; }
.vtittel { display: flex; align-items: center; gap: 8px; background: #202020; color: #e6e6e6; font-size: 12.5px; height: 32px; padding-left: 10px; flex: none; user-select: none; border-radius: 8px 8px 0 0; }
.vtittel .vikon { width: 18px; height: 14px; background: #1d63ed; border-radius: 3px; flex: none; }
.vtittel .vnamn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); }
.vtittel button { background: none; border: 1px solid #555; color: #ddd; border-radius: 5px; font: inherit; font-size: 12px; padding: 2px 9px; cursor: pointer; margin-right: 8px; }
.vtittel button:hover { background: #333; }
#term { flex: 1 1 0; min-height: 160px; overflow-y: auto; overflow-x: hidden; padding: 4px 10px 10px; font-family: var(--mono); font-size: 14px; line-height: 1.32; color: #cccccc; background: #0c0c0c; white-space: pre-wrap; word-break: normal; overflow-wrap: anywhere; cursor: text; position: relative; tab-size: 8; }
#term::-webkit-scrollbar { width: 10px; }
#term::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 5px; }
#termUt > div { min-height: 1.32em; }
#termAktiv { position: relative; min-height: 1.32em; }
#termInn { position: absolute; left: 0; top: 0; width: 2px; height: 1.3em; opacity: 0; border: 0; padding: 0; margin: 0; resize: none; overflow: hidden; font-size: 16px; color: transparent; background: transparent; caret-color: transparent; outline: none; }
.markor { position: relative; }
.markor::after { content: ""; position: absolute; left: 0; right: 0; bottom: 1px; height: 3px; background: currentColor; animation: blink 1.06s steps(1) infinite; }
.markor.tom::after { width: .6em; right: auto; }
#term.ufokus .markor::after { animation: none; opacity: .45; }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
#term .hjelp { word-break: normal; overflow-wrap: break-word; line-height: 1.45; white-space: normal; }
#term .hjelp code { font-family: var(--mono); background: rgba(255,255,255,.1); padding: 0 4px; border-radius: 3px; color: #fff3c4; }
#term ::selection { background: #f2f2f2; color: #0c0c0c; }
.fg { color: #3fc85a; } .fr { color: #f14c4c; } .fy { color: #d7ba3d; } .fc { color: #29b8db; } .fm { color: #c678dd; } .fb { font-weight: bold; } .fd { color: #5c9cff; }
.mobilrad { display: none; gap: 6px; padding: 6px 8px; background: #1a1a1a; flex: none; overflow-x: auto; }
.mobilrad button { background: #2d2d2d; color: #e6e6e6; border: 1px solid #444; border-radius: 6px; padding: 6px 12px; font: 13px var(--mono); flex: none; }
@media (max-width: 900px), (pointer: coarse) { .mobilrad { display: flex; } }

/* ---------- Figur: VM mot container ---------- */
.vmfig { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0 12px; font-size: 12px; }
.vmfig h5 { margin: 0 0 4px; font-size: 13px; text-align: center; color: var(--gron-mork); }
.vmfig .rad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-bottom: 3px; }
.vmfig .rad span, .vmfig .lag { border-radius: 4px; padding: 4px 2px; text-align: center; line-height: 1.2; }
.vmfig .app { background: var(--gron-lys); border: 1px solid #a5d6a7; }
.vmfig .gos { background: #ffe8cc; border: 1px solid #f0b46a; }
.vmfig .lag { margin-bottom: 3px; }
.vmfig .hv { background: #e3e8f7; border: 1px solid #a9b6e0; }
.vmfig .dk { background: #dbeafe; border: 1px solid #8ab4f8; }
.vmfig .os { background: #ffe8cc; border: 1px solid #f0b46a; }
.vmfig .mv { background: #e6e9e7; border: 1px solid #c3cbc6; }
@media (max-width: 420px) { .vmfig { grid-template-columns: 1fr; } }

/* ---------- Docker-modell (levande teikning) ---------- */
#sim.inne .vtittel { background: #0b3a8f; }
#sim.inne .vtittel .vikon { background: #fff; }
#modell { flex: 0 0 auto; max-height: 50%; overflow-y: auto; background: #f7faf8; color: var(--tekst); border-top: 3px solid #111; font-size: 13px; border-radius: 0 0 8px 8px; }
#modell .mtopp { display: flex; align-items: baseline; gap: 8px; padding: 6px 10px 2px; flex-wrap: wrap; }
#modell .mtopp b { font-size: 13.5px; }
#modell .mtopp .repo { color: var(--grå); font-size: 12px; }
#modell .tom { padding: 8px 12px 12px; color: var(--grå); }
#modell code { font-family: var(--mono); background: var(--kode-bg); padding: 1px 4px; border-radius: 3px; font-size: 12.5px; }
.dk { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.5fr) auto minmax(0, 1fr); gap: 4px; padding: 4px 10px 8px; align-items: start; }
.dk .kol { background: #fff; border: 1px solid var(--linje); border-radius: 8px; padding: 5px 6px 6px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.dk h4 { margin: 0; font-size: 12px; color: var(--grå); text-transform: uppercase; letter-spacing: .03em; }
.dk .pil { align-self: center; font-size: 11px; color: var(--grå); text-align: center; line-height: 1.2; font-family: var(--mono); }
.dk .pil span { display: block; font-size: 18px; color: #9aa59f; }
.dk .ingen { color: #9aa59f; font-size: 12px; font-style: italic; }
.bil, .ko, .vo { border: 1px solid var(--linje); border-radius: 6px; padding: 4px 6px; min-width: 0; background: #fbfdfc; }
.bil .bn, .ko .kn, .vo .vn { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bil .bn { font-weight: bold; }
.bil .bn span { font-weight: normal; color: var(--grå); }
.bil .bn em { font-style: normal; font-family: var(--font); font-size: 10.5px; background: var(--gron); color: #fff; border-radius: 8px; padding: 0 6px; margin-left: 5px; vertical-align: 1px; }
.bil .lagrad { display: flex; gap: 2px; margin: 3px 0 2px; }
.bil .lagrad i { flex: 1 1 0; max-width: 14px; height: 6px; background: #8ab4f8; border-radius: 1px; }
.bil .lagrad i:first-child { background: #1d63ed; }
.bil .bs, .ko .ks, .vo .vs { font-size: 11.5px; color: var(--grå); }
.ko { border-left: 4px solid #b9c2bd; }
.ko.pa { border-left-color: var(--gron); background: #f4fbf5; }
.ko.feil { border-left-color: #b3261e; background: #fff6f5; }
.ko.her { box-shadow: 0 0 0 2px #1d63ed; }
.ko .kn { display: flex; align-items: center; gap: 5px; }
.ko .kn b { overflow: hidden; text-overflow: ellipsis; }
.ko .ki { color: var(--grå); margin-left: auto; padding-left: 6px; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
.ko .prikk { width: 9px; height: 9px; border-radius: 50%; background: #b9c2bd; flex: none; }
.ko.pa .prikk { background: #2fb344; box-shadow: 0 0 0 3px rgba(47,179,68,.2); }
.ko.feil .prikk { background: #b3261e; }
.ko .kp { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.ko .port { font: 12px var(--mono); background: #fff; border: 1px solid #1d63ed; color: #0b3a8f; border-radius: 10px; padding: 1px 8px; cursor: pointer; }
.ko .port:hover:not(:disabled) { background: #1d63ed; color: #fff; }
.ko .port:disabled { border-color: #c3cbc6; color: #9aa59f; cursor: default; }
.ko .mo { font: 11.5px var(--mono); color: #5a4a00; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vo { background: #fffaf0; border-color: #ecd9a8; }
.dk .ny { animation: popp .6s ease-out; }
@keyframes popp { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
.nettlesar { margin: 0 10px 10px; border: 1px solid #c3cbc6; border-radius: 8px; overflow: hidden; background: #fff; }
.nettlesar .adr { display: flex; align-items: center; gap: 8px; background: #e9eeeb; padding: 4px 8px; font-size: 12px; }
.nettlesar .prikkar { color: #b9c2bd; font-size: 9px; letter-spacing: 1px; flex: none; }
.nettlesar .url { flex: 1; min-width: 0; background: #fff; border-radius: 10px; padding: 2px 10px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nettlesar .stat { background: #b3261e; color: #fff; border-radius: 8px; padding: 0 7px; font-weight: bold; }
.nettlesar button { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--grå); padding: 0 4px; }
.nettlesar iframe { display: block; width: 100%; height: 120px; border: 0; background: #fff; }
@media (max-width: 900px) { #sim { height: auto; min-height: 0; } #term { height: 56vh; flex: none; } #modell { max-height: none; } }
@media (max-width: 600px) {
    #term { font-size: 12.5px; padding: 4px 6px 10px; }
    .dk { grid-template-columns: 1fr; }

<script>
"use strict";
/* ================== KURSOPPSETT ================== */
const KURS = {
    namn: "Docker 101",
    prefiks: "kode101-docker-",
};

/* Hjelparar (funksjonsdeklarasjonar, så dei finst før LEKSJONAR blir laga) */
function htmlEsc(s) { return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }
function ex(kode) { return `<div class="eksempel"><pre>${htmlEsc(kode)}</pre></div>`; }
/* Døme som ikkje skal limast inn i terminalen (utskrift, filinnhald) – utan «Prøv»-knapp */
function exUtan(kode) { return `<div class="eksempel utan"><pre style="padding-right:12px">${htmlEsc(kode)}</pre></div>`; }

/* Hjelparar for oppgåvesjekk (les tilstanden til Docker på serveren) */
function koyrande() { return st.kont.filter(c => c.status === "running"); }
function lokaltBilete(repo, tag) { return st.bilete.find(b => b.repo === repo && (!tag || b.tag === tag)) || null; }

const LEKSJONAR = [
{ id: "l1", tittel: "Kva er ein container?", laerer: "kva ein container er, korleis han skil seg frå ei virtuell maskin, og korleis du køyrer den første containeren.",
  html: `
<p>«Det verkar på min maskin!» Program treng rett versjon av bibliotek, innstillingar og andre program for å køyre. Flyttar du programmet til ein annan server, manglar det ofte noko.</p>
<p>Ein <b>container</b> løyser dette: Programmet blir pakka saman med alt det treng, og køyrer isolert frå resten av maskina. Same pakke køyrer likt på PC-en din, på skuleserveren og i skya.</p>
<table class="juks">
<tr><td>image</td><td>ei ferdig pakke med program og filer – ei oppskrift som berre kan lesast</td></tr>
<tr><td>container</td><td>eit image som køyrer. Du kan starte mange containerar frå same image</td></tr>
<tr><td>Docker Hub</td><td>ein nettstad med tusenvis av ferdige image du kan laste ned</td></tr>
</table>
<p>Ei virtuell maskin (VM) har sitt eige operativsystem. Ein container <b>deler kjernen</b> med verten. Difor er containerar små og startar på under eitt sekund:</p>
<div class="vmfig">
  <div><h5>Virtuelle maskiner</h5>
    <div class="rad"><span class="app">App A</span><span class="app">App B</span><span class="app">App C</span></div>
    <div class="rad"><span class="gos">Gjeste-OS</span><span class="gos">Gjeste-OS</span><span class="gos">Gjeste-OS</span></div>
    <div class="lag hv">Hypervisor (Proxmox, Hyper-V)</div>
    <div class="lag mv">Maskinvare</div></div>
  <div><h5>Containerar</h5>
    <div class="rad"><span class="app">App A</span><span class="app">App B</span><span class="app">App C</span></div>
    <div class="lag dk">Docker</div>
    <div class="lag os">Eitt operativsystem (delt kjerne)</div>
    <div class="lag mv">Maskinvare</div></div>
</div>
<p>Til høgre er du logga inn på Linux-serveren <code>im-server</code>, der Docker er installert. Under terminalen ser du ei levande teikning av image, containerar og volum. Sjekk først at Docker svarar:</p>
${ex(`docker --version`)}
<p>Køyr så den første containeren. <code>docker run</code> lastar ned imaget om det manglar, lagar ein container og startar han:</p>
${ex(`docker run hello-world`)}
<p>Containeren skreiv ei helsing og avslutta. Han ligg der framleis, men er stoppa. <code>docker ps</code> viser containerar som køyrer, og <code>-a</code> tek med dei som er stoppa:</p>
${ex(`docker ps -a`)}
<div class="tips">💡 Trykk <b>Tab</b> for å fullføre kommandoar og namn, og <b>pil opp</b> for å hente førre kommando. <code>clear</code> tømer skjermen.</div>`,
  oppgaver: [
    { id: "l1o1", tekst: "Sjekk kva versjon av Docker som er installert.", hint: ["<code>docker --version</code>"],
      sjekk: c => !!st.flagg.versjon },
    { id: "l1o2", tekst: "Køyr ein container frå imaget <code>hello-world</code>.", hint: ["Kommandoen er <code>docker run</code> og namnet på imaget.", "<code>docker run hello-world</code>"],
      sjekk: c => !!st.flagg.hello },
    { id: "l1o3", tekst: "Vis alle containerar, også dei som er stoppa.", hint: ["<code>docker ps</code> viser berre dei som køyrer. Kva flagg tek med alle?", "<code>docker ps -a</code>"],
      sjekk: c => !!st.flagg.psA },
  ]},

{ id: "l2", tittel: "Image frå Docker Hub", laerer: "å laste ned image, sjå kva du har lokalt, og køyre ein kommando i ein container.",
  html: `
<p>Eit image er bygd opp av <b>lag</b>. Kvart lag er ei endring: først eit lite Linux-system, så programmet, så innstillingane. Når du lastar ned eit image, ser du at laga kjem eitt og eitt:</p>
${ex(`docker pull nginx`)}
<p><code>nginx</code> er ein webserver. Namnet kan ha ein <b>tag</b> etter kolon, som fortel kva versjon du vil ha. Utan tag får du <code>latest</code>. <code>nginx:alpine</code> er same webserver bygd på det vesle Linux-systemet Alpine:</p>
${ex(`docker pull nginx:alpine`)}
<p>Sjå kva image som ligg på serveren. Legg merke til skilnaden i storleik:</p>
${ex(`docker images`)}
<p>Du kan gi containeren ein kommando å køyre, rett etter namnet på imaget. Containeren startar, køyrer kommandoen og avsluttar:</p>
${ex(`docker run alpine echo "Hei frå ein container"`)}
${ex(`docker run alpine cat /etc/os-release`)}
<p>Den siste kommandoen viser at containeren er Alpine Linux, sjølv om serveren køyrer Ubuntu. Samanlikn med <code>cat /etc/os-release</code> på serveren.</p>
<div class="tips">💡 Ein container lever så lenge hovudprogrammet i han køyrer. <code>echo</code> er ferdig med ein gong, så containeren stoppar. Ein webserver køyrer til du stoppar han.</div>`,
  oppgaver: [
    { id: "l2o1", tekst: "Last ned imaget <code>nginx</code> frå Docker Hub.", hint: ["<code>docker pull nginx</code>"],
      sjekk: c => !!lokaltBilete("nginx") },
    { id: "l2o2", tekst: "Vis kva image som ligg på serveren.", hint: ["<code>docker images</code>"],
      sjekk: c => !!st.flagg.images },
    { id: "l2o3", tekst: "Køyr ein <code>alpine</code>-container som skriv ut ein tekst med <code>echo</code>.", hint: ["Kommandoen kjem etter namnet på imaget.", "<code>docker run alpine echo Hei</code>"],
      sjekk: c => !!st.flagg.ekko },
  ]},

{ id: "l3", tittel: "Køyr ein webserver", laerer: "å køyre ein container i bakgrunnen, gi han eit namn og opne ein port inn til han.",
  html: `
<p>Ein webserver skal køyre heile tida. Då treng du tre flagg:</p>
<table class="juks">
<tr><td>-d</td><td>køyr i bakgrunnen (<i>detached</i>), så du får terminalen tilbake</td></tr>
<tr><td>--name web</td><td>gi containeren eit namn du vel sjølv</td></tr>
<tr><td>-p 8080:80</td><td>send port 8080 på serveren vidare til port 80 i containeren</td></tr>
</table>
<p>Flagga må stå <b>før</b> namnet på imaget:</p>
${ex(`docker run -d --name web -p 8080:80 nginx`)}
<p>Containeren er isolert. Utan <code>-p</code> når ingen inn til webserveren. Rekkjefølgja er alltid <code>VERT:CONTAINER</code>. Sjå at containeren køyrer, og kva portar som er opne:</p>
${ex(`docker ps`)}
<p>Hent nettsida med <code>curl</code>. I teikninga kan du òg klikke på porten for å sjå sida slik ein nettlesar viser ho:</p>
${ex(`curl localhost:8080`)}
<p>Alt containeren skriv ut, hamnar i loggen. Der ser du kvar førespurnad til webserveren:</p>
${ex(`docker logs web`)}
<div class="tips">💡 To containerar kan ikkje bruke same port på serveren. Vil du ha to webserverar, kan den andre få <code>-p 8081:80</code>. Port 80 i containeren er den same.</div>`,
  oppgaver: [
    { id: "l3o1", tekst: "Start ein <code>nginx</code>-container i bakgrunnen. Han skal heite <code>web</code> og svare på port <code>8080</code> på serveren.", hint: ["Du treng <code>-d</code>, <code>--name web</code> og <code>-p 8080:80</code> før <code>nginx</code>.", "<code>docker run -d --name web -p 8080:80 nginx</code>"],
      sjekk: c => koyrande().some(k => k.namn === "web" && k.bilete.base === "nginx" && k.portar.some(p => p.vert === 8080 && p.kont === 80)) },
    { id: "l3o2", tekst: "Vis containerane som køyrer.", hint: ["<code>docker ps</code>"],
      sjekk: c => !!st.flagg.ps },
    { id: "l3o3", tekst: "Hent nettsida frå webserveren på port 8080.", hint: ["<code>curl localhost:8080</code> – eller klikk på porten i teikninga."],
      sjekk: c => !!st.flagg.web8080 },
    { id: "l3o4", tekst: "Sjå i loggen til <code>web</code>.", hint: ["<code>docker logs web</code>"],
      sjekk: c => !!st.flagg.logs },
  ]},

{ id: "l4", tittel: "Stopp, start og rydd", laerer: "å stoppe, starte og slette containerar, og kvifor du bør rydde.",
  html: `
<p>Denne leksjonen bruker containeren <code>web</code> frå leksjon 3. Manglar han, startar du han slik:</p>
${ex(`docker run -d --name web -p 8080:80 nginx`)}
<p>Stopp containeren. Han blir ikkje sletta, berre sett på pause med alt innhaldet sitt:</p>
${ex(`docker stop web`)}
<p>No svarar ikkje port 8080 lenger. Prøv <code>curl localhost:8080</code>. Start han igjen med same namn, portar og innstillingar:</p>
${ex(`docker start web`)}
<p>Stoppa containerar tek plass og held på namnet sitt. Prøver du å lage ein ny container som heiter <code>web</code>, får du ei feilmelding. Slett containeren når du er ferdig med han. Han må vere stoppa først, eller du kan tvinge det med <code>-f</code>:</p>
${ex(`docker rm -f web`)}
<p>Sjå etter gamle containerar som ligg att, og slett dei med namn eller ID. Du treng berre skrive dei første teikna i ID-en:</p>
${ex(`docker ps -a`)}
<table class="juks">
<tr><td>docker stop namn</td><td>stopp ein container</td></tr>
<tr><td>docker start namn</td><td>start ein stoppa container</td></tr>
<tr><td>docker restart namn</td><td>stopp og start</td></tr>
<tr><td>docker rm namn</td><td>slett ein stoppa container</td></tr>
<tr><td>docker rm -f namn</td><td>stopp og slett i eitt</td></tr>
<tr><td>docker container prune</td><td>slett alle stoppa containerar</td></tr>
</table>
<div class="tips">💡 Legg til <code>--rm</code> i <code>docker run</code> når du berre skal teste noko. Då slettar containeren seg sjølv når han stoppar.</div>`,
  oppgaver: [
    { id: "l4o1", tekst: "Stopp containeren <code>web</code>.", hint: ["<code>docker stop web</code>. Finst han ikkje, startar du han først med kommandoen øvst i leksjonen."],
      sjekk: c => !!st.flagg.stoppaWeb },
    { id: "l4o2", tekst: "Start <code>web</code> igjen.", hint: ["<code>docker start web</code>"],
      sjekk: c => !!st.flagg.startaWeb },
    { id: "l4o3", tekst: "Slett containeren <code>web</code>.", hint: ["Ein container som køyrer, må stoppast først – eller slettast med <code>-f</code>.", "<code>docker rm -f web</code>"],
      sjekk: c => !!st.flagg.rmWeb },
    { id: "l4o4", tekst: "Rydd: slett alle stoppa containerar, og sjekk med <code>docker ps -a</code> at ingen ligg att.", hint: ["<code>docker ps -a</code> viser dei. Slett kvar av dei med <code>docker rm</code> og namnet eller ID-en.", "Raskast: <code>docker container prune</code>, og så <code>docker ps -a</code>."],
      sjekk: c => !!st.flagg.ryddig },
  ]},

{ id: "l5", tittel: "Inn i containeren", laerer: "å opne eit skal inne i ein container, og kva som skjer med endringar når containeren blir sletta.",
  html: `
<p>Start ein webserver om du ikkje har ein som køyrer:</p>
${ex(`docker run -d --name web -p 8080:80 nginx`)}
<p><code>docker exec</code> køyrer ein kommando i ein container som alt køyrer. Med <code>-it</code> og <code>sh</code> får du eit skal på innsida:</p>
${ex(`docker exec -it web sh`)}
<p>Ledeteksten endrar seg til <code>#</code>. No er du <b>inne i containeren</b>, og han ser ut som ei eiga maskin med eige filsystem og eige namn. Prøv desse:</p>
${exUtan(`hostname
ls /
cat /etc/os-release
uname -r`)}
<p><code>uname -r</code> viser versjonen av Linux-kjernen. Han er den same inne i containeren som på serveren. Det er dette som er meint med at containerar deler kjerne med verten.</p>
<p>Nettsida til nginx ligg i <code>/usr/share/nginx/html</code>. Byt ho ut, og gå ut av containeren:</p>
${exUtan(`echo "<h1>Hei frå innsida</h1>" > /usr/share/nginx/html/index.html
exit`)}
<p>Hent sida på nytt med <code>curl localhost:8080</code>. Endringa verkar. Men ho ligg berre i <b>denne eine containeren</b>. Slett han og start ein ny frå same image:</p>
${ex(`docker rm -f web`)}
${ex(`docker run -d --name web -p 8080:80 nginx`)}
<p>No er standardsida tilbake. Imaget blir aldri endra. Kvar container får sitt eige skrivelag oppå imaget, og det laget forsvinn når containeren blir sletta.</p>
<div class="tips">💡 Image som nginx er strippa for alt som ikkje trengst. Difor finst ikkje <code>nano</code>, <code>ping</code> eller <code>ps</code> i containeren. Mindre innhald gir mindre å angripe.</div>`,
  oppgaver: [
    { id: "l5o1", tekst: "Opne eit skal inne i ein container som køyrer.", hint: ["Bruk <code>docker exec</code> med <code>-it</code>, namnet på containeren og <code>sh</code>.", "<code>docker exec -it web sh</code>"],
      sjekk: c => !!st.flagg.execSkal },
    { id: "l5o2", tekst: "Finn ut kva maskinnamn containeren har på innsida.", hint: ["Kommandoen heiter <code>hostname</code>. Du må køyre han inne i containeren."],
      sjekk: c => !!st.flagg.hostnameInne },
    { id: "l5o3", tekst: "Endre nettsida inne i nginx-containeren.", hint: ["Fila heiter <code>/usr/share/nginx/html/index.html</code>.", "Inne i containeren: <code>echo \"&lt;h1&gt;Hei&lt;/h1&gt;\" &gt; /usr/share/nginx/html/index.html</code>"],
      sjekk: c => !!st.flagg.endraInne },
    { id: "l5o4", tekst: "Slett containeren, start ein ny frå <code>nginx</code>, og hent sida. Endringa skal vere borte.", hint: ["Gå ut med <code>exit</code>. Så <code>docker rm -f web</code> og <code>docker run -d --name web -p 8080:80 nginx</code>.", "Hent sida med <code>curl localhost:8080</code>."],
      sjekk: c => !!st.flagg.borte },
  ]},

{ id: "l6", tittel: "Volum: data som overlever", laerer: "å lagre data utanfor containeren med volum og med mapper frå serveren.",
  html: `
<p>I leksjon 5 forsvann endringane då containeren blei sletta. Det er bra for program, men ikkje for data. Databasar, opplasta filer og innstillingar må liggje <b>utanfor</b> containeren.</p>
<p>Eit <b>volum</b> er eit lager som Docker styrer. Lag eit, og sjå at det dukkar opp i teikninga:</p>
${ex(`docker volume create webdata`)}
<p>Med <code>-v VOLUM:STI</code> blir volumet kopla inn som ei mappe i containeren. Rydd først vekk den gamle containeren:</p>
${ex(`docker rm -f web`)}
${ex(`docker run -d --name web -p 8080:80 -v webdata:/usr/share/nginx/html nginx`)}
<p>Endre nettsida utan å gå inn i containeren. <code>sh -c</code> køyrer heile teksten i hermeteikn på innsida:</p>
${ex(`docker exec web sh -c "echo '<h1>Lagra i volum</h1>' > /usr/share/nginx/html/index.html"`)}
<p>Slett containeren og start ein ny med same volum. No overlever sida:</p>
${ex(`docker rm -f web`)}
${ex(`docker run -d --name web -p 8080:80 -v webdata:/usr/share/nginx/html nginx`)}
${ex(`curl localhost:8080`)}
<h3>Mappe frå serveren</h3>
<p>Du kan òg kople inn ei vanleg mappe frå serveren. Då skriv du ein sti i staden for eit volumnamn. I heimemappa di ligg mappa <code>nettside</code> med ei <code>index.html</code>:</p>
${ex(`docker run -d --name side -p 8081:80 -v ~/nettside:/usr/share/nginx/html nginx`)}
<p>Endrar du fila på serveren med <code>nano ~/nettside/index.html</code>, endrar ho seg i containeren med ein gong.</p>
<table class="juks">
<tr><td>docker volume ls</td><td>vis alle volum</td></tr>
<tr><td>docker volume create namn</td><td>lag eit volum</td></tr>
<tr><td>docker volume rm namn</td><td>slett eit volum som ikkje er i bruk</td></tr>
</table>
<div class="tips">💡 Tommelfingerregel: Containeren skal kunne slettast når som helst. Alt du vil ta vare på, ligg i eit volum – og volumet tek du backup av.</div>`,
  oppgaver: [

<li><b>Lagring:</b> framdrift, filer, containerar og terminalhistorikk blir berre lagra i nettlesaren til eleven (localStorage). «Nullstill maskina» slettar containerar, image og volum, men ikkje framdrifta.</li>

/* ================== LAGRING ================== */
const lager = {
    hent(nokkel, standard) {
        try { const v = localStorage.getItem(KURS.prefiks + nokkel); return v === null ? standard : JSON.parse(v); }
        catch (e) { return standard; }
    },
    set(nokkel, verdi) { try { localStorage.setItem(KURS.prefiks + nokkel, JSON.stringify(verdi)); } catch (e) {} },
    slettAlle() {
        try {
            const ut = [];
            for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(KURS.prefiks)) ut.push(k); }
            ut.forEach(k => localStorage.removeItem(k));
        } catch (e) {}
    }
};

/* ================== TILSTAND ================== */
let loyste = new Set(lager.hent("loyste", []));
let besokt = new Set(lager.hent("besokt", []));
let hintNiva = lager.hent("hint", {});
let aktivIndeks = Math.min(Math.max(0, LEKSJONAR.findIndex(l => l.id === lager.hent("aktiv", LEKSJONAR[0].id))), LEKSJONAR.length - 1);
const ALLE_OPPGAVER = LEKSJONAR.flatMap(l => l.oppgaver.map(o => ({ ...o, leksjon: l })));

function lagreTilstand() {
    lager.set("loyste", [...loyste]);
    lager.set("besokt", [...besokt]);
    lager.set("hint", hintNiva);
    lager.set("aktiv", LEKSJONAR[aktivIndeks].id);
}

function leksjonStatus(l) {
    const n = l.oppgaver.length, ok = l.oppgaver.filter(o => loyste.has(o.id)).length;
    if (n === 0) return besokt.has(l.id) ? "ferdig" : "ny";
    if (ok === n) return "ferdig";
    if (ok > 0 || besokt.has(l.id)) return "igang";
    return "ny";
}
const STATUSIKON = { ny: '<span class="sirkel"></span>', igang: '<span class="sirkel halv"></span>', ferdig: "✔" };

/* ================== VISING ================== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function oppdaterFramdrift() {
    const n = ALLE_OPPGAVER.length, ok = ALLE_OPPGAVER.filter(o => loyste.has(o.id)).length;
    document.getElementById("framdriftTekst").textContent = `${ok} / ${n} oppgåver`;
    document.getElementById("framdriftLinje").style.width = (n ? 100 * ok / n : 0) + "%";
}

function teiknListe() {
    const ol = document.getElementById("leksjonsliste");
    ol.innerHTML = "";
    LEKSJONAR.forEach((l, i) => {
        const st = leksjonStatus(l);
        const ok = l.oppgaver.filter(o => loyste.has(o.id)).length;
        const li = document.createElement("li");
        li.className = (i === aktivIndeks ? "aktiv " : "") + st;
        li.innerHTML = `<button type="button"><span class="status" title="${st === "ferdig" ? "Ferdig" : st === "igang" ? "I gang" : "Ikkje starta"}">${STATUSIKON[st]}</span><span class="nr">${i + 1}.</span><span>${esc(l.tittel)}</span>${l.oppgaver.length ? `<span class="tal">${ok}/${l.oppgaver.length}</span>` : ""}</button>`;
        li.querySelector("button").onclick = () => visLeksjon(i);
        ol.appendChild(li);
    });
    oppdaterFramdrift();
}

function visLeksjon(i, rull = true) {
    aktivIndeks = i;
    const l = LEKSJONAR[i];
    besokt.add(l.id);
    lagreTilstand();
    const el = document.getElementById("leksjon");
    el.innerHTML = `
        <h2>${i + 1}. ${esc(l.tittel)}</h2>
        <p class="laerer"><b>Dette lærer du:</b> ${l.laerer}</p>
        <div class="forklaring">${l.html}</div>
        ${l.oppgaver.length ? `<h3>Oppgåver</h3><ul class="oppgaver"></ul>` : ""}
        <div class="fullfortplass"></div>
        <div class="navknappar">
            <button type="button" class="forre" ${i === 0 ? "disabled" : ""}>◀ Førre</button>
            <button type="button" class="neste" ${i === LEKSJONAR.length - 1 ? "disabled" : ""}>Neste ▶</button>
        </div>
        <details class="laerar"><summary>For læraren</summary>${LAERAR_HTML}</details>`;
    el.querySelectorAll(".eksempel:not(.utan)").forEach(ex => {
        const pre = ex.querySelector("pre");
        const b = document.createElement("button");
        b.type = "button"; b.className = "prov"; b.textContent = "Prøv";
        b.title = "Lim inn koden (du køyrer sjølv)";
        b.onclick = () => { if (typeof simLim === "function") simLim(pre.dataset.kode ?? pre.textContent); };
        ex.appendChild(b);
    });
    const ul = el.querySelector(".oppgaver");
    if (ul) l.oppgaver.forEach(o => ul.appendChild(lagOppgaveEl(o)));
    el.querySelector(".forre").onclick = () => visLeksjon(i - 1);
    el.querySelector(".neste").onclick = () => visLeksjon(i + 1);
    teiknFullfort();
    teiknListe();
    if (rull) document.getElementById("leksjonspanel").scrollTop = 0;
    if (typeof simByttLeksjon === "function") simByttLeksjon(l);   // valfri krok (t.d. startkode i editoren)
}

function lagOppgaveEl(o) {
    const li = document.createElement("li");
    li.className = "oppgave" + (loyste.has(o.id) ? " loyst" : "");
    li.dataset.id = o.id;
    li.innerHTML = `<span class="ikon">${loyste.has(o.id) ? "✔" : "○"}</span><span class="tekst">${o.tekst}</span>` +
        (o.hint && o.hint.length ? `<button type="button" class="hintknapp">Hint</button>` : "<span></span>");
    const vis = () => {
        li.querySelectorAll(".hint").forEach(h => h.remove());
        const n = hintNiva[o.id] || 0;
        for (let k = 0; k < n; k++) {
            const d = document.createElement("div");
            d.className = "hint"; d.innerHTML = "💡 " + o.hint[k];
            li.appendChild(d);
        }
        const b = li.querySelector(".hintknapp");
        if (b) { b.textContent = n === 0 ? "Hint" : n < o.hint.length ? "Meir hjelp" : "Hint"; b.disabled = n >= o.hint.length; b.style.opacity = n >= o.hint.length ? .4 : 1; }
    };
    const b = li.querySelector(".hintknapp");
    if (b) b.onclick = () => { hintNiva[o.id] = Math.min((hintNiva[o.id] || 0) + 1, o.hint.length); lagreTilstand(); vis(); };
    vis();
    return li;
}

function teiknFullfort() {
    const l = LEKSJONAR[aktivIndeks];
    const plass = document.querySelector("#leksjon .fullfortplass");
    if (!plass) return;
    plass.innerHTML = "";
    if (l.oppgaver.length && leksjonStatus(l) === "ferdig") {
        const d = document.createElement("div");
        d.className = "fullfort";
        d.innerHTML = `<span>✔ Leksjon fullført!</span>` + (aktivIndeks < LEKSJONAR.length - 1 ? `<button type="button">Neste leksjon ▶</button>` : "");
        const b = d.querySelector("button");
        if (b) b.onclick = () => visLeksjon(aktivIndeks + 1);
        plass.appendChild(d);
    }
}

let toastTid = null;
function toast(tekst) {
    const t = document.getElementById("toast");
    t.textContent = tekst; t.classList.add("vis");
    clearTimeout(toastTid); toastTid = setTimeout(() => t.classList.remove("vis"), 3200);
}

/* ================== OPPGÅVESJEKK ================== */
/* Kall etter KVAR kommando/køyring. Sjekkar alle oppgåver i alle leksjonar. */
function sjekkOppgaver(ctx) {
    const nye = [];
    for (const o of ALLE_OPPGAVER) {
        if (loyste.has(o.id)) continue;
        let ok = false;
        try { ok = !!o.sjekk(ctx); } catch (e) { ok = false; }
        if (ok) { loyste.add(o.id); nye.push(o); }
    }
    if (!nye.length) return nye;
    lagreTilstand();
    const aktiv = LEKSJONAR[aktivIndeks];
    for (const o of nye) {
        const li = document.querySelector(`#leksjon .oppgave[data-id="${o.id}"]`);
        if (li) {
            li.classList.add("loyst");
            li.querySelector(".ikon").textContent = "✔";
            const bra = document.createElement("div");
            bra.className = "bra"; bra.textContent = "✔ Bra!";
            li.appendChild(bra);
            setTimeout(() => bra.remove(), 2700);
        }
    }
    const andre = nye.filter(o => o.leksjon !== aktiv);
    if (andre.length) {
        const o = andre[0];
        toast(`✔ Bra! Du løyste ei oppgåve i leksjon ${LEKSJONAR.indexOf(o.leksjon) + 1}: ${o.leksjon.tittel}`);
    }
    teiknFullfort();
    teiknListe();
    return nye;
}

/* ================== KURSBEVIS ================== */
function datoTekst(d = new Date()) {
    return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + d.getFullYear();
}
function hentNamn() { try { return localStorage.getItem("kode101-namn") || ""; } catch (e) { return ""; } }
function teiknBevis() {
    const namn = document.getElementById("bevisNamn").value.trim();
    const n = ALLE_OPPGAVER.length, ok = ALLE_OPPGAVER.filter(o => loyste.has(o.id)).length;
    const alt = ok === n;
    const leks = LEKSJONAR.filter(l => l.oppgaver.length);
    const manglar = leks.filter(l => leksjonStatus(l) !== "ferdig");

/* =====================================================================
   TOLKING AV KOMMANDOLINJA
   ===================================================================== */
function avstand(a, b) {
    a = a.toLowerCase(); b = b.toLowerCase();
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
}
function naermast(ord, liste) {
    let best = null, bd = Infinity;
    for (const x of liste) { const d = avstand(ord, x); if (d < bd) { bd = d; best = x; } }
    return best && bd > 0 && bd <= Math.max(1, Math.floor(ord.length / 3)) ? best : null;
}

/* Del opp ei linje i kommandoar (&&, ;) og ord, med hermeteikn og omdirigering */
function tolk(linje) {
    const kmd = [];
    let ord = [], cur = "", harCur = false, q = null, omd = null, kopling = null;
    const fullfor = () => { if (harCur) { if (omd && omd.fil === undefined) omd.fil = cur; else ord.push(cur); } cur = ""; harCur = false; };
    const avslutt = op => { fullfor(); if (ord.length || omd) kmd.push({ ord, omd, kopling }); ord = []; omd = null; kopling = op; };
    for (let i = 0; i < linje.length; i++) {
        const c = linje[i];
        if (q) { if (c === q) q = null; else cur += c; continue; }
        if (c === '"' || c === "'") { q = c; harCur = true; continue; }
        if (c === "\\" && i + 1 < linje.length && linje[i + 1] !== "\\") { cur += linje[++i]; harCur = true; continue; }
        if (/\s/.test(c)) { fullfor(); continue; }
        if (c === "&" && linje[i + 1] === "&") { avslutt("&&"); i++; continue; }
        if (c === ";") { avslutt(";"); continue; }
        if (c === "|" && linje[i + 1] === "|") { avslutt("||"); i++; continue; }
        if (c === ">") { fullfor(); const leggTil = linje[i + 1] === ">"; if (leggTil) i++; omd = { leggTil }; continue; }
        cur += c; harCur = true;
    }
    if (q) return { feil: "hermeteikn" };
    avslutt(null);
    return { kmd };
}

inn.addEventListener("input", () => {

    if (tabT && tabT.resultat !== inn.value) tabT = null;
    teikn();
});
inn.addEventListener("paste", e => {
    const t = (e.clipboardData || window.clipboardData)?.getData("text");
    if (t == null) return;
    e.preventDefault();
    const d = t.replace(/\r/g, "").split("\n");
    settInnTekst(d[0]);
    if (d.length > 1) { sendInn(); for (const l of d.slice(1).filter(x => x.trim())) { inn.value = l; sendInn(); } }
});
["select", "keyup", "click"].forEach(ev => inn.addEventListener(ev, () => teikn()));
inn.addEventListener("focus", () => { termEl.classList.remove("ufokus"); teikn(); });
inn.addEventListener("blur", () => termEl.classList.add("ufokus"));
function fokuserTerm() { try { inn.focus({ preventScroll: true }); } catch (e) { inn.focus(); } }
termEl.addEventListener("click", () => { if (!String(window.getSelection ? window.getSelection() : "")) fokuserTerm(); });
document.querySelectorAll(".mobilrad button").forEach(b => {
    b.addEventListener("pointerdown", e => e.preventDefault());
    b.addEventListener("click", () => {
        fokuserTerm();
        if (b.dataset.tekst) { settInnTekst(b.dataset.tekst); return; }
        const t = b.dataset.tast;
        if (t === "Tab") fullfor(false); else if (t === "ArrowUp") historikkSteg(-1); else if (t === "ArrowDown") historikkSteg(1);
        else if (t === "CtrlL") { tomSkjerm(); visPrompt(); }
    });
});
/* Malen kallar simLim når eleven trykkjer «Prøv» */
function simLim(tekst) {
    const t = tekst.replace(/\r/g, "").trim().split("\n").map(s => s.trim()).filter(Boolean).join(" && ");
    inn.value = t; inn.setSelectionRange(t.length, t.length);
    fokuserTerm(); teikn();
    if (st.skal && /^(docker|cd ~|nano|curl)\b/.test(t)) toast("Du er inne i ein container. Skriv exit først for å kome tilbake til serveren.");
}

/* =====================================================================
   EDITOR (nano)
   ===================================================================== */
const editorBak = document.getElementById("editorBak"), editorTekst = document.getElementById("editorTekst");
function opneEditor(p) {
    editorOpen = p;
    document.getElementById("editorNamn").textContent = "nano – " + visSti(p);
    editorTekst.value = vertVis.erFil(p) ? vertVis.les(p) : "";
    editorBak.classList.add("vis");
    setTimeout(() => { editorTekst.focus(); editorTekst.setSelectionRange(0, 0); editorTekst.scrollTop = 0; }, 30);
}
function lukkEditor(lagre) {
    const p = editorOpen;
    if (!p) return;
    if (lagre) {
        let t = editorTekst.value.replace(/\r/g, "");
        if (t && !t.endsWith("\n")) t += "\n";
        vertVis.skriv(p, t);
        leggTil("💡 " + `Lagra ${kd(visSti(p))}.` + (namnAv(p) === "Dockerfile" ? ` Bygg imaget med ${kd("docker build -t minside .")}` : /^dockerfile/i.test(namnAv(p)) ? ` Obs: Docker leitar etter ${kd("Dockerfile")} – med stor D og utan filending.` : ""), "hjelp");
    }
    editorOpen = null;
    editorBak.classList.remove("vis");
    visPrompt();
    etterKommando({ st, linje: "", editor: true });
    fokuserTerm();
}
document.getElementById("editorLagre").onclick = () => lukkEditor(true);
document.getElementById("editorAvbryt").onclick = () => lukkEditor(false);
editorTekst.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); lukkEditor(true); }
    else if (e.ctrlKey && e.key.toLowerCase() === "x") { e.preventDefault(); lukkEditor(true); }
    else if (e.key === "Escape") { e.preventDefault(); lukkEditor(false); }
    else if (e.key === "Tab") { e.preventDefault(); const a = editorTekst.selectionStart; editorTekst.setRangeText("    ", a, editorTekst.selectionEnd, "end"); }
});

/* =====================================================================
   LEVANDE TEIKNING AV DOCKER PÅ SERVEREN
   ===================================================================== */
const modellEl = document.getElementById("modell");
let kjende = null;
function kortNamn(n) { return /^[0-9a-f]{64}$/.test(n) ? n.slice(0, 12) + "…" : n; }
function teiknModell() {
    const ny = id => (kjende && !kjende.has(id) ? " ny" : "");
    const idar = new Set();
    const bil = st.bilete.slice().reverse().map(b => {
        const id = "b:" + b.id + b.repo + b.tag; idar.add(id);
        return `<div class="bil${ny(id)}" title="Image ${E(b.repo)}:${E(b.tag)} – ${b.lag} lag, ${E(b.str)}"><div class="bn">${E(b.repo)}<span>:${E(b.tag)}</span>${b.bygd ? "<em>eige</em>" : ""}</div><div class="lagrad">${"<i></i>".repeat(Math.min(b.lag, 14))}</div><div class="bs">${b.lag} lag · ${E(b.str)}</div></div>`;
    }).join("");
    const kont = st.kont.slice().reverse().map(c => {
        const id = "c:" + c.id; idar.add(id);
        const kl = c.status === "running" ? "pa" : c.status === "exited" && c.kode ? "feil" : "av";
        const status = c.status === "running" ? "køyrer" : c.status === "exited" ? `stoppa (kode ${c.kode})` : "laga, ikkje starta";
        const portar = c.portar.map(p => `<button type="button" class="port" data-port="${p.vert}"${c.status === "running" ? "" : " disabled"} title="Opne http://localhost:${p.vert} i nettlesaren">:${p.vert} → ${p.kont}</button>`).join("");
        const mont = c.mont.map(m => `<div class="mo" title="${E(m.src)} → ${E(m.dst)}">${m.type === "volume" ? "🗄️ " + E(kortNamn(m.src)) : "📁 " + E(visSti(m.src))} → ${E(m.dst)}</div>`).join("");
        const her = st.skal && st.skal.id === c.id;
        return `<div class="ko ${kl}${her ? " her" : ""}${ny(id)}"><div class="kn"><span class="prikk"></span><b>${E(c.namn)}</b><span class="ki">${E(c.bref)}</span></div><div class="ks">${status}${c.prosjekt ? ` · compose: ${E(c.prosjekt)}` : ""}${her ? " · <b>du er her inne</b>" : ""}</div>${portar ? `<div class="kp">${portar}</div>` : ""}${mont}</div>`;
    }).join("");
    const vol = Object.entries(st.volum).map(([n, v]) => {
        const id = "v:" + n; idar.add(id);
        const br = st.kont.filter(c => c.mont.some(m => m.type === "volume" && m.src === n)).map(c => c.namn);
        const tal = Object.keys(v.filer).length;
        return `<div class="vo${ny(id)}" title="Volum ${E(n)}"><div class="vn">🗄️ ${E(kortNamn(n))}</div><div class="vs">${tal} ${tal === 1 ? "fil" : "filer"} · ${br.length ? "kopla til " + br.map(E).join(", ") : "ikkje i bruk"}</div></div>`;
    }).join("");
    const k = koyrande().length;
    let html = `<div class="mtopp"><b>Docker på ${VERT}</b><span class="repo">${st.bilete.length} image · ${st.kont.length} ${st.kont.length === 1 ? "container" : "containerar"}${st.kont.length ? ` (${k} køyrer)` : ""} · ${Object.keys(st.volum).length} volum</span></div>`;
    if (!st.bilete.length && !st.kont.length && !Object.keys(st.volum).length) html += `<div class="tom">Her er det tomt enno. Køyr <code>docker run hello-world</code>, så dukkar imaget og containeren opp her.</div>`;
    else html += `<div class="dk">
        <div class="kol"><h4>Image</h4>${bil || '<div class="ingen">Ingen image</div>'}</div>
        <div class="pil">run<span>→</span></div>
        <div class="kol"><h4>Containerar</h4>${kont || '<div class="ingen">Ingen containerar</div>'}</div>
        <div class="pil">-v<span>↔</span></div>
        <div class="kol"><h4>Volum</h4>${vol || '<div class="ingen">Ingen volum</div>'}</div>
    </div>`;
    if (st.side) html += `<div class="nettlesar"><div class="adr"><span class="prikkar">● ● ●</span><span class="url">http://localhost:${st.side.port}${E(st.side.sti)}</span>${st.side.status !== 200 ? `<span class="stat">${st.side.status}</span>` : ""}<button type="button" id="sideLukk" title="Lukk nettlesaren">✕</button></div><iframe sandbox="" title="Nettsida slik ein nettlesar viser ho" srcdoc="${E(st.side.html)}"></iframe></div>`;
    modellEl.innerHTML = html;
    kjende = idar;
}
modellEl.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.id === "sideLukk") { st.side = null; lagreAlt(); teiknModell(); return; }
    if (b.classList.contains("port")) {
        const port = +b.dataset.port, r = hent(port, "/");
        if (r.feil === 7) toast(`Ingenting svarar på port ${port}.`);
        else if (r.feil === 56) toast(r.c.lyttar ? `Port ${port} går til port ${r.pm.kont} i containeren, men programmet lyttar på port ${r.h.port}.` : `Det køyrer ingen webserver i ${r.c.namn}.`);
        else if (r.feil === 52) toast(`${r.c.namn} er ikkje ein webserver, så det er inga nettside å vise. Men porten er open.`);
        else st.side = { port, sti: "/", html: r.kropp, status: r.status };
        etterKommando({ st, linje: "" });
    }
});

/* =====================================================================
   NULLSTILL MASKINA
   ===================================================================== */
document.getElementById("knappMaskin").onclick = () => {
    if (!confirm("Vil du setje serveren tilbake til start? Alle containerar, image, volum og filer blir borte. Framdrifta i kurset blir ikkje sletta.")) return;
    nyTilstand(); kjende = new Set(); tomSkjerm();
    leggTil("💡 Serveren er nullstilt. Docker er tom, og mappene <code>nettside</code> og <code>blogg</code> er som nye.", "hjelp");
    visPrompt(); etterKommando({ st, linje: "" }); fokuserTerm();
};

/* =====================================================================
   OPPSTART
   ===================================================================== */
(function start() {
    const lagra = lager.hent("maskin", null);
    if (lagra && lagra.v === 1 && lagra.fs && Array.isArray(lagra.kont) && lagra.volum && lagra.nett) st = lagra;
    else nyTilstand();
    for (const h of skjerm) { const d = document.createElement("div"); d.innerHTML = h; termUt.appendChild(d.childElementCount === 1 && d.firstElementChild.className === "hjelp" ? d.firstElementChild : d); }
    if (!skjerm.length) {
        leggTil(`💡 Velkomen til ${kd(VERT)}! Dette er ein trygg simulator av ein Linux-server med Docker – du kan ikkje øydeleggje noko. Skriv ${kd("docker --version")} og trykk Enter.`, "hjelp");
    }
    teiknModell();
    kjende = kjende || new Set();
    visLeksjon(aktivIndeks, false);
    visPrompt();
})();
</script>
