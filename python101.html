<!--
  Kode 101 – Python 101. Bygd på den felles malen for «Kode 101».
  Ekte Python 3.14 i nettlesaren via Pyodide 314.0.7 (JSPI for input() og ■ Stopp).
-->
<style>
:root {
    --gron: #2e7d32;
    --gron-mork: #1b5e20;
    --gron-lys: #e8f5e9;
    --bg: #eef3ef;
    --kort: #ffffff;
    --tekst: #24302a;
    --grå: #5f6b64;
    --linje: #dfe6e1;
    --lenke: #0066cc;
    --gul: #fff6d6;
    --gul-kant: #e8c547;
    --kode-bg: #f4f6f5;
    --font: system-ui, "Segoe UI", Arial, sans-serif;
    --mono: Consolas, "Cascadia Mono", "Cascadia Code", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--tekst); font-family: var(--font); font-size: 15px; display: flex; flex-direction: column; }

/* ---------- Grøn tittellinje ---------- */
header.topp { background: var(--gron); color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; border-bottom: 3px solid var(--gron-mork); }
header.topp .tilbake { color: #fff; text-decoration: none; font-size: 14px; padding: 4px 10px; border: 1px solid rgba(255,255,255,.5); border-radius: 14px; white-space: nowrap; }
header.topp .tilbake:hover { background: var(--gron-mork); }
header.topp .titlar { flex: 1 1 260px; min-width: 0; }
header.topp h1 { margin: 0; font-size: 21px; line-height: 1.2; }
header.topp .under { margin: 2px 0 0; font-size: 13px; opacity: .9; }
header.topp .hogre { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.framdrift { font-size: 13px; min-width: 130px; }
.framdrift .linje { height: 6px; background: rgba(255,255,255,.3); border-radius: 3px; margin-top: 4px; overflow: hidden; }
.framdrift .linje div { height: 100%; width: 0; background: #fff; transition: width .4s; }
header.topp button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6); border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
header.topp button:hover { background: var(--gron-mork); }

/* ---------- To kolonnar ---------- */
main.oppsett { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(320px, 40%) 1fr; gap: 14px; padding: 14px; }
.kort { background: var(--kort); border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
#leksjonspanel { overflow-y: auto; min-height: 0; padding: 0; display: flex; flex-direction: column; }
#sim { min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
@media (max-width: 900px) {
    body { height: auto; display: block; }
    main.oppsett { display: flex; flex-direction: column; padding: 10px; }
    #leksjonspanel { overflow: visible; }
    #sim { height: 78vh; min-height: 460px; }
}

/* ---------- Leksjonsliste ---------- */
#leksjonsliste { list-style: none; margin: 0; padding: 8px; border-bottom: 1px solid var(--linje); display: flex; flex-direction: column; gap: 2px; }
#leksjonsliste li button { width: 100%; text-align: left; background: none; border: none; font: inherit; font-size: 14px; padding: 5px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; color: var(--tekst); }
#leksjonsliste li button:hover { background: var(--gron-lys); }
#leksjonsliste li.aktiv button { background: var(--gron); color: #fff; }
#leksjonsliste .status { width: 1.2em; text-align: center; flex: none; }
#leksjonsliste .sirkel { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; vertical-align: -1px; opacity: .75; }
#leksjonsliste .sirkel.halv { background: linear-gradient(90deg, currentColor 50%, transparent 50%); opacity: 1; }
@media (max-width: 600px) { #leksjon .eksempel pre { padding-right: 12px; padding-top: 34px; } }
#leksjonsliste .nr { color: var(--grå); width: 1.6em; flex: none; }
#leksjonsliste li.aktiv .nr { color: #dfeee0; }
#leksjonsliste .tal { margin-left: auto; font-size: 12px; color: var(--grå); }
#leksjonsliste li.aktiv .tal { color: #dfeee0; }
#leksjonsliste .ferdig .status { color: var(--gron); }
#leksjonsliste li.aktiv.ferdig .status { color: #fff; }

/* ---------- Leksjonsinnhald ---------- */
#leksjon { padding: 14px 18px 18px; line-height: 1.5; }
#leksjon h2 { font-size: 20px; margin: 0 0 4px; padding-bottom: 6px; border-bottom: 2px solid var(--gron); }
#leksjon .laerer { color: var(--grå); font-size: 14px; margin: 6px 0 12px; }
#leksjon .laerer b { color: var(--gron-mork); }
#leksjon p { margin: 8px 0; }
#leksjon code { font-family: var(--mono); background: var(--kode-bg); padding: 1px 4px; border-radius: 3px; font-size: 13.5px; }
#leksjon h3 { font-size: 15px; margin: 18px 0 6px; color: var(--gron-mork); }
.eksempel { position: relative; margin: 8px 0 12px; }
.eksempel pre { margin: 0; background: #1e1e1e; color: #e6e6e6; font-family: var(--mono); font-size: 13.5px; padding: 10px 12px; padding-right: 70px; border-radius: 6px; overflow-x: auto; line-height: 1.4; }
.eksempel .prov { position: absolute; top: 6px; right: 6px; background: var(--gron); color: #fff; border: none; border-radius: 4px; padding: 3px 9px; font: inherit; font-size: 12.5px; cursor: pointer; }
.eksempel .prov:hover { background: var(--gron-mork); }
.tips { background: var(--gul); border-left: 4px solid var(--gul-kant); padding: 8px 12px; border-radius: 4px; margin: 10px 0; }
table.juks { border-collapse: collapse; width: 100%; font-size: 13.5px; margin: 8px 0; }
table.juks td, table.juks th { border-bottom: 1px solid var(--linje); padding: 4px 6px; text-align: left; vertical-align: top; }
table.juks td:first-child { font-family: var(--mono); white-space: nowrap; }

/* ---------- Oppgåver ---------- */
.oppgaver { list-style: none; padding: 0; margin: 6px 0; display: flex; flex-direction: column; gap: 8px; }
.oppgave { border: 1px solid var(--linje); border-radius: 8px; padding: 9px 12px; display: grid; grid-template-columns: 1.4em 1fr auto; gap: 4px 8px; align-items: start; transition: background .4s, border-color .4s; }
.oppgave .ikon { font-size: 16px; line-height: 1.4; color: #9aa59f; }
.oppgave.loyst { background: var(--gron-lys); border-color: #a5d6a7; }
.oppgave.loyst .ikon { color: var(--gron); }
.oppgave .hintknapp { background: #fff; border: 1px solid var(--linje); border-radius: 5px; padding: 2px 9px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--grå); }
.oppgave .hintknapp:hover { border-color: var(--gron); color: var(--gron-mork); }
.oppgave .hint { grid-column: 2 / 4; font-size: 13.5px; background: var(--gul); border-radius: 5px; padding: 5px 9px; }
.oppgave .bra { grid-column: 2 / 4; color: var(--gron-mork); font-weight: bold; font-size: 14px; animation: bra 2.6s forwards; }
@keyframes bra { 0% { opacity: 0; } 10% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
.fullfort { background: var(--gron); color: #fff; border-radius: 8px; padding: 10px 14px; margin: 14px 0 6px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.fullfort button { background: #fff; color: var(--gron-mork); border: none; border-radius: 5px; padding: 5px 12px; font: inherit; font-weight: bold; cursor: pointer; }
.navknappar { display: flex; justify-content: space-between; margin: 18px 0 8px; }
.navknappar button { background: #fff; border: 1px solid var(--gron); color: var(--gron-mork); border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer; }
.navknappar button:hover:not(:disabled) { background: var(--gron); color: #fff; }
.navknappar button:disabled { opacity: .35; cursor: default; }
details.laerar { margin: 16px 0 0; border: 1px solid var(--linje); border-radius: 8px; padding: 8px 12px; font-size: 14px; background: #fafcfb; }
details.laerar summary { cursor: pointer; font-weight: bold; color: var(--grå); }
details.laerar ul { padding-left: 20px; margin: 6px 0; }

/* ---------- Toast ---------- */
#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); background: var(--gron-mork); color: #fff; padding: 9px 16px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; z-index: 50; max-width: 90vw; font-size: 14px; }
#toast.vis { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- Kursbevis ---------- */
#bevisbakgrunn { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
#bevisbakgrunn.vis { display: flex; }
#bevisboks { background: #fff; border-radius: 10px; max-width: 640px; width: 100%; max-height: 92vh; overflow-y: auto; padding: 18px; }
.namnrad { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; font-size: 14px; }
.namnrad input { flex: 1; min-width: 160px; padding: 7px 10px; font: inherit; border: 1px solid #bbb; border-radius: 6px; }
#bevis { border: 3px solid var(--gron); border-radius: 6px; padding: 0 22px 18px; position: relative; text-align: center; }
#bevis .stripe { height: 14px; background: var(--gron); margin: 0 -22px 16px; }
#bevis h2 { margin: 6px 0 2px; font-size: 26px; color: var(--gron-mork); letter-spacing: .02em; }
#bevis .bnamn { font-size: 24px; margin: 14px 0 2px; font-family: Georgia, serif; border-bottom: 1px solid #999; display: inline-block; min-width: 60%; padding: 0 10px 2px; }
#bevis .skule { color: var(--grå); font-size: 14px; }
#bevis ul { list-style: none; padding: 0; text-align: left; margin: 14px auto 6px; max-width: 420px; font-size: 14px; }
#bevis ul li { padding: 2px 0; }
#bevis .sum { font-weight: bold; margin-top: 8px; }
#bevis .segl { position: absolute; right: 14px; top: 26px; width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe680, #d4a017 60%, #a87900); color: #5a3d00; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; box-shadow: 0 0 0 4px #f3d36b, 0 2px 6px rgba(0,0,0,.3); transform: rotate(-12deg); }
#bevis .delvis { position: absolute; right: 14px; top: 30px; border: 2px dashed var(--grå); color: var(--grå); border-radius: 6px; padding: 4px 8px; font-size: 13px; transform: rotate(-8deg); }
#bevis .manglar { font-size: 13px; color: var(--grå); }
.bevisknappar { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.bevisknappar button { padding: 7px 14px; font: inherit; border-radius: 6px; border: 1px solid var(--gron); background: #fff; color: var(--gron-mork); cursor: pointer; }
.bevisknappar button.hoved { background: var(--gron); color: #fff; }
@media print {
    body * { visibility: hidden !important; }
    #bevis, #bevis * { visibility: visible !important; }
    #bevisbakgrunn { position: static; background: none; display: block; padding: 0; }
    #bevisboks { box-shadow: none; max-height: none; overflow: visible; padding: 0; }
    #bevis { position: absolute; left: 0; top: 0; width: 100%; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* ---------- Felles 💡-hjelpetekst (bruk i simulatoren) ---------- */
.hjelp { color: #ffe9a8; font-family: var(--font); font-size: 14px; background: rgba(255, 214, 90, .08); border-left: 3px solid #f2c94c; padding: 4px 10px; margin: 4px 0 6px; white-space: pre-wrap; border-radius: 0 4px 4px 0; }

/* ---------- Python: simulator-CSS ---------- */
#sim { background: #212121; color: #ddd; }
.vtittel { display: flex; align-items: center; gap: 10px; background: #2d2d2d; color: #cfcfcf; font-size: 13px; padding: 7px 12px; border-bottom: 1px solid #151515; border-radius: 8px 8px 0 0; min-width: 0; }
.vtittel .pylogo { width: 16px; height: 16px; flex: none; }
.vtittel .fil { font-family: var(--mono); color: #eee; }
.vtittel .ver { color: #8d8d8d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#pyStatus { margin-left: auto; font-size: 12.5px; color: #b0b0b0; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
#pyStatus::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #f2c94c; flex: none; animation: puls 1.2s infinite; }
#pyStatus.klar::before { background: #66bb6a; animation: none; }
#pyStatus.koyrer::before { background: #42a5f5; }
#pyStatus.ventar::before { background: #a5d6a7; }
#pyStatus.feil::before { background: #ef5350; animation: none; }
@keyframes puls { 50% { opacity: .3; } }
.verktoy { display: flex; gap: 8px; padding: 8px 10px; background: #262626; border-bottom: 1px solid #151515; flex-wrap: wrap; align-items: center; }
.verktoy button { font: inherit; font-size: 13.5px; border-radius: 6px; padding: 6px 12px; cursor: pointer; border: 1px solid #474747; background: #333; color: #e6e6e6; white-space: nowrap; }
.verktoy button:hover:not(:disabled) { background: #3f3f3f; }
.verktoy button:disabled { opacity: .45; cursor: default; }
.verktoy button.koyr { background: var(--gron); border-color: var(--gron-mork); color: #fff; font-weight: 600; }
.verktoy button.koyr:hover:not(:disabled) { background: #388e3c; }
.verktoy button.stopp:not(:disabled) { background: #c62828; border-color: #8e0000; color: #fff; font-weight: 600; }
.verktoy button.stopp:hover:not(:disabled) { background: #d32f2f; }
.verktoy .tastatur { margin-left: auto; font-size: 12px; color: #8a8a8a; }
.verktoy kbd { font-family: var(--mono); font-size: 11.5px; background: #333; border: 1px solid #4a4a4a; border-radius: 3px; padding: 0 4px; color: #ccc; }
#editorramme { flex: 11 1 0; min-height: 130px; position: relative; background: #212121; }
#editorramme .CodeMirror { position: absolute; inset: 0; height: auto; font-family: var(--mono); font-size: 14.5px; line-height: 1.5; }
#editorramme .CodeMirror-gutters { border-right: 1px solid #333; }
#editorramme .feillinje { background: rgba(239, 83, 80, .26); }
#editorramme .feilgutter .CodeMirror-linenumber { background: #c62828; color: #fff; }
#editorramme textarea.reserve { position: absolute; inset: 0; width: 100%; height: 100%; resize: none; border: none; outline: none; background: #212121; color: #eee; font-family: var(--mono); font-size: 14.5px; line-height: 1.5; padding: 8px 12px; tab-size: 4; }
.konsolltopp { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: #9a9a9a; background: #262626; padding: 4px 12px; border-top: 1px solid #111; border-bottom: 1px solid #111; letter-spacing: .03em; }
#konsoll { flex: 9 1 0; min-height: 110px; overflow-y: auto; background: #141414; color: #e3e3e3; font-family: var(--mono); font-size: 14px; line-height: 1.45; padding: 8px 12px 12px; white-space: pre-wrap; overflow-wrap: anywhere; border-radius: 0 0 8px 8px; }
#konsoll .err { color: #ff8a80; }
#konsoll .inn { color: #a5d6a7; }
#konsoll .info { color: #7f8c86; font-style: italic; font-family: var(--font); font-size: 12.5px; }
#konsoll .tom { color: #6f7672; font-family: var(--font); font-size: 13.5px; }
#konsoll .hjelp { display: block; }
#konsoll .hjelp code { font-family: var(--mono); background: rgba(255,255,255,.08); padding: 0 4px; border-radius: 3px; color: #fff3c4; }
#konsoll .innfelt { background: transparent; border: none; border-bottom: 1px dashed #4caf50; outline: none; color: #a5d6a7; font: inherit; padding: 0; margin: 0; width: 12ch; max-width: 100%; caret-color: #a5d6a7; vertical-align: baseline; }
#konsoll .innfelt::placeholder { color: #5f6f66; font-style: italic; }
@media (max-width: 900px) {
    #editorramme .CodeMirror, #editorramme textarea.reserve { font-size: 14px; }
    .verktoy .tastatur { display: none; }
    .verktoy button { padding: 6px 10px; }
}
@media (max-width: 480px) {
    .verktoy { gap: 6px; padding: 7px 8px; }
    .verktoy button { font-size: 12.5px; padding: 5px 8px; }
    .vtittel .ver { display: none; }
}
</style>
</head>

            <svg class="pylogo" viewBox="0 0 32 32" aria-hidden="true"><path fill="#4b8bbe" d="M15.9 2c-7 0-6.6 3-6.6 3v3.2H16v1H6.6S2 8.7 2 15.9s4 6.9 4 6.9h2.4v-3.3s-.1-4 3.9-4h6.7s3.8.1 3.8-3.6V5.6S23.4 2 15.9 2zm-3.7 2.1a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z"/><path fill="#ffd43b" d="M16.1 30c7 0 6.6-3 6.6-3v-3.2H16v-1h9.4s4.6.5 4.6-6.7-4-6.9-4-6.9h-2.4v3.3s.1 4-3.9 4h-6.7s-3.8-.1-3.8 3.6v6.3S8.6 30 16.1 30zm3.7-2.1a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4z"/></svg>

        </div>
        <div id="bevis"></div>
        <div class="bevisknappar">
            <button type="button" id="bevisLukk">Lukk</button>

<script type="text/x-python" id="pyKjerne">
import sys, builtins, io, time, ast, traceback, linecache, json, tokenize, math
from pyodide.ffi import run_sync, can_run_sync
import sim

# ---------- Utskrift: rett til konsollen, utan linjebuffer ----------
class _Ut(io.TextIOBase):
    def __init__(self, kind):
        self._kind = kind
    def writable(self):
        return True
    def write(self, s):
        if not isinstance(s, str):
            raise TypeError(f"write() argument must be str, not {type(s).__name__}")
        if s:
            sim.skriv(s, self._kind)
        return len(s)
    def flush(self):
        pass
    def isatty(self):
        return True
    @property
    def encoding(self):
        return "utf-8"

sys.stdout = _Ut("ut")
sys.stderr = _Ut("feil")

# ---------- Stopp og pausar: sys.monitoring på hopp (løkker) og funksjonskall ----------
_T = {"n": 0, "sist": 0.0, "start": 0.0, "jspi": False, "grense": False, "stopp": False}
_M = sys.monitoring
_VERKTOY = 4

        if no - _T["sist"] > 0.03:
            stopp = run_sync(sim.pause())
            _T["sist"] = time.perf_counter()

                raise KeyboardInterrupt
    elif no - _T["start"] > 8:

    _sjekk()

_M.register_callback(_VERKTOY, _M.events.PY_START, _hopp)

def _sleep(sek, /):
    if isinstance(sek, (str, bytes)) or not (hasattr(type(sek), "__float__") or hasattr(type(sek), "__index__")):
        raise TypeError(f"'{type(sek).__name__}' object cannot be interpreted as an integer or float")
    sek = float(sek)
    if sek < 0:
        raise ValueError("sleep length must be non-negative")
    if _T["jspi"] and can_run_sync():
        stopp = run_sync(sim.sov(sek * 1000))
        if stopp:
            _T["stopp"] = True
            raise KeyboardInterrupt
        _T["sist"] = time.perf_counter()
    else:
        slutt = time.perf_counter() + min(sek, 3)
        while time.perf_counter() < slutt:
            pass

# ---------- Rydda traceback ----------
def _intern(fn):
    return fn.startswith("<kode101") or "_pyodide" in fn or "/pyodide/" in fn

def _rydd_tb(e):
    tb = e.__traceback__
    behald = []
    while tb is not None:
        if not _intern(tb.tb_frame.f_code.co_filename):
            behald.append(tb)
        tb = tb.tb_next
    if isinstance(e, RecursionError) and len(behald) > 1:
        siste = behald[-1]
        if siste.tb_lineno == siste.tb_frame.f_code.co_firstlineno:
            behald.pop()
    for a, b in zip(behald, behald[1:] + [None]):
        a.tb_next = b
    return behald[0] if behald else None

def _feilinfo(e):
    linje = None
    if isinstance(e, SyntaxError):
        e.__traceback__ = None
        tekst = "".join(traceback.format_exception_only(type(e), e))
        if e.filename == "main.py":
            linje = e.lineno
        melding = e.msg
    else:
        tb = _rydd_tb(e)
        for kjeda in (e.__context__, e.__cause__):
            if kjeda is not None and kjeda.__traceback__ is not None:
                kjeda.__traceback__ = _rydd_tb(kjeda)
        tekst = "".join(traceback.format_exception(type(e), e, tb))
        t = tb
        while t is not None:
            if t.tb_frame.f_code.co_filename == "main.py":
                linje = t.tb_lineno
            t = t.tb_next
        melding = str(e)
    return {"type": type(e).__name__, "melding": melding, "tekst": tekst, "linje": linje,
            "namn": getattr(e, "name", None) if isinstance(e, (NameError, AttributeError, ImportError)) else None,
            "grense": _T["grense"]}

# ---------- Kodeanalyse for oppgåvesjekken ----------
def _kallnamn(f):
    if isinstance(f, ast.Name):
        return f.id
    if isinstance(f, ast.Attribute):
        return f.attr
    return ""

def _analyser(kode, tre):
    I = {"noder": {}, "kall": [], "tilordna": [], "tal": [], "strengar": [], "binops": [], "cmpops": [], "boolops": [],
         "kjede": False, "fstr": [], "funksjonar": [], "forIter": [], "indeksar": [], "elif": False, "else": False,
         "kallILokke": [], "inputILokke": False, "kommentarar": [], "importar": []}
    spesifikasjonar = set()
    for n in ast.walk(tre):
        if isinstance(n, ast.FormattedValue) and n.format_spec is not None:
            spesifikasjonar.add(id(n.format_spec))
    for n in ast.walk(tre):
        k = type(n).__name__
        I["noder"][k] = I["noder"].get(k, 0) + 1
        if isinstance(n, ast.Call):
            I["kall"].append(_kallnamn(n.func))
        elif isinstance(n, ast.Name) and isinstance(n.ctx, ast.Store):
            I["tilordna"].append(n.id)
        elif isinstance(n, ast.Constant):
            if isinstance(n.value, bool) or n.value is None:
                pass
            elif isinstance(n.value, (int, float)):
                if math.isfinite(n.value) and abs(n.value) < 2 ** 53:
                    I["tal"].append(n.value)
            elif isinstance(n.value, str):
                I["strengar"].append(n.value[:200])
        elif isinstance(n, ast.BinOp):
            I["binops"].append(type(n.op).__name__)
        elif isinstance(n, ast.AugAssign):
            I["binops"].append(type(n.op).__name__)
        elif isinstance(n, ast.Compare):
            I["cmpops"].extend(type(o).__name__ for o in n.ops)
            if len(n.ops) >= 2:
                I["kjede"] = True
        elif isinstance(n, ast.BoolOp):
            I["boolops"].append(type(n.op).__name__)
        elif isinstance(n, ast.JoinedStr) and id(n) not in spesifikasjonar:
            fv = [v for v in n.values if isinstance(v, ast.FormattedValue)]
            I["fstr"].append({
                "verdiar": len(fv),
                "spec": ["".join(str(c.value) for c in v.format_spec.values if isinstance(c, ast.Constant)) for v in fv if v.format_spec is not None],
                "rekning": any(isinstance(v.value, ast.BinOp) for v in fv),
            })
        elif isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)):
            I["funksjonar"].append({"namn": n.name, "args": len(n.args.args),
                                    "retur": any(isinstance(m, ast.Return) and m.value is not None for m in ast.walk(n))})
        elif isinstance(n, ast.For):
            it = n.iter
            if isinstance(it, ast.Call):
                I["forIter"].append(_kallnamn(it.func) or "anna")
            elif isinstance(it, ast.Name):
                I["forIter"].append("namn")
            elif isinstance(it, ast.Constant) and isinstance(it.value, str):
                I["forIter"].append("streng")
            elif isinstance(it, (ast.List, ast.Tuple)):
                I["forIter"].append("liste")
            else:
                I["forIter"].append("anna")
        elif isinstance(n, ast.Subscript):
            s = n.slice
            if isinstance(s, ast.Constant) and isinstance(s.value, int) and not isinstance(s.value, bool):
                I["indeksar"].append(s.value)
            elif isinstance(s, ast.UnaryOp) and isinstance(s.op, ast.USub) and isinstance(s.operand, ast.Constant) and isinstance(s.operand.value, int):
                I["indeksar"].append(-s.operand.value)
        elif isinstance(n, ast.Import):
            I["importar"].extend(a.name for a in n.names)
        elif isinstance(n, ast.ImportFrom):
            I["importar"].append(n.module or "")
        if isinstance(n, ast.If) and n.orelse:
            if len(n.orelse) == 1 and isinstance(n.orelse[0], ast.If):
                I["elif"] = True
            else:
                I["else"] = True
        if isinstance(n, (ast.While, ast.For)):
            for m in ast.walk(n):
                if isinstance(m, ast.Call):
                    I["kallILokke"].append(_kallnamn(m.func))
    I["inputILokke"] = "input" in I["kallILokke"]
    try:
        for tok in tokenize.generate_tokens(io.StringIO(kode).readline):
            if tok.type == tokenize.COMMENT:
                I["kommentarar"].append(tok.string)
    except Exception:
        pass
    return I

def _verdi(v, d=0):
    if v is None or isinstance(v, bool):
        return v
    if isinstance(v, int):
        return v if abs(v) < 2 ** 53 else str(v)
    if isinstance(v, float):
        return v if math.isfinite(v) else str(v)
    if isinstance(v, str):
        return v[:2000]
    if isinstance(v, (list, tuple)) and d < 3:
        return [_verdi(x, d + 1) for x in v[:200]]
    if isinstance(v, dict) and d < 3:
        return {str(k): _verdi(x, d + 1) for k, x in list(v.items())[:100]}
    return "<" + type(v).__name__ + ">"

def _variablar(g):
    ut = {}
    for k, v in list(g.items()):
        if k.startswith("__") or callable(v) or type(v).__name__ == "module":
            continue
        ut[k] = _verdi(v)
    return ut

# ---------- Køyr brukarkoden med friske globale variablar ----------
def _koyr(kode, jspi):
    _T["jspi"] = bool(jspi)
    _T["n"] = 0
    _T["grense"] = False
    _T["stopp"] = False
    _T["start"] = _T["sist"] = time.perf_counter()
    linecache.cache["main.py"] = (len(kode), None, kode.splitlines(True), "main.py")
    g = {"__name__": "__main__", "__builtins__": builtins, "__file__": "main.py"}
    res = {"feil": None, "ast": None, "variablar": {}}
    try:
        kodeobj = compile(kode, "main.py", "exec")
    except SyntaxError as e:
        res["feil"] = _feilinfo(e)
        return json.dumps(res, ensure_ascii=False, default=str)
    try:
        res["ast"] = _analyser(kode, ast.parse(kode, "main.py"))
    except Exception:
        res["ast"] = None
    _M.set_events(_VERKTOY, _M.events.JUMP | _M.events.PY_START)
    try:
        exec(kodeobj, g)
    except SystemExit:
        pass
    except BaseException as e:
        _M.set_events(_VERKTOY, 0)
        res["feil"] = _feilinfo(e)
    finally:
        _M.set_events(_VERKTOY, 0)
    try:
        res["variablar"] = _variablar(g)
    except Exception:
        pass
    return json.dumps(res, ensure_ascii=False, default=str)

    { id: "l5", tittel: "Vilkår med if", laerer: "å la programmet velje med <code>if</code>, <code>elif</code> og <code>else</code>.",
      html: `
        <p>Med <code>if</code> kan programmet ta val. Koden som er <b>rykt inn</b> (4 mellomrom) under <code>if</code>, blir berre køyrd når vilkåret er sant. Koden under <code>else</code> blir køyrd elles.</p>
        ${ex(`alder = int(input("Alder: "))\nif alder >= 18:\n    print("Du er myndig.")\nelse:\n    print("Du er ikkje myndig enno.")`)}
        <p>Hugs <b>kolon</b> på slutten av <code>if</code>- og <code>else</code>-linja, og <b>innrykk</b> på linjene under. Editoren rykkjer inn automatisk når du trykkjer Enter etter kolon.</p>
        <table class="juks">
          <tr><td>==</td><td>er lik</td></tr>
          <tr><td>!=</td><td>er ikkje lik</td></tr>
          <tr><td>&lt;  &gt;</td><td>mindre enn, større enn</td></tr>
          <tr><td>&lt;=  &gt;=</td><td>mindre enn eller lik, større enn eller lik</td></tr>
          <tr><td>and  or</td><td>begge må vere sanne / minst eitt må vere sant</td></tr>
        </table>
        <p><code>elif</code> (kort for «else if») lar deg sjekke fleire vilkår etter kvarandre. Python vel det første som er sant:</p>
        ${ex(`temp = int(input("Temperatur: "))\nif temp > 25:\n    print("Shorts!")\nelif temp > 10:\n    print("Jakke.")\nelse:\n    print("Lue og vottar!")`)}
        <div class="tips"><code>=</code> gir ein variabel ein verdi. <code>==</code> spør om to ting er like. Tekst samanliknar du med tekst: <code>if svar == "ja":</code></div>`,
      oppgaver: [
        { id: "l5o1", tekst: "Spør om alderen. Skriv ut <code>Du kan ta lappen</code> om alderen er 18 eller meir, og <code>Du må vente</code> elles. Bruk <code>if</code> og <code>else</code>.",
          hint: ["Gjer svaret om til tal med <code>int()</code>, og samanlikn med <code>&gt;= 18</code>.", "<code>alder = int(input(\"Alder: \"))</code><br><code>if alder &gt;= 18:</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;print(\"Du kan ta lappen\")</code><br><code>else:</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;print(\"Du må vente\")</code>"],

          hint: ["Samanlikn teksten frå <code>input()</code> med <code>==</code> og passordet i hermeteikn.", "<code>passord = input(\"Passord: \")</code><br><code>if passord == \"hemmeleg\":</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;print(\"Velkomen inn!\")</code><br><code>else:</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;print(\"Feil passord\")</code>"],
          sjekk: c => ok(c) && node(c, "If") >= 1 && A(c).else && harCmp(c, "Eq", "NotEq") && A(c).strengar.length >= 1 && kall(c, "input") >= 1 && c.input.length >= 1 },
        { id: "l5o3", tekst: "Bruk <code>elif</code>: Spør etter ein temperatur (eller ein poengsum), og skriv ut minst tre ulike svar avhengig av talet.",
          hint: ["Du treng <code>if</code>, minst éin <code>elif</code> og gjerne <code>else</code>.", "Sjå på temperatur-eksempelet over, og lag din eigen versjon, t.d. med karakterar: over 90 poeng gir 6, over 75 gir 5 …"],
          sjekk: c => ok(c) && A(c).elif && A(c).cmpops.length >= 2 && kall(c, "input") >= 1 },
        { id: "l5o4", tekst: "Bruk <code>and</code> eller <code>or</code> i eit vilkår, t.d. for å sjekke om eit tal er mellom 1 og 10.",
          hint: ["<code>and</code> krev at begge vilkåra er sanne.", "<code>tal = int(input(\"Tal: \"))</code><br><code>if tal &gt;= 1 and tal &lt;= 10:</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;print(\"Mellom 1 og 10\")</code>"],
          sjekk: c => ok(c) && node(c, "If") >= 1 && (A(c).boolops.length >= 1 || A(c).kjede) },

    { id: "l6", tittel: "while-løkker", laerer: "å gjenta kode med <code>while</code>, å lage spelet «Gjett talet» og å stoppe ei evig løkke.",
      html: `
        <p>Ei <code>while</code>-løkke gjentek koden under seg så lenge vilkåret er sant – litt som «så lenge det er att deig, steik ei vaffel til».</p>
        ${ex(`n = 1\nwhile n <= 5:\n    print(n)\n    n = n + 1\nprint("Ferdig!")`)}
        <p>Gløymer du <code>n = n + 1</code>, blir vilkåret aldri usant, og løkka går for alltid. Det kallar vi ei <b>evig løkke</b> – det skjer alle programmerarar! Trykk <b>■ Stopp</b> for å stoppe programmet. (I ein ekte terminal trykkjer du <b>Ctrl+C</b>.)</p>
        <p><code>while True:</code> er ei løkke som går heilt til du stoppar ho med <code>break</code>. Det er nyttig når du ikkje veit på førehand kor mange gonger noko skal skje:</p>
        ${ex(`import random\nhemmeleg = random.randint(1, 20)\nwhile True:\n    gjett = int(input("Gjett eit tal frå 1 til 20: "))\n    if gjett == hemmeleg:\n        print("Rett!")\n        break\n    print("Feil, prøv igjen.")`)}
        <p><code>import random</code> gir deg tilgang til tilfeldige tal. <code>random.randint(1, 20)</code> gir eit tilfeldig heiltal frå og med 1 til og med 20. Med <code>import time</code> kan du pause programmet: <code>time.sleep(1)</code> ventar eitt sekund.</p>`,
      oppgaver: [
        { id: "l6o1", tekst: "Bruk ei <code>while</code>-løkke til å skrive ut tala frå 1 til 10.",
          hint: ["Start med <code>n = 1</code>, og køyr løkka så lenge <code>n &lt;= 10</code>.", "<code>n = 1</code><br><code>while n &lt;= 10:</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;print(n)</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;n = n + 1</code>"],
          sjekk: c => ok(c) && node(c, "While") >= 1 && delsekvens(c, rekkje(1, 10)) },
        { id: "l6o2", tekst: "Lag ei evig løkke med <code>while True:</code>, køyr ho, og stopp ho med <b>■ Stopp</b>.",
          hint: ["Ei løkke med <code>while True:</code> og utan <code>break</code> stoppar aldri av seg sjølv.", "<code>while True:</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;print(\"Hjelp, eg går i ring!\")</code><br>Køyr, og trykk ■ Stopp."],
          sjekk: c => node(c, "While") >= 1 && c.feiltype === "KeyboardInterrupt" },
        { id: "l6o3", tekst: "Lag spelet «Gjett talet»: Datamaskinen trekkjer eit tilfeldig tal med <code>random.randint</code>. Brukaren gjettar heilt til svaret er rett, og får vite om gjettinga er <code>For høgt</code> eller <code>For lågt</code>.",
          hint: ["Bruk eksempelet over, men legg til <code>if gjett &gt; hemmeleg:</code> og <code>elif gjett &lt; hemmeleg:</code>.", "<code>if gjett == hemmeleg:</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;print(\"Rett!\")</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;break</code><br><code>elif gjett &gt; hemmeleg:</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;print(\"For høgt\")</code><br><code>else:</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;print(\"For lågt\")</code>"],
          sjekk: c => ok(c) && (kall(c, "randint") + kall(c, "randrange")) >= 1 && node(c, "While") >= 1 && A(c).inputILokke && harCmp(c, ...STORLEIK) && c.input.length >= 1 },
        { id: "l6o4", tekst: "Lag ei nedteljing frå 5 til 1 med ei løkke og <code>time.sleep(1)</code> mellom kvart tal, og skriv ut <code>Takeoff!</code> til slutt.",
          hint: ["Start med <code>n = 5</code>, og trekk frå 1 kvar runde: <code>n = n - 1</code>. Hugs <code>import time</code> øvst.", "<code>import time</code><br><code>n = 5</code><br><code>while n &gt; 0:</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;print(n)</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;time.sleep(1)</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;n = n - 1</code><br><code>print(\"Takeoff!\")</code>"],
          sjekk: c => ok(c) && (node(c, "While") + node(c, "For")) >= 1 && kall(c, "sleep") >= 1 && delsekvens(c, [5, 4, 3, 2, 1]) },
      ]},

    { id: "l7", tittel: "for-løkker og range", laerer: "å gjenta kode eit bestemt tal gonger med <code>for</code> og <code>range()</code>.",
      html: `
        <p>Når du veit kor mange gonger noko skal gjentakast, er <code>for</code>-løkka enklast. <code>range(5)</code> gir tala 0, 1, 2, 3, 4 – fem tal, men det startar på <b>0</b>!</p>
        ${ex(`for i in range(5):\n    print("Runde", i)`)}
        <p><code>range(start, stopp)</code> går frå og med <i>start</i> og opp til, men <b>ikkje med</b>, <i>stopp</i>. Med eit tredje tal bestemmer du kor store steg det skal vere:</p>
        ${ex(`for tal in range(2, 11, 2):\n    print(tal)`)}
        <p>Ein vanleg teknikk er å <b>summere</b> i ei løkke. <code>totalt += tal</code> er det same som <code>totalt = totalt + tal</code>.</p>
        ${ex(`totalt = 0\nfor tal in range(1, 6):\n    totalt += tal\nprint("Summen er", totalt)`)}
        <p>Ei <code>for</code>-løkke kan også gå gjennom kvar bokstav i ein tekst:</p>
        ${ex(`for bokstav in "Stord":\n    print(bokstav)`)}`,
      oppgaver: [
        { id: "l7o1", tekst: "Skriv ut tala frå 1 til 10 med ei <code>for</code>-løkke og <code>range()</code>.",
          hint: ["<code>range(1, 11)</code> gir tala 1 til og med 10.", "<code>for i in range(1, 11):</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;print(i)</code>"],
          sjekk: c => ok(c) && A(c).forIter.includes("range") && delsekvens(c, rekkje(1, 10)) },
        { id: "l7o2", tekst: "Skriv ut 7-gongen: 7, 14, 21 … heilt til 70, med ei <code>for</code>-løkke.",
          hint: ["Gå gjennom tala 1 til 10, og gong kvart tal med 7. (Eller bruk steg: <code>range(7, 71, 7)</code>.)", "<code>for i in range(1, 11):</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;print(i * 7)</code>"],
          sjekk: c => ok(c) && node(c, "For") >= 1 && delsekvens(c, rekkje(7, 70, 7)) },
        { id: "l7o3", tekst: "Bruk ei løkke til å rekne ut summen av alle tala frå 1 til 100, og skriv ut svaret.",
          hint: ["Start med <code>totalt = 0</code>, og legg til kvart tal i løkka. Sjå eksempelet over.", "<code>totalt = 0</code><br><code>for tal in range(1, 101):</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;totalt += tal</code><br><code>print(totalt)</code>"],
          sjekk: c => ok(c) && (node(c, "For") + node(c, "While")) >= 1 && talISvar(c, 5050) && !iKoden(c, 5050) },
        { id: "l7o4", tekst: "Spør etter eit ord (eller namnet ditt), og skriv ut kvar bokstav på eiga linje med ei <code>for</code>-løkke.",
          hint: ["Du kan gå gjennom ein tekst-variabel på same måten som gjennom <code>\"Stord\"</code> i eksempelet.", "<code>ord = input(\"Skriv eit ord: \")</code><br><code>for bokstav in ord:</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;print(bokstav)</code>"],
          sjekk: c => {
              if (!ok(c) || kall(c, "input") < 1 || !A(c).forIter.some(t => t !== "range") || !c.input.length) return false;
              const ord = [...c.input[0].replace(/\s/g, "")];
              if (ord.length < 2) return false;
              const l = linjer(c); let i = 0;
              for (const x of l) if (x === ord[i]) { i++; if (i === ord.length) return true; }
              return false; } },
      ]},

    { id: "l8", tittel: "Lister", laerer: "å lagre mange verdiar i ei liste, å gå gjennom lista og å leggje til nye element.",
      html: `
        <p>Ei <b>liste</b> lagrar mange verdiar i éin variabel. Du lagar ho med klammeparentesar <code>[ ]</code> og komma mellom elementa.</p>
        ${ex(`fag = ["Norsk", "Driftsstøtte", "Teknologiforståing"]\nprint(fag)\nprint(fag[0])\nprint(len(fag))`)}
        <p>Elementa er nummererte frå <b>0</b>: <code>fag[0]</code> er det første, <code>fag[1]</code> det andre, og <code>fag[-1]</code> er det siste. <code>len(fag)</code> gir kor mange element det er i lista.</p>
        <p>Med ei <code>for</code>-løkke går du gjennom alle elementa. Det er nyttig i IT-drift, t.d. når du skal sjekke mange maskiner:</p>
        ${ex(`maskinar = ["PC01", "PC02", "Skrivar"]\nfor m in maskinar:\n    print("Sjekkar", m, "...")`)}
        <p><code>append()</code> legg til eit nytt element på slutten av lista:</p>
        ${ex(`maskinar = ["PC01"]\nmaskinar.append("PC02")\nprint(maskinar)`)}
        <div class="tips">Klammeparentesar skriv du med <b>AltGr + 8</b> og <b>AltGr + 9</b>. Prøver du å hente eit element som ikkje finst, t.d. <code>fag[10]</code>, får du ein <code>IndexError</code>.</div>`,
      oppgaver: [
        { id: "l8o1", tekst: "Lag ei liste med minst tre IP-adresser (som tekst, t.d. <code>\"10.0.0.1\"</code>), og skriv ut lista.",
          hint: ["Kvar IP-adresse står i hermeteikn, med komma mellom.", "<code>ip_adresser = [\"10.0.0.1\", \"10.0.0.2\", \"8.8.8.8\"]</code><br><code>print(ip_adresser)</code>"],
          sjekk: c => ok(c) && kall(c, "print") >= 1 && ipLister(c).some(l => c.utdata.includes(l[0])) },
        { id: "l8o2", tekst: "Gå gjennom IP-lista med ei <code>for</code>-løkke, og skriv ut <code>Pingar 10.0.0.1 ...</code> for kvar adresse – éi linje per adresse.",
          hint: ["<code>for ip in ip_adresser:</code> gir deg éi adresse om gongen i variabelen <code>ip</code>.", "<code>for ip in ip_adresser:</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;print(\"Pingar\", ip, \"...\")</code>"],
          sjekk: c => {
              if (!ok(c) || !A(c).forIter.includes("namn")) return false;
              const l = c.utdata.split("\n");
              return ipLister(c).some(ips => ips.every(ip => l.some(x => x.includes(ip) && ips.filter(y => x.includes(y)).length === 1))); } },
        { id: "l8o3", tekst: "Legg til ei ny adresse med <code>append()</code>, og skriv ut kor mange adresser lista har med <code>len()</code>.",

/* Simulatoren MÅ definere:
     simLim(tekst)  – lim inn tekst i terminal/editor (ikkje køyr)
   og kalle sjekkOppgaver(ctx) etter kvar kommando/køyring. */

/* ================== LAGRING ================== */
const lager = {
    hent(nokkel, standard) {
        try { const v = localStorage.getItem(KURS.prefiks + nokkel); return v === null ? standard : JSON.parse(v); }
        catch (e) { return standard; }
    },
    set(nokkel, verdi) { try { localStorage.setItem(KURS.prefiks + nokkel, JSON.stringify(verdi)); } catch (e) {} },
    slettAlle() {
        try {
            const ut = [];
            for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(KURS.prefiks)) ut.push(k); }
            ut.forEach(k => localStorage.removeItem(k));
        } catch (e) {}
    }
};

/* ================== TILSTAND ================== */
let loyste = new Set(lager.hent("loyste", []));
let besokt = new Set(lager.hent("besokt", []));
let hintNiva = lager.hent("hint", {});
let aktivIndeks = Math.min(Math.max(0, LEKSJONAR.findIndex(l => l.id === lager.hent("aktiv", LEKSJONAR[0].id))), LEKSJONAR.length - 1);
const ALLE_OPPGAVER = LEKSJONAR.flatMap(l => l.oppgaver.map(o => ({ ...o, leksjon: l })));

function lagreTilstand() {
    lager.set("loyste", [...loyste]);
    lager.set("besokt", [...besokt]);
    lager.set("hint", hintNiva);
    lager.set("aktiv", LEKSJONAR[aktivIndeks].id);
}

function leksjonStatus(l) {
    const n = l.oppgaver.length, ok = l.oppgaver.filter(o => loyste.has(o.id)).length;
    if (n === 0) return besokt.has(l.id) ? "ferdig" : "ny";
    if (ok === n) return "ferdig";
    if (ok > 0 || besokt.has(l.id)) return "igang";
    return "ny";
}
const STATUSIKON = { ny: '<span class="sirkel"></span>', igang: '<span class="sirkel halv"></span>', ferdig: "✔" };

/* ================== VISING ================== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function oppdaterFramdrift() {
    const n = ALLE_OPPGAVER.length, ok = ALLE_OPPGAVER.filter(o => loyste.has(o.id)).length;
    document.getElementById("framdriftTekst").textContent = `${ok} / ${n} oppgåver`;
    document.getElementById("framdriftLinje").style.width = (n ? 100 * ok / n : 0) + "%";
}

function teiknListe() {
    const ol = document.getElementById("leksjonsliste");
    ol.innerHTML = "";
    LEKSJONAR.forEach((l, i) => {
        const st = leksjonStatus(l);
        const ok = l.oppgaver.filter(o => loyste.has(o.id)).length;
        const li = document.createElement("li");
        li.className = (i === aktivIndeks ? "aktiv " : "") + st;
        li.innerHTML = `<button type="button"><span class="status" title="${st === "ferdig" ? "Ferdig" : st === "igang" ? "I gang" : "Ikkje starta"}">${STATUSIKON[st]}</span><span class="nr">${i + 1}.</span><span>${esc(l.tittel)}</span>${l.oppgaver.length ? `<span class="tal">${ok}/${l.oppgaver.length}</span>` : ""}</button>`;
        li.querySelector("button").onclick = () => visLeksjon(i);
        ol.appendChild(li);
    });
    oppdaterFramdrift();
}

function visLeksjon(i, rull = true) {
    aktivIndeks = i;
    const l = LEKSJONAR[i];
    besokt.add(l.id);
    lagreTilstand();
    const el = document.getElementById("leksjon");
    el.innerHTML = `
        <h2>${i + 1}. ${esc(l.tittel)}</h2>
        <p class="laerer"><b>Dette lærer du:</b> ${l.laerer}</p>
        <div class="forklaring">${l.html}</div>
        ${l.oppgaver.length ? `<h3>Oppgåver</h3><ul class="oppgaver"></ul>` : ""}
        <div class="fullfortplass"></div>
        <div class="navknappar">
            <button type="button" class="forre" ${i === 0 ? "disabled" : ""}>◀ Førre</button>
            <button type="button" class="neste" ${i === LEKSJONAR.length - 1 ? "disabled" : ""}>Neste ▶</button>
        </div>
        <details class="laerar"><summary>For læraren</summary>${LAERAR_HTML}</details>`;
    el.querySelectorAll(".eksempel").forEach(ex => {
        const pre = ex.querySelector("pre");
        const b = document.createElement("button");
        b.type = "button"; b.className = "prov"; b.textContent = "Prøv";
        b.title = "Lim inn koden (du køyrer sjølv)";
        b.onclick = () => { if (typeof simLim === "function") simLim(pre.dataset.kode ?? pre.textContent); };
        ex.appendChild(b);
    });
    const ul = el.querySelector(".oppgaver");
    if (ul) l.oppgaver.forEach(o => ul.appendChild(lagOppgaveEl(o)));
    el.querySelector(".forre").onclick = () => visLeksjon(i - 1);
    el.querySelector(".neste").onclick = () => visLeksjon(i + 1);
    teiknFullfort();
    teiknListe();
    if (rull) document.getElementById("leksjonspanel").scrollTop = 0;
    if (typeof simByttLeksjon === "function") simByttLeksjon(l);   // valfri krok (t.d. startkode i editoren)
}

function lagOppgaveEl(o) {
    const li = document.createElement("li");
    li.className = "oppgave" + (loyste.has(o.id) ? " loyst" : "");
    li.dataset.id = o.id;
    li.innerHTML = `<span class="ikon">${loyste.has(o.id) ? "✔" : "○"}</span><span class="tekst">${o.tekst}</span>` +
        (o.hint && o.hint.length ? `<button type="button" class="hintknapp">Hint</button>` : "<span></span>");
    const vis = () => {
        li.querySelectorAll(".hint").forEach(h => h.remove());
        const n = hintNiva[o.id] || 0;
        for (let k = 0; k < n; k++) {
            const d = document.createElement("div");
            d.className = "hint"; d.innerHTML = "💡 " + o.hint[k];
            li.appendChild(d);
        }
        const b = li.querySelector(".hintknapp");
        if (b) { b.textContent = n === 0 ? "Hint" : n < o.hint.length ? "Meir hjelp" : "Hint"; b.disabled = n >= o.hint.length; b.style.opacity = n >= o.hint.length ? .4 : 1; }
    };
    const b = li.querySelector(".hintknapp");
    if (b) b.onclick = () => { hintNiva[o.id] = Math.min((hintNiva[o.id] || 0) + 1, o.hint.length); lagreTilstand(); vis(); };
    vis();
    return li;
}

function teiknFullfort() {
    const l = LEKSJONAR[aktivIndeks];
    const plass = document.querySelector("#leksjon .fullfortplass");
    if (!plass) return;
    plass.innerHTML = "";
    if (l.oppgaver.length && leksjonStatus(l) === "ferdig") {
        const d = document.createElement("div");
        d.className = "fullfort";
        d.innerHTML = `<span>✔ Leksjon fullført!</span>` + (aktivIndeks < LEKSJONAR.length - 1 ? `<button type="button">Neste leksjon ▶</button>` : "");
        const b = d.querySelector("button");
        if (b) b.onclick = () => visLeksjon(aktivIndeks + 1);
        plass.appendChild(d);
    }
}

let toastTid = null;
function toast(tekst) {
    const t = document.getElementById("toast");
    t.textContent = tekst; t.classList.add("vis");
    clearTimeout(toastTid); toastTid = setTimeout(() => t.classList.remove("vis"), 3200);
}

/* ================== OPPGÅVESJEKK ================== */
/* Kall etter KVAR kommando/køyring. Sjekkar alle oppgåver i alle leksjonar. */
function sjekkOppgaver(ctx) {
    const nye = [];
    for (const o of ALLE_OPPGAVER) {
        if (loyste.has(o.id)) continue;
        let ok = false;
        try { ok = !!o.sjekk(ctx); } catch (e) { ok = false; }
        if (ok) { loyste.add(o.id); nye.push(o); }
    }
    if (!nye.length) return nye;
    lagreTilstand();
    const aktiv = LEKSJONAR[aktivIndeks];
    for (const o of nye) {
        const li = document.querySelector(`#leksjon .oppgave[data-id="${o.id}"]`);
        if (li) {
            li.classList.add("loyst");
            li.querySelector(".ikon").textContent = "✔";
            const bra = document.createElement("div");
            bra.className = "bra"; bra.textContent = "✔ Bra!";
            li.appendChild(bra);
            setTimeout(() => bra.remove(), 2700);
        }
    }
    const andre = nye.filter(o => o.leksjon !== aktiv);
    if (andre.length) {
        const o = andre[0];
        toast(`✔ Bra! Du løyste ei oppgåve i leksjon ${LEKSJONAR.indexOf(o.leksjon) + 1}: ${o.leksjon.tittel}`);
    }
    teiknFullfort();
    teiknListe();
    return nye;
}

const PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v314.0.7/full/";
const HAR_JSPI = typeof WebAssembly !== "undefined" && typeof WebAssembly.Suspending === "function";
const MAKS_KONSOLL = 120000;     // teikn i konsollen før gamle linjer blir fjerna
const MAKS_UTDATA = 100000;      // teikn i ctx.utdata

const $ = id => document.getElementById(id);
const konsoll = $("konsoll");
const knappKoyr = $("knappKoyr"), knappStopp = $("knappStopp");

/* ---------- Editor: CodeMirror 5, med <textarea> som reserve ---------- */
let ed;
function lagEditor() {
    const ta = $("kodefelt");
    if (typeof CodeMirror === "function") {
        const cm = CodeMirror.fromTextArea(ta, {
            mode: "python", theme: "material-darker", lineNumbers: true, indentUnit: 4, tabSize: 4,
            indentWithTabs: false, matchBrackets: true, autoCloseBrackets: true, smartIndent: true,
            extraKeys: {
                "Tab": c => c.somethingSelected() ? c.indentSelection("add") : c.replaceSelection("    ", "end"),
                "Shift-Tab": c => c.indentSelection("subtract"),
                "Ctrl-Enter": () => koyr(), "Cmd-Enter": () => koyr(),
            },
        });
        // closebrackets parar ikkje hermeteikn rett etter ein bokstav – men f"…", r"…" og b"…" skal parast.
        const prefiksSitat = q => c => {
            if (c.somethingSelected()) return CodeMirror.Pass;
            const cur = c.getCursor(), linje = c.getLine(cur.line);
            const for_ = linje.slice(0, cur.ch), neste = linje.charAt(cur.ch);
            // står vi inne i ein streng og neste teikn er sluttteiknet, hopp over det (python-modusen kan rote med f"{x:.2f}")
            if (neste === q && (for_.split("\\" + q).join("").split(q).length - 1) % 2 === 1) { c.execCommand("goCharRight"); return; }
            if (/(^|[^\w])([rRbBfFuU]|[rR][bBfF]|[bBfF][rR])$/.test(for_) && (!neste || /[\s)\]},:;]/.test(neste))) {
                c.replaceSelection(q + q); c.execCommand("goCharLeft"); return;
            }
            return CodeMirror.Pass;
        };
        cm.addKeyMap({ "'\"'": prefiksSitat('"'), "'\''": prefiksSitat("'") });
        let markert = [];
        return {
            hent: () => cm.getValue(),
            set(tekst, nyHistorikk) { cm.setValue(tekst); if (nyHistorikk) cm.clearHistory(); cm.setCursor({ line: cm.lineCount(), ch: 0 }, null, { scroll: false }); },
            fokus: () => cm.focus(),
            onEndring: fn => cm.on("change", fn),
            marker(linje) {
                this.fjernMarkering();
                const l = Math.min(Math.max(0, linje - 1), cm.lineCount() - 1);
                cm.addLineClass(l, "background", "feillinje");
                cm.addLineClass(l, "gutter", "feilgutter");
                markert.push(l);
                cm.scrollIntoView({ line: l, ch: 0 }, 40);
            },
            fjernMarkering() {
                markert.forEach(l => { cm.removeLineClass(l, "background", "feillinje"); cm.removeLineClass(l, "gutter", "feilgutter"); });
                markert = [];
            },
            harMarkering: () => markert.length > 0,
            refresh: () => cm.refresh(),
        };
    }
    // Reserve: vanleg tekstfelt
    ta.classList.add("reserve");
    ta.addEventListener("keydown", e => {
        if (e.key === "Tab") {
            e.preventDefault();
            const s = ta.selectionStart;
            ta.value = ta.value.slice(0, s) + "    " + ta.value.slice(ta.selectionEnd);
            ta.selectionStart = ta.selectionEnd = s + 4;
            ta.dispatchEvent(new Event("input"));
        } else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); koyr(); }
    });
    return {
        hent: () => ta.value, set(t) { ta.value = t; ta.dispatchEvent(new Event("input")); }, fokus: () => ta.focus(),
        onEndring: fn => ta.addEventListener("input", fn), marker() {}, fjernMarkering() {}, harMarkering: () => false, refresh() {},
    };
}
ed = lagEditor();

/* ---------- Konsoll ---------- */
let konsollTeikn = 0;
function tomKonsoll() { konsoll.innerHTML = ""; konsollTeikn = 0; }
function nedst() { return konsoll.scrollHeight - konsoll.scrollTop - konsoll.clientHeight < 60; }
function rullNed() { konsoll.scrollTop = konsoll.scrollHeight; }
function trimKonsoll() {
    while (konsollTeikn > MAKS_KONSOLL && konsoll.firstChild) {
        const n = konsoll.firstChild;
        konsollTeikn -= (n.textContent || "").length;
        n.remove();
    }
}
function skrivKonsoll(tekst, kl) {
    if (!tekst) return;
    const varNedst = nedst();
    const t = konsoll.querySelector(".tom"); if (t) t.remove();
    const sist = konsoll.lastChild;
    if (sist && sist.nodeType === 1 && sist.tagName === "SPAN" && sist.className === kl) sist.textContent += tekst;
    else { const s = document.createElement("span"); s.className = kl; s.textContent = tekst; konsoll.appendChild(s); }
    konsollTeikn += tekst.length;
    trimKonsoll();
    if (varNedst) rullNed();
}
function sluttarMedLinjeskift() { const t = konsoll.lastChild ? konsoll.lastChild.textContent : ""; return !t || t.endsWith("\n"); }
function infoLinje(tekst) {
    if (!sluttarMedLinjeskift()) skrivKonsoll("\n", "ut");
    skrivKonsoll(tekst + "\n", "info");
}
function hjelpBoks(html) {
    if (!sluttarMedLinjeskift()) skrivKonsoll("\n", "ut");
    const d = document.createElement("div");
    d.className = "hjelp"; d.innerHTML = "💡 " + html;
    konsoll.appendChild(d);
    rullNed();
}
$("knappTom").onclick = () => { tomKonsoll(); if (!koyrer) konsoll.innerHTML = `<span class="tom">Konsollen er tom.</span>`; };
konsoll.addEventListener("mouseup", () => {
    if (ventar && !String(window.getSelection() || "")) ventar.inp.focus();
});

/* ---------- Status ---------- */
function setStatus(tekst, kl) { const s = $("pyStatus"); s.textContent = tekst; s.className = kl || ""; }
let pyKlar = false, koyrer = false;
function oppdaterKnappar() {
    knappKoyr.disabled = !pyKlar || koyrer;
    knappStopp.disabled = !koyrer || !HAR_JSPI;
}

/* ---------- Køyring ---------- */
let py = null, pyKoyr = null, instans = 0;
let koyringId = 0, stoppBedt = false, ventar = null, sovn = null;
let utBuffer = [], utdataTekst = "", stderrTekst = "", innSvar = [];

function flushUt() {
    for (const [tekst, kl] of utBuffer) skrivKonsoll(tekst, kl);
    utBuffer = [];
}

function lagSimModul(minInstans) {
    const gjeld = () => minInstans === instans;
    const aldri = () => new Promise(() => {});
    return {
        skriv(s, kind) {
            if (!gjeld()) return;
            s = String(s);
            const kl = kind === "feil" ? "err" : "ut";
            const sist = utBuffer[utBuffer.length - 1];
            if (sist && sist[1] === kl) sist[0] += s; else utBuffer.push([s, kl]);
            if (kl === "ut") { if (utdataTekst.length < MAKS_UTDATA) utdataTekst += s; }
            else if (stderrTekst.length < MAKS_UTDATA) stderrTekst += s;
            if (sist && sist[0].length > 200000) flushUt();
        },
        pause() {
            if (!gjeld()) return aldri();
            flushUt();
            return new Promise(r => setTimeout(() => { if (gjeld()) r(stoppBedt); }, 0));
        },
        les() {
            if (!gjeld()) return aldri();
            flushUt();
            return new Promise(resolve => {
                if (stoppBedt) return setTimeout(() => { if (gjeld()) resolve(undefined); }, 0);
                const inp = document.createElement("input");
                inp.className = "innfelt"; inp.type = "text"; inp.placeholder = "skriv her";
                inp.setAttribute("autocomplete", "off"); inp.setAttribute("autocapitalize", "off"); inp.spellcheck = false;
                inp.setAttribute("aria-label", "Svar til programmet");
                const t = konsoll.querySelector(".tom"); if (t) t.remove();
                konsoll.appendChild(inp);
                inp.addEventListener("input", () => { inp.style.width = Math.max(12, inp.value.length + 2) + "ch"; });
                inp.addEventListener("keydown", e => {
                    if (e.key === "Enter") { e.preventDefault(); ferdigLes(inp.value); }
                    else if ((e.key === "c" || e.key === "C") && e.ctrlKey && inp.selectionStart === inp.selectionEnd) { e.preventDefault(); stopp(); }
                });
                ventar = { inp, resolve };
                const tst = document.getElementById("toast"); if (tst) tst.classList.remove("vis");   // ikkje dekk til inputfeltet
                setStatus("Ventar på svar …", "ventar");
                rullNed();
                inp.focus({ preventScroll: true });
            });
        },
        sov(ms) {
            if (!gjeld()) return aldri();
            flushUt();
            return new Promise(resolve => {
                if (stoppBedt) return setTimeout(() => { if (gjeld()) resolve(true); }, 0);
                const timer = setTimeout(() => { sovn = null; if (gjeld()) resolve(false); }, Math.max(0, ms));
                sovn = { timer, resolve };
            });
        },
        lesReserve(prompt) {      // berre når nettlesaren manglar JSPI
            flushUt();
            const svar = window.prompt(prompt || "input()");
            if (svar === null) return undefined;
            skrivKonsoll(svar + "\n", "inn");
            innSvar.push(svar); utdataTekst += "\n";
            return svar;
        },
    };
}

function ferdigLes(verdi) {
    if (!ventar) return;
    const { inp, resolve } = ventar;
    ventar = null;
    const s = document.createElement("span");
    s.className = "inn"; s.textContent = verdi === undefined ? "" : verdi;
    inp.replaceWith(s);
    konsollTeikn += s.textContent.length;
    skrivKonsoll("\n", "ut");
    if (verdi !== undefined) { innSvar.push(verdi); utdataTekst += "\n"; }
    setStatus("Køyrer …", "koyrer");
    resolve(verdi);
}

function stopp() {
    if (!koyrer) return;
    stoppBedt = true;
    if (ventar) ferdigLes(undefined);
    if (sovn) { clearTimeout(sovn.timer); const r = sovn.resolve; sovn = null; r(true); }
    const id = koyringId;
    setTimeout(() => { if (koyrer && koyringId === id) forlatOgStartPaaNytt(); }, 3000);
}
knappStopp.onclick = stopp;
knappKoyr.onclick = () => koyr();
document.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && !e.target.closest(".CodeMirror") && !e.target.classList.contains("innfelt")) { e.preventDefault(); koyr(); }
});

async function koyr() {
    if (koyrer || !pyKlar) return;
    const kode = ed.hent();
    lagreKode();
    ed.fjernMarkering();
    koyrer = true; stoppBedt = false; ventar = null; sovn = null;
    utBuffer = []; utdataTekst = ""; stderrTekst = ""; innSvar = [];
    const id = ++koyringId;
    oppdaterKnappar();
    setStatus("Køyrer …", "koyrer");
    if (konsoll.querySelector(".tom")) tomKonsoll();
    if (konsoll.childNodes.length) skrivKonsoll(sluttarMedLinjeskift() ? "\n" : "\n\n", "ut");
    skrivKonsoll("▶ main.py\n", "info");
    const t0 = performance.now();
    let res;
    try {
        const svar = HAR_JSPI ? await pyKoyr.callPromising(kode, true) : pyKoyr(kode, false);
        if (id !== koyringId) return;        // forlaten køyring
        res = JSON.parse(svar);
    } catch (e) {
        if (id !== koyringId) return;
        console.warn(e);
        res = { feil: { type: "InternalError", melding: String(e && e.message || e), tekst: "Intern feil i simulatoren: " + (e && e.message || e) + "\n", linje: null }, ast: null, variablar: {} };
    }
    flushUt();
    avsluttKoyring(kode, res, performance.now() - t0);
}

function avsluttKoyring(kode, res, ms) {
    koyrer = false;
    if (ventar) { ventar.inp.remove(); ventar = null; }
    const f = res.feil;
    if (f) {
        if (!sluttarMedLinjeskift()) skrivKonsoll("\n", "ut");
        skrivKonsoll(f.tekst, "err");
        if (f.linje) ed.marker(f.linje);
        const h = lagHjelp(f, kode);
        if (h) hjelpBoks(h);
        setStatus(f.type === "KeyboardInterrupt" ? "Stoppa" : "Feil – sjå konsollen", f.type === "KeyboardInterrupt" ? "klar" : "feil");
    } else {
        const h = hjelpForStderr(stderrTekst);
        if (h) hjelpBoks(h);
        infoLinje(`Programmet er ferdig (${(ms / 1000).toFixed(2).replace(".", ",")} s).`);
        setStatus("Klar", "klar");
    }
    oppdaterKnappar();
    const ctx = {
        kode, utdata: utdataTekst, input: innSvar.slice(), feil: f ? f.tekst : null, feiltype: f ? f.type : null,
        ast: res.ast || null, variablar: res.variablar || {},
    };
    window.sisteCtx = ctx;
    sjekkOppgaver(ctx);
}

/* Programmet ville ikkje stoppe (t.d. fanga det KeyboardInterrupt): forlat Python-instansen og start ein ny. */
function forlatOgStartPaaNytt() {
    instans++;
    flushUt();
    const kode = ed.hent();
    avsluttKoyring(kode, { feil: { type: "KeyboardInterrupt", melding: "", linje: null,
        tekst: "KeyboardInterrupt\n", hardStopp: true }, ast: null, variablar: {} }, 0);
    koyringId++;
    startPython(true);
}

/* ---------- 💡-hjelpetekst på nynorsk ---------- */
function kodeTag(s) { return `<code>${htmlEsc(s)}</code>`; }
function lagHjelp(f, kode) {
    const t = f.type, m = f.melding || "";
    const linjeTekst = f.linje ? (kode.split("\n")[f.linje - 1] || "") : "";
    if (f.hardStopp) return "Programmet ville ikkje stoppe (kanskje fangar det <code>KeyboardInterrupt</code> med <code>except</code>?), så Python vart starta på nytt.";
    if (t === "KeyboardInterrupt") {
        if (f.grense) return "Programmet køyrde i meir enn 8 sekund og vart stoppa. Denne nettlesaren støttar ikkje ■ Stopp, så lange program blir stoppa automatisk.";
        return "Du stoppa programmet med ■ Stopp – det same som <b>Ctrl+C</b> i ein ekte terminal. Det er heilt normalt å stoppe eit program som heng eller går i ei evig løkke. Linja der programmet var, er markert.";
    }
    if (t === "SyntaxError" || t === "IndentationError" || t === "TabError") {
        const m = (f.melding || "") + "\n" + (f.tekst.trim().split("\n").pop() || "");
        if (/Missing parentheses in call to 'print'/.test(m)) return "I Python 3 er <code>print</code> ein funksjon. Du må ha parentes rundt det som skal skrivast ut: " + kodeTag('print("hei")') + ".";
        if (/expected ':'/.test(m)) return "Det manglar eit <b>kolon</b> <code>:</code> på slutten av linja. Linjer som startar med <code>if</code>, <code>elif</code>, <code>else</code>, <code>while</code>, <code>for</code> og <code>def</code> skal slutte med kolon.";
        if (/unterminated string literal|unterminated triple-quoted/.test(m)) return "Ein tekst (streng) manglar hermeteikn på slutten. Tekst skal stå mellom to like hermeteikn: " + kodeTag('"hei"') + " eller " + kodeTag("'hei'") + ".";
        if (/was never closed/.test(m)) return "Ein parentes eller klamme blir opna, men aldri lukka. Tel parentesane: kvar <code>(</code> treng ein <code>)</code>. Markeringa viser kvar parentesen vart opna.";
        if (/unmatched '[)\]}]'/.test(m)) return "Det er ein sluttparentes for mykje på linja. Tel parentesane – det skal vere like mange <code>(</code> som <code>)</code>.";
        if (/does not match opening parenthesis/.test(m)) return "Parentesane passar ikkje saman, t.d. <code>(</code> som blir lukka med <code>]</code>.";
        if (/Maybe you meant '==' or ':='/.test(m)) return "I eit vilkår samanliknar du med <b>to</b> likskapsteikn: <code>==</code>. Eitt likskapsteikn <code>=</code> gir ein variabel ein verdi.";
        if (/Perhaps you forgot a comma/.test(m)) return "Det ser ut til at det manglar eit <b>komma</b> mellom to ting, t.d. " + kodeTag('print("Alder:", alder)') + ". Eller manglar det hermeteikn rundt ein tekst?";
        if (/Did you mean '(\w+)'/.test(m)) return `Python kjenner ikkje igjen ordet. Sjekk stavemåten – meinte du <code>${htmlEsc(m.match(/Did you mean '(\w+)'/)[1])}</code>?`;
        if (/invalid character/.test(m)) return "Koden inneheld eit teikn som Python ikkje forstår, t.d. typografiske hermeteikn “ ” eller – frå Word. Bruk vanlege <code>\"</code> og <code>-</code> frå tastaturet.";
        if (/invalid decimal literal/.test(m)) return "Eit tal står rett inntil bokstavar. Variabelnamn kan ikkje starte med eit tal, og desimaltal skriv du med punktum: <code>3.5</code>.";
        if (/cannot assign to|cannot be assigned/.test(m)) return "Variabelen du gir verdi til, må stå til <b>venstre</b> for <code>=</code>, t.d. <code>alder = 17</code>. Vil du samanlikne, bruk <code>==</code>.";
        if (/expected an indented block/.test(m)) return "Etter ei linje som sluttar med kolon, må dei neste linjene <b>rykkjast inn</b> med 4 mellomrom (eller Tab). Det viser kva kode som høyrer til <code>if</code>, løkka eller funksjonen.";
        if (/unexpected indent/.test(m)) return "Linja er rykt inn utan grunn. Fjern mellomromma først på linja – berre kode under ei linje med kolon skal rykkjast inn.";
        if (/unindent does not match|inconsistent use of tabs/.test(m)) return "Innrykket passar ikkje med linjene over. Bruk alltid 4 mellomrom per nivå, og ikkje bland Tab og mellomrom.";
        if (/'return' outside function/.test(m)) return "<code>return</code> kan berre brukast inne i ein funksjon (under <code>def</code>, med innrykk).";
        if (/'break' outside loop|'continue' not properly in loop/.test(m)) return "<code>break</code> og <code>continue</code> kan berre brukast inne i ei løkke (med innrykk under <code>while</code> eller <code>for</code>).";
        if (/expected 'except' or 'finally'/.test(m)) return "Etter <code>try:</code> må det kome ein <code>except</code>-blokk.";
        if (/^invalid syntax/.test(m) && /^\s*(else|elif)\b/.test(linjeTekst)) return "<code>else</code> og <code>elif</code> må stå rett under ein <code>if</code>, med same innrykk som <code>if</code>-linja.";
        if (/^\s*print\s+[^(\s=]/.test(linjeTekst)) return "I Python 3 er <code>print</code> ein funksjon. Du må ha parentes: " + kodeTag('print("hei")') + ".";
        return "Python forstår ikkje korleis linja er skriven (syntaksfeil). Sjå på linja som er markert – og linja over. Ofte manglar det eit kolon, ein parentes eller eit hermeteikn. Python køyrer ikkje noko av programmet før syntaksfeilen er retta.";
    }
    if (t === "NameError") {
        const namn = f.namn || ((m.match(/name '([^']+)'/) || [])[1]) || "";
        const forslag = (f.tekst.match(/Did you mean: '([^']+)'/) || [])[1];
        const kjende = ["print", "input", "int", "float", "str", "len", "range", "True", "False", "None", "list", "round", "abs", "sum", "max", "min"];
        if (namn && namn !== namn.toLowerCase() && kjende.includes(namn.toLowerCase())) return `Python skil mellom store og små bokstavar. Skriv <code>${htmlEsc(namn.toLowerCase())}</code> med små bokstavar, ikkje <code>${htmlEsc(namn)}</code>.`;
        if (namn && ["true", "false", "none"].includes(namn)) return `I Python skriv du <code>${namn[0].toUpperCase() + namn.slice(1)}</code> med stor forbokstav.`;
        let s = `Python kjenner ikkje namnet <code>${htmlEsc(namn)}</code>. `;
        if (forslag) s += `Kanskje du har skrive feil – meinte du <code>${htmlEsc(forslag)}</code>? `;
        s += "Ein variabel må få ein verdi (med <code>=</code>) <b>før</b> du brukar han. Var det meint som tekst, må det stå i hermeteikn: " + kodeTag(`print("${namn || "hei"}")`) + ".";
        return s;
    }
    if (t === "UnboundLocalError") return "Du brukar ein variabel inne i ein funksjon før han har fått ein verdi der. Send verdien inn som parameter, eller gi variabelen ein verdi først i funksjonen.";
    if (t === "TypeError") {
        if (/can only concatenate str \(not "(int|float)"\) to str/.test(m)) return "Du kan ikkje setje saman tekst og tal med <code>+</code>. Bruk komma i staden: " + kodeTag('print("Alder:", alder)') + ", eller ein f-streng: " + kodeTag('f"Alder: {alder}"') + ". Du kan også gjere talet om til tekst med <code>str()</code>.";
        if (/unsupported operand type\(s\) for .*'(int|float)' and 'str'|unsupported operand type\(s\) for .*'str' and '(int|float)'/.test(m)) return "Du prøver å rekne med ein tekst. Hugs at <code>input()</code> alltid gir tekst – gjer han om til tal med <code>int(...)</code> eller <code>float(...)</code>, t.d. " + kodeTag('alder = int(input("Alder: "))') + ".";
        if (/not supported between instances of 'str' and '(int|float)'|not supported between instances of '(int|float)' and 'str'/.test(m)) return "Du samanliknar ein tekst med eit tal. Svaret frå <code>input()</code> er tekst – bruk " + kodeTag('int(input(...))') + " for å få eit tal.";
        if (/can't multiply sequence by non-int of type 'str'/.test(m)) return "Du prøver å gonge med ein tekst. Gjer teksten om til tal med <code>int()</code> eller <code>float()</code> først.";
        if (/can't multiply sequence by non-int of type 'float'/.test(m)) return "Ein tekst eller ei liste kan berre gongast med eit heiltal, t.d. " + kodeTag('"-" * 20') + ".";
        if (/object is not callable/.test(m)) return "Du har parentes etter noko som ikkje er ein funksjon. Har du kanskje kalla ein variabel det same som ein funksjon (t.d. <code>print = 5</code> eller <code>input = ...</code>)?";
        if (/missing \d+ required positional argument/.test(m)) return "Funksjonen treng fleire argument enn du gav han. Sjå kor mange parametrar som står i parentesen i <code>def</code>-linja.";
        if (/takes \d+ positional arguments? but \d+ (was|were) given/.test(m)) return "Du gav funksjonen fleire (eller færre) argument enn han har parametrar. Tel parametrane i <code>def</code>-linja.";
        if (/object cannot be interpreted as an integer/.test(m)) return "Her trengst eit heiltal, men du har ein tekst eller eit desimaltal. Bruk <code>int(...)</code>, t.d. " + kodeTag("range(int(svar))") + ".";
        if (/object is not subscriptable/.test(m)) return "Du brukar <code>[ ]</code> på noko som ikkje er ei liste eller ein tekst.";
        if (/object is not iterable/.test(m)) return "Du prøver å gå gjennom noko med <code>for</code> som ikkje er ei liste, ein tekst eller <code>range()</code>. Gå gjennom eit tal med " + kodeTag("for i in range(tal):") + ".";
        return "Typefeil: du brukar ein verdi av feil type, t.d. tekst der Python ventar eit tal. Sjekk typen med " + kodeTag("print(type(x))") + ".";
    }
    if (t === "ValueError") {
        const v = (m.match(/with base 10: (.*)$/) || [])[1];
        if (/invalid literal for int\(\) with base 10/.test(m)) {
            const desimal = v && /^'\s*-?\d+[.,]\d+\s*'$/.test(v);
            return `<code>int()</code> kan berre gjere om tekst som ser ut som eit heiltal, t.d. <code>"17"</code>. ${v ? `Teksten <code>${htmlEsc(v)}</code> er ikkje eit heiltal.` : ""} ` +
                (desimal ? "Er det eit desimaltal, bruk <code>float()</code> – og punktum, ikkje komma." : "Køyr programmet på nytt, og skriv eit tal. (Seinare kan du lære å fange feilen med <code>try</code>/<code>except</code>.)");
        }
        if (/could not convert string to float/.test(m)) return "<code>float()</code> klarer ikkje å gjere om teksten til eit desimaltal. Bruk punktum, ikkje komma: <code>3.5</code> – ikkje <code>3,5</code>.";
        if (/math domain error/.test(m)) return "Matematikkfunksjonen fekk eit tal han ikkje kan rekne med, t.d. kvadratrota av eit negativt tal.";
        if (/empty range/.test(m)) return "<code>random.randint(a, b)</code> krev at <code>a</code> er mindre enn eller lik <code>b</code>.";
        return "Verdien har rett type, men ein verdi som ikkje går an. Les den siste linja i feilmeldinga.";
    }
    if (t === "ZeroDivisionError") return "Du kan ikkje dele på 0 – heller ikkje i matematikken. Sjekk at talet du deler på ikkje er 0, t.d. med " + kodeTag("if b != 0:") + ".";
    if (t === "IndexError") return "Du prøver å hente eit element som ikkje finst. Den første plassen er <code>[0]</code>, og den siste er <code>[len(liste) - 1]</code> – eller berre <code>[-1]</code>.";
    if (t === "KeyError") return "Nøkkelen finst ikkje i ordboka (dict). Sjekk stavemåten, eller sjekk først med " + kodeTag("if nokkel in ordbok:") + ".";
    if (t === "AttributeError") {
        const a = f.namn || ((m.match(/has no attribute '([^']+)'/) || [])[1]) || "";
        const forslag = (f.tekst.match(/Did you mean: '([^']+)'/) || [])[1];
        return `Denne typen verdi har ikkje <code>.${htmlEsc(a)}</code>. ` + (forslag ? `Meinte du <code>.${htmlEsc(forslag)}</code>? ` : "") + "Sjekk stavemåten, og at variabelen er den typen du trur (t.d. ei liste og ikkje ein tekst).";
    }
    if (t === "RecursionError") return "Funksjonen kallar seg sjølv om og om att utan å stoppe. Ein funksjon som kallar seg sjølv, må ha eit vilkår som gjer at han sluttar.";
    if (t === "ModuleNotFoundError" || t === "ImportError") return "Modulen finst ikkje her. I nettlesaren har du berre standardbiblioteket til Python (t.d. <code>random</code>, <code>math</code>, <code>time</code> og <code>datetime</code>). I ekte Python kan du installere andre pakkar med <code>pip install</code>.";
    if (t === "OverflowError") return "Talet vart for stort til å reknast med. Prøv mindre tal.";
    if (t === "MemoryError") return "Programmet brukte opp minnet – kanskje ei løkke som lagar ei liste som aldri sluttar å vekse?";
    if (t === "EOFError") return "Programmet venta på input, men fekk ikkje noko.";
    if (t === "InternalError") return "Noko gjekk gale i simulatoren. Prøv å køyre på nytt, eller last sida om att.";
    return "Les den siste linja i feilmeldinga – ho fortel kva som gjekk gale. Linja med feilen er markert raudt i editoren.";
}
function hjelpForStderr(s) {
    if (/SyntaxWarning: .*invalid escape sequence/.test(s)) return "Åtvaringa over er ikkje ein feil, men eit råd: Skråstreken <code>\\</code> har ei spesiell tyding i tekst. Skriv <code>\\\\</code> når du vil ha éin <code>\\</code> i teksten.";
    if (/SyntaxWarning: "is" with/.test(s)) return "Bruk <code>==</code> (ikkje <code>is</code>) når du samanliknar tal og tekst.";
    return null;
}

/* ---------- Last Pyodide ---------- */
function lastSkript(url) {
    return new Promise((ok, feil) => {
        if (typeof loadPyodide === "function") return ok();
        const s = document.createElement("script");
        s.src = url; s.onload = () => ok(); s.onerror = () => feil(new Error("Fekk ikkje lasta " + url));
        document.head.appendChild(s);
    });
}
async function startPython(paaNytt) {
    pyKlar = false; oppdaterKnappar();
    setStatus(paaNytt ? "Startar Python på nytt …" : "Lastar Python …", "");
    const minInstans = ++instans;
    try {
        await lastSkript(PYODIDE_URL + "pyodide.js");
        const p = await loadPyodide({ indexURL: PYODIDE_URL, stdout: s => console.log(s), stderr: s => console.log(s) });
        if (minInstans !== instans) return;
        p.registerJsModule("sim", lagSimModul(minInstans));
        p.runPython($("pyKjerne").textContent, { filename: "<kode101>" });
        py = p;
        pyKoyr = p.globals.get("_koyr");
        const ver = p.runPython("import sys; sys.version.split()[0]");
        $("pyVersjon").textContent = "Python " + ver;
        pyKlar = true;
        setStatus(HAR_JSPI ? "Python er klar" : "Python er klar (avgrensa modus)", "klar");
        if (!HAR_JSPI) infoLinje("Merk: Denne nettlesaren manglar JSPI. input() kjem som eit sprettoppvindauge, og ■ Stopp verkar ikkje (lange program blir stoppa etter 8 sekund). Bruk ein nyare Chrome eller Edge for full funksjon.");
    } catch (e) {
        console.warn(e);
        setStatus("Fekk ikkje lasta Python", "feil");
        if (konsoll.querySelector(".tom")) tomKonsoll();
        hjelpBoks("Klarte ikkje å laste Python frå nettet. Sjekk at du er kopla til Internett, og last sida om att. Skulenettet kan av og til blokkere <code>cdn.jsdelivr.net</code>.");
    }
    oppdaterKnappar();
}

/* ================== OPPSTART ================== */
visLeksjon(aktivIndeks, false);
startPython(false);
</script>
