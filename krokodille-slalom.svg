    <path d="M470 305 L520 340" stroke="#22601f" stroke-width="9" stroke-linecap="round"/>
    <line x1="520" y1="340" x2="600" y2="388" stroke="#444" stroke-width="4"/>
    <circle cx="600" cy="388" r="6" fill="none" stroke="#444" stroke-width="3"/>
    <path d="M330 300 L280 335" stroke="#22601f" stroke-width="9" stroke-linecap="round"/>
    <line x1="280" y1="335" x2="215" y2="388" stroke="#444" stroke-width="4"/>
    <circle cx="215" cy="388" r="6" fill="none" stroke="#444" stroke-width="3"/>
