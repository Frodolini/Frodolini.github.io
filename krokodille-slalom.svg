    <path d="M545 322 L640 305" stroke="#22601f" stroke-width="3" fill="none"/>
    <g fill="#fff" stroke="#999" stroke-width="1">
      <path d="M560 320 l6 12 l6 -13z"/><path d="M585 317 l6 12 l6 -13z"/><path d="M610 312 l6 12 l6 -13z"/>
      <path d="M570 315 l5 -10 l6 10z"/><path d="M600 309 l5 -10 l6 10z"/>
    </g>
    <circle cx="640" cy="282" r="4" fill="#22601f"/>
    <!-- auge + skibriller -->
    <circle cx="530" cy="262" r="16" fill="#4cb043" stroke="#22601f" stroke-width="3"/>
    <rect x="508" y="246" width="44" height="26" rx="12" fill="#ffb703" stroke="#222" stroke-width="3" opacity="0.9"/>
    <circle cx="534" cy="259" r="5" fill="#111"/>
    <path d="M508 258 Q470 262 470 290" stroke="#222" stroke-width="4" fill="none"/>
    <!-- lue -->
    <path d="M500 250 Q515 218 555 240 Q540 236 510 252Z" fill="#2a6fdb" stroke="#123a80" stroke-width="2"/>
    <circle cx="528" cy="226" r="7" fill="#fff" stroke="#123a80" stroke-width="2"/>

