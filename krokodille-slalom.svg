      <stop offset="0" stop-color="#7ec8f2"/>
      <stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="40" fill="#ffe680"/>
  <!-- fjell -->
