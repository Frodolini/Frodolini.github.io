    <path d="M285 322 Q400 362 515 322 Q400 345 285 322Z" fill="#d9e98a"/>
    <!-- ryggpigger -->
    <g fill="#2f7a2b"><path d="M300 262l14-20 14 22z"/><path d="M345 254l14-22 14 22z"/><path d="M390 252l14-22 14 22z"/><path d="M435 256l14-22 14 22z"/></g>
    <!-- framfot -->
    <path d="M450 330 L480 372 L458 378 L520 378 L510 345Z" fill="#4cb043" stroke="#22601f" stroke-width="3"/>

    <!-- hovud og snute -->
