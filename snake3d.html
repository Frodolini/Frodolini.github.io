<!doctype html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IM-Stord 3D Snake</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Chakra+Petch:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed WebGL cellar under Frode's green title bar; HUD lives in the bar, overlays float over the scene. Single dark theme by design. */
:root {
  --void: #040605;
  --bar: #1d6a33;
  --bar-deep: #134a23;
  --ink: #eaf1e4;
  --muted: #a7b9a2;
  --glow: #8dff9c;
  --blood: #d8392f;
  --panel: rgba(8, 13, 10, 0.88);
  --line: rgba(141, 255, 156, 0.22);
  --f-display: "Pirata One", "Luminari", "Palatino Linotype", Georgia, serif;
  --f-ui: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--void); color: var(--ink); font-family: var(--f-ui); overflow: hidden; -webkit-user-select: none; user-select: none; }
#app { display: flex; flex-direction: column; height: 100%; }

.bar {
  flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 20px;
  background: var(--bar); border-bottom: 2px solid var(--bar-deep);
  padding-block: 7px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  position: relative; z-index: 5;
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand .school { font-weight: 700; letter-spacing: 0.14em; font-size: 12px; text-transform: uppercase; color: #cfeed5; }
.brand .game { font-family: var(--f-display); font-size: 26px; line-height: 1; color: #fff; }
.brand .roomname { font-size: 13px; color: #cfeed5; letter-spacing: 0.04em; }
.stats { display: flex; gap: 18px; margin-left: auto; font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.05; }
.stat span { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #bfe3c6; }
.stat b { font-size: 20px; font-weight: 700; color: #fff; }
.tools { display: flex; gap: 6px; }
.tools button {
  font: 500 13px var(--f-ui); color: #fff; background: var(--bar-deep); border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px; padding: 6px 10px; cursor: pointer; display: flex; align-items: center; gap: 6px;
}
.tools button:hover { background: #0e3a1b; }
.tools button kbd { font: 700 10px var(--f-ui); opacity: 0.7; border: 1px solid rgba(255,255,255,0.3); border-radius: 3px; padding: 0 4px; }
button:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

#stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; }
#c { display: block; width: 100%; height: 100%; }

#overlay {
  position: absolute; inset: 0; display: grid; place-items: center; z-index: 3;
  background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0.25), rgba(0,0,0,0.72));
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-y: auto;
}
.panel {
  width: min(480px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 22px 24px 20px; box-shadow: 0 30px 80px rgba(0,0,0,0.6); backdrop-filter: blur(3px);
}
.kicker { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--glow); }
.panel h1 { margin: 2px 0 6px; font-family: var(--f-display); font-weight: 400; font-size: clamp(42px, 9vw, 64px); line-height: 0.95; text-wrap: balance; color: #f3f7ee; text-shadow: 0 0 24px rgba(141,255,156,0.25); }
.panel h1.dead { color: #ffd9d4; text-shadow: 0 0 24px rgba(216,57,47,0.45); }
.lede { margin: 0 0 16px; color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 60ch; }
.goal { margin: -4px 0 18px; font-size: 14px; color: var(--ink); border-left: 3px solid var(--glow); padding: 2px 0 2px 10px; }
.prey { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 14px; font-variant-numeric: tabular-nums; }
.prey th { text-align: left; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 0 0 4px; border-bottom: 1px solid var(--line); }
.prey th:not(:first-child), .prey td:not(:first-child) { text-align: right; }
.prey td { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
.prey td i { font-style: normal; color: var(--muted); font-size: 12px; margin-left: 6px; }
.keys { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--muted); margin-bottom: 18px; }
.keys kbd { font: 700 12px var(--f-ui); color: var(--ink); border: 1px solid rgba(255,255,255,0.25); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; margin-right: 4px; background: rgba(255,255,255,0.04); }
.go {
  font: 700 16px var(--f-ui); letter-spacing: 0.04em; color: #062010; background: var(--glow); border: 0; border-radius: 8px;
  padding: 12px 22px; cursor: pointer; box-shadow: 0 0 0 0 rgba(141,255,156,0.5); animation: pulse 2.4s infinite;
}
.go:hover { background: #b4ffbe; }
.ghost { font: 500 14px var(--f-ui); color: var(--ink); background: transparent; border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; padding: 11px 16px; cursor: pointer; }
.ghost:hover { border-color: var(--glow); }
.go-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.go-row small { color: var(--muted); font-size: 13px; }
.result { display: flex; flex-wrap: wrap; gap: 8px 26px; margin: 4px 0 18px; font-variant-numeric: tabular-nums; }
.result div { display: flex; flex-direction: column; }
.result span { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.result b { font-size: 32px; font-weight: 700; }
.record { color: var(--glow); font-weight: 700; margin: -8px 0 14px; font-size: 14px; letter-spacing: 0.05em; }
.rooms { margin: 2px 0 18px; }
.rooms p { margin: 0 0 6px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.rooms div { display: flex; flex-wrap: wrap; gap: 6px; }
.rooms button { font: 500 12px var(--f-ui); color: var(--ink); background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.16); border-radius: 5px; padding: 5px 9px; cursor: pointer; }
.rooms button:hover { border-color: var(--glow); color: #fff; }
.rooms button b { color: var(--glow); margin-right: 5px; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(141,255,156,0.45); } 70% { box-shadow: 0 0 0 14px rgba(141,255,156,0); } 100% { box-shadow: 0 0 0 0 rgba(141,255,156,0); } }

#flash { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(216,57,47,0.0) 30%, rgba(216,57,47,0.55)); opacity: 0; z-index: 2; transition: opacity 0.6s ease-out; }
#flash.boom { background: radial-gradient(ellipse at center, rgba(255,255,230,0.95), rgba(141,255,156,0.5) 60%, rgba(0,0,0,0)); transition: opacity 1.6s ease-out; }
#flash.on { opacity: 1; transition: none; }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 2; transition: opacity 0.5s ease; }
#fade.on { opacity: 1; }
.pop {
  position: absolute; z-index: 2; pointer-events: none; transform: translate(-50%, -50%);
  font: 700 20px var(--f-ui); color: var(--glow); text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 0 18px rgba(141,255,156,0.5);
  white-space: nowrap; animation: rise 1.1s ease-out forwards;
}
.pop small { display: block; text-align: center; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #d8f5dc; }
@keyframes rise { from { opacity: 1; transform: translate(-50%, -50%) scale(0.9); } to { opacity: 0; transform: translate(-50%, -160%) scale(1.1); } }
#toast {
  position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 2;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 14px; font-size: 14px; color: var(--ink);
  opacity: 0; transition: opacity 0.3s; pointer-events: none; max-width: calc(100% - 32px); text-align: center;
}
#toast.on { opacity: 1; }

#dpad { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 2; display: none; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 4px; }
#dpad button { background: rgba(10,20,13,0.6); border: 1px solid var(--line); border-radius: 10px; color: var(--ink); font-size: 22px; touch-action: none; }
#dpad button:active { background: rgba(141,255,156,0.3); }
@media (pointer: coarse) { #dpad { display: grid; } }

@media (max-width: 760px) {
  .brand .school, .brand .roomname { display: none; }
  .tools button span, .tools button kbd { display: none; }
  .stats { gap: 12px; }
  .stat b { font-size: 17px; }
  .bar { gap: 6px 12px; }
}
@media (prefers-reduced-motion: reduce) { .go { animation: none; } .pop { animation-duration: 0.01s; } }
</style>
</head>
<body>

<div id="app">
  <header class="bar">
    <div class="brand"><span class="school">IM-Stord</span><span class="game">3D Snake</span><span class="roomname" id="roomName">Vaskekjellaren</span></div>
    <div class="stats">
      <div class="stat"><span>Rom</span><b id="room">1/5</b></div>
      <div class="stat"><span id="goalLbl">Bytte</span><b id="goal">0/8</b></div>
      <div class="stat"><span>Poeng</span><b id="score">0</b></div>
      <div class="stat"><span>Rekord</span><b id="best">0</b></div>
    </div>
    <div class="tools">
      <button id="bCam" type="button" title="Byt kamera (C)">🎥<span>Kamera</span><kbd>C</kbd></button>
      <button id="bSnd" type="button" title="Lyd av/på (M)">🔊<span>Lyd</span><kbd>M</kbd></button>
      <button id="bPause" type="button" title="Pause (P)">⏸<span>Pause</span><kbd>P</kbd></button>
    </div>
  </header>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="flash"></div>
    <div id="fade"></div>
    <div id="overlay"></div>
    <div id="toast"></div>
    <div id="dpad" aria-label="Styring">
      <span></span><button type="button" data-d="up" aria-label="Opp">▲</button><span></span>
      <button type="button" data-d="left" aria-label="Venstre">◀</button><span></span><button type="button" data-d="right" aria-label="Høgre">▶</button>
      <span></span><button type="button" data-d="down" aria-label="Ned">▼</button><span></span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const canvas = $('#c'), stage = $('#stage'), overlay = $('#overlay');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------- utilities ----------------
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(1979);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerpAngle = (a, b, f) => { let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI; if (d < -Math.PI) d += Math.PI * 2; return a + d * f; };
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// ---------------- renderer ----------------
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  overlay.innerHTML = '<div class="panel"><p class="kicker">Feil</p><h1>Ingen WebGL</h1><p class="lede">Nettlesaren klarte ikkje å starta 3D-grafikk. Prøv Chrome, Edge eller Firefox med maskinvareakselerasjon slått på.</p></div>';
  return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.55;
const ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030504);
scene.fog = new THREE.FogExp2(0x050807, 0.022);
const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 200);

const GRID = 20, HALF = GRID / 2, ROOM_H = 7, DOOR_I = 10;
const cx = i => i - HALF + 0.5;
const key = (i, j) => i + j * GRID;

// shared unit geometry, scaled per mesh
const SPH = new THREE.SphereGeometry(1, 20, 14);
const CYL = new THREE.CylinderGeometry(1, 1, 1, 6);
const CYL16 = new THREE.CylinderGeometry(1, 1, 1, 20);
const BOX = new THREE.BoxGeometry(1, 1, 1);
const TOR = new THREE.TorusGeometry(1, 0.05, 6, 28);
const PLANE = new THREE.PlaneGeometry(1, 1);
const UP = V(0, 1, 0);
function mesh(geo, mat, sx = 1, sy = 1, sz = 1, x = 0, y = 0, z = 0, shadow = true) { const m = new THREE.Mesh(geo, mat); m.scale.set(sx, sy, sz); m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = shadow; return m; }
function seg(a, b, r, mat) { const m = new THREE.Mesh(CYL, mat); const d = V().subVectors(b, a); const len = d.length(); m.scale.set(r, len, r); m.position.copy(a).addScaledVector(d, 0.5); m.quaternion.setFromUnitVectors(UP, d.normalize()); m.castShadow = true; return m; }

// ---------------- procedural textures ----------------
function makeCanvas(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return c; }
function texPair(c, repeatX = 1, repeatY = 1) {
  const map = new THREE.CanvasTexture(c); map.encoding = THREE.sRGBEncoding; map.anisotropy = ANISO;
  const bump = new THREE.CanvasTexture(c); bump.anisotropy = ANISO;
  [map, bump].forEach(t => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeatX, repeatY); });
  return { map, bump };
}
function rrect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

const floorCanvas = makeCanvas(1024, 1024, (g, w, h) => {
  const cs = w / GRID;
  g.fillStyle = '#0b0a08'; g.fillRect(0, 0, w, h);
  for (let j = 0; j < GRID; j++) for (let i = 0; i < GRID; i++) {
    const l = 17 + R() * 11, hue = 26 + R() * 26, sat = 5 + R() * 9;
    const x = i * cs + 1.6, y = j * cs + 1.6, s = cs - 3.2;
    const gr = g.createLinearGradient(x, y, x + s, y + s);
    gr.addColorStop(0, `hsl(${hue},${sat}%,${l + 3}%)`); gr.addColorStop(1, `hsl(${hue},${sat}%,${l - 4}%)`);
    g.fillStyle = gr; rrect(g, x, y, s, s, 5); g.fill();
    for (let k = 0; k < 70; k++) { g.fillStyle = R() < 0.55 ? 'rgba(0,0,0,0.28)' : 'rgba(255,236,200,0.07)'; g.fillRect(x + R() * s, y + R() * s, 1 + R() * 2.2, 1 + R() * 2.2); }
    if (R() < 0.24) {
      g.strokeStyle = 'rgba(0,0,0,0.65)'; g.lineWidth = 0.8 + R() * 1.2; g.beginPath();
      let px = x + R() * s, py = y + R() * s; g.moveTo(px, py);
      for (let m = 0; m < 6; m++) { px = clamp(px + (R() - 0.5) * s * 0.5, x, x + s); py = clamp(py + (R() - 0.5) * s * 0.5, y, y + s); g.lineTo(px, py); }
      g.stroke();
    }
  }
  for (let k = 0; k < 34; k++) {
    const x = R() * w, y = R() * h, r = 20 + R() * 95, moss = R() < 0.4;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, moss ? 'rgba(42,74,24,0.38)' : 'rgba(6,4,3,0.5)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  for (let k = 0; k < 9; k++) {
    const x = R() * w, y = R() * h, a = R() * Math.PI, len = 18 + R() * 26;
    g.strokeStyle = 'rgba(220,205,170,0.10)'; g.lineWidth = 1.2;
    for (let m = 0; m < 3; m++) { g.beginPath(); const ox = Math.cos(a + 1.57) * m * 5, oy = Math.sin(a + 1.57) * m * 5; g.moveTo(x + ox, y + oy); g.lineTo(x + ox + Math.cos(a) * len, y + oy + Math.sin(a) * len); g.stroke(); }
  }
  const vg = g.createRadialGradient(w / 2, h / 2, w * 0.25, w / 2, h / 2, w * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = vg; g.fillRect(0, 0, w, h);
});

const brickCanvas = makeCanvas(512, 1024, (g, w, h) => {
  g.fillStyle = '#15110e'; g.fillRect(0, 0, w, h);
  const bh = 32, bw = 64;
  for (let r = 0; r < h / bh; r++) {
    const off = (r % 2) * (bw / 2);
    for (let c = -1; c <= w / bw; c++) {
      const x = c * bw + off, y = r * bh, l = 12 + R() * 10, hue = 6 + R() * 20, sat = 22 + R() * 22;
      g.fillStyle = `hsl(${hue},${sat}%,${l}%)`; rrect(g, x + 2, y + 2, bw - 4, bh - 4, 3); g.fill();
      for (let k = 0; k < 14; k++) { g.fillStyle = R() < 0.5 ? 'rgba(0,0,0,0.3)' : 'rgba(255,220,190,0.06)'; g.fillRect(x + R() * bw, y + R() * bh, 1 + R() * 2, 1 + R() * 2); }
    }
  }
  for (let k = 0; k < 18; k++) {
    const x = R() * w, y = R() * h * 0.7, ww = 6 + R() * 24, hh = 120 + R() * 320;
    const gr = g.createLinearGradient(0, y, 0, y + hh);
    gr.addColorStop(0, R() < 0.5 ? 'rgba(34,58,22,0.45)' : 'rgba(0,0,0,0.45)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x, y, ww, hh);
  }
  const bot = g.createLinearGradient(0, h * 0.6, 0, h);
  bot.addColorStop(0, 'rgba(0,0,0,0)'); bot.addColorStop(1, 'rgba(0,0,0,0.6)');
  g.fillStyle = bot; g.fillRect(0, h * 0.6, w, h * 0.4);
});

const stoneCanvas = makeCanvas(256, 256, (g, w, h) => {
  g.fillStyle = '#3a3630'; g.fillRect(0, 0, w, h);
  for (let k = 0; k < 2600; k++) { const v = R(); g.fillStyle = v < 0.5 ? `rgba(0,0,0,${0.1 + R() * 0.2})` : `rgba(255,245,225,${0.03 + R() * 0.06})`; g.fillRect(R() * w, R() * h, 1 + R() * 3, 1 + R() * 3); }
  for (let k = 0; k < 6; k++) { const x = R() * w, y = R() * h, r = 20 + R() * 50; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(30,50,20,0.4)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); }
});

const woodCanvas = makeCanvas(256, 256, (g, w, h) => {
  const pw = 64;
  for (let p = 0; p < w / pw; p++) {
    g.fillStyle = `hsl(${24 + R() * 10},${35 + R() * 15}%,${20 + R() * 9}%)`; g.fillRect(p * pw, 0, pw, h);
    for (let k = 0; k < 40; k++) { g.strokeStyle = `rgba(0,0,0,${0.08 + R() * 0.15})`; g.lineWidth = 1; g.beginPath(); const x = p * pw + R() * pw; g.moveTo(x, 0); g.bezierCurveTo(x + (R() - 0.5) * 8, h * 0.3, x + (R() - 0.5) * 8, h * 0.7, x + (R() - 0.5) * 6, h); g.stroke(); }
    if (R() < 0.6) { g.beginPath(); g.ellipse(p * pw + R() * pw, R() * h, 4, 8, 0, 0, 7); g.fillStyle = 'rgba(0,0,0,0.35)'; g.fill(); }
    g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(p * pw, 0, 3, h);
  }
  g.fillStyle = 'rgba(0,0,0,0.4)'; g.fillRect(0, 0, w, 10); g.fillRect(0, h - 10, w, 10);
});

const waterCanvas = makeCanvas(256, 256, (g, w, h) => {
  g.fillStyle = '#16301c'; g.fillRect(0, 0, w, h);

// Snake skin: x = along the body, y = around it (canvas top = v 1). Dorsal line sits at v = 0.25, belly at v = 0.75.
const skinCanvas = makeCanvas(512, 256, (g, w, h) => {
  for (let y = 0; y < h; y++) {
    const v = 1 - y / h, top = Math.sin(v * Math.PI * 2);
    let col;
    if (top < -0.45) { const b = (-top - 0.45) / 0.55; col = `rgb(${Math.round(150 + 60 * b)},${Math.round(150 + 50 * b)},${Math.round(70 + 25 * b)})`; }
    else { const t = (top + 0.45) / 1.45; col = `rgb(${Math.round(70 - 46 * t)},${Math.round(150 - 78 * t)},${Math.round(58 - 26 * t)})`; }
    g.fillStyle = col; g.fillRect(0, y, w, 1);
  }
  for (let x = 0; x < w; x += 14) { g.fillStyle = 'rgba(40,30,0,0.28)'; g.fillRect(x, h * 0.08, 2, h * 0.34); }
  const dy = h * 0.75;
  for (let k = 0; k < 4; k++) {
    const x = k * 128 + 64;
    g.beginPath(); g.moveTo(x - 56, dy); g.lineTo(x, dy - 46); g.lineTo(x + 56, dy); g.lineTo(x, dy + 46); g.closePath();
    g.fillStyle = '#081009'; g.fill(); g.lineWidth = 6; g.strokeStyle = '#b9dc4a'; g.stroke();
    g.beginPath(); g.ellipse(x, dy, 12, 9, 0, 0, Math.PI * 2); g.fillStyle = '#3d8a35'; g.fill();
    [h * 0.55, h * 0.95].forEach(yy => { g.beginPath(); g.ellipse(x - 64, yy, 18, 11, 0, 0, Math.PI * 2); g.fillStyle = 'rgba(8,16,9,0.85)'; g.fill(); });
  }
  for (let y = 0; y < h; y += 9) for (let x = (y / 9 % 2) * 6; x < w; x += 12) {
    g.beginPath(); g.arc(x, y, 6, 0.15 * Math.PI, 0.85 * Math.PI); g.strokeStyle = 'rgba(0,0,0,0.30)'; g.lineWidth = 1.4; g.stroke();
    g.beginPath(); g.arc(x, y - 1.5, 4, 1.15 * Math.PI, 1.85 * Math.PI); g.strokeStyle = 'rgba(255,255,220,0.07)'; g.lineWidth = 1; g.stroke();
  }
});
const scaleCanvas = makeCanvas(128, 128, (g, w, h) => {

const cornerWebCanvas = makeCanvas(256, 256, (g, w) => {
  g.strokeStyle = 'rgba(230,230,220,0.55)'; g.lineWidth = 1;
  const rays = 9;
  for (let k = 0; k <= rays; k++) { const a = k / rays * Math.PI / 2; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * w * 1.1, Math.sin(a) * w * 1.1); g.stroke(); }
  for (let r = 22; r < w; r += 18 + r * 0.08) {
    g.beginPath();
    for (let k = 0; k <= rays; k++) { const a = k / rays * Math.PI / 2, rr = r * (0.92 + R() * 0.1); const px = Math.cos(a) * rr, py = Math.sin(a) * rr; if (k === 0) g.moveTo(px, py); else g.quadraticCurveTo(Math.cos(a - 0.08) * rr * 0.9, Math.sin(a - 0.08) * rr * 0.9, px, py); }
    g.globalAlpha = 1 - r / w; g.stroke(); g.globalAlpha = 1;
  }
});
const fullWebCanvas = makeCanvas(256, 256, (g, w) => {
  const c = w / 2; g.strokeStyle = 'rgba(245,245,240,0.95)'; g.lineWidth = 2.6;
  const rays = 14;
  for (let k = 0; k < rays; k++) { const a = k / rays * Math.PI * 2; g.beginPath(); g.moveTo(c, c); g.lineTo(c + Math.cos(a) * c, c + Math.sin(a) * c); g.stroke(); }
  for (let r = 10; r < c; r += 9 + r * 0.04) { g.beginPath(); for (let k = 0; k <= rays; k++) { const a = k / rays * Math.PI * 2, rr = r * (0.94 + R() * 0.08); const px = c + Math.cos(a) * rr, py = c + Math.sin(a) * rr; k ? g.lineTo(px, py) : g.moveTo(px, py); } g.stroke(); }
});

// ---------------- camera ----------------
const camPos = V(0, 16, 17.5), camLook = V(0, 0, -0.5), camFwdSmooth = V(0, 0, -1);
let camM = 1;
function updateCamera(dt) {
  const aspect = camera.aspect;
  let dPos, dLook, k;
  if (camMode === 'over') {
    camM = Math.max(1, 0.95 / aspect);
    const fx = clamp(headWorld.x, -HALF, HALF) * 0.16, fz = -0.5 + clamp(headWorld.z, -HALF, HALF) * 0.12;
    dLook = V(fx, 0, fz);

    scene.fog.density = lvl.pal.fogD / camM;
    k = 3;
  } else {
    camFwdSmooth.lerp(headFwd, 1 - Math.exp(-dt * 4)).normalize();
    dPos = headWorld.clone().addScaledVector(camFwdSmooth, -5.2); dPos.y = 3.4;
    dLook = headWorld.clone().addScaledVector(camFwdSmooth, 3.2); dLook.y = 0.2;
    scene.fog.density = lvl.pal.fogD * 1.8;
    k = 5;

  if (state === 'ending' && camMode === 'over') { dLook.lerp(headWorld, 0.5); dPos = dLook.clone().add(V(0, 9, 10)); k = 1.5; }
  const f = 1 - Math.exp(-dt * k);

  } else if (kind === 'room') {
    html = `<div class="panel"><p class="kicker">${lvl.final ? 'Siste rom' : `Rom ${level + 1} av 5`}</p><h1>${lvl.name}</h1>
      <p class="lede">${lvl.lede}</p><p class="goal">${goalText(lvl)}</p>
      <div class="go-row"><button class="go" id="go" type="button">Kryp inn</button><small>eller trykk ein piltast</small></div></div>`;
  } else if (kind === 'pause') {
    html = `<div class="panel"><p class="kicker">Pause · ${lvl.name}</p><h1>Slangen ventar</h1><p class="lede">Krypa i kjellaren held pusten. Trykk P eller mellomrom for å halda fram.</p>
      <div class="go-row"><button class="go" id="go" type="button">Hald fram</button></div></div>`;
  } else if (kind === 'over') {
    html = `<div class="panel"><p class="kicker">${lvl.name} · slangen er død</p><h1 class="dead">${deathCause === 'sjolv' ? 'Au!' : deathCause === 'mor' ? 'Bitt!' : 'Krasj!'}</h1>
      <p class="lede">${DEATH[deathCause] || 'Slangen er død.'}</p>
      <div class="result"><div><span>Poeng</span><b>${score}</b></div><div><span>Rom</span><b>${lvl.final ? 'Hola' : level + 1}</b></div><div><span>Rekord</span><b>${best}</b></div></div>
      ${newRecord && score > 0 ? '<p class="record">Ny rekord!</p>' : ''}
      <div class="go-row"><button class="go" id="go" type="button">Prøv rommet på nytt</button><button class="ghost" id="restart" type="button">Start frå rom 1</button></div></div>`;
  } else if (kind === 'win') {
    html = `<div class="panel"><p class="kicker">Kjellaren er reinska</p><h1>Slangen sprakk!</h1>
      <p class="lede">Alle edderkoppars mor var éin bit for mykje. Slangen åt henne og eksploderte i tusen grøne bitar. Gratulerer, du klarte alle fem romma og hola!</p>
      <div class="result"><div><span>Poeng</span><b>${score}</b></div><div><span>Kryp etne</span><b>${totalEaten}</b></div><div><span>Rekord</span><b>${best}</b></div></div>
      ${newRecord ? '<p class="record">Ny rekord!</p>' : ''}
      <div class="go-row"><button class="go" id="go" type="button">Spel igjen</button></div></div>`;
  }
  overlay.innerHTML = html;
  const go = $('#go');
  if (go) {
    go.addEventListener('click', () => {
      if (kind === 'pause') resume();
      else if (kind === 'over') retryRoom();
      else if (kind === 'win') toStart();
      else startPlay();
    });
    setTimeout(() => go.focus({ preventScroll: true }), 30);
  }
  const rs = $('#restart'); if (rs) rs.addEventListener('click', toStart);
  const cont = $('#cont'); if (cont) cont.addEventListener('click', () => { score = 0; totalEaten = 0; newRecord = false; loadLevel(reached); state = 'room'; showOverlay('room'); });
}
function hideOverlay() { overlay.hidden = true; }

function toStart() { flowToken++; score = 0; totalEaten = 0; newRecord = false; loadLevel(0); state = 'start'; showOverlay('start'); }
function retryRoom() { flowToken++; score = roomStartScore; totalEaten = roomStartTotal; loadLevel(level); state = 'room'; showOverlay('room'); }
function startPlay(firstDir) {
  Sound.init();
  if (state !== 'start' && state !== 'room') return;
  state = 'play'; hideOverlay(); acc = 0; Sound.hiss();
  if (firstDir) queueDir(firstDir);
}
function pause() { if (state !== 'play') return; state = 'pause'; showOverlay('pause'); }
function resume() { if (state !== 'pause') return; state = 'play'; hideOverlay(); Sound.init(); }

// ---------------- input ----------------
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
function queueDir(d) {
  const lastD = queue.length ? queue[queue.length - 1] : dir;
  if (d[0] === -lastD[0] && d[1] === -lastD[1]) return;
  if (d[0] === lastD[0] && d[1] === lastD[1]) return;
  if (queue.length < 3) queue.push(d);
}
function turn(rel) { const l = queue.length ? queue[queue.length - 1] : dir; queueDir(rel > 0 ? [-l[1], l[0]] : [l[1], -l[0]]); }
function steer(name) {
  if (state === 'start' || state === 'room') { startPlay(camMode === 'over' ? DIRS[name] : null); return; }
  if (state === 'over') { if (!overlay.hidden) retryRoom(); return; }
  if (state !== 'play') return;
  if (camMode === 'over') queueDir(DIRS[name]);
  else if (name === 'left') turn(-1); else if (name === 'right') turn(1);
}
function toggleCam() { camMode = camMode === 'over' ? 'jakt' : 'over'; queue = []; toast(camMode === 'over' ? 'Kamera: oversikt · piltastane styrer i alle retningar' : 'Kamera: jakt · ← og → svingar slangen'); }
function toggleSound() { Sound.init(); const m = Sound.toggle(); $('#bSnd').firstChild.textContent = m ? '🔇' : '🔊'; toast(m ? 'Lyd av' : 'Lyd på'); }
$('#bSnd').firstChild.textContent = Sound.muted ? '🔇' : '🔊';
window.addEventListener('keydown', e => {
  const k = e.key;
  const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
  if (k.startsWith('Arrow')) e.preventDefault();
  if (map[k] && (k.startsWith('Arrow') || state === 'play')) { if (!e.repeat || state === 'play') steer(map[k]); return; }
  if (k === 'p' || k === 'P') { state === 'play' ? pause() : resume(); }
  else if (k === ' ') { e.preventDefault(); if (state === 'play') pause(); else if (state === 'pause') resume(); else if (state === 'start' || state === 'room') startPlay(); }
  else if (k === 'Enter') {
    if (state === 'start' || state === 'room') { e.preventDefault(); startPlay(); }
    else if (state === 'pause') { e.preventDefault(); resume(); }
    else if (state === 'over' && !overlay.hidden) { e.preventDefault(); retryRoom(); }
    else if (state === 'win' && !overlay.hidden) { e.preventDefault(); toStart(); }
  }
  else if (k === 'c' || k === 'C') toggleCam();
  else if (k === 'm' || k === 'M') toggleSound();
});
$('#bCam').addEventListener('click', toggleCam);
$('#bSnd').addEventListener('click', toggleSound);
$('#bPause').addEventListener('click', () => state === 'play' ? pause() : resume());
document.querySelectorAll('#dpad button').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); steer(b.dataset.d); }));
let swipe = null;
canvas.addEventListener('pointerdown', e => { swipe = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', e => {
  if (!swipe) return; const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y; swipe = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

// ---------------- resize & loop ----------------
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();

loadLevel(0);
updateCamera(10); camPos.copy(camera.position);
showOverlay('start');

let lastT = performance.now(), time = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; time += dt;
  const ticking = state === 'play' || state === 'exit';
  if (ticking) { acc += dt; let guard = 0; while (acc >= tickInt && (state === 'play' || state === 'exit') && guard++ < 5) { acc -= tickInt; tick(); } }
  const t = (state === 'play' || state === 'exit') ? clamp(acc / tickInt, 0, 1) : 1;
  if (state !== 'pause') { updatePrey(dt, time); updateMother(dt, time); }
  if (state === 'play') {
    spawnTimer -= dt;
    if (lvl.final) {
      const left = lvl.goal - eatenRoom;
      if (mother && !mother.weak && spawnTimer <= 0 && preys.length < Math.min(3, left)) { spawnPrey('unge'); spawnTimer = rand(0.8, 1.8); }
    } else if (!doorOpen) {
      const target = Math.min(6, lvl.spawn + Math.floor(eatenRoom / 5));
      if (spawnTimer <= 0 && preys.length < target) { spawnPrey(); spawnTimer = rand(0.6, 1.6); }
    }
  }
  if (state === 'ending') {
    endT += dt;
    swell = endT < 0.7 ? 0 : Math.min(1.5, (endT - 0.7) * 1.25);
    if (endT > 1.0 && endT < 1.9 && Math.random() < 0.04) Sound.gulp();
    if (endT >= 1.95 && !exploded) explode();
    if (endT >= 4.6) { state = 'win'; showOverlay('win'); }
  }
  if (!exploded) drawSnake(t, state === 'pause' ? 0 : dt, time);
  updateEnv(dt, time);
  updateParticles(dt);
  updateCamera(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
