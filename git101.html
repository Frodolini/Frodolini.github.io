<!DOCTYPE html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git 101</title>
<!-- Kode 101 – Git. Bygd på felles mal for Kode 101-sidene. Git, Git Bash og GitHub er simulerte i nettlesaren (ingen eksterne bibliotek). -->
<style>
:root {
    --gron: #2e7d32;
    --gron-mork: #1b5e20;
    --gron-lys: #e8f5e9;
    --bg: #eef3ef;
    --kort: #ffffff;
    --tekst: #24302a;
    --grå: #5f6b64;
    --linje: #dfe6e1;
    --lenke: #0066cc;
    --gul: #fff6d6;
    --gul-kant: #e8c547;
    --kode-bg: #f4f6f5;
    --font: system-ui, "Segoe UI", Arial, sans-serif;
    --mono: Consolas, "Cascadia Mono", "Cascadia Code", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--tekst); font-family: var(--font); font-size: 15px; display: flex; flex-direction: column; }

/* ---------- Grøn tittellinje ---------- */
header.topp { background: var(--gron); color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; border-bottom: 3px solid var(--gron-mork); }
header.topp .tilbake { color: #fff; text-decoration: none; font-size: 14px; padding: 4px 10px; border: 1px solid rgba(255,255,255,.5); border-radius: 14px; white-space: nowrap; }
header.topp .tilbake:hover { background: var(--gron-mork); }
header.topp .titlar { flex: 1 1 260px; min-width: 0; }
header.topp h1 { margin: 0; font-size: 21px; line-height: 1.2; }
header.topp .under { margin: 2px 0 0; font-size: 13px; opacity: .9; }
header.topp .hogre { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.framdrift { font-size: 13px; min-width: 130px; }
.framdrift .linje { height: 6px; background: rgba(255,255,255,.3); border-radius: 3px; margin-top: 4px; overflow: hidden; }
.framdrift .linje div { height: 100%; width: 0; background: #fff; transition: width .4s; }
header.topp button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6); border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
header.topp button:hover { background: var(--gron-mork); }

/* ---------- To kolonnar ---------- */
main.oppsett { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(320px, 40%) 1fr; gap: 14px; padding: 14px; }
.kort { background: var(--kort); border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
#leksjonspanel { overflow-y: auto; min-height: 0; padding: 0; display: flex; flex-direction: column; }
#sim { min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
@media (max-width: 900px) {
    body { height: auto; display: block; }
    main.oppsett { display: flex; flex-direction: column; padding: 10px; }
    #leksjonspanel { overflow: visible; }
    #sim { height: 78vh; min-height: 460px; }
}

/* ---------- Leksjonsliste ---------- */
#leksjonsliste { list-style: none; margin: 0; padding: 8px; border-bottom: 1px solid var(--linje); display: flex; flex-direction: column; gap: 2px; }
#leksjonsliste li button { width: 100%; text-align: left; background: none; border: none; font: inherit; font-size: 14px; padding: 5px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; color: var(--tekst); }
#leksjonsliste li button:hover { background: var(--gron-lys); }
#leksjonsliste li.aktiv button { background: var(--gron); color: #fff; }
#leksjonsliste .status { width: 1.2em; text-align: center; flex: none; }
#leksjonsliste .sirkel { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; vertical-align: -1px; opacity: .75; }
#leksjonsliste .sirkel.halv { background: linear-gradient(90deg, currentColor 50%, transparent 50%); opacity: 1; }
@media (max-width: 600px) { #leksjon .eksempel pre { padding-right: 12px; padding-top: 34px; } }
#leksjonsliste .nr { color: var(--grå); width: 1.6em; flex: none; }
#leksjonsliste li.aktiv .nr { color: #dfeee0; }
#leksjonsliste .tal { margin-left: auto; font-size: 12px; color: var(--grå); }
#leksjonsliste li.aktiv .tal { color: #dfeee0; }
#leksjonsliste .ferdig .status { color: var(--gron); }
#leksjonsliste li.aktiv.ferdig .status { color: #fff; }

/* ---------- Leksjonsinnhald ---------- */
#leksjon { padding: 14px 18px 18px; line-height: 1.5; }
#leksjon h2 { font-size: 20px; margin: 0 0 4px; padding-bottom: 6px; border-bottom: 2px solid var(--gron); }
#leksjon .laerer { color: var(--grå); font-size: 14px; margin: 6px 0 12px; }
#leksjon .laerer b { color: var(--gron-mork); }
#leksjon p { margin: 8px 0; }
#leksjon code { font-family: var(--mono); background: var(--kode-bg); padding: 1px 4px; border-radius: 3px; font-size: 13.5px; }
#leksjon h3 { font-size: 15px; margin: 18px 0 6px; color: var(--gron-mork); }
.eksempel { position: relative; margin: 8px 0 12px; }
.eksempel pre { margin: 0; background: #1e1e1e; color: #e6e6e6; font-family: var(--mono); font-size: 13.5px; padding: 10px 12px; padding-right: 70px; border-radius: 6px; overflow-x: auto; line-height: 1.4; }
.eksempel .prov { position: absolute; top: 6px; right: 6px; background: var(--gron); color: #fff; border: none; border-radius: 4px; padding: 3px 9px; font: inherit; font-size: 12.5px; cursor: pointer; }
.eksempel .prov:hover { background: var(--gron-mork); }
.tips { background: var(--gul); border-left: 4px solid var(--gul-kant); padding: 8px 12px; border-radius: 4px; margin: 10px 0; }
table.juks { border-collapse: collapse; width: 100%; font-size: 13.5px; margin: 8px 0; }
table.juks td, table.juks th { border-bottom: 1px solid var(--linje); padding: 4px 6px; text-align: left; vertical-align: top; }
table.juks td:first-child { font-family: var(--mono); white-space: nowrap; }

/* ---------- Oppgåver ---------- */
.oppgaver { list-style: none; padding: 0; margin: 6px 0; display: flex; flex-direction: column; gap: 8px; }
.oppgave { border: 1px solid var(--linje); border-radius: 8px; padding: 9px 12px; display: grid; grid-template-columns: 1.4em 1fr auto; gap: 4px 8px; align-items: start; transition: background .4s, border-color .4s; }
.oppgave .ikon { font-size: 16px; line-height: 1.4; color: #9aa59f; }
.oppgave.loyst { background: var(--gron-lys); border-color: #a5d6a7; }
.oppgave.loyst .ikon { color: var(--gron); }
.oppgave .hintknapp { background: #fff; border: 1px solid var(--linje); border-radius: 5px; padding: 2px 9px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--grå); }
.oppgave .hintknapp:hover { border-color: var(--gron); color: var(--gron-mork); }
.oppgave .hint { grid-column: 2 / 4; font-size: 13.5px; background: var(--gul); border-radius: 5px; padding: 5px 9px; }
.oppgave .bra { grid-column: 2 / 4; color: var(--gron-mork); font-weight: bold; font-size: 14px; animation: bra 2.6s forwards; }
@keyframes bra { 0% { opacity: 0; } 10% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
.fullfort { background: var(--gron); color: #fff; border-radius: 8px; padding: 10px 14px; margin: 14px 0 6px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.fullfort button { background: #fff; color: var(--gron-mork); border: none; border-radius: 5px; padding: 5px 12px; font: inherit; font-weight: bold; cursor: pointer; }
.navknappar { display: flex; justify-content: space-between; margin: 18px 0 8px; }
.navknappar button { background: #fff; border: 1px solid var(--gron); color: var(--gron-mork); border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer; }
.navknappar button:hover:not(:disabled) { background: var(--gron); color: #fff; }
.navknappar button:disabled { opacity: .35; cursor: default; }
details.laerar { margin: 16px 0 0; border: 1px solid var(--linje); border-radius: 8px; padding: 8px 12px; font-size: 14px; background: #fafcfb; }
details.laerar summary { cursor: pointer; font-weight: bold; color: var(--grå); }
details.laerar ul { padding-left: 20px; margin: 6px 0; }

/* ---------- Toast ---------- */
#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); background: var(--gron-mork); color: #fff; padding: 9px 16px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; z-index: 50; max-width: 90vw; font-size: 14px; }
#toast.vis { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- Kursbevis ---------- */
#bevisbakgrunn { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
#bevisbakgrunn.vis { display: flex; }
#bevisboks { background: #fff; border-radius: 10px; max-width: 640px; width: 100%; max-height: 92vh; overflow-y: auto; padding: 18px; }
.namnrad { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; font-size: 14px; }
.namnrad input { flex: 1; min-width: 160px; padding: 7px 10px; font: inherit; border: 1px solid #bbb; border-radius: 6px; }
#bevis { border: 3px solid var(--gron); border-radius: 6px; padding: 0 22px 18px; position: relative; text-align: center; }
#bevis .stripe { height: 14px; background: var(--gron); margin: 0 -22px 16px; }
#bevis h2 { margin: 6px 0 2px; font-size: 26px; color: var(--gron-mork); letter-spacing: .02em; }
#bevis .bnamn { font-size: 24px; margin: 14px 0 2px; font-family: Georgia, serif; border-bottom: 1px solid #999; display: inline-block; min-width: 60%; padding: 0 10px 2px; }
#bevis .skule { color: var(--grå); font-size: 14px; }
#bevis ul { list-style: none; padding: 0; text-align: left; margin: 14px auto 6px; max-width: 420px; font-size: 14px; }
#bevis ul li { padding: 2px 0; }
#bevis .sum { font-weight: bold; margin-top: 8px; }
#bevis .segl { position: absolute; right: 14px; top: 26px; width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe680, #d4a017 60%, #a87900); color: #5a3d00; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; box-shadow: 0 0 0 4px #f3d36b, 0 2px 6px rgba(0,0,0,.3); transform: rotate(-12deg); }
#bevis .delvis { position: absolute; right: 14px; top: 30px; border: 2px dashed var(--grå); color: var(--grå); border-radius: 6px; padding: 4px 8px; font-size: 13px; transform: rotate(-8deg); }
#bevis .manglar { font-size: 13px; color: var(--grå); }
.bevisknappar { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.bevisknappar button { padding: 7px 14px; font: inherit; border-radius: 6px; border: 1px solid var(--gron); background: #fff; color: var(--gron-mork); cursor: pointer; }
.bevisknappar button.hoved { background: var(--gron); color: #fff; }
@media print {
    @page { size: A4; margin: 15mm; }
    /* display:none (ikkje visibility:hidden) – elles tek resten av sida plass og gir fleire tomme sider */
    html, body { height: auto !important; min-height: 0 !important; overflow: visible !important; background: #fff !important; }
    body { display: block !important; }
    body > *:not(#bevisbakgrunn) { display: none !important; }
    #bevisbakgrunn { position: static !important; inset: auto; background: none !important; display: block !important; padding: 0 !important; }
    #bevisboks { box-shadow: none; max-width: none; max-height: none; overflow: visible; padding: 0; border-radius: 0; }
    #bevisboks .namnrad, #bevisboks .bevisknappar { display: none !important; }
    #bevis { break-inside: avoid; page-break-inside: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* ---------- Felles 💡-hjelpetekst (bruk i simulatoren) ---------- */
.hjelp { color: #ffe9a8; font-family: var(--font); font-size: 14px; background: rgba(255, 214, 90, .08); border-left: 3px solid #f2c94c; padding: 4px 10px; margin: 4px 0 6px; white-space: pre-wrap; border-radius: 0 4px 4px 0; }
#leksjon button.handling { background: var(--gron); color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; margin: 2px 6px 2px 0; }
#leksjon button.handling:hover { background: var(--gron-mork); }
#leksjon button.handling.lys { background: #fff; color: var(--gron-mork); border: 1px solid var(--gron); }
#leksjon button.handling.lys:hover { background: var(--gron-lys); }
#leksjon .klargjer { font-size: 13.5px; color: var(--grå); border-top: 1px dashed var(--linje); margin-top: 14px; padding-top: 8px; }

/* ---------- Git Bash ---------- */
#sim { background: #0c0c0c; position: relative; }
.vtittel { display: flex; align-items: center; gap: 8px; background: #202020; color: #e6e6e6; font-size: 12.5px; height: 32px; padding-left: 10px; flex: none; user-select: none; border-radius: 8px 8px 0 0; }
.vtittel .vikon { width: 18px; height: 16px; background: linear-gradient(135deg, #f05133 0 50%, #2b2b2b 50%); border-radius: 3px; flex: none; }
.vtittel .vnamn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); }
.vtittel button { background: none; border: 1px solid #555; color: #ddd; border-radius: 5px; font: inherit; font-size: 12px; padding: 2px 9px; cursor: pointer; margin-right: 8px; }
.vtittel button:hover { background: #333; }
#term { flex: 1 1 0; min-height: 160px; overflow-y: auto; overflow-x: hidden; padding: 4px 10px 10px; font-family: var(--mono); font-size: 14px; line-height: 1.32; color: #cccccc; background: #0c0c0c; white-space: pre-wrap; word-break: normal; overflow-wrap: anywhere; cursor: text; position: relative; tab-size: 8; }
#term::-webkit-scrollbar { width: 10px; }
#term::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 5px; }
#termUt > div { min-height: 1.32em; }
#termAktiv { position: relative; min-height: 1.32em; }
#termInn { position: absolute; left: 0; top: 0; width: 2px; height: 1.3em; opacity: 0; border: 0; padding: 0; margin: 0; resize: none; overflow: hidden; font-size: 16px; color: transparent; background: transparent; caret-color: transparent; outline: none; }
.markor { position: relative; }
.markor::after { content: ""; position: absolute; left: 0; right: 0; bottom: 1px; height: 3px; background: currentColor; animation: blink 1.06s steps(1) infinite; }
.markor.tom::after { width: .6em; right: auto; }
#term.ufokus .markor::after { animation: none; opacity: .45; }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
#term .hjelp { word-break: normal; overflow-wrap: break-word; line-height: 1.45; white-space: normal; }
#term .hjelp code { font-family: var(--mono); background: rgba(255,255,255,.1); padding: 0 4px; border-radius: 3px; color: #fff3c4; }
#term ::selection { background: #f2f2f2; color: #0c0c0c; }
.fg { color: #3fc85a; } .fr { color: #f14c4c; } .fy { color: #d7ba3d; } .fc { color: #29b8db; } .fm { color: #c678dd; } .fb { font-weight: bold; } .fd { color: #5c9cff; }
.mobilrad { display: none; gap: 6px; padding: 6px 8px; background: #1a1a1a; flex: none; overflow-x: auto; }
.mobilrad button { background: #2d2d2d; color: #e6e6e6; border: 1px solid #444; border-radius: 6px; padding: 6px 12px; font: 13px var(--mono); flex: none; }
@media (max-width: 900px), (pointer: coarse) { .mobilrad { display: flex; } }

/* ---------- Git-modell (levande teikning) ---------- */
#modell { flex: 0 0 auto; max-height: 52%; overflow-y: auto; background: #f7faf8; color: var(--tekst); border-top: 3px solid #111; font-size: 13px; }
#modell .mtopp { display: flex; align-items: center; gap: 8px; padding: 6px 10px 2px; flex-wrap: wrap; }
#modell .mtopp b { font-size: 13.5px; }
#modell .mtopp .repo { font-family: var(--mono); color: var(--grå); font-size: 12.5px; }
#modell .tom { padding: 10px 12px 12px; color: var(--grå); }
.omraade { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 4px; padding: 4px 10px 6px; align-items: stretch; }
.omraade .boks { background: #fff; border: 1px solid var(--linje); border-radius: 8px; padding: 5px 7px; min-width: 0; }
.omraade .boks h4 { margin: 0 0 4px; font-size: 12px; color: var(--grå); text-transform: uppercase; letter-spacing: .03em; display: flex; justify-content: space-between; gap: 4px; }
.omraade .pil { align-self: center; font-size: 11px; color: var(--grå); text-align: center; line-height: 1.2; font-family: var(--mono); }
.omraade .pil span { display: block; font-size: 18px; color: #9aa59f; }
.fil { display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 12px; padding: 1px 4px; border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fil:hover { background: var(--gron-lys); }
.fil .merke { font-weight: bold; width: 1.3em; text-align: center; flex: none; border-radius: 3px; font-size: 10.5px; line-height: 1.5; }
.fil.u .merke { background: #fde2e1; color: #b3261e; } .fil.m .merke { background: #ffe8cc; color: #a85b00; } .fil.ok .merke { color: #9aa59f; }
.fil.s .merke { background: #d7f2dc; color: #1b5e20; } .fil.k .merke { background: #b3261e; color: #fff; } .fil.ig { color: #9aa59f; font-style: italic; }
.fil.u, .fil.m { color: #8a1c13; } .fil.s { color: #1b5e20; }
.boks .ingen { color: #9aa59f; font-size: 12px; font-style: italic; }
.boks .commitinfo { font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.boks .commitinfo .sha { color: #a07800; }
.graftittel { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 10px 0; font-size: 12px; color: var(--grå); }
.graftittel b { color: var(--tekst); }
.grafboks { overflow-x: auto; padding: 0 6px 4px; }
.grafboks svg { display: block; }
.grafboks svg text { font-family: var(--mono); }
.grafboks .ny circle.c { animation: popp .6s ease-out; transform-box: fill-box; transform-origin: center; }
@keyframes popp { 0% { transform: scale(0); } 70% { transform: scale(1.35); } 100% { transform: scale(1); } }
.forklaring-graf { font-size: 11.5px; color: var(--grå); padding: 0 10px 6px; }
@media (max-width: 900px) { #sim { height: auto; min-height: 0; } #term { height: 56vh; flex: none; } #modell { max-height: none; } }
@media (max-width: 600px) {
    #term { font-size: 12.5px; padding: 4px 6px 10px; }
    .omraade { grid-template-columns: 1fr; }
    .omraade .pil { display: flex; gap: 6px; justify-content: center; align-items: center; }
    .omraade .pil span { display: inline; font-size: 14px; transform: rotate(90deg); }
}

/* ---------- Editor (nano/notepad) ---------- */
#editorBak { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 90; padding: 14px; }
#editorBak.vis { display: flex; }
#editor { background: #fff; border-radius: 8px; width: min(760px, 100%); height: min(560px, 92vh); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 34px rgba(0,0,0,.5); }
#editor .et { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: #2b2b2b; color: #eee; font-family: var(--mono); font-size: 13px; }
#editor .et .namn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#editorTekst { flex: 1; min-height: 0; border: 0; outline: none; resize: none; padding: 10px 12px; font: 14px/1.45 var(--mono); color: #111; background: #fff; white-space: pre; overflow: auto; tab-size: 4; }
#editor .ek { display: flex; gap: 8px; padding: 8px 10px; background: #f3f3f3; border-top: 1px solid #ddd; align-items: center; flex-wrap: wrap; }
#editor .ek .info { font-size: 12px; color: #666; margin-right: auto; }
#editor .ek button { padding: 6px 14px; font: inherit; font-size: 13.5px; border-radius: 6px; border: 1px solid var(--gron); background: #fff; color: var(--gron-mork); cursor: pointer; }
#editor .ek button.hoved { background: var(--gron); color: #fff; }
</style>
</head>
<body>

<header class="topp">
    <a class="tilbake" href="index.html">← Sandkassa</a>
    <div class="titlar">
        <h1>Git 101</h1>
        <p class="under">Versjonskontroll med Git – sjå commitar, staging og greiner bli til</p>
    </div>
    <div class="hogre">
        <div class="framdrift" title="Løyste oppgåver">
            <span id="framdriftTekst">0 / 0 oppgåver</span>
            <div class="linje"><div id="framdriftLinje"></div></div>
        </div>
        <button id="knappBevis" type="button">Kursbevis</button>
        <button id="knappNullstill" type="button">Start på nytt</button>
    </div>
</header>

<main class="oppsett">
    <aside id="leksjonspanel" class="kort">
        <ol id="leksjonsliste"></ol>
        <div id="leksjon"></div>
    </aside>
    <section id="sim" class="kort">
        <div class="vtittel"><span class="vikon"></span><span class="vnamn" id="vTittel">MINGW64:/c/Users/elev</span><button type="button" id="knappMaskin" title="Set maskina tilbake til start (framdrifta blir ikkje sletta)">Nullstill maskina</button></div>
        <div id="term" class="ufokus" aria-label="Git Bash – klikk og skriv"><div id="termUt"></div><div id="termAktiv"><span id="aktivTekst"></span><textarea id="termInn" rows="1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Skriv ein kommando"></textarea></div></div>

<script>
"use strict";
/* ================== KURSOPPSETT ================== */
const KURS = {
    namn: "Git 101",
    prefiks: "kode101-git-",
};

/* Hjelparar (funksjonsdeklarasjonar, så dei finst før LEKSJONAR blir laga) */
function htmlEsc(s) { return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }
function ex(kode) { return `<div class="eksempel"><pre>${htmlEsc(kode)}</pre></div>`; }
/* Døme som ikkje skal limast inn i terminalen (utskrift, filinnhald) – utan «Prøv»-knapp */
function exUtan(kode) { return `<div class="eksempel utan"><pre style="padding-right:12px">${htmlEsc(kode)}</pre></div>`; }

/* Hjelparar for oppgåvesjekk (les tilstanden til repoet i nettside) */
function nr() { return st.repos[NETTSIDE] || null; }
function nrGrein(n) { const r = nr(); return r ? r.refs["refs/heads/" + n] : null; }
function nrHovud() { const r = nr(); return r ? (r.refs["refs/heads/main"] || r.refs["refs/heads/master"]) : null; }
function nrHistorikk() { const r = nr(); if (!r) return []; const s = new Set(); Object.values(r.refs).forEach(x => forfedrar(x).forEach(y => s.add(y))); return [...s]; }

const LEKSJONAR = [
{ id: "l1", tittel: "Kva er versjonskontroll?", laerer: "kvifor vi bruker Git, kva eit repo og ein commit er, og dei første kommandoane i Git Bash.",
  html: `
<p>Har du nokon gong hatt filer som heiter <code>oppgåve.docx</code>, <code>oppgåve_ferdig.docx</code> og <code>oppgåve_HEILT_ferdig2.docx</code>? Det er versjonskontroll for hand – og det blir fort rot.</p>
<p><b>Git</b> er eit program som hugsar kvar einaste versjon av prosjektet ditt. Når du er nøgd, tek du eit «bilete» av alle filene. Eit slikt bilete heiter ein <b>commit</b>. Då kan du alltid sjå kva som er endra, gå tilbake til ein eldre versjon og arbeide saman med andre utan å skrive over arbeidet deira.</p>
<table class="juks">
<tr><td>repo</td><td>ei prosjektmappe som Git held auge med (av engelsk <i>repository</i>)</td></tr>
<tr><td>commit</td><td>eit lagra bilete av filene, med ei melding om kva du har gjort</td></tr>
<tr><td>GitHub</td><td>ein nettstad der du kan lagre repoa dine og dele dei med andre</td></tr>
</table>
<p>Til høgre har du <b>Git Bash</b>, terminalen som følgjer med Git for Windows. Linja <code>elev@IM-PC MINGW64 ~</code> viser kven du er, og kvar du står. <code>~</code> er heimemappa di. Under terminalen ser du ei levande teikning av Git-repoet – ho blir oppdatert etter kvar kommando.</p>
<p>Git Bash bruker Linux-kommandoar: <code>ls</code> viser kva som ligg i mappa, <code>cd</code> byter mappe, og <code>cat</code> viser innhaldet i ei fil.</p>
${ex(`ls`)}
${ex(`cd nettside`)}
<p>Sjekk kva versjon av Git som er installert:</p>
${ex(`git --version`)}
<div class="tips">💡 Trykk <b>Tab</b> for å fullføre namn, og <b>pil opp</b> for å hente førre kommando. <code>cd ..</code> går éi mappe opp, og <code>clear</code> tømer skjermen.</div>`,
  oppgaver: [
    { id: "l1o1", tekst: "Gå inn i mappa <code>nettside</code>.", hint: ["Bruk <code>cd</code> og namnet på mappa.", "Skriv <code>cd nettside</code> – eller <code>cd net</code> og trykk Tab."],
      sjekk: c => st.cwd === NETTSIDE },
    { id: "l1o2", tekst: "Vis innhaldet i fila <code>index.html</code>.", hint: ["Bruk <code>cat</code> og filnamnet.", "<code>cat index.html</code> – du må stå i mappa <code>nettside</code>."],
      sjekk: c => !!st.flagg.catIndex },
    { id: "l1o3", tekst: "Sjekk kva versjon av Git som er installert.", hint: ["<code>git --version</code>"],
      sjekk: c => !!st.flagg.versjon },
  ]},

{ id: "l2", tittel: "Første repo og commit", laerer: "å lage eit repo med <code>git init</code>, fortelje Git kven du er, og lage den første commiten.",
  html: `
<p>Mappa <code>nettside</code> er ei vanleg mappe. For at Git skal halde auge med ho, må du gjere ho om til eit repo. Stå i mappa og skriv:</p>
${ex(`git init`)}
<p>Git lagar då ei skjult mappe som heiter <code>.git</code>. Der lagrar Git heile historikken. Du ser ho med <code>ls -a</code> – men ikkje rør innhaldet! Legg merke til at ledeteksten no viser <code>(main)</code>: Det er namnet på greina du står på.</p>
<p>Før den første commiten må Git vite kven du er. Namnet og e-posten blir lagra i kvar commit du lagar. <code>--global</code> betyr at innstillinga gjeld for alle repo på maskina:</p>
${ex(`git config --global user.name "Kari Nordmann"`)}
${ex(`git config --global user.email "kari@example.com"`)}
<p>Ein commit blir laga i to steg. Først vel du kva som skal vere med, med <code>git add</code>. Det heiter å leggje filene i <b>staging</b>. Så lagar du commiten med ei kort melding som forklarer kva du har gjort:</p>
${ex(`git add index.html`)}
${ex(`git commit -m "Første versjon av nettsida"`)}
<p><code>git add .</code> legg alle filene i mappa i staging på ein gong. Punktumet betyr «denne mappa».</p>
<div class="tips">💡 Skriv commit-meldingar som fortel <i>kva</i> du gjorde: «Legg til meny» er betre enn «endringar» eller «asdf».</div>`,
  oppgaver: [
    { id: "l2o1", tekst: "Gjer mappa <code>nettside</code> om til eit Git-repo.", hint: ["Stå i mappa <code>nettside</code> (sjå på ledeteksten), og skriv <code>git init</code>."],
      sjekk: c => !!nr() },
    { id: "l2o2", tekst: "Fortel Git kva du heiter, og kva e-postadresse du har.", hint: ["To kommandoar: <code>git config --global user.name \"...\"</code> og <code>git config --global user.email \"...\"</code>.", "Hugs hermeteikn rundt namnet når det har mellomrom."],
      sjekk: c => !!cfgHent(nr(), "user.name") && !!cfgHent(nr(), "user.email") },
    { id: "l2o3", tekst: "Lag den første commiten med både <code>index.html</code> og <code>style.css</code>.", hint: ["Legg filene i staging med <code>git add .</code> (eller éi og éi).", "Lag commiten: <code>git commit -m \"Første versjon\"</code>"],
      sjekk: c => nrHistorikk().some(s => tre(s)["index.html"] && tre(s)["style.css"]) },
    { id: "l2o4", tekst: "Sjekk at alt er lagra: <code>git status</code> skal seie <code>nothing to commit, working tree clean</code>.", hint: ["Køyr <code>git status</code>. Står det noko i raudt eller grønt, må du bruke <code>git add</code> og <code>git commit</code> på nytt."],
      sjekk: c => !!st.flagg.statusRein },
  ]},

{ id: "l3", tittel: "Status, staging og diff", laerer: "å følgje ei endring frå arbeidsmappa, via staging og inn i ein commit – og å ignorere filer med <code>.gitignore</code>.",
  html: `
<p>Ei fil kan vere tre stader i Git. Følg med i teikninga under terminalen:</p>
<table class="juks">
<tr><td>Arbeidsmappe</td><td>filene slik du ser dei og endrar dei</td></tr>
<tr><td>Staging</td><td>endringane du har valt ut til neste commit (<code>git add</code>)</td></tr>
<tr><td>Repo</td><td>commitane – historikken (<code>git commit</code>)</td></tr>
</table>
<p>Opne ei fil i editoren med <code>nano</code> (eller klikk på fila i teikninga), gjer ei endring og lagre:</p>
${ex(`nano index.html`)}
<p><code>git status</code> fortel kva som er endra. Raudt betyr «endra, men ikkje i staging». Grønt betyr «klar til commit». Med <code>git diff</code> ser du nøyaktig kva linjer som er endra: <code>-</code> er fjerna, og <code>+</code> er lagt til.</p>
${ex(`git status`)}
${ex(`git diff`)}
<p>Når endringa ligg i staging, viser <code>git diff</code> ingenting. Då må du skrive <code>git diff --staged</code>.</p>
<h3>.gitignore</h3>
<p>Nokre filer skal aldri inn i Git, t.d. passord, store filer og mapper som blir laga automatisk. Skriv namna i fila <code>.gitignore</code>, så later Git som dei ikkje finst:</p>
${ex(`echo "passord.txt" > .gitignore`)}
<div class="tips">💡 <code>echo "tekst" > fil</code> skriv teksten til ei fil og erstattar det som stod der. Med <code>&gt;&gt;</code> blir teksten lagd til på slutten i staden.</div>`,
  oppgaver: [
    { id: "l3o1", tekst: "Endre <code>index.html</code> (skriv t.d. eit nytt avsnitt under overskrifta), og sjå at <code>git status</code> viser fila som <code>modified</code>.", hint: ["Opne fila med <code>nano index.html</code>, endre noko og trykk «Lagre og lukk».", "Køyr så <code>git status</code>."],
      sjekk: c => !!st.flagg.statusEndra },
    { id: "l3o2", tekst: "Bruk <code>git diff</code> til å sjå kva linjer du har endra.", hint: ["Skriv <code>git diff</code> <i>før</i> du køyrer <code>git add</code>."],
      sjekk: c => !!st.flagg.diff },
    { id: "l3o3", tekst: "Commit endringa, så du har minst to commitar.", hint: ["<code>git add index.html</code> og så <code>git commit -m \"...\"</code>.", "Snarveg for filer som Git kjenner frå før: <code>git commit -am \"...\"</code>"],
      sjekk: c => nrHistorikk().length >= 2 },
    { id: "l3o4", tekst: "Lag fila <code>passord.txt</code> og ein <code>.gitignore</code> som gjer at Git ignorerer ho. Commit <code>.gitignore</code>.", hint: ["Lag fila: <code>echo hemmeleg > passord.txt</code>", "Lag ignore-fila: <code>echo passord.txt > .gitignore</code>. Sjekk med <code>git status</code> at <code>passord.txt</code> ikkje er med.", "<code>git add .gitignore</code> og <code>git commit -m \"Legg til .gitignore\"</code>"],
      sjekk: c => { const r = nr(); if (!r) return false; const h = tre(headSha(r)); return erFil(NETTSIDE + "/passord.txt") && !!h[".gitignore"] && !r.index["passord.txt"] && !h["passord.txt"] && erIgnorert(NETTSIDE, "passord.txt"); } },
  ]},

{ id: "l4", tittel: "Historikk og å angre", laerer: "å lese historikken med <code>git log</code>, og å angre endringar med <code>git restore</code>.",
  html: `
<p>Alle commitane dine ligg i historikken. Kvar commit har ein unik <b>ID</b> (ein hash), t.d. <code>3f2c1a9</code>. Den fulle ID-en er 40 teikn lang, men dei første sju er nok til å peike på ein commit.</p>
${ex(`git log`)}
${ex(`git log --oneline`)}
<p>Merkelappen <code>HEAD -&gt; main</code> fortel kvar du er: <b>HEAD</b> betyr «her står du no», og han peikar på greina <code>main</code>. Med <code>git show</code> og ein ID ser du kva som vart endra i ein bestemd commit, t.d. <code>git show 3f2c1a9</code>.</p>
<h3>Angre endringar</h3>
<p>Har du øydelagt ei fil og vil tilbake til slik ho var i siste commit? Bruk <code>git restore</code>. Ver forsiktig: Endringane i arbeidsmappa blir borte for godt.</p>
${ex(`git restore style.css`)}
<p>Har du lagt ei fil i staging ved ein feil, tek du ho ut att med <code>--staged</code>. Endringa ligg då framleis i arbeidsmappa:</p>
${ex(`git restore --staged style.css`)}
<div class="tips">💡 <code>git status</code> fortel deg alltid korleis du angrar. Les linjene i parentes, t.d. <code>(use "git restore &lt;file&gt;..." to discard changes in working directory)</code>.</div>`,
  oppgaver: [
    { id: "l4o1", tekst: "Vis historikken med éi linje per commit.", hint: ["<code>git log --oneline</code>"],
      sjekk: c => !!st.flagg.logOneline },
    { id: "l4o2", tekst: "Skriv tull i <code>style.css</code> og lagre. Hent så tilbake versjonen frå siste commit med <code>git restore</code>.", hint: ["<code>nano style.css</code>, slett noko og lagre. Sjå i teikninga at fila er merkt <b>M</b>.", "<code>git restore style.css</code>"],
      sjekk: c => !!st.flagg.restoreArbeid },
    { id: "l4o3", tekst: "Endre ei fil og legg ho i staging med <code>git add</code>. Ta ho så ut av staging att – utan å miste endringa.", hint: ["<code>git restore --staged filnamn</code>", "Etterpå skal <code>git status</code> vise fila i raudt under «Changes not staged for commit»."],
      sjekk: c => !!st.flagg.restoreStaged },
  ]},

{ id: "l5", tittel: "Greiner", laerer: "kva ei grein er, og korleis du lagar og byter mellom greiner med <code>git branch</code> og <code>git switch</code>.",
  html: `
<p>Ei <b>grein</b> (branch) er ei eiga utviklingslinje. På ei grein kan du prøve ut nye idear utan å røre den fungerande versjonen på <code>main</code>. Teknisk er ei grein berre ein <b>merkelapp</b> som peikar på ein commit – sjå i teikninga!</p>
${ex(`git branch meny`)}
${ex(`git branch`)}
<p>Stjerna viser kva grein du står på. Byt grein med <code>git switch</code>:</p>
${ex(`git switch meny`)}
<p>Når du lagar ein commit, flyttar merkelappen til greina du står på, seg fram til den nye commiten. Dei andre greinene blir verande der dei er.</p>
<p>Snarveg: <code>git switch -c namn</code> lagar ei ny grein og byter til ho med ein gong. Mange bruker også den eldre kommandoen <code>git checkout</code>, som gjer det same: <code>git checkout meny</code> og <code>git checkout -b namn</code>.</p>
<div class="tips">💡 Når du byter grein, endrar Git filene i arbeidsmappa så dei passar med greina. Byter du tilbake, er filene der att.</div>`,
  oppgaver: [
    { id: "l5o1", tekst: "Lag ei ny grein som heiter <code>meny</code>.", hint: ["<code>git branch meny</code>", "Du må ha minst éin commit før du kan lage greiner."],
      sjekk: c => !!nrGrein("meny") },
    { id: "l5o2", tekst: "Byt til greina <code>meny</code>.", hint: ["<code>git switch meny</code> – sjå at ledeteksten og HEAD i teikninga endrar seg."],
      sjekk: c => !!nr() && nr().head === "refs/heads/meny" },
    { id: "l5o3", tekst: "Lag ein meny i <code>index.html</code> på greina <code>meny</code>, og commit han.", hint: ["Opne <code>nano index.html</code> og legg til t.d. <code>&lt;nav&gt;Heim | Om meg&lt;/nav&gt;</code> rett under <code>&lt;body&gt;</code>.", "<code>git commit -am \"Legg til meny\"</code>"],
      sjekk: c => { const m = nrGrein("meny"), h = nrHovud(); if (!m || !h) return false; const c0 = commit(m); return !erForfar(m, h) && c0.p.length === 1 && tre(m)["index.html"] !== tre(c0.p[0])["index.html"]; } },
    { id: "l5o4", tekst: "Byt tilbake til <code>main</code>, og sjå at menyen er borte frå <code>index.html</code>. Han ligg trygt på greina <code>meny</code>.", hint: ["<code>git switch main</code>, så <code>cat index.html</code>."],
      sjekk: c => { const r = nr(), m = nrGrein("meny"), h = nrHovud(); return !!r && !!m && (r.head === "refs/heads/main" || r.head === "refs/heads/master") && !erForfar(m, h); } },
  ]},

{ id: "l6", tittel: "Flette greiner (merge)", laerer: "å flette ei grein inn i ei anna med <code>git merge</code> – både som «fast-forward» og med ein merge-commit.",
  html: `
<p>Når arbeidet på ei grein er ferdig, flettar du det inn i <code>main</code>. Stå på greina som skal <b>ta imot</b> endringane, og skriv namnet på greina du vil hente frå:</p>
${ex(`git switch main`)}
${ex(`git merge meny`)}
<p>Har ikkje <code>main</code> fått nye commitar sidan <code>meny</code> vart laga, treng ikkje Git lage noko nytt. Han flyttar berre <code>main</code>-merkelappen fram. Det heiter <b>fast-forward</b>.</p>
<p>Har begge greinene fått nye commitar, lagar Git ein <b>merge-commit</b> med to foreldre – sjå korleis linjene møtest i teikninga. Historikken med greiner kan du også sjå i terminalen:</p>
${ex(`git log --oneline --graph --all`)}
<p>Ei grein som er fletta inn, kan du slette. Commitane forsvinn ikkje – dei er jo ein del av <code>main</code> no.</p>
${ex(`git branch -d meny`)}
<div class="tips">💡 Vil du ha ein merge-commit sjølv om fast-forward er mogleg, skriv du <code>git merge --no-ff meny</code>.</div>`,
  oppgaver: [
    { id: "l6o1", tekst: "Flett greina <code>meny</code> inn i <code>main</code>.", hint: ["Stå på <code>main</code> først: <code>git switch main</code>.", "<code>git merge meny</code>"],
      sjekk: c => !!st.flagg["merge:meny"] },
    { id: "l6o2", tekst: "Lag ein ekte merge-commit: Lag greina <code>farge</code>, og commit ei endring i <code>style.css</code> der. Byt til <code>main</code> og commit ei endring i <code>index.html</code>. Flett så <code>farge</code> inn i <code>main</code>.", hint: ["<code>git switch -c farge</code>, endre <code>style.css</code> og commit.", "<code>git switch main</code>, endre <code>index.html</code> og commit.", "<code>git merge farge</code> – då får du ein commit med to foreldre."],
      sjekk: c => { const h = nrHovud(); return !!h && [...forfedrar(h)].some(s => commit(s).p.length === 2); } },
    { id: "l6o3", tekst: "Slett greina <code>meny</code>, som no er fletta inn.", hint: ["<code>git branch -d meny</code> – du kan ikkje stå på greina du slettar."],
      sjekk: c => !!st.flagg["slett:meny"] && !nrGrein("meny") },
  ]},

{ id: "l7", tittel: "Konfliktar", laerer: "kva ein flettekonflikt er, og korleis du løyser han.",
  html: `
<p>Av og til har to greiner endra <b>same linje</b> i same fil på kvar sin måte. Då veit ikkje Git kva som er rett, og du får ein <b>konflikt</b>:</p>
${exUtan(`Auto-merging index.html\nCONFLICT (content): Merge conflict in index.html\nAutomatic merge failed; fix conflicts and then commit the result.`)}
<p>Git stoppar midt i flettinga (sjå <code>main|MERGING</code> i ledeteksten) og skriv begge versjonane inn i fila, med markørar rundt:</p>
${exUtan(`<<<<<<< HEAD\n    <h1>Velkomen til nettsida mi</h1>\n=======\n    <h1>Hei og velkomen!</h1>\n>>>>>>> tittel`)}
<p>Delen mellom <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</code> og <code>=======</code> kjem frå greina du står på. Delen under kjem frå greina du flettar inn. Slik løyser du konflikten:</p>
<ol>
<li>Opne fila med <code>nano index.html</code>.</li>
<li>Bestem kva som skal stå: den eine, den andre eller ein kombinasjon.</li>
<li>Slett alle markørlinjene (<code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code>, <code>=======</code> og <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code>) og lagre.</li>
<li>Fortel Git at konflikten er løyst: <code>git add index.html</code></li>
<li>Fullfør flettinga: <code>git commit -m "Løys konflikt i overskrifta"</code></li>
</ol>
<p>Lag ein konflikt sjølv: Lag greina <code>tittel</code>, endre <code>&lt;h1&gt;</code>-linja og commit. Byt til <code>main</code>, endre <b>same</b> linje til noko anna og commit. Flett så <code>tittel</code> inn i <code>main</code>. Vil du hoppe over førebuinga, kan du trykkje her:</p>
<p><button type="button" class="handling" data-handling="konflikt">Gjer klar ein konflikt for meg</button></p>
<div class="tips">💡 Angrar du? <code>git merge --abort</code> avbryt flettinga og set alt tilbake til slik det var før.</div>`,
  oppgaver: [
    { id: "l7o1", tekst: "Få ein flettekonflikt i <code>index.html</code>.", hint: ["Følg oppskrifta over – eller trykk «Gjer klar ein konflikt for meg» og køyr så <code>git merge tittel</code>."],

/* ================== LAGRING ================== */
const lager = {
    hent(nokkel, standard) {
        try { const v = localStorage.getItem(KURS.prefiks + nokkel); return v === null ? standard : JSON.parse(v); }
        catch (e) { return standard; }
    },
    set(nokkel, verdi) { try { localStorage.setItem(KURS.prefiks + nokkel, JSON.stringify(verdi)); } catch (e) {} },
    slettAlle() {
        try {
            const ut = [];
            for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(KURS.prefiks)) ut.push(k); }
            ut.forEach(k => localStorage.removeItem(k));
        } catch (e) {}
    }
};

/* ================== TILSTAND ================== */
let loyste = new Set(lager.hent("loyste", []));
let besokt = new Set(lager.hent("besokt", []));
let hintNiva = lager.hent("hint", {});
let aktivIndeks = Math.min(Math.max(0, LEKSJONAR.findIndex(l => l.id === lager.hent("aktiv", LEKSJONAR[0].id))), LEKSJONAR.length - 1);
const ALLE_OPPGAVER = LEKSJONAR.flatMap(l => l.oppgaver.map(o => ({ ...o, leksjon: l })));

function lagreTilstand() {
    lager.set("loyste", [...loyste]);
    lager.set("besokt", [...besokt]);
    lager.set("hint", hintNiva);
    lager.set("aktiv", LEKSJONAR[aktivIndeks].id);
}

function leksjonStatus(l) {
    const n = l.oppgaver.length, ok = l.oppgaver.filter(o => loyste.has(o.id)).length;
    if (n === 0) return besokt.has(l.id) ? "ferdig" : "ny";
    if (ok === n) return "ferdig";
    if (ok > 0 || besokt.has(l.id)) return "igang";
    return "ny";
}
const STATUSIKON = { ny: '<span class="sirkel"></span>', igang: '<span class="sirkel halv"></span>', ferdig: "✔" };

/* ================== VISING ================== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function oppdaterFramdrift() {
    const n = ALLE_OPPGAVER.length, ok = ALLE_OPPGAVER.filter(o => loyste.has(o.id)).length;
    document.getElementById("framdriftTekst").textContent = `${ok} / ${n} oppgåver`;
    document.getElementById("framdriftLinje").style.width = (n ? 100 * ok / n : 0) + "%";
}

function teiknListe() {
    const ol = document.getElementById("leksjonsliste");
    ol.innerHTML = "";
    LEKSJONAR.forEach((l, i) => {
        const st = leksjonStatus(l);
        const ok = l.oppgaver.filter(o => loyste.has(o.id)).length;
        const li = document.createElement("li");
        li.className = (i === aktivIndeks ? "aktiv " : "") + st;
        li.innerHTML = `<button type="button"><span class="status" title="${st === "ferdig" ? "Ferdig" : st === "igang" ? "I gang" : "Ikkje starta"}">${STATUSIKON[st]}</span><span class="nr">${i + 1}.</span><span>${esc(l.tittel)}</span>${l.oppgaver.length ? `<span class="tal">${ok}/${l.oppgaver.length}</span>` : ""}</button>`;
        li.querySelector("button").onclick = () => visLeksjon(i);
        ol.appendChild(li);
    });
    oppdaterFramdrift();
}

function visLeksjon(i, rull = true) {
    aktivIndeks = i;
    const l = LEKSJONAR[i];
    besokt.add(l.id);
    lagreTilstand();
    const el = document.getElementById("leksjon");
    el.innerHTML = `
        <h2>${i + 1}. ${esc(l.tittel)}</h2>
        <p class="laerer"><b>Dette lærer du:</b> ${l.laerer}</p>
        <div class="forklaring">${l.html}</div>
        ${l.oppgaver.length ? `<h3>Oppgåver</h3><ul class="oppgaver"></ul>` : ""}
        <div class="fullfortplass"></div>
        <div class="navknappar">
            <button type="button" class="forre" ${i === 0 ? "disabled" : ""}>◀ Førre</button>
            <button type="button" class="neste" ${i === LEKSJONAR.length - 1 ? "disabled" : ""}>Neste ▶</button>
        </div>
        <details class="laerar"><summary>For læraren</summary>${LAERAR_HTML}</details>`;
    el.querySelectorAll(".eksempel:not(.utan)").forEach(ex => {
        const pre = ex.querySelector("pre");
        const b = document.createElement("button");
        b.type = "button"; b.className = "prov"; b.textContent = "Prøv";
        b.title = "Lim inn koden (du køyrer sjølv)";
        b.onclick = () => { if (typeof simLim === "function") simLim(pre.dataset.kode ?? pre.textContent); };
        ex.appendChild(b);
    });
    const ul = el.querySelector(".oppgaver");
    if (ul) l.oppgaver.forEach(o => ul.appendChild(lagOppgaveEl(o)));
    el.querySelector(".forre").onclick = () => visLeksjon(i - 1);
    el.querySelector(".neste").onclick = () => visLeksjon(i + 1);
    teiknFullfort();
    teiknListe();
    if (rull) document.getElementById("leksjonspanel").scrollTop = 0;
    if (typeof simByttLeksjon === "function") simByttLeksjon(l);   // valfri krok (t.d. startkode i editoren)
}

function lagOppgaveEl(o) {
    const li = document.createElement("li");
    li.className = "oppgave" + (loyste.has(o.id) ? " loyst" : "");
    li.dataset.id = o.id;
    li.innerHTML = `<span class="ikon">${loyste.has(o.id) ? "✔" : "○"}</span><span class="tekst">${o.tekst}</span>` +
        (o.hint && o.hint.length ? `<button type="button" class="hintknapp">Hint</button>` : "<span></span>");
    const vis = () => {
        li.querySelectorAll(".hint").forEach(h => h.remove());
        const n = hintNiva[o.id] || 0;
        for (let k = 0; k < n; k++) {
            const d = document.createElement("div");
            d.className = "hint"; d.innerHTML = "💡 " + o.hint[k];
            li.appendChild(d);
        }
        const b = li.querySelector(".hintknapp");
        if (b) { b.textContent = n === 0 ? "Hint" : n < o.hint.length ? "Meir hjelp" : "Hint"; b.disabled = n >= o.hint.length; b.style.opacity = n >= o.hint.length ? .4 : 1; }
    };
    const b = li.querySelector(".hintknapp");
    if (b) b.onclick = () => { hintNiva[o.id] = Math.min((hintNiva[o.id] || 0) + 1, o.hint.length); lagreTilstand(); vis(); };
    vis();
    return li;
}

function teiknFullfort() {
    const l = LEKSJONAR[aktivIndeks];
    const plass = document.querySelector("#leksjon .fullfortplass");
    if (!plass) return;
    plass.innerHTML = "";
    if (l.oppgaver.length && leksjonStatus(l) === "ferdig") {
        const d = document.createElement("div");
        d.className = "fullfort";
        d.innerHTML = `<span>✔ Leksjon fullført!</span>` + (aktivIndeks < LEKSJONAR.length - 1 ? `<button type="button">Neste leksjon ▶</button>` : "");
        const b = d.querySelector("button");
        if (b) b.onclick = () => visLeksjon(aktivIndeks + 1);
        plass.appendChild(d);
    }
}

let toastTid = null;
function toast(tekst) {
    const t = document.getElementById("toast");
    t.textContent = tekst; t.classList.add("vis");
    clearTimeout(toastTid); toastTid = setTimeout(() => t.classList.remove("vis"), 3200);
}

/* ================== OPPGÅVESJEKK ================== */
/* Kall etter KVAR kommando/køyring. Sjekkar alle oppgåver i alle leksjonar. */
function sjekkOppgaver(ctx) {
    const nye = [];
    for (const o of ALLE_OPPGAVER) {
        if (loyste.has(o.id)) continue;
        let ok = false;
        try { ok = !!o.sjekk(ctx); } catch (e) { ok = false; }
        if (ok) { loyste.add(o.id); nye.push(o); }
    }
    if (!nye.length) return nye;
    lagreTilstand();
    const aktiv = LEKSJONAR[aktivIndeks];
    for (const o of nye) {
        const li = document.querySelector(`#leksjon .oppgave[data-id="${o.id}"]`);
        if (li) {
            li.classList.add("loyst");
            li.querySelector(".ikon").textContent = "✔";
            const bra = document.createElement("div");
            bra.className = "bra"; bra.textContent = "✔ Bra!";
            li.appendChild(bra);
            setTimeout(() => bra.remove(), 2700);
        }
    }
    const andre = nye.filter(o => o.leksjon !== aktiv);
    if (andre.length) {
        const o = andre[0];
        toast(`✔ Bra! Du løyste ei oppgåve i leksjon ${LEKSJONAR.indexOf(o.leksjon) + 1}: ${o.leksjon.tittel}`);
    }
    teiknFullfort();
    teiknListe();
    return nye;
}

/* ================== KURSBEVIS ================== */
function datoTekst(d = new Date()) {

}
function hentNamn() { try { return localStorage.getItem("kode101-namn") || ""; } catch (e) { return ""; } }

        <h2>Kursbevis – ${esc(KURS.namn)}</h2>

    [() => { st.fs[NETTSIDE + "/index.html"] = st.fs[NETTSIDE + "/index.html"].replace("</p>", "</p>\n    <p>Eg går på IM ved Stord vgs.</p>"); }, 'git commit -am "Legg til presentasjon"',
     "echo hemmeleg > passord.txt", "echo passord.txt > .gitignore", "git add .gitignore", 'git commit -m "Ignorer passord.txt"'],
    [],
    ["git switch -c meny", () => { st.fs[NETTSIDE + "/index.html"] = st.fs[NETTSIDE + "/index.html"].replace("<body>\n", "<body>\n    <nav>Heim | Om meg</nav>\n"); }, 'git commit -am "Legg til meny"', "git switch main"],
    ["git merge meny", "git branch -d meny", "git switch -c farge", () => { st.fs[NETTSIDE + "/style.css"] = st.fs[NETTSIDE + "/style.css"].replace("darkgreen", "navy"); }, 'git commit -am "Blå overskrift"',
     "git switch main", () => { st.fs[NETTSIDE + "/index.html"] = st.fs[NETTSIDE + "/index.html"].replace("Dette er nettsida mi.", "Dette er nettsida mi. Velkomen!"); }, 'git commit -am "Betre velkomsttekst"', "git merge farge", "git branch -d farge"],
    [() => { lagKonfliktStille(); }, "git merge tittel", () => { endreH1("Velkomen til nettsida mi"); }, "git add index.html", 'git commit -m "Løys konflikt i overskrifta"', "git branch -d tittel"],
    ["git remote add origin https://github.com/elev/nettside.git", "git push -u origin main", () => kariCommit(), "git pull", () => { st.fs[NETTSIDE + "/style.css"] += "\np {\n    font-size: 18px;\n}\n"; }, 'git commit -am "Større tekst"', "git push", "cd ~", "git clone https://github.com/frodolini/git101-demo.git", "cd ~/nettside"],
];
function lagKonfliktStille() {
    skript(["git switch -c tittel", () => endreH1("Hei og velkomen!"), 'git commit -am "Ny overskrift: Hei og velkomen!"', "git switch main", () => endreH1("Velkomen til nettsida mi"), 'git commit -am "Ny overskrift: Velkomen til nettsida mi"'], true);
}
function klargjer(n) {
    st = nyTilstand();
    for (let i = 1; i < n; i++) skript(KLARGJER[i] || [], true);
    st.klargjort = n;
    st.flagg = {};
    kjendeCommitar = new Set();
    tomSkjerm();
    leggTil(`💡 Maskina er klargjord for leksjon ${n}: Alle stega frå leksjon 1–${n - 1} er gjorde for deg. Oppgåvene i dei leksjonane tel ikkje på kursbeviset før du nullstiller maskina og gjer dei sjølv.`, "hjelp");
    if (st.repos[NETTSIDE] && headSha(st.repos[NETTSIDE])) { st.cwd = NETTSIDE; leggTil(promptHtml()); leggTil("$ git log --oneline --graph --all"); koyrKommando("git log --oneline --graph --all"); }
    visPrompt();
    etterKommando({ st, linje: "" });
}
document.getElementById("leksjon").addEventListener("click", e => {
    const b = e.target.closest("[data-handling]");
    if (!b) return;
    const h = b.dataset.handling;
    if (h === "konflikt") { const f = lagKonflikt(); if (f) toast(f); fokuserTerm(); }
    else if (h === "kari") {
        if (!st.gh["elev/nettside"].refs.main) { toast("GitHub-repoet er tomt. Push main først (git push -u origin main)."); return; }
        kariCommit();
        leggTil(`<span style="color:#888"># På GitHub: Jonas Berg har laga ein commit på main («${E(commit(st.gh["elev/nettside"].refs.main).m)}»)</span>`);
        toast("✔ Jonas har pusha ein commit til GitHub. Hent han med git pull.");
        lagreAlt(); teiknModell(); fokuserTerm();
    } else if (h === "klargjer") {
        const n = aktivIndeks + 1;
        if (!confirm(`Vil du klargjere maskina for leksjon ${n}? Alt du har gjort i terminalen, blir erstatta med ferdige steg frå leksjon 1–${n - 1}. Framdrifta di blir ikkje sletta.`)) return;
        klargjer(n); fokuserTerm();
    }
});
document.getElementById("knappMaskin").onclick = () => {
    if (!confirm("Vil du setje maskina tilbake til start? Alle filer, repo og commitar blir borte. Framdrifta i kurset blir ikkje sletta.")) return;
    st = nyTilstand(); kjendeCommitar = new Set(); tomSkjerm();
    leggTil("💡 Maskina er nullstilt. Mappa <code>nettside</code> er som ny, og det finst ingen Git-repo.", "hjelp");
    visPrompt(); etterKommando({ st, linje: "" }); fokuserTerm();
};

/* =====================================================================
   OPPSTART
   ===================================================================== */
(function start() {
    const lagra = lager.hent("maskin", null);
    if (lagra && lagra.v === 1 && lagra.fs) { st = lagra; if (!st.gh["frodolini/git101-demo"]) lagDemoRepo(); }
    else nyTilstand();
    for (const h of skjerm) { const d = document.createElement("div"); d.innerHTML = h; termUt.appendChild(d.childElementCount === 1 && d.firstElementChild.className === "hjelp" ? d.firstElementChild : d); }
    if (!skjerm.length) {
        leggTil(`💡 Velkomen til Git Bash! Dette er ein trygg simulator – du kan ikkje øydeleggje noko. Skriv ${kd("ls")} og trykk Enter for å sjå kva som ligg i heimemappa di.`, "hjelp");
        visPrompt();
    }
    kjendeCommitar = new Set(Object.keys(st.obj));
    visLeksjon(aktivIndeks, false);
    teiknModell();
    teikn();
})();
</script>
